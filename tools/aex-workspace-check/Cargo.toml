[package]
name = "aex-workspace-check"
version = "0.1.0"
description = "`aex-workspace-check` owns the structural rules of the AEX Cargo workspace: the member list and the on-disk tree agree, names are consistent, dependency direction points inward, no test-support crate can reach a production binary, the member graph is acyclic, and the frozen inventory is exactly present."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "test-architecture"
role = "tool"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "property"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.targets]
workspace = "unit"
properties = "unit"
failure_fixtures = "unit"

[package.metadata.aex.not_applicable]
live_suite = "workspace tool; it reads manifests and never reaches a deployed plane"

[[bin]]
name = "aex-workspace-check"
path = "src/main.rs"

[[test]]
name = "workspace"
path = "tests/workspace.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "failure_fixtures"
path = "tests/failure_fixtures.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
aex-test-harness = { path = "../../tests/support/aex-test-harness" }
proptest.workspace = true
