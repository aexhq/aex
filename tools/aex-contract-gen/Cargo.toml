[package]
name = "aex-contract-gen"
version = "0.1.0"
description = "The deterministic AEX contract generator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "contracts"
role = "tool"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "property"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.targets]
canonical_agreement = "unit"
determinism = "unit"
session_product = "unit"
surface = "unit"
typescript = "unit"

[package.metadata.aex.not_applicable]
live_suite = "workspace tool; it produces bytes locally and reaches no deployed plane"

[[bin]]
name = "aex-contract-gen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
aex-wire = { path = "../../crates/aex-wire" }
similar-asserts.workspace = true
tempfile.workspace = true
walkdir.workspace = true
