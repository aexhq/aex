[package]
name = "aex-contract-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "contracts"
role = "tool"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "property"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the contracts stream; the cases land with the tool's own implementation"
live_suite = "workspace tool; it produces bytes locally and reaches no deployed plane"

[[bin]]
name = "aex-contract-gen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
