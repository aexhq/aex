[package]
name = "aex-cli"
version = "0.50.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "clients"
role = "tool"
artifact = "native_binary"
layers = ["unit"]
concerns = ["contract", "property"]
seams = []
security_tier = "public_edge"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
cli_contract = "unit"
config_exit_output = "unit"
download = "unit"

[package.metadata.aex.not_applicable]
live_suite = "packed-binary evidence is package-owned in the tool's own targets; the CLI has no deployed endpoint of its own"

[[bin]]
name = "aex"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aex-wire = { path = "../../crates/aex-wire" }
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "cli_contract"
path = "tests/cli_contract.rs"

[[test]]
name = "config_exit_output"
path = "tests/config_exit_output.rs"

[[test]]
name = "download"
path = "tests/download.rs"
