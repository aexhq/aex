# The self-contained local stack: one brain (local mode — in-memory journal, subprocess tools;
# NOT durable, NOT a sandbox) behind one control plane (fake payments — every top-up instantly
# "paid"). This is for trying aex on your own machine with prompts you trust; production is
# the Fargate deploy in the private platform repo (AWS-mode brain, MicroVM hands, real Stripe).
#
#   docker compose up
#   aex --base-url http://127.0.0.1:8600 signup --email you@example.com
#   aex topup --usd 10 && aex keys create --name local
#   aex session new --provider anthropic --model claude-sonnet-5   # BYOK via ANTHROPIC_API_KEY
#
# AEX_LOCAL_TOKEN is the brain-side operator token shared between the two containers. It never
# leaves the compose network; override it in a .env file if you expose anything.

services:
  brain:
    image: ghcr.io/aexhq/brain:latest
    build: ../brain # used only if you `docker compose build` with the brain repo checked out alongside
    environment:
      AEX_MODE: local
      AEX_LISTEN: 0.0.0.0:8700 # container-network only; not published to the host
      AEX_API_TOKEN: ${AEX_LOCAL_TOKEN:-dev-local-token}
    volumes:
      - brain-data:/data

  control:
    image: ghcr.io/aexhq/aex-control:latest
    build: .
    depends_on:
      - brain
    environment:
      AEX_BRAIN_URL: http://brain:8700
      AEX_BRAIN_TOKEN: ${AEX_LOCAL_TOKEN:-dev-local-token}
      AEX_CONTROL_LISTEN: 0.0.0.0:8600
      AEX_PAYMENTS: fake
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - control-data:/data

volumes:
  brain-data:
  control-data:
