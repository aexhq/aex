# The local hosted composition: independently runnable Brain (disk journal and in-memory current
# context) behind Aex account/authentication and fake prepaid payments. Agentloops use Brain's one
# Component pipeline. Tool execution requires a separately running Environment adapter.
#
#   docker compose --env-file ../.env.dev up --build
#
# Then point the TypeScript SDK or CLI at http://127.0.0.1:8600. Account bootstrap remains an
# explicit control-plane operation; see docs/quickstart.md for the session client.
#
# Brain and control share one network namespace so their private authenticated route remains
# loopback-only. Keep local environment values in the workspace-root .env.

services:
  control:
    image: ghcr.io/aexhq/aex-control:latest
    build: .
    environment:
      AEX_BRAIN_URL: http://127.0.0.1:8700
      AEX_BRAIN_TOKEN: ${AEX_LOCAL_BRAIN_TOKEN:-dev-local-brain-token}
      AEX_CONTROL_LISTEN: 0.0.0.0:8600
      AEX_CONTROL_DB: /data/control.db
      AEX_PAYMENTS: fake
    ports:
      - "127.0.0.1:8600:8600"
      - "127.0.0.1:8700:8700"
    volumes:
      - control-data:/data

  brain:
    image: ghcr.io/aexhq/brain:latest
    depends_on:
      - control
    network_mode: service:control
    environment:
      BRAIN_DATA_DIR: /data
      BRAIN_LISTEN: 0.0.0.0:8700
      BRAIN_API_TOKEN: ${AEX_LOCAL_BRAIN_TOKEN:-dev-local-brain-token}
    volumes:
      - brain-data:/data

volumes:
  brain-data:
  control-data:
