[package]
name = "aex-control-aurora"
version = "0.1.0"
description = "`aex-control-aurora` is the schema-owned SQL for the control plane."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# The real-PostgreSQL suite. Arming it turns on the harness's container
# helpers, so the suite starts its own digest-pinned engine; the unit lane
# never selects it, because `required-features` keeps it out.
integration-engines = ["aex-test-harness/containers"]

[package.metadata.aex]
owner = "central-identity"
role = "adapter"
artifact = "none"
live_suite = "aex-live-control-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.rds_data.transaction", "aws.aurora.serverless_v2"]
security_tier = "authority"
risk = ["sql"]
scenarios = []

[package.metadata.aex.targets]
migrations = "integration"
personal_account = "unit"
statements = "unit"

[dependencies]
async-trait.workspace = true
aws-sdk-rdsdata.workspace = true
aws-smithy-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-control-app = { path = "../aex-control-app" }
aex-control-domain = { path = "../aex-control-domain" }
aex-rds-data = { path = "../aex-rds-data" }
aex-wire = { path = "../aex-wire" }

[dev-dependencies]
aex-test-harness = { path = "../../tests/support/aex-test-harness" }
# The migration suite applies the production privilege renderer rather than a
# copy of it, so the denial matrix it proves is the one a plane receives.
central-schema-admin = { path = "../../workers/central-schema-admin" }
sqlx.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
uuid.workspace = true

[[test]]
name = "statements"
path = "tests/statements.rs"

[[test]]
name = "personal_account"
path = "tests/personal_account.rs"

[[test]]
name = "migrations"
path = "tests/migrations.rs"
required-features = ["integration-engines"]
