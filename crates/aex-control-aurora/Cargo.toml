[package]
name = "aex-control-aurora"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "adapter"
artifact = "none"
live_suite = "aex-live-central-control-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.rds_data.transaction", "aws.aurora.serverless_v2"]
security_tier = "authority"
risk = ["sql"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the central-identity stream; the cases land with the crate's own implementation"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-control-app = { path = "../aex-control-app" }
aex-rds-data = { path = "../aex-rds-data" }
