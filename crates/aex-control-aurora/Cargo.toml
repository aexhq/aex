[package]
name = "aex-control-aurora"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# The real-PostgreSQL suite. A marker feature: the engine crates are ordinary
# dev-dependencies, and the feature exists so `required-features` can keep the
# suite out of the unit lane while the integration lane arms it.
integration-engines = []

[package.metadata.aex]
owner = "central-identity"
role = "adapter"
artifact = "none"
live_suite = "aex-live-central-control-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.rds_data.transaction", "aws.aurora.serverless_v2"]
security_tier = "authority"
risk = ["sql"]
scenarios = []

[package.metadata.aex.targets]
statements = "unit"
migrations = "integration"

[dependencies]
async-trait.workspace = true
aws-sdk-rdsdata.workspace = true
aws-smithy-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-control-app = { path = "../aex-control-app" }
aex-control-domain = { path = "../aex-control-domain" }
aex-rds-data = { path = "../aex-rds-data" }
aex-wire = { path = "../aex-wire" }

[dev-dependencies]
aex-test-harness = { path = "../../tests/support/aex-test-harness" }
sqlx.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
uuid.workspace = true

[[test]]
name = "statements"
path = "tests/statements.rs"

[[test]]
name = "migrations"
path = "tests/migrations.rs"
required-features = ["integration-engines"]
