[package]
name = "aex-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["models", "routes"]
# The generated request/response models.
models = []
# The generated route registry and the framework-free matcher.
routes = []
# Server-side response wrappers and the per-fragment API traits.
server = ["models", "routes"]
# The low-level transport-generic client.
client = ["models", "routes"]
# The conformance-corpus loader.
testing = ["models", "routes"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true
