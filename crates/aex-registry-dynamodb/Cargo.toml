[package]
name = "aex-registry-dynamodb"
version = "0.1.0"
description = "Current workspace pointers, multipart upload staging, and receipt rows within the unified `regional-file-authority` table."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# The removed split-table suite is not auto-discovered; the active adapter's
# unit evidence lives beside the code and unified-authority behavior is covered
# by the composing services and live session suite.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = ["SC-FILES-CURRENT"]

[package.metadata.aex.not_applicable]
inline_targets = "regional-stores: this active regional-file-authority row-family adapter keeps unit evidence in inline modules; unified-table composition is exercised by session-stream-api, file-ingest-worker, tool-mux, and aex-live-session-api"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aex-content-domain = { path = "../aex-content-domain" }
aex-session-app = { path = "../aex-session-app" }
aex-wire = { path = "../aex-wire" }
aex-workspace-domain = { path = "../aex-workspace-domain" }
# The application-plan compiler is feature-owned beside session authority; the
# registry adapter implements only its own table family's action renderer.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false, features = ["session-authority"] }

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }
