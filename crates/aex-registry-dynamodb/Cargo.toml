[package]
name = "aex-registry-dynamodb"
version = "0.1.0"
description = "`aex-registry-dynamodb` owns the `regional-registry` table adapter: the current `(workspace, kind, name)` pointer with its revision and `ETag`, multipart upload staging, and idempotency receipts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-stream-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aex-content-domain = { path = "../aex-content-domain" }
aex-session-app = { path = "../aex-session-app" }
aex-wire = { path = "../aex-wire" }
aex-workspace-domain = { path = "../aex-workspace-domain" }
# The application-plan compiler is feature-owned beside session authority; the
# registry adapter implements only its own table family's action renderer.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false, features = ["session-authority"] }

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
