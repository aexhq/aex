[package]
name = "aex-brain-hands"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.lambda.microvm", "hands.guest.lifecycle"]
security_tier = "internal"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "the `brain-core` stream places this crate's evidence in inline unit modules, which the declared `unit` layer already collects; the crate declares no [[test]] target, so there is nothing to map"

[dependencies]
aex-brain-application = { path = "../aex-brain-application" }
aex-brain-domain = { path = "../aex-brain-domain" }
aex-hands-agent = { path = "../aex-hands-agent" }
aex-hands-control-aws = { path = "../aex-hands-control-aws" }
aex-hands-protocol = { path = "../aex-hands-protocol" }
aex-hands-tools = { path = "../aex-hands-tools" }
aex-runtime-control = { path = "../aex-runtime-control" }
aex-wire = { path = "../aex-wire" }
blake3.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
uuid.workspace = true
