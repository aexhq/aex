[package]
name = "aex-observation-domain"
version = "0.1.0"
description = "`aex-observation-domain` owns the pure customer-observation authority model: canonicalization, revision and order, series claims, receipts, gaps, frontiers and deletion."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "domain"
artifact = "none"
layers = ["unit"]
concerns = ["property"]
seams = []
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
admission_laws = "unit"
canonical_order = "unit"
keys = "unit"

[package.metadata.aex.not_applicable]
live_suite = "pure domain crate; Area 9's registry declares no independent live seam"

[dependencies]
aex-wire = { path = "../aex-wire" }
blake3.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
