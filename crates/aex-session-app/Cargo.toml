[package]
name = "aex-session-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-domains"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"
faults = "unit"

[package.metadata.aex.not_applicable]
live_suite = "application crate; its ports are exercised through its deployable's companion"

[dependencies]
aex-content-domain = { path = "../aex-content-domain" }
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-operation-domain = { path = "../aex-operation-domain" }
aex-secret-domain = { path = "../aex-secret-domain" }
aex-session-domain = { path = "../aex-session-domain" }
aex-wire = { path = "../aex-wire" }
aex-workspace-domain = { path = "../aex-workspace-domain" }
async-trait.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
