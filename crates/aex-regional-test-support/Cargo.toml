[package]
name = "aex-regional-test-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "test_support"
artifact = "none"
layers = ["unit"]
concerns = ["property"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"

[package.metadata.aex.not_applicable]
live_suite = "test-only crate; must be absent from every production link graph"

[dependencies]
blake3.workspace = true
hex.workspace = true
jsonschema.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"
