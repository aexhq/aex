[package]
name = "aex-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
storage-integration-tests = []

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
brain-protocol = { git = "https://github.com/aexhq/brain", rev = "ff0c242f1cef742c020483e6e1597b12af7b66fd" }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
