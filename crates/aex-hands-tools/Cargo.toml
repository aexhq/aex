[package]
name = "aex-hands-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "adapter"
artifact = "none"
live_suite = "aex-live-hands-agent"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["hands.guest.lifecycle"]
security_tier = "guest"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "the `hands` stream places this crate's evidence in inline unit modules, which the declared `unit` layer already collects; the crate declares no [[test]] target, so there is nothing to map"

[dependencies]
aex-hands-protocol = { path = "../aex-hands-protocol" }
aex-wire = { path = "../aex-wire" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
