[package]
name = "aex-brain-store-aws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.s3.conditional_put"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
expressions = "unit"

[package.metadata.aex.not_applicable]
integration = "brain-core owns the integration layer through the aex-live-brain-mux companion: the DynamoDB Local and real-stack suites run there so one harness owns every created resource"


[dependencies]
async-trait.workspace = true
blake3.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sqs.workspace = true
aws-smithy-types.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-brain-domain = { path = "../aex-brain-domain" }

[dev-dependencies]
aex-brain-test-support = { path = "../aex-brain-test-support" }

[[test]]
name = "expressions"
path = "tests/expressions.rs"
