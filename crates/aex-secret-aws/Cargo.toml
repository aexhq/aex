[package]
name = "aex-secret-aws"
version = "0.1.0"
description = "`aex-secret-aws` owns the KMS custody cryptography: the encryption-context binding, the envelope, the bounded zeroizing branch-key cache and rotation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.kms.encryption_context", "aws.kms.branch_key_rotation"]
security_tier = "secret"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-lc-rs.workspace = true
aws-sdk-kms.workspace = true
aws-smithy-types.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true
aex-secret-domain = { path = "../aex-secret-domain" }
aex-wire = { path = "../aex-wire" }

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
