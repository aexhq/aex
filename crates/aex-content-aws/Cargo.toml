[package]
name = "aex-content-aws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-regional-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.s3.conditional_put", "aws.s3.multipart", "aws.s3.unversioned_delete", "aws.s3.presigned_expiry", "aws.s3.sse_kms", "aws.kms.encryption_context"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"

[package.metadata.aex.not_applicable]
integration = "blocked on a cross-stream gap: `data-image-literal` bans `GenericImage::new(` outside `tests/support/aex-test-harness`, and the harness exposes `images::reference` but no container-start helper, so no stream can start a pinned engine today. The MinIO cases are specified in plan 05 section 8.2 and land the moment the harness owns container bring-up."

[dependencies]
async-trait.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-types.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
aex-content-domain = { path = "../aex-content-domain" }
aex-wire = { path = "../aex-wire" }
# One error vocabulary across the regional adapters: `Resolution` is what makes
# "resolve this by reading the object, not by writing again" a type rather than
# a comment. `default-features = false` keeps the session row codec out.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"
