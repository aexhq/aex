[package]
name = "aex-usage-query-dynamodb"
version = "0.1.0"
description = "`aex-usage-query-dynamodb` owns the read-only `usage-query-projection` adapter: the pure query plan, bounded coarse and per-tuple reads, and the copied coverage vector."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so an engine-backed target can carry
# `required-features` without autodiscovery claiming the same name unconditionally.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []


[package.metadata.aex.targets]
write_incapability = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-usage-domain = { path = "../aex-usage-domain" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "write_incapability"
path = "tests/write_incapability.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
