[package]
name = "aex-payment-contracts"
version = "0.1.0"
description = "`aex-payment-contracts` is the command, result and event boundary between the two minimal `TypeScript` Stripe edges and the Rust finance path."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "contracts"
role = "contract"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "property", "security"]
seams = []
security_tier = "money"
risk = ["money"]
scenarios = []

[package.metadata.aex.targets]
effects = "unit"
payment_method_events = "unit"

[package.metadata.aex.not_applicable]
live_suite = "generated contract crate; its wire is exercised through every deployable's companion, not a live seam of its own"

[dependencies]
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-wire = { path = "../aex-wire" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
