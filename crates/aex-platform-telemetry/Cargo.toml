[package]
name = "aex-platform-telemetry"
version = "0.1.0"
description = "`aex-platform-telemetry` owns the narrow `tracing`/`OpenTelemetry` facade every AEX Rust host installs: bounded non-blocking recording, registry-driven redaction, drop counters and a flush with a deadline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.cloudwatch.export"]
security_tier = "diagnostic"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
facade = "unit"
json = "unit"
pump = "unit"

[package.metadata.aex.not_applicable]
integration = "awaiting the observations-usage stream; the real-collector integration target lands with the OTLP pipeline"

[dependencies]
aex-telemetry-schema = { path = "../aex-telemetry-schema" }
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The exporter renders JSON by hand so the ceiling can be enforced without a
# serialiser in the dependency graph. `serde_json` is the independent parser the
# tests hold that rendering to; it must not become a production dependency.
[dev-dependencies]
serde_json.workspace = true
