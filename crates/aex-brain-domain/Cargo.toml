[package]
name = "aex-brain-domain"
version = "0.1.0"
description = "`aex-brain-domain` owns the pure Brain fold, effect, child-activation, join and budget model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "domain"
artifact = "none"
layers = ["unit"]
concerns = ["property"]
seams = []
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
histories = "unit"
properties = "unit"
decode = "unit"
planner = "unit"
budget = "unit"
envelope = "unit"
recovery = "unit"
mutation = "unit"

[package.metadata.aex.not_applicable]
live_suite = "pure domain crate; Area 9's registry declares no independent live seam"

[dependencies]
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-model-catalog = { path = "../aex-model-catalog" }
aex-wire = { path = "../aex-wire" }
blake3.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
aex-brain-test-support = { path = "../aex-brain-test-support" }
proptest.workspace = true

[[test]]
name = "histories"
path = "tests/histories.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "decode"
path = "tests/decode.rs"

[[test]]
name = "planner"
path = "tests/planner.rs"

[[test]]
name = "budget"
path = "tests/budget.rs"

[[test]]
name = "envelope"
path = "tests/envelope.rs"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "mutation"
path = "tests/mutation.rs"
