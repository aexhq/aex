[package]
name = "aex-otlp-admission"
version = "0.1.0"
description = "`aex-otlp-admission` owns the pinned `OTLP` decode and normalization boundary: protobuf and `JSON` decoding, decompression bounds, canonical conversion and response mapping."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "adapter"
artifact = "none"
live_suite = "aex-live-regional-otlp"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = []
security_tier = "internal"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
decode_bounds = "integration"
properties = "unit"


[dependencies]
aex-observation-domain = { path = "../aex-observation-domain" }
aex-wire = { path = "../aex-wire" }
bytes.workspace = true
flate2.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
flate2.workspace = true
proptest.workspace = true
