[package]
name = "aex-brain-store-dynamodb"
version = "0.1.0"
description = "`aex-brain-store-dynamodb` owns the Brain `DynamoDB` and `SQS` adapter: journal and effect records, activation leases and fences, snapshot pointers, and wake publication."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
expressions = "unit"
plans = "unit"
adapters = "unit"

[package.metadata.aex.not_applicable]
integration = "brain-core owns the integration layer through the aex-live-brain-mux companion: the DynamoDB Local and real-stack suites run there so one harness owns every created resource"


[dependencies]
async-trait.workspace = true
blake3.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-sqs.workspace = true
aws-smithy-types.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-brain-app = { path = "../aex-brain-app" }
aex-brain-domain = { path = "../aex-brain-domain" }
aex-content-aws = { path = "../aex-content-aws" }
# The shared regional store machinery: key templates, row codecs, item
# measurement, the one transaction-plan compiler and the error vocabulary. Brain
# calls these rather than forking the item shapes they own.
aex-session-dynamodb = { path = "../aex-session-dynamodb" }
aex-work-dynamodb = { path = "../aex-work-dynamodb" }
aex-wire = { path = "../aex-wire" }

[dev-dependencies]
aex-brain-test-support = { path = "../aex-brain-test-support" }
aex-session-domain = { path = "../aex-session-domain" }
aws-smithy-http-client.workspace = true
base64.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "expressions"
path = "tests/expressions.rs"

[[test]]
name = "plans"
path = "tests/plans.rs"

[[test]]
name = "adapters"
path = "tests/adapters.rs"
