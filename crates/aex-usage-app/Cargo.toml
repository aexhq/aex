[package]
name = "aex-usage-app"
version = "0.1.0"
description = "`aex-usage-app` owns the usage accept, project, publish, receive-settlement-receipt and rebuild use cases."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "internal"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
live_suite = "application crate; its ports are exercised through its deployable's companion"

[features]
# The METER-02 probe library. Non-default on purpose: it drags `rustix`, cgroup
# reading and pin projection in, and the three usage workers never probe.
default = []
probe = ["dep:bytes", "dep:http-body", "dep:pin-project-lite", "dep:rustix"]

[package.metadata.aex.targets]
probe_properties = "unit"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-usage-domain = { path = "../aex-usage-domain" }
bytes = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
http-body-util.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
# Self dev-dependency so `probe` is on whenever this package's own tests are
# built. The feature stays non-default for real consumers — the three usage
# workers never link `rustix` or cgroup reading — while the default test lane
# still covers the probe rather than silently skipping it.
aex-usage-app = { path = ".", features = ["probe"] }

[[test]]
name = "probe_properties"
path = "tests/probe_properties.rs"
