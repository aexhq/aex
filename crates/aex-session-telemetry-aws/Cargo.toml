[package]
name = "aex-session-telemetry-aws"
version = "0.1.0"
description = "Customer-safe, immutable session telemetry segments."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "security", "fault"]
seams = ["aws.s3.conditional_put"]
security_tier = "authority"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
segments = "unit"
aws = "integration"

[dependencies]
aws-sdk-s3.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
sha2.workspace = true
thiserror.workspace = true
aex-wire = { path = "../aex-wire" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "segments"
path = "tests/segments.rs"

[[test]]
name = "aws"
path = "tests/aws.rs"
