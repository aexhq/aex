[package]
name = "aex-secret-keystore-dynamodb"
version = "0.1.0"
description = "`aex-secret-keystore-dynamodb` owns the isolated `regional-secret-keystore` table adapter: hierarchical branch-key records under a privileged administration role."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition"]
security_tier = "secret"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
# The one `KMS` call this crate makes is `GenerateDataKeyWithoutPlaintext`, in
# `provision`: it wraps fresh branch material that never enters this process in
# the clear. Opening material is `aex-secret-aws`'s job and is not linked here.
aws-sdk-kms.workspace = true
aws-smithy-types.workspace = true
thiserror.workspace = true
# Only for the wall clock a lazily created record stamps itself with.
time.workspace = true
aex-secret-domain = { path = "../aex-secret-domain" }
aex-wire = { path = "../aex-wire" }
# The shared error vocabulary and page budget only.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false }

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }
