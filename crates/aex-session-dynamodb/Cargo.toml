[package]
name = "aex-session-dynamodb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-regional-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.dynamodb.streams", "aws.dynamodb.ttl", "aws.dynamodb.throughput"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"

[package.metadata.aex.not_applicable]
integration = "blocked on a cross-stream gap: `data-image-literal` bans `GenericImage::new(` outside `tests/support/aex-test-harness`, and the harness exposes `images::reference` but no container-start helper, so no stream can start a pinned engine today. The DynamoDB Local cases are specified in plan 05 section 8.2 and land the moment the harness owns container bring-up."

[features]
default = ["session-authority", "authz-projection"]
# The `session-authority` key templates, row codecs and transactions.
session-authority = ["dep:aex-operation-domain", "dep:aex-runtime-control"]
# The read-only `regional-authz-projection` reader. A deployable that needs only
# the projection depends on this crate with `default-features = false,
# features = ["authz-projection"]` and links no session write symbol (D-21).
authz-projection = []
# The central worker's write-only projection adapter. Regional request roles
# never enable this feature.
authz-projection-write = []
# Engine-backed targets. The unit lane does not build them, so a machine with no
# container runtime still runs the per-stream gate.
integration-engines = ["dep:tokio"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
base64.workspace = true
hex.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
xxhash-rust.workspace = true
aex-wire = { path = "../aex-wire" }
aex-observation-domain = { path = "../aex-observation-domain" }
aex-operation-domain = { path = "../aex-operation-domain", optional = true }
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-runtime-control = { path = "../aex-runtime-control", optional = true }
futures.workspace = true

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"
