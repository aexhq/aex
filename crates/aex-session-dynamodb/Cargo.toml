[package]
name = "aex-session-dynamodb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-regional-session-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.dynamodb.streams", "aws.dynamodb.ttl", "aws.dynamodb.throughput"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the regional-stores stream; the cases land with the crate's own implementation"

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-session-domain = { path = "../aex-session-domain" }
