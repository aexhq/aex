[package]
name = "aex-session-dynamodb"
version = "0.1.0"
description = "`aex-session-dynamodb` owns the `session-authority` table adapter and, with it, the machinery every regional `DynamoDB` adapter shares: key components, attribute codecs, item measurement, the transaction plan compiler, the store error vocabulary, bounded paging and the idempotent-replay combinator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-stream-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.dynamodb.streams", "aws.dynamodb.ttl", "aws.dynamodb.throughput"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"
limit_projection = "unit"
integration = "integration"
session_listing = "unit"

[features]
default = ["session-authority", "authz-projection"]
# The `session-authority` key templates, row codecs and transactions.
session-authority = [
    "dep:aex-content-domain",
    "dep:aex-operation-domain",
    "dep:aex-runtime-control",
    "dep:aex-secret-domain",
    "dep:aex-session-app",
    "dep:aex-session-domain",
]
# The read-only `regional-authz-projection` reader. A deployable that needs only
# the projection depends on this crate with `default-features = false,
# features = ["authz-projection"]` and links no session write symbol (D-21).
authz-projection = []
# Central control's placement, profile and revocation producer. The regional
# capacity authority cannot be constructed through this feature.
authz-projection-write = []
# The regional capacity authority's workspace-limit projection producer. This
# is transport only: it owns no defaults, override policy or production caller.
capacity-limit-projection-write = []
# Engine-backed targets. The unit lane does not build them, so a machine with no
# container runtime still runs the per-stream gate.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
base64.workspace = true
hex.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
xxhash-rust.workspace = true
aex-wire = { path = "../aex-wire" }
aex-observation-domain = { path = "../aex-observation-domain" }
aex-content-domain = { path = "../aex-content-domain", optional = true }
aex-operation-domain = { path = "../aex-operation-domain", optional = true }
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-runtime-control = { path = "../aex-runtime-control", optional = true }
aex-secret-domain = { path = "../aex-secret-domain", optional = true }
aex-session-app = { path = "../aex-session-app", optional = true }
aex-session-domain = { path = "../aex-session-domain", optional = true }
futures.workspace = true

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
http.workspace = true
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json.workspace = true
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["session-authority"]

[[test]]
name = "properties"
path = "tests/properties.rs"
required-features = ["session-authority"]

[[test]]
name = "faults"
path = "tests/faults.rs"
required-features = ["session-authority"]

[[test]]
name = "security"
path = "tests/security.rs"
required-features = ["session-authority"]

[[test]]
name = "limit_projection"
path = "tests/limit_projection.rs"
required-features = ["capacity-limit-projection-write"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines", "session-authority"]

[[test]]
name = "session_listing"
path = "tests/session_listing.rs"
required-features = ["session-authority"]
