[package]
name = "aex-finance-app"
version = "0.1.0"
description = "`aex-finance-app` owns finance, provider-effect and settlement use cases: the prepare/execute/finalize state machine and account serialization."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "money"
risk = ["money"]
scenarios = []

[package.metadata.aex.not_applicable]
live_suite = "application crate; its ports are exercised through its deployable's companion"

[package.metadata.aex.targets]
faults = "unit"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-payment-contracts = { path = "../aex-payment-contracts" }
aex-wire = { path = "../aex-wire" }
