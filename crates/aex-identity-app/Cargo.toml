[package]
name = "aex-identity-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "internal"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
use_cases = "unit"

[package.metadata.aex.not_applicable]
live_suite = "application crate; its ports are exercised through its deployable's companion"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-control-domain = { path = "../aex-control-domain" }
aex-identity-domain = { path = "../aex-identity-domain" }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "use_cases"
path = "tests/use_cases.rs"
