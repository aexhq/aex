[package]
name = "aex-brain-provider"
version = "0.1.0"
description = "`aex-brain-provider` implements the Brain `ProviderPort` over rig: dialect routing onto the compiled models.dev admit table, bounded pre-send retry, canonical frame mapping, and receipt sealing."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "providers"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["provider.openai.stream", "provider.anthropic.stream", "provider.deepseek.stream", "provider.zai.stream", "provider.moonshotai.stream", "provider.google.stream"]
security_tier = "secret"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"
protocol = "integration"

[dependencies]
aex-brain-app = { path = "../aex-brain-app" }
aex-brain-domain = { path = "../aex-brain-domain" }
aex-brain-provider-custody = { path = "../aex-brain-provider-custody" }
aex-model-catalog = { path = "../aex-model-catalog" }
aex-model-vocabulary = { path = "../aex-model-vocabulary" }
aex-secret-domain = { path = "../aex-secret-domain" }
aex-wire = { path = "../aex-wire" }
bytes.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
rig-core = "=0.41.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
socket2 = "0.5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
uuid.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "protocol"
path = "tests/protocol.rs"
