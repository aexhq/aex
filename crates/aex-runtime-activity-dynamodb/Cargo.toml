[package]
name = "aex-runtime-activity-dynamodb"
version = "0.1.0"
description = "`aex-runtime-activity-dynamodb` owns the `runtime-activity` table adapter: exact Hands generations, lifecycle intents and receipts, true-idle heartbeats and snapshot activity."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-runtime-control-worker"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition", "aws.dynamodb.ttl"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
blake3.workspace = true
thiserror.workspace = true
aex-hands-protocol = { path = "../aex-hands-protocol" }
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-runtime-control = { path = "../aex-runtime-control" }
aex-secret-domain = { path = "../aex-secret-domain" }
# The port traits only. This crate is the production `ContinuityReader`: the
# runtime-activity rows are the authority for both continuity and true idle, so
# implementing it anywhere else would mean two authorities computing it.
aex-session-app = { path = "../aex-session-app" }
aex-usage-domain = { path = "../aex-usage-domain" }
aex-wire = { path = "../aex-wire" }
# The shared regional store machinery only. `default-features = false` keeps the
# session-authority row codec and the projection reader out of the link graph.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false }
serde_json.workspace = true

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
