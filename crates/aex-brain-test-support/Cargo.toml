live_suite = "test-only crate; must be absent from every production link graph"

[dependencies]
aex-test-harness = { path = "../../tests/support/aex-test-harness" }
proptest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

aex-brain-domain = { path = "../aex-brain-domain" }
