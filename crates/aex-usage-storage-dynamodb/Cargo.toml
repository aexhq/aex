[package]
name = "aex-usage-storage-dynamodb"
version = "0.1.0"
description = "`aex-usage-storage-dynamodb` is the `usage-storage-authority` adapter: table expressions, the row codec, the admission transaction and the frontier compare-and-set for `storage.byte_min.v1` facts, plus the rating-queue producer and this category's settlement receipt consumer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "adapter"
artifact = "none"
live_suite = "aex-live-usage-storage-worker"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition", "aws.s3.conditional_put"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []


[package.metadata.aex.targets]
isolation = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["aex-test-harness/containers"]

[dependencies]
aws-sdk-dynamodb.workspace = true
serde_json.workspace = true
aex-usage-authority-dynamodb = { path = "../aex-usage-authority-dynamodb" }
aex-usage-app = { path = "../aex-usage-app" }
aex-usage-domain = { path = "../aex-usage-domain" }

[dev-dependencies]
aws-sdk-sqs.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# The integration target mints its fixture identifiers from the wire owner
# rather than hand-typing them: the outbox boundary parses those strings into
# the central contract's identifier types, and a hand-written spelling would
# keep passing after the format moved.
aex-wire = { path = "../aex-wire" }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "isolation"
path = "tests/isolation.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
