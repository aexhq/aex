[package]
name = "aex-capacity-dynamodb"
version = "0.1.0"
description = "Durable regional capacity-limit authority."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# The one test target is declared explicitly, so it can carry `required-features`
# without autodiscovery claiming the same name unconditionally.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.iam.denial"]
security_tier = "authority"
risk = ["concurrency", "iam"]
scenarios = []

[package.metadata.aex.targets]
integration = "integration"

[package.metadata.aex.not_applicable]
inline_targets = "the `regional-stores` stream places this crate's unit evidence in inline `#[cfg(test)]` modules, which the declared `unit` layer already collects; the only [[test]] target it owns is the engine-backed one"
live_suite = "the adapter is exercised through regional-capacity-controller's live companion"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["aex-test-harness/containers"]

[dependencies]
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false, features = ["capacity-limit-projection-write"] }
aex-wire = { path = "../aex-wire" }
aws-sdk-dynamodb.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
