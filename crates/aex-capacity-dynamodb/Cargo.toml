[package]
name = "aex-capacity-dynamodb"
version = "0.1.0"
description = "Durable regional capacity-limit authority."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.iam.denial"]
security_tier = "authority"
risk = ["concurrency", "iam"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "the `regional-stores` stream places this crate's evidence in inline unit modules, which the declared `unit` layer already collects; the crate declares no [[test]] target, so there is nothing to map"
live_suite = "the adapter is exercised through regional-capacity-controller's live companion"
integration = "the transaction request and ambiguity resolver use deterministic SDK replay; the workspace has no approved DynamoDB Local harness"

[dependencies]
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false, features = ["capacity-limit-projection-write"] }
aex-wire = { path = "../aex-wire" }
aws-sdk-dynamodb.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
http.workspace = true
