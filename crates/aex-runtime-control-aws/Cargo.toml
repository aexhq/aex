[package]
name = "aex-runtime-control-aws"
version = "0.1.0"
description = "`aex-runtime-control-aws` owns the runtime-activity, queue and provider composition used by the runtime control worker: partial-batch handling, claims and receipts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "adapter"
artifact = "none"
live_suite = "aex-live-runtime-control-worker"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.ecs.run_task", "aws.lambda.microvm"]
security_tier = "internal"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "the `hands` stream places this crate's evidence in inline unit modules, which the declared `unit` layer already collects; the crate declares no [[test]] target, so there is nothing to map"

[dependencies]
aex-hands-control-aws = { path = "../aex-hands-control-aws" }
aex-hands-protocol = { path = "../aex-hands-protocol" }
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-runtime-control = { path = "../aex-runtime-control" }
aex-usage-domain = { path = "../aex-usage-domain" }
aex-wire = { path = "../aex-wire" }
aws-sdk-sqs.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
