[package]
name = "aex-model-catalog"
version = "0.1.0"
description = "`aex-model-catalog` owns the signed immutable model catalog: model, dialect, capability and routing policy plus its content signature."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "providers"
role = "domain"
artifact = "none"
live_suite = "aex-live-model-catalog"
layers = ["unit"]
concerns = ["property"]
seams = ["provider.openai.stream", "provider.anthropic.stream", "provider.deepseek.stream", "provider.zai.stream", "provider.moonshotai.stream", "provider.google.stream"]
security_tier = "internal"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"

[dependencies]
aex-wire = { path = "../aex-wire" }
aws-lc-rs.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"
