[package]
name = "aex-model-catalog"
version = "0.1.0"
description = "`aex-model-catalog` owns the immutable model catalog: the generated admit table, model, dialect, capability and routing policy, and the pre-dispatch qualification that admits a `(provider, model)` pair."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "providers"
role = "domain"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit"]
concerns = ["property"]
seams = []
security_tier = "internal"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"

[dependencies]
aex-model-vocabulary = { path = "../aex-model-vocabulary" }
aex-wire = { path = "../aex-wire" }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"
