[package.metadata.aex.not_applicable]
targets = "awaiting the providers stream; the cases land with the crate's own implementation"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
