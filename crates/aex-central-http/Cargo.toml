version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "composition"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "security"]
