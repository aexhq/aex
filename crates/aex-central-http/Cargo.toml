[package]
name = "aex-central-http"
version = "0.1.0"
description = "`aex-central-http` owns the generated central `HTTP` composition: route tables, request limits, authentication extraction and the public error mapping."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "composition"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "security"]
seams = []
security_tier = "public_edge"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
composition = "unit"

[package.metadata.aex.not_applicable]
live_suite = "composition crate; the mounted-route set is a unit fact and the deployed route set belongs to its deployable's companion"

[dependencies]
async-trait.workspace = true
axum.workspace = true
http.workspace = true
lambda_http.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
aex-control-app = { path = "../aex-control-app" }
aex-control-domain = { path = "../aex-control-domain" }
aex-wire = { path = "../aex-wire" }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "composition"
path = "tests/composition.rs"
