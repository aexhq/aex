[package]
name = "aex-hands-agent"
version = "0.1.0"
description = "`aex-hands-agent` owns the credential-free guest-root protocol agent: the command/result journal, the process tree, reconnect, cancel and crash observation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "guest"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
no_cloud_authority = "unit"
no_guest_billing = "unit"

[package.metadata.aex.not_applicable]
live_suite = "application crate; its ports are exercised through its deployable's companion"

[dependencies]
aex-hands-protocol = { path = "../aex-hands-protocol" }
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-wire = { path = "../aex-wire" }
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cargo_metadata.workspace = true
proptest.workspace = true
tempfile.workspace = true
