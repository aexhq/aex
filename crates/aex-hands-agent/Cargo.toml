[package]
name = "aex-hands-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "guest"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the hands stream; the cases land with the crate's own implementation"
live_suite = "application crate; its ports are exercised through its deployable's companion"

[dependencies]
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
aex-hands-protocol = { path = "../aex-hands-protocol" }
