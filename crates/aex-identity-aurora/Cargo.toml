[package]
name = "aex-identity-aurora"
version = "0.1.0"
description = "`aex-identity-aurora` is the schema-owned SQL for the identity plane."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# The real-PostgreSQL suite lives in `aex-control-aurora`, which owns the
# migration bundle; this crate's statements are prepared there against the same
# database, so there is one fixture rather than two.
integration-engines = ["aex-control-aurora/integration-engines"]

[package.metadata.aex]
owner = "central-identity"
role = "adapter"
artifact = "none"
live_suite = "aex-live-control-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.rds_data.transaction", "aws.aurora.serverless_v2"]
security_tier = "authority"
risk = ["sql"]
scenarios = []

[package.metadata.aex.targets]
statements = "unit"

[package.metadata.aex.not_applicable]
integration = "the identity statements are prepared against the real schema by `aex-control-aurora`'s migration suite, which owns the single PostgreSQL fixture; a second container per crate would double the substrate for one shared database"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-control-aurora = { path = "../aex-control-aurora" }
aex-control-domain = { path = "../aex-control-domain" }
aex-identity-app = { path = "../aex-identity-app" }
aex-identity-domain = { path = "../aex-identity-domain" }
aex-rds-data = { path = "../aex-rds-data" }

[dev-dependencies]
aws-sdk-rdsdata.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "statements"
path = "tests/statements.rs"
