[package]
name = "aex-rds-data"
version = "0.1.0"
description = "`aex-rds-data` owns the focused Aurora Data `API` transport: request and parameter mapping, paging, transaction lifecycle and error classification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "adapter"
artifact = "none"
live_suite = "aex-live-central-identity-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.rds_data.transaction"]
security_tier = "authority"
risk = ["sql"]
scenarios = []

[package.metadata.aex.targets]
transport = "unit"
properties = "unit"

[package.metadata.aex.not_applicable]
integration = "the Data API has no local emulator; the transport's real-endpoint evidence is claimed by aex-live-central-identity-api, and the repository crates carry the PostgreSQL container suites"

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-rdsdata.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "transport"
path = "tests/transport.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"
