[package]
name = "aex-brain-mcp"
version = "0.1.0"
description = "`aex-brain-mcp` owns the `MCP` protocol and recovery adapter: pinned protocol conformance, task identity, cancellation and reconnect."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "tools-mcp"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["mcp.streamable_http"]
security_tier = "internal"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
integration = "integration"

[package.metadata.aex.not_applicable]

[dependencies]
aex-brain-domain = { path = "../aex-brain-domain" }
aex-brain-managed-web = { path = "../aex-brain-managed-web" }
aex-brain-tool-catalog = { path = "../aex-brain-tool-catalog" }
aex-wire = { path = "../aex-wire" }
base64.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
proptest.workspace = true
tokio.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
