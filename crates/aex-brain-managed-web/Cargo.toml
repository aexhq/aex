[package]
name = "aex-brain-managed-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "tools-mcp"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["net.public_egress"]
security_tier = "public_edge"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
integration = "integration"

[package.metadata.aex.not_applicable]

[dependencies]
aex-brain-application = { path = "../aex-brain-application" }
aex-brain-domain = { path = "../aex-brain-domain" }
aex-brain-tool-catalog = { path = "../aex-brain-tool-catalog" }
aex-model-catalog = { path = "../aex-model-catalog" }
aex-secret-aws = { path = "../aex-secret-aws" }
aex-secret-custody-dynamodb = { path = "../aex-secret-custody-dynamodb" }
aex-secret-domain = { path = "../aex-secret-domain" }
aex-session-dynamodb = { path = "../aex-session-dynamodb" }
aex-wire = { path = "../aex-wire" }
async-trait.workspace = true
brotli.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
futures.workspace = true
html5ever.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
uuid.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
