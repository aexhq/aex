[package]
name = "aex-brain-managed-web"
version = "0.1.0"
description = "`aex-brain-managed-web` owns the Brain-managed network tool adapter: bounded fetch and search with `URL`, redirect, `DNS`, size, media-type and timeout guards."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "tools-mcp"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["net.public_egress"]
security_tier = "public_edge"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
integration = "integration"

[package.metadata.aex.not_applicable]

# The crate is two halves and only one of them is the Brain's.
#
# `egress`, `fetch`, `search` and `serializer` are network work: a screened
# outbound policy and two bounded clients. `credential` and `executor` are the
# Brain's tenant-BYOK adapter, and they are what drags in the session store, the
# secret custody store and the dispatch ticket.
#
# The tool executor holds the *platform's* credential and must link no tenant
# custody path at all -- that separation is the whole reason it is a separate
# process -- so the Brain's half is a feature it does not turn on. Default-on, so
# `brain-mux` and every existing consumer are unchanged.
[features]
default = ["brain-adapter"]
brain-adapter = [
    "dep:aex-brain-app",
    "dep:aex-brain-domain",
    "dep:aex-brain-tool-catalog",
    "dep:aex-model-catalog",
    "dep:aex-secret-aws",
    "dep:aex-secret-custody-dynamodb",
    "dep:aex-secret-domain",
    "dep:aex-session-dynamodb",
]

[dependencies]
aex-brain-app = { path = "../aex-brain-app", optional = true }
aex-brain-domain = { path = "../aex-brain-domain", optional = true }
aex-brain-tool-catalog = { path = "../aex-brain-tool-catalog", optional = true }
aex-model-catalog = { path = "../aex-model-catalog", optional = true }
aex-secret-aws = { path = "../aex-secret-aws", optional = true }
aex-secret-custody-dynamodb = { path = "../aex-secret-custody-dynamodb", optional = true }
aex-secret-domain = { path = "../aex-secret-domain", optional = true }
aex-session-dynamodb = { path = "../aex-session-dynamodb", optional = true }
aex-wire = { path = "../aex-wire" }
async-trait.workspace = true
brotli.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
futures.workspace = true
html5ever.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
uuid.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
