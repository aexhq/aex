[package]
name = "aex-brain-provider-gateway"
version = "0.1.0"
description = "`aex-brain-provider-gateway` owns customer-key provider transport and dialect adapters: six direct providers plus two fixed gateway authorities over one shared bounded `HTTP`/`SSE` core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "providers"
role = "adapter"
artifact = "none"
live_suite = "aex-live-brain-mux"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["provider.openai.stream", "provider.anthropic.stream", "provider.deepseek.stream", "provider.zai.stream", "provider.moonshotai.stream", "provider.google.stream"]
security_tier = "secret"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"
protocol = "integration"

[dependencies]
aex-brain-app = { path = "../aex-brain-app" }
aex-brain-domain = { path = "../aex-brain-domain" }
aex-model-catalog = { path = "../aex-model-catalog" }
aex-secret-domain = { path = "../aex-secret-domain" }
aex-wire = { path = "../aex-wire" }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
uuid.workspace = true
wiremock.workspace = true

[build-dependencies]
blake3.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "protocol"
path = "tests/protocol.rs"
