[package]
name = "aex-regional-http"
version = "0.1.0"
description = "`aex-regional-http` owns the generated finite regional `HTTP` composition: route tables, region assertion extraction, body limits and the public error mapping."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "composition"
artifact = "none"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = []
security_tier = "public_edge"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
primitives = "unit"
mount = "unit"
projection = "unit"
authz = "unit"
integration = "integration"

[package.metadata.aex.not_applicable]
live_suite = "composition crate; the mounted-route set is a unit fact and the deployed route set belongs to its deployable's companion"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime. There
# is no `dep:tokio` here as there is in the store crates: this crate links tokio
# unconditionally, so making it optional for one target would be a lie.
integration-engines = ["aex-test-harness/containers"]

[dependencies]
axum.workspace = true
async-trait.workspace = true
# The two cold-start reads, one store each. The credential pepper ring is read
# from Secrets Manager because that is where the issuing authority reads it: one
# stored document with two readers, rather than two copies a rotation can leave
# out of step. The cursor signing ring has a single reader and stays in
# Parameter Store. Both are resolved once, before the listener binds. There is no
# `aws-sdk-lambda` here any more: nothing on a regional request path invokes a
# function, because the credential check is in-process.
aws-sdk-secretsmanager.workspace = true
aws-sdk-ssm.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hmac.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tower.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
aex-wire = { path = "../aex-wire" }
aex-internal-contracts = { path = "../aex-internal-contracts" }
# The one credential implementation. Both crates are pure and link no AWS SDK:
# the token grammar, the peppered MAC, its constant-time comparison and the
# epoch vocabulary all live there, and re-stating any of them here is exactly how
# a second, subtly different verifier gets written.
aex-control-domain = { path = "../aex-control-domain" }
aex-identity-domain = { path = "../aex-identity-domain" }
# The projection module's inputs: the decoded authority rows. The alternative to
# depending on the adapters is a third view type per model, which is exactly the
# drift a single projection exists to prevent (RS-28).
aex-content-domain = { path = "../aex-content-domain" }
aex-workspace-domain = { path = "../aex-workspace-domain" }
aex-registry-dynamodb = { path = "../aex-registry-dynamodb" }
aex-secret-domain = { path = "../aex-secret-domain" }
aex-secret-custody-dynamodb = { path = "../aex-secret-custody-dynamodb" }
aex-session-domain = { path = "../aex-session-domain" }
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false, features = [
    "authz-projection",
] }

[dev-dependencies]
http-body-util.workspace = true
proptest.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "primitives"
path = "tests/primitives.rs"

[[test]]
name = "mount"
path = "tests/mount.rs"

[[test]]
name = "projection"
path = "tests/projection.rs"

[[test]]
name = "authz"
path = "tests/authz.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
