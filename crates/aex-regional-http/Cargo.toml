[package]
name = "aex-regional-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "composition"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "property", "fault", "security"]
seams = []
security_tier = "public_edge"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
primitives = "unit"
mount = "unit"
projection = "unit"

[package.metadata.aex.not_applicable]
live_suite = "composition crate; the mounted-route set is a unit fact and the deployed route set belongs to its deployable's companion"

[dependencies]
axum.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
hmac.workspace = true
http.workspace = true
lambda_http.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
aex-wire = { path = "../aex-wire" }
aex-internal-contracts = { path = "../aex-internal-contracts" }
# The projection module's inputs: the decoded authority rows. The alternative to
# depending on the adapters is a third view type per model, which is exactly the
# drift a single projection exists to prevent (RS-28).
aex-secret-domain = { path = "../aex-secret-domain" }
aex-secret-custody-dynamodb = { path = "../aex-secret-custody-dynamodb" }
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false }

[dev-dependencies]
http-body-util.workspace = true
proptest.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros"] }

[[test]]
name = "primitives"
path = "tests/primitives.rs"

[[test]]
name = "mount"
path = "tests/mount.rs"

[[test]]
name = "projection"
path = "tests/projection.rs"
