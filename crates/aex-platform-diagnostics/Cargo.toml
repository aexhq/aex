[package]
name = "aex-platform-diagnostics"
version = "0.1.0"
description = "`aex-platform-diagnostics` installs AEX's process-local JSON diagnostics."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "adapter"
artifact = "none"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.targets]
install = "unit"

[package.metadata.aex.not_applicable]
integration = "the adapter writes through tracing-subscriber's process-local formatter and owns no external transport or collector seam"
live_suite = "process-local JSON rendering has no external seam; each deployable's own live companion observes its logs"

[dependencies]
tracing-subscriber.workspace = true

[dev-dependencies]
tracing.workspace = true
