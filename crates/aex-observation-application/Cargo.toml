[package]
name = "aex-observation-application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "internal"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the observations-usage stream; the cases land with the crate's own implementation"
live_suite = "application crate; its ports are exercised through its deployable's companion"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-observation-domain = { path = "../aex-observation-domain" }
aex-wire = { path = "../aex-wire" }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
