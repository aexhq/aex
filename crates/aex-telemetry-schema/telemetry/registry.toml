# AEX internal operational telemetry registry.
#
# This file is the single source of truth for internal diagnostic vocabulary.
# `src/generated.rs` is rendered from it and committed; a test proves that
# regeneration is byte-identical, so editing the generated file by hand fails CI.
#
# Every attribute declares exactly one cardinality class and exactly one
# visibility class. `aex-platform-telemetry` removes any attribute whose
# visibility is not `public` before a record can leave the process, so an
# accidental identifier cannot become a metric dimension or reach a collector.
#
# Cardinality:
#   fixed      a closed, enumerable set fixed at build time
#   bounded    an open set with a declared maximum length and a review obligation
#   unbounded  a per-entity identifier that must never become a metric dimension
#
# Visibility:
#   public     safe to export from the process
#   internal   removed on export; usable only inside the emitting process
#   forbidden  never representable in an exported record at all

schema_version = "1"
reserved_prefixes = ["aex.reserved.", "otel.", "telemetry.sdk."]

# --- resource and process identity -------------------------------------------

[[attribute]]
name = "aex.plane"
brief = "Deployment plane the emitting process belongs to."
cardinality = "fixed"
visibility = "public"
max_len = 8

[[attribute]]
name = "aex.region"
brief = "AWS region the emitting process is bound to."
cardinality = "fixed"
visibility = "public"
max_len = 24

[[attribute]]
name = "aex.deployable"
brief = "Name of the deployable that emitted the record."
cardinality = "fixed"
visibility = "public"
max_len = 48

[[attribute]]
name = "aex.artifact.digest"
brief = "Immutable digest of the artifact the process was built from."
cardinality = "bounded"
visibility = "internal"
max_len = 71

# --- operation shape ----------------------------------------------------------

[[attribute]]
name = "aex.operation"
brief = "Declared operation name, drawn from the contract route registry."
cardinality = "bounded"
visibility = "public"
max_len = 64

[[attribute]]
name = "aex.outcome"
brief = "Outcome class of an operation: ok, rejected, failed or unknown."
cardinality = "fixed"
visibility = "public"
max_len = 8

[[attribute]]
name = "aex.error.class"
brief = "Stable error class from the public error vocabulary."
cardinality = "bounded"
visibility = "public"
max_len = 48

[[attribute]]
name = "aex.retry.count"
brief = "Number of attempts already made for this effect identity."
cardinality = "bounded"
visibility = "public"
max_len = 3

[[attribute]]
name = "aex.isolation.count"
brief = "Complete number of malformed rows isolated in one bounded recovery pass."
cardinality = "bounded"
visibility = "public"
max_len = 10

[[attribute]]
name = "aex.isolation.fingerprint"
brief = "Redacted sixteen-hex correlation digest for one isolated row."
cardinality = "bounded"
visibility = "public"
max_len = 16

# --- provider and meter shape -------------------------------------------------

[[attribute]]
name = "aex.provider"
brief = "Model provider, one of the six admitted BYOK providers."
cardinality = "fixed"
visibility = "public"
max_len = 16

[[attribute]]
name = "aex.model"
brief = "Model slug within the declared provider."
cardinality = "bounded"
visibility = "public"
max_len = 64

[[attribute]]
name = "aex.meter"
brief = "Usage meter identity, one of the four launch meters."
cardinality = "fixed"
visibility = "public"
max_len = 32

# --- per-entity identifiers: never exported -----------------------------------

[[attribute]]
name = "aex.organization.id"
brief = "Organization identifier. Internal only: never a metric dimension."
cardinality = "unbounded"
visibility = "internal"
max_len = 36

[[attribute]]
name = "aex.workspace.id"
brief = "Workspace identifier. Internal only: never a metric dimension."
cardinality = "unbounded"
visibility = "internal"
max_len = 36

[[attribute]]
name = "aex.session.id"
brief = "Session identifier. Internal only: never a metric dimension."
cardinality = "unbounded"
visibility = "internal"
max_len = 36

[[attribute]]
name = "aex.run.id"
brief = "Run identifier. Internal only: never a metric dimension."
cardinality = "unbounded"
visibility = "internal"
max_len = 36

[[attribute]]
name = "aex.activation.id"
brief = "Brain activation identifier. Internal only: never a metric dimension."
cardinality = "unbounded"
visibility = "internal"
max_len = 36

[[attribute]]
name = "aex.request.id"
brief = "Inbound request identifier. Internal only: never a metric dimension."
cardinality = "unbounded"
visibility = "internal"
max_len = 36

# --- values that may never be recorded ---------------------------------------

[[attribute]]
name = "aex.customer.email"
brief = "Customer email address. Declared so the redactor can name and drop it."
cardinality = "unbounded"
visibility = "forbidden"
max_len = 254

[[attribute]]
name = "aex.secret.plaintext"
brief = "Secret plaintext. Declared so the redactor can name and drop it."
cardinality = "unbounded"
visibility = "forbidden"
max_len = 0

[[attribute]]
name = "aex.payment.instrument"
brief = "Payment instrument detail. Declared so the redactor can name and drop it."
cardinality = "unbounded"
visibility = "forbidden"
max_len = 0

# --- instruments --------------------------------------------------------------

[[metric]]
name = "aex.telemetry.records.dropped"
brief = "Diagnostic records discarded because the bounded export queue was full or the exporter failed."
instrument = "counter"
unit = "1"
attributes = ["aex.plane", "aex.region", "aex.deployable"]

[[metric]]
name = "aex.telemetry.records.exported"
brief = "Diagnostic records handed to the host exporter."
instrument = "counter"
unit = "1"
attributes = ["aex.plane", "aex.region", "aex.deployable"]

[[metric]]
name = "aex.telemetry.flush.deadline.exceeded"
brief = "Flush attempts that stopped at their deadline with records still pending."
instrument = "counter"
unit = "1"
attributes = ["aex.plane", "aex.region", "aex.deployable"]

[[metric]]
name = "aex.operation.duration"
brief = "Wall-clock duration of a declared operation."
instrument = "histogram"
unit = "ms"
attributes = ["aex.plane", "aex.region", "aex.deployable", "aex.operation", "aex.outcome"]

[[metric]]
name = "aex.admission.rejected"
brief = "Admissions shed by a pressure or quota policy."
instrument = "counter"
unit = "1"
attributes = ["aex.plane", "aex.region", "aex.deployable", "aex.error.class"]

# --- spans --------------------------------------------------------------------

[[span]]
name = "aex.operation.execute"
brief = "One declared operation from admission to outcome."
attributes = ["aex.operation", "aex.outcome", "aex.error.class", "aex.retry.count"]

[[span]]
name = "aex.provider.call"
brief = "One model provider request, including its streamed response."
attributes = ["aex.provider", "aex.model", "aex.outcome", "aex.error.class"]

[[span]]
name = "aex.storage.transaction"
brief = "One durable storage transaction against a single authority."
attributes = ["aex.operation", "aex.outcome", "aex.error.class", "aex.retry.count"]

# --- events -------------------------------------------------------------------

[[event]]
name = "aex.brain.due_row.isolated"
brief = "Brain isolated a malformed due-index row while valid siblings continued."
attributes = ["aex.plane", "aex.region", "aex.deployable", "aex.error.class", "aex.isolation.count", "aex.isolation.fingerprint"]

[[event]]
name = "aex.process.started"
brief = "A deployable accepted its configuration and started."
attributes = ["aex.plane", "aex.region", "aex.deployable", "aex.artifact.digest"]

[[event]]
name = "aex.process.configuration.rejected"
brief = "A deployable refused to start because its configuration was invalid."
attributes = ["aex.plane", "aex.region", "aex.deployable", "aex.error.class"]

[[event]]
name = "aex.telemetry.exporter.absent"
brief = "No exporter was installed, so diagnostics are discarded at the facade."
attributes = ["aex.plane", "aex.region", "aex.deployable"]
