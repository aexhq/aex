[package]
name = "aex-telemetry-schema"
version = "0.1.0"
description = "`aex-telemetry-schema` owns the internal operational telemetry vocabulary: a reviewed declarative registry of attribute, instrument, span and event names, the cardinality and visibility class of every attribute, and the reserved-name rules that keep product code from colliding with runtime-owned names."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "contracts"
role = "contract"
artifact = "none"
layers = ["unit"]
concerns = ["contract", "property", "security"]
seams = []
security_tier = "diagnostic"
risk = ["untrusted_input", "generated_code"]
scenarios = []

[package.metadata.aex.targets]
generated = "unit"

[package.metadata.aex.not_applicable]
live_suite = "generated contract crate; its wire is exercised through every deployable's companion, not a live seam of its own"

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
