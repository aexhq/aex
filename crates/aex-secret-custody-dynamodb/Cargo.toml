[package]
name = "aex-secret-custody-dynamodb"
version = "0.1.0"
description = "`aex-secret-custody-dynamodb` owns the `regional-secret-custody` table adapter: ciphertext generations, lineage rows and revocation epochs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-regional-secret-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.dynamodb.condition", "aws.dynamodb.ttl"]
security_tier = "secret"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"
integration = "integration"

[features]
# The provider-credential condition compiler used by session admission. The
# default custody adapter stays independent of session-authority rows; only the
# serving owner that composes cross-table session transactions enables this
# bridge.
session-admission = ["aex-session-dynamodb/session-authority"]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["dep:tokio", "aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
aex-secret-domain = { path = "../aex-secret-domain" }
# The narrow BYOK admission port and cross-table condition vocabulary. The
# adapter projects metadata only and never exposes credential material.
aex-session-app = { path = "../aex-session-app" }
aex-wire = { path = "../aex-wire" }
# The shared regional store machinery only. `session-admission` explicitly adds
# the application-plan compiler's session-authority vocabulary for its owner.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false }

tokio = { workspace = true, optional = true }

[dev-dependencies]
aws-config.workspace = true
http.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
