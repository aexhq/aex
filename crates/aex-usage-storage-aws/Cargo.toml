[package.metadata.aex.not_applicable]
integration = "DEFERRED, not inapplicable: the DynamoDB Local suite (concurrent producers converging on a contiguous sequence, ambiguous-commit resolution by re-reading ID#, replay vs conflict discrimination) is unwritten. The expression and codec halves are covered at the unit layer; the transaction's live behaviour is not."

[package.metadata.aex.targets]
isolation = "unit"

