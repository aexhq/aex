[package]
name = "aex-usage-authority-dynamodb"
version = "0.1.0"
description = "Shared, category-parametric `DynamoDB` machinery for the usage authorities."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "adapter"
artifact = "none"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = []
security_tier = "internal"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
inline_targets = "the `observations-usage` stream keeps the byte-for-byte codec, expression, fault, and stream fixtures beside the shared mechanisms; this crate declares no separate [[test]] target"
integration = "the shared leaf selects no category, table, credentials, queue, or IAM boundary; the three owning authority facades retain the existing integration and live suites"
live_suite = "the shared leaf owns no deployable or external seam; compute, storage, and transfer authority live companions exercise it through their typed facades"

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-sqs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true
aex-usage-app = { path = "../aex-usage-app" }
aex-usage-domain = { path = "../aex-usage-domain" }

[dev-dependencies]
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
