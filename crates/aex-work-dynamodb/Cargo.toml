[package]
name = "aex-work-dynamodb"
version = "0.1.0"
description = "`aex-work-dynamodb` owns the `regional-work` table: wake, due, claim, lease, fence, attempt, dedupe claims and per-shard reconciliation cursors over one sharded due index."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-operation-worker"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
# `aws.dynamodb.streams` is deliberately absent: this crate writes rows, it
# never reads the change feed. The stream contract is a table-definition fact in
# `migrations/regional`, and `regional-stream` plus the EventBridge pipes own the
# consuming seam.
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.dynamodb.ttl"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"

[package.metadata.aex.not_applicable]
integration = "blocked on a cross-stream gap: `data-image-literal` bans `GenericImage::new(` outside `tests/support/aex-test-harness`, and the harness exposes `images::reference` but no container-start helper, so no stream can start a pinned engine today. The DynamoDB Local cases are specified in plan 05 section 8.2 and land the moment the harness owns container bring-up."

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
aex-wire = { path = "../aex-wire" }
# The shared regional store machinery only: key components, the typed row
# reader, item measurement, the plan compiler, the error vocabulary and the
# replay combinator. `default-features = false` keeps the session-authority row
# codec and the projection reader out of this crate's link graph entirely.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"
