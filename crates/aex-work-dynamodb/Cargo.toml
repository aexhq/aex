[package]
name = "aex-work-dynamodb"
version = "0.1.0"
description = "`aex-work-dynamodb` owns the `regional-work` table: wake, due, claim, lease, fence, attempt, dedupe claims and per-shard reconciliation cursors over one sharded due index."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Every test target is declared explicitly, so `tests/support/` is a module and
# never a target of its own.
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-stores"
role = "adapter"
artifact = "none"
live_suite = "aex-live-session-maintenance-worker"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
# `aws.dynamodb.streams` is deliberately absent: this crate writes rows, it
# never reads the change feed. The stream contract is a table-definition fact in
# `migrations/regional`, and `regional-stream` plus the EventBridge pipes own the
# consuming seam.
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.dynamodb.ttl"]
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
faults = "unit"
security = "unit"
integration = "integration"

[features]
# Engine-backed targets. The unit lane neither builds nor links any of it, so
# the per-stream gate still runs on a machine with no container runtime.
integration-engines = ["aex-test-harness/containers"]

[dependencies]
async-trait.workspace = true
aws-sdk-dynamodb.workspace = true
aws-smithy-types.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
aex-operation-domain = { path = "../aex-operation-domain" }
aex-session-app = { path = "../aex-session-app" }
aex-wire = { path = "../aex-wire" }
# The shared regional store machinery only: key components, the typed row
# reader, item measurement, the plan compiler, the error vocabulary and the
# replay combinator. `default-features = false` keeps the session-authority row
# codec and the projection reader out of this crate's link graph entirely.
aex-session-dynamodb = { path = "../aex-session-dynamodb", default-features = false, features = ["session-authority"] }

[dev-dependencies]
aws-config.workspace = true
aws-smithy-http-client.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
aex-test-harness = { path = "../../tests/support/aex-test-harness" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-engines"]
