[package]
name = "aex-finance-aurora"
version = "0.1.0"
description = "`aex-finance-aurora` owns the finance `PostgreSQL` adapter: balanced-posting constraints, atomic projection/inbox/outbox writes and lock/serialization behaviour."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "adapter"
artifact = "none"
live_suite = "aex-live-finance-api"
layers = ["unit", "integration"]
concerns = ["contract", "property", "fault", "security"]
seams = ["aws.rds_data.transaction", "aws.aurora.serverless_v2"]
security_tier = "authority"
risk = ["money"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
integration = "integration"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
aex-finance-app = { path = "../aex-finance-app" }
aex-finance-domain = { path = "../aex-finance-domain" }
aex-rds-data = { path = "../aex-rds-data" }

[dev-dependencies]
aws-sdk-rdsdata.workspace = true
proptest.workspace = true
