[package]
name = "aex-control-domain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "domain"
artifact = "none"
layers = ["unit"]
concerns = ["property", "security"]
seams = []
security_tier = "authority"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"
authorization = "unit"

[package.metadata.aex.not_applicable]
live_suite = "pure domain crate; Area 9's registry declares no independent live seam"

[dependencies]
aex-wire = { path = "../aex-wire" }
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "authorization"
path = "tests/authorization.rs"
