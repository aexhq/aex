[package]
name = "aex-identity-domain"
version = "0.1.0"
description = "`aex-identity-domain` owns the pure identity state machine — people, provider links, browser sessions and email challenges — plus the two codecs the whole platform authenticates through: the credential codec and the 30-second authorization assertion."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "domain"
artifact = "none"
layers = ["unit"]
concerns = ["property", "security"]
seams = []
security_tier = "secret"
risk = ["concurrency", "untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"
security = "unit"
assertion = "unit"

[package.metadata.aex.not_applicable]
live_suite = "pure domain crate; Area 9's registry declares no independent live seam"

[dependencies]
aex-control-domain = { path = "../aex-control-domain" }
# The audience vocabulary and the issued-envelope transport. There is one
# audience enum in the platform and it is the one the two `central-authz`
# requests carry; this crate owns the byte that encodes it, not the enum.
aex-internal-contracts = { path = "../aex-internal-contracts" }
aex-wire = { path = "../aex-wire" }
ed25519-dalek.workspace = true
hmac.workspace = true
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "assertion"
path = "tests/assertion.rs"
