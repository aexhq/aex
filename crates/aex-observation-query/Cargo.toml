[package]
name = "aex-observation-query"
version = "0.1.0"
description = "`aex-observation-query` owns the bounded public observation query language: `AST` normalization, the typed field policy, exact ordering, cursor binding and coverage calculation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "application"
artifact = "none"
layers = ["unit"]
concerns = ["property", "fault"]
seams = []
security_tier = "diagnostic"
risk = ["concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the observations-usage stream; the cases land with the crate's own implementation"
live_suite = "application crate; its ports are exercised through its deployable's companion"

[dependencies]
aex-observation-domain = { path = "../aex-observation-domain" }
aex-wire = { path = "../aex-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
