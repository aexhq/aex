# AEX Rust-native platform workspace.
#
# One virtual workspace holds every Rust library crate, deployable binary,
# workspace tool and live-test companion package. Direct dependency versions are
# declared exactly once, here, and referenced by members with `dep.workspace = true`.
#
# Retained TypeScript surfaces (`packages/`, `apps/`, `scripts/`,
# `tools/eslint-plugin-aex`) and the two TypeScript Stripe edge Lambdas are not
# Cargo members. `tools/aex-workspace-check` proves the member list and the
# on-disk tree agree.

[workspace]
resolver = "3"
members = [
    "crates/aex-brain-app",
    "crates/aex-brain-domain",
    "crates/aex-brain-hands",
    "crates/aex-brain-managed-web",
    "crates/aex-brain-provider-custody",
    "crates/aex-brain-provider",
    "crates/aex-brain-store-dynamodb",
    "crates/aex-brain-test-support",
    "crates/aex-brain-tool-catalog",
    "crates/aex-capacity-dynamodb",
    "crates/aex-central-http",
    "crates/aex-central-aws",
    "crates/aex-content-aws",
    "crates/aex-content-domain",
    "crates/aex-content-dynamodb",
    "crates/aex-control-app",
    "crates/aex-control-aurora",
    "crates/aex-control-domain",
    "crates/aex-finance-app",
    "crates/aex-finance-domain",
    "crates/aex-hands-agent",
    "crates/aex-hands-control-aws",
    "crates/aex-hands-protocol",
    "crates/aex-hands-tools",
    "crates/aex-identity-app",
    "crates/aex-identity-aurora",
    "crates/aex-identity-domain",
    "crates/aex-internal-contracts",
    "crates/aex-model-catalog",
    "crates/aex-model-vocabulary",
    "crates/aex-operation-domain",
    "crates/aex-payment-contracts",
    "crates/aex-platform-diagnostics",
    "crates/aex-rds-data",
    "crates/aex-regional-http",
    "crates/aex-regional-test-support",
    "crates/aex-registry-dynamodb",
    "crates/aex-runtime-activity-dynamodb",
    "crates/aex-runtime-control",
    "crates/aex-runtime-control-aws",
    "crates/aex-secret-aws",
    "crates/aex-secret-custody-dynamodb",
    "crates/aex-secret-domain",
    "crates/aex-secret-keystore-dynamodb",
    "crates/aex-session-app",
    "crates/aex-session-domain",
    "crates/aex-session-dynamodb",
    "crates/aex-session-telemetry-aws",
    "crates/aex-tool-mux",
    "crates/aex-usage-app",
    "crates/aex-usage-domain",
    "crates/aex-usage-rating",
    "crates/aex-wire",
    "crates/aex-work-dynamodb",
    "crates/aex-workspace-domain",
    "services/central-api",
    "services/finance-ingest",
    "services/session-stream-api",
    "services/tool-mux",
    "workers/central-control-worker",
    "workers/central-schema-admin",
    "workers/file-ingest-worker",
    "workers/runtime-control-worker",
    "workers/session-operation-worker",
    "runtimes/brain-mux",
    "runtimes/hands-agent",
    "runtimes/hands-image",
    "tools/aex-cli",
    "tools/aex-contract-gen",
    "tools/aex-release-tool",
    "tools/aex-workspace-check",
    "tests/live/aex-live-brain-mux",
    "tests/live/aex-live-control-api",
    "tests/live/aex-live-control-projection-worker",
    "tests/live/aex-live-dashboard",
    "tests/live/aex-live-billing-worker",
    "tests/live/aex-live-hands-agent",
    "tests/live/aex-live-hands-image",
    "tests/live/aex-live-session-api",
    "tests/live/aex-live-runtime-control-worker",
    "tests/live/aex-live-tool-mux",
    "tests/live/aex-live-session-maintenance-worker",
    "tests/live/aex-live-site",
    "tests/live/aex-live-stripe-webhook-edge",
    "tests/support/aex-scenarios",
    "tests/support/aex-test-harness",
    "tests/load/aex-load-harness",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aexhq/aex"
authors = ["AEX maintainers <maintainers@aex.dev>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

# Lambda ZIP and one-shot task builds. `panic = "abort"` belongs here rather than
# in `release` so `cargo test --release` keeps working for the whole workspace.
[profile.release-lambda]
inherits = "release"
panic = "abort"
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
# --- async runtime and utilities -------------------------------------------
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1.91"
bytes = { version = "1.12.1", features = ["serde"] }
# Safe pin projection. `unsafe_code` is forbidden workspace-wide, so a future or
# body wrapper cannot hand-roll one.
pin-project-lite = "0.2.17"

# --- HTTP server, client and TLS -------------------------------------------
axum = { version = "0.8.9", features = ["macros"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query", "stream", "http2", "charset"] }
oauth2 = { version = "5.0.0", default-features = false }
aws-lc-rs = "1.17.3"
url = { version = "2.5.8", features = ["serde"] }
webbrowser = { version = "1.2.4", features = ["hardened"] }

# --- AWS Lambda hosting ------------------------------------------------------
lambda_runtime = "1.3.0"
lambda_http = "1.3.0"
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["dynamodb", "sqs", "s3"] }

# --- AWS service SDKs --------------------------------------------------------
aws-config = { version = "1.10.1", features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.119.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodbstreams = { version = "1.107.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-sdk-sqs = { version = "1.105.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.114.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# The regional edge resolves a 30-second assertion by invoking `central-authz`
# directly. That deployable is IAM-invoked rather than routed, so there is no
# HTTPS endpoint to reach it on and no second authentication hop to get wrong.
aws-sdk-lambda = { version = "1.138.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# Parameter Store holds the two pieces of key material a regional edge needs at
# start-up: the assertion trust anchors and the cursor signing ring. Both are
# read once per cold start and never per request.
aws-sdk-ssm = { version = "1.118.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-rdsdata = { version = "1.108.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.136.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-lambdamicrovms = { version = "1.3.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.111.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1.128.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sigv4a"] }
# The finance sweeps report and fence; they never auto-repair money (F-30). The
# report leaves the process through the operations topic and nowhere else.
aws-sdk-sns = { version = "1.107.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-smithy-types = "1.6.1"
aws-smithy-runtime-api = "1.14.0"
aws-types = "1.3.14"
# `capture_request` is how every adapter asserts the exact serialized request
# body instead of comparing it against a hand-written mirror (plan 05 D-28). It
# is a dev-dependency everywhere; no production target links it.
aws-smithy-http-client = { version = "1.2.0", features = ["test-util"] }

# --- serialization and schema ------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_dynamo = "4.3.0"
serde_norway = "0.9.42"
jsonschema = { version = "0.49.2", default-features = false, features = ["resolve-file"] }
html5ever = "0.39.0"
encoding_rs = "0.8.35"
prost = "0.14.4"
prost-types = "0.14.4"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
toml = "1.1.4"

# --- PostgreSQL (schema admin only; runtime Lambdas use aex-rds-data) --------
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "time", "uuid"] }

# --- errors ------------------------------------------------------------------
thiserror = "2.0.19"
anyhow = "1.0.104"

# --- private process diagnostics ---------------------------------------------
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }


# --- identifiers, time, exact arithmetic, hashing, secrets -------------------
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
time = { version = "0.3.54", features = ["macros", "serde", "formatting", "parsing"] }
sha2 = "0.11.0"
blake3 = "1.8.5"
# Shard selection only: `xxh3_64(id) % shards` spreads a due index over a fixed
# partition set. Never used where a cryptographic digest is required.
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
hmac = "0.13.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
base64 = "0.23.0"
hex = "0.4.3"
# num-bigint stays on 0.4 so it is the same crate version num-rational 0.4 uses;
# 0.5 exists but would split the graph and break exact rational interop.
num-bigint = { version = "0.4.8", features = ["serde"] }
num-rational = { version = "0.4.2", default-features = false, features = ["std", "num-bigint", "serde"] }
num-traits = "0.2.19"
rand = { version = "0.10.2", features = ["std", "std_rng", "thread_rng"] }
# Constant-time comparison for every credential verifier and MAC check.
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
# Ed25519 signing and verification for the 30-second authorization assertion.
# OD-21 keeps this to the one path where AEX holds the key material directly;
# everything whose key lives in KMS uses `ECDSA_SHA_256` instead.
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "zeroize", "fast"] }
zeroize = { version = "1.9.0", features = ["derive", "alloc", "std"] }
secrecy = { version = "0.10.3", features = ["serde"] }
# Safe wrappers over the four syscall seams the usage probe needs
# (`clock_gettime(ThreadCPUTime)`); keeps `unsafe_code` forbidden.
rustix = { version = "1.1.4", default-features = false, features = ["std", "time", "process", "thread"] }

# --- protocol adapters -------------------------------------------------------
rmcp = { version = "=3.1.0", default-features = false, features = ["client"] }

# --- deterministic archive packaging (aex-release-tool only) -----------------
# The release tool writes ZIP and tar.gz archives itself rather than delegating
# to a packager, because artifact identity requires byte-stable archive
# metadata that `cargo lambda --output-format zip` does not guarantee. Only the
# DEFLATE stream is borrowed; every header field is written explicitly.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
zstd = "0.13.3"
brotli = "8.0.4"

# --- general utilities -------------------------------------------------------
regex = "1.13.1"
parking_lot = "0.12.5"
clap = { version = "4.6.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.8"
cargo_metadata = "0.23.1"
walkdir = "2.5.0"

# --- test-only ---------------------------------------------------------------
proptest = "1.11.0"
insta = { version = "1.48.0", features = ["json", "yaml", "redactions"] }
loom = "0.7.2"
testcontainers = "0.27.3"
tempfile = "3.27.0"
similar-asserts = "2.0.0"
