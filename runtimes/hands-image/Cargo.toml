[package]
name = "hands-image"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "runtime_image"
artifact = "hands_image"
deployable = "hands-image"
live_suite = "aex-live-hands-image"
layers = ["unit", "smoke", "e2e"]
concerns = ["fault", "security"]
seams = ["hands.guest.lifecycle", "aws.lambda.microvm"]
security_tier = "guest"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
image_variants = "unit"
package_manifest = "unit"
nevra_lockfile = "unit"
rootfs_contract = "unit"

[[bin]]
name = "hands-image"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
