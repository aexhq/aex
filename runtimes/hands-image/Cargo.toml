[package]
name = "hands-image"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "runtime_image"
artifact = "hands_image"
deployable = "hands-image"
live_suite = "aex-live-hands-image"
layers = ["unit", "smoke", "e2e"]
concerns = ["fault", "security"]
seams = ["hands.guest.lifecycle", "aws.lambda.microvm"]
security_tier = "guest"
risk = ["untrusted_input"]
scenarios = []


[[bin]]
name = "hands-image"
path = "src/main.rs"

[package.metadata.aex.not_applicable]
targets = "the `hands` stream places this crate's evidence in inline unit modules, which the declared `unit` layer already collects; the crate declares no [[test]] target, so there is nothing to map"

[dependencies]
aex-hands-agent = { path = "../../crates/aex-hands-agent" }
cargo_metadata.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
