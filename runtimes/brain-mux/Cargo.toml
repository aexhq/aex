[package]
name = "brain-mux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "deployable"
artifact = "oci_image"
deployable = "brain-mux"
live_suite = "aex-live-brain-mux"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.ecs.run_task", "aws.dynamodb.transact_write", "aws.sqs.fifo", "aws.iam.denial", "provider.openai.stream", "provider.anthropic.stream", "provider.deepseek.stream", "provider.zai.stream", "provider.moonshotai.stream", "provider.google.stream", "mcp.streamable_http", "net.public_egress", "aws.lambda.microvm", "hands.guest.lifecycle"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "brain-core's composition, config and health cases live in the binary's #[cfg(test)] modules; the smoke, e2e and performance layers belong to the aex-live-brain-mux companion, which owns every created resource"

[[bin]]
name = "brain-mux"
path = "src/main.rs"

[dependencies]
aex-brain-application = { path = "../../crates/aex-brain-application" }
aex-brain-domain = { path = "../../crates/aex-brain-domain" }
aex-brain-hands = { path = "../../crates/aex-brain-hands" }
aex-brain-provider-gateway = { path = "../../crates/aex-brain-provider-gateway" }
aex-brain-store-aws = { path = "../../crates/aex-brain-store-aws" }
aex-model-catalog = { path = "../../crates/aex-model-catalog" }
# The composed `ToolPort`. It is linked with no executor registered, because nothing
# implements `ToolExecutor` yet; the router then refuses by its own typed error
# rather than by one invented in this composition.
aex-brain-tool-catalog = { path = "../../crates/aex-brain-tool-catalog" }
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-sqs.workspace = true
futures.workspace = true
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
# The METER-02 probe library. A11-MUX imports `ActivationMeter`, `MemoryBudget`,
# `MemoryReservation` and `CpuReconciler` from here rather than declaring its
# own: two definitions of a billing unit is how a bill and a receipt come to
# disagree.
aex-usage-application = { path = "../../crates/aex-usage-application", features = ["probe"] }
aex-usage-domain = { path = "../../crates/aex-usage-domain" }
aex-wire = { path = "../../crates/aex-wire" }
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }

[dev-dependencies]
# The engine's own in-memory ports, so the composition is asserted against exactly the
# behaviour the activation is asserted against rather than a second set of fixtures.
aex-brain-application = { path = "../../crates/aex-brain-application", features = ["testing"] }
