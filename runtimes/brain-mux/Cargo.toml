[package]
name = "brain-mux"
version = "0.1.0"
description = "`brain-mux` composition root (Rust Fargate OCI)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "deployable"
artifact = "oci_image"
deployable = "brain-mux"
live_suite = "aex-live-brain-mux"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.sqs.fifo", "aws.iam.denial", "provider.openai.stream", "provider.anthropic.stream", "provider.deepseek.stream", "provider.xai.stream", "provider.meta.stream", "provider.moonshotai.stream", "provider.alibaba.stream", "net.public_egress"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.not_applicable]
inline_targets = "brain-core's composition, config and health cases live in the binary's #[cfg(test)] modules; the smoke, e2e and performance layers belong to the aex-live-brain-mux companion, which owns every created resource"

[[bin]]
name = "brain-mux"
path = "src/main.rs"

[dependencies]
aex-brain-app = { path = "../../crates/aex-brain-app" }
aex-brain-domain = { path = "../../crates/aex-brain-domain" }
aex-content-aws = { path = "../../crates/aex-content-aws" }
aex-tool-mux = { path = "../../crates/aex-tool-mux" }
aex-hands-protocol = { path = "../../crates/aex-hands-protocol" }
aex-control-domain = { path = "../../crates/aex-control-domain" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-identity-domain = { path = "../../crates/aex-identity-domain" }
aex-brain-provider-custody = { path = "../../crates/aex-brain-provider-custody" }
aex-brain-provider = { path = "../../crates/aex-brain-provider" }
aex-brain-store-dynamodb = { path = "../../crates/aex-brain-store-dynamodb" }
aex-model-catalog = { path = "../../crates/aex-model-catalog" }
aex-runtime-control = { path = "../../crates/aex-runtime-control" }
aex-secret-aws = { path = "../../crates/aex-secret-aws" }
aex-secret-custody-dynamodb = { path = "../../crates/aex-secret-custody-dynamodb" }
aex-secret-domain = { path = "../../crates/aex-secret-domain" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", features = ["session-authority"] }
aex-session-telemetry-aws = { path = "../../crates/aex-session-telemetry-aws" }
# The composed `ToolPort`. Production binds only executors with exact per-tool
# coverage; catalog installation refuses any active row without an earned
# implementation.
aex-brain-tool-catalog = { path = "../../crates/aex-brain-tool-catalog" }
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-kms.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sqs.workspace = true
aws-sdk-secretsmanager.workspace = true
base64.workspace = true
hex.workspace = true
futures.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
reqwest.workspace = true
aex-platform-diagnostics = { path = "../../crates/aex-platform-diagnostics" }
tracing.workspace = true
# The METER-02 probe library. A11-MUX imports `ActivationMeter`, `MemoryBudget`,
# `MemoryReservation` and `CpuReconciler` from here rather than declaring its
# own: two definitions of a billing unit is how a bill and a receipt come to
# disagree.
aex-usage-app = { path = "../../crates/aex-usage-app", features = ["probe"] }
aex-usage-domain = { path = "../../crates/aex-usage-domain" }
aex-wire = { path = "../../crates/aex-wire" }
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }

[dev-dependencies]
# The engine's own in-memory ports, so the composition is asserted against exactly the
# behaviour the activation is asserted against rather than a second set of fixtures.
aex-brain-app = { path = "../../crates/aex-brain-app", features = ["testing"] }
tool-mux = { path = "../../services/tool-mux" }
axum.workspace = true
serde.workspace = true
# The paused clock. The dependency probe's cadence and the reactor window's one-second
# publication are both schedules, and asserting a schedule against the wall clock is how a
# suite becomes slow and flaky at once.
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

[build-dependencies]
serde.workspace = true
toml.workspace = true
