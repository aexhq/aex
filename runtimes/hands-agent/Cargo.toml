[package]
name = "hands-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "deployable"
artifact = "native_binary"
deployable = "hands-agent"
live_suite = "aex-live-hands-agent"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["hands.guest.lifecycle"]
security_tier = "guest"
risk = ["untrusted_input"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the hands stream; the cases land with the binary's own implementation"

[[bin]]
name = "hands-agent"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true
