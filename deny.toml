# cargo-deny policy for the AEX Rust workspace.
#
# Run with: cargo deny --all-features check
#
# The policy is deliberately strict: a dependency that cannot be classified is a
# review item, not a silent addition. License, advisory, ban and source classes
# are all gated so a supply-chain change cannot arrive as incidental drift.

[graph]
all-features = false
no-default-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0e_ed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # TLS is rustls-only everywhere; no OpenSSL may enter the graph.
    { crate = "openssl", reason = "TLS is rustls + aws-lc-rs only" },
    { crate = "openssl-sys", reason = "TLS is rustls + aws-lc-rs only" },
    { crate = "native-tls", reason = "TLS is rustls + aws-lc-rs only" },
    # Time handling is the `time` crate only.
    { crate = "chrono", reason = "time handling is the `time` crate only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
