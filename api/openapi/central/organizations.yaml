plane: central
fragment: organizations
operations:
  - { id: organizations_list, method: GET, path: /api/organizations, summary: "List organizations the caller belongs to.", scope: "organizations:read", success: OrganizationPage, errors: [unauthenticated, insufficient_scope, invalid_cursor], query: { cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: organization_create, method: POST, path: /api/organizations, summary: "Create an organization whose creator becomes owner.", scope: "organizations:write", idempotency: idempotency_key, request: OrganizationCreateRequest, successStatus: 201, success: Organization, errors: [unauthenticated, insufficient_scope, invalid_request, idempotency_conflict, idempotency_in_flight, resource_conflict, commit_outcome_unknown, limit_exceeded] }
  - { id: organization_get, method: GET, path: "/api/organizations/{organizationId}", summary: "Read one organization.", scope: "organizations:read", success: Organization, errors: [unauthenticated, forbidden, insufficient_scope, not_found] }
  - { id: memberships_list, method: GET, path: "/api/organizations/{organizationId}/memberships", summary: "List the memberships of an organization.", scope: "memberships:read", success: MembershipPage, errors: [unauthenticated, forbidden, insufficient_scope, not_found, invalid_cursor], query: { cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: invitation_create, method: POST, path: "/api/organizations/{organizationId}/invitations", summary: "Invite a person to the organization.", scope: "memberships:write", idempotency: idempotency_key, request: InvitationCreateRequest, successStatus: 201, success: Invitation, errors: [unauthenticated, forbidden, insufficient_scope, not_found, invalid_request, idempotency_conflict, idempotency_in_flight, resource_conflict, commit_outcome_unknown, limit_exceeded] }
  # Acceptance names no invitation. An invitation carries no secret and no
  # token column exists, so the only thing that identifies one is the address
  # it was sent to: this route redeems every pending invitation addressed to
  # the caller's own verified email, in one transaction, and is therefore
  # naturally idempotent — a second call finds nothing pending and answers an
  # empty list. It resolves no organization, because the caller is by
  # definition not yet a member of the organizations inviting them.
  - { id: invitation_accept, method: POST, path: /api/invitations/acceptances, summary: "Redeem every pending invitation addressed to the caller's verified email.", scope: "memberships:accept", altPrincipal: user_session, request: EmptyRequest, success: InvitationAcceptResult, safeRetry: true, errors: [unauthenticated, forbidden, insufficient_scope, resource_conflict, commit_outcome_unknown, upstream_error] }
