plane: central
fragment: billing
operations:
  - { id: billing_balance_get, method: GET, path: /api/billing/balance, summary: "Read the caller's prepaid balance and active reservations.", scope: "billing:read", altPrincipal: user_session, success: BillingBalance, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found] }
  - { id: billing_payment_methods_list, method: GET, path: /api/billing/payment-methods, summary: "List card display metadata for the caller's account.", scope: "billing:read", altPrincipal: user_session, success: PaymentMethodPage, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found, upstream_error] }
  - { id: billing_payment_method_session_create, method: POST, path: /api/billing/payment-method-sessions, summary: "Create a Stripe-hosted card setup session with explicit consent.", scope: "billing:write", altPrincipal: user_session, idempotency: idempotency_key, request: PaymentMethodSessionRequest, successStatus: 201, success: HostedSession, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found, invalid_request, idempotency_conflict, upstream_error] }
  - { id: billing_payment_method_delete, method: DELETE, path: "/api/billing/payment-methods/{paymentMethodId}", summary: "Detach a card owned by the caller's account.", scope: "billing:write", altPrincipal: user_session, idempotency: idempotency_key, successStatus: 204, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found, idempotency_conflict, resource_conflict, upstream_error] }
  - { id: billing_top_up_checkout_create, method: POST, path: /api/billing/top-up-checkouts, summary: "Create a one-time Stripe-hosted prepaid top-up checkout.", scope: "billing:write", altPrincipal: user_session, idempotency: idempotency_key, request: TopUpCheckoutRequest, successStatus: 201, success: HostedSession, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found, invalid_request, idempotency_conflict, upstream_error] }
  - { id: billing_transactions_list, method: GET, path: /api/billing/transactions, summary: "List immutable prepaid ledger transactions, newest first.", scope: "billing:read", altPrincipal: user_session, success: BillingTransactionPage, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, invalid_cursor], query: { cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 100, optional: true, doc: "Page size; defaults to 25." } } }
  - { id: billing_usage_get, method: GET, path: /api/billing/usage, summary: "Read bounded rated usage and its settlement coverage.", scope: "billing:read", altPrincipal: user_session, success: BillingUsagePage, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, invalid_request, invalid_cursor, usage_coverage_gap], query: { from: { type: timestamp, optional: true, doc: "Inclusive service-time lower bound." }, to: { type: timestamp, optional: true, doc: "Exclusive service-time upper bound." }, sessionId: { type: id, of: session, optional: true, doc: "Restrict to one session." }, category: { type: ref, to: BillingUsageCategory, optional: true, doc: "Restrict to one rated category." }, cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 100, optional: true, doc: "Page size; defaults to 25." } } }
