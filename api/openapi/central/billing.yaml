  - { id: billing_portal_session_create, method: POST, path: "/api/organizations/{organizationId}/billing/portal-sessions", summary: "Create a hosted billing portal session.", scope: "billing:write", idempotency: idempotency_key, request: PortalSessionRequest, successStatus: 201, success: HostedSession, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found, invalid_request, idempotency_conflict, upstream_error] }
