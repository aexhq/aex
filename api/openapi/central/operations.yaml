plane: central
fragment: operations
operations:
  - { id: central_operations_list, method: GET, path: /api/operations, summary: "List central durable operations.", scope: "operations:read", success: OperationPage, pauseExempt: true, errors: [unauthenticated, insufficient_scope, invalid_cursor, invalid_request], query: { kind: { type: ref, to: OperationKind, optional: true, doc: "Restrict to one operation kind." }, status: { type: ref, to: OperationStatus, optional: true, doc: "Restrict to one status." }, cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: central_operation_get, method: GET, path: "/api/operations/{operationId}", summary: "Read one central durable operation.", scope: "operations:read", success: Operation, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found] }
  - { id: central_operation_cancel, method: POST, path: "/api/operations/{operationId}/cancellations", summary: "Request cancellation of a central operation.", scope: "operations:write", request: EmptyRequest, success: Operation, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, not_found, operation_not_cancelable] }
