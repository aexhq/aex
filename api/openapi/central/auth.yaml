plane: central
fragment: auth
operations:
  - { id: device_authorization_create, method: POST, path: /api/auth/device/authorizations, summary: "Begin the CLI device-authorization flow.", altPrincipal: anonymous, idempotency: idempotency_key, request: DeviceAuthorizationRequest, successStatus: 201, success: DeviceAuthorization, pauseExempt: true, errors: [invalid_request, rate_limited, internal_error] }
  - { id: device_token_create, method: POST, path: /api/auth/device/tokens, summary: "Exchange an approved device code for an account token.", altPrincipal: anonymous, request: DeviceTokenRequest, successStatus: 200, success: DeviceToken, pauseExempt: true, safeRetry: true, errors: [invalid_request, authorization_pending, slow_down, token_expired, rate_limited, internal_error] }
  - { id: device_decision_create, method: POST, path: /api/auth/device/decisions, summary: "Approve or deny a pending device authorization.", scope: "account:write", altPrincipal: user_session, request: DeviceDecisionRequest, successStatus: 200, success: DeviceDecisionResult, pauseExempt: true, errors: [invalid_request, unauthenticated, forbidden, insufficient_scope, not_found, token_expired, rate_limited, internal_error] }
  - { id: dashboard_session_create, method: POST, path: /api/auth/sessions, summary: "Exchange a provider authorization code for a browser session.", altPrincipal: anonymous, request: DashboardSessionRequest, successStatus: 201, success: DashboardSessionCredential, pauseExempt: true, errors: [invalid_request, unauthenticated, forbidden, rate_limited, internal_error] }
  - { id: dashboard_session_delete, method: DELETE, path: /api/auth/sessions/current, summary: "Close the browser session the caller presented.", scope: "account:write", altPrincipal: user_session, successStatus: 204, pauseExempt: true, errors: [unauthenticated, forbidden, insufficient_scope, rate_limited, internal_error] }
