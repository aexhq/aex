# Telemetry gaps and exports.
#
# No gap mutation or repair endpoint is public: a gap is evidence, and evidence
# a caller can edit is not evidence.
plane: regional
fragment: telemetry-lifecycle
operations:
  - { id: telemetry_gaps_query, method: POST, path: /api/telemetry/gaps/query, summary: "Query recorded workspace telemetry gaps.", scope: "telemetry:read", request: TelemetryGapQuery, success: TelemetryGapPage, safeRetry: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, invalid_cursor, observability_unavailable] }
  - { id: telemetry_gap_get, method: GET, path: "/api/telemetry/gaps/{gapId}", summary: "Read one recorded telemetry gap.", scope: "telemetry:read", success: TelemetryGap, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found] }
  - { id: session_telemetry_gaps_query, method: POST, path: "/api/sessions/{sessionId}/telemetry/gaps/query", summary: "Query recorded session telemetry gaps.", scope: "telemetry:read", request: TelemetryGapQuery, success: TelemetryGapPage, safeRetry: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, session_deleted, invalid_request, invalid_cursor, observability_unavailable] }
  - { id: session_telemetry_gap_get, method: GET, path: "/api/sessions/{sessionId}/telemetry/gaps/{gapId}", summary: "Read one recorded session telemetry gap.", scope: "telemetry:read", success: TelemetryGap, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, session_deleted] }
  - { id: telemetry_export_create, method: POST, path: /api/telemetry/exports, summary: "Admit the durable workspace telemetry-export operation.", scope: "telemetry:read", idempotency: operation_id, request: TelemetryExportRequest, successStatus: 202, success: Operation, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, invalid_query, unsupported_export_signal, telemetry_incomplete, operation_idempotency_conflict, limit_exceeded] }
  - { id: telemetry_export_get, method: GET, path: "/api/telemetry/exports/{exportId}", summary: "Read one telemetry export record.", scope: "telemetry:read", success: TelemetryExport, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, export_not_found] }
  - { id: telemetry_export_download_create, method: POST, path: "/api/telemetry/exports/{exportId}/downloads", summary: "Mint a download grant for a ready telemetry export.", scope: "telemetry:read", idempotency: idempotency_key, request: EmptyRequest, successStatus: 201, success: DownloadGrant, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, export_not_found, export_not_ready, export_expired, export_revoked, idempotency_conflict] }
  - { id: telemetry_export_revoke, method: POST, path: "/api/telemetry/exports/{exportId}/revocations", summary: "Revoke a telemetry export and its outstanding grants.", scope: "telemetry:read", idempotency: idempotency_key, request: EmptyRequest, success: TelemetryExport, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, export_not_found, idempotency_conflict] }
  - { id: session_telemetry_export_create, method: POST, path: "/api/sessions/{sessionId}/telemetry/exports", summary: "Admit the durable session telemetry-export operation.", scope: "telemetry:read", idempotency: operation_id, request: TelemetryExportRequest, successStatus: 202, success: Operation, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, session_deleted, invalid_request, invalid_query, unsupported_export_signal, telemetry_incomplete, operation_idempotency_conflict, limit_exceeded] }
  - { id: session_telemetry_export_get, method: GET, path: "/api/sessions/{sessionId}/telemetry/exports/{exportId}", summary: "Read one session telemetry export record.", scope: "telemetry:read", success: TelemetryExport, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, session_deleted, export_not_found] }
  - { id: session_telemetry_export_download_create, method: POST, path: "/api/sessions/{sessionId}/telemetry/exports/{exportId}/downloads", summary: "Mint a download grant for a ready session telemetry export.", scope: "telemetry:read", idempotency: idempotency_key, request: EmptyRequest, successStatus: 201, success: DownloadGrant, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, session_deleted, export_not_found, export_not_ready, export_expired, export_revoked, idempotency_conflict] }
  - { id: session_telemetry_export_revoke, method: POST, path: "/api/sessions/{sessionId}/telemetry/exports/{exportId}/revocations", summary: "Revoke a session telemetry export and its outstanding grants.", scope: "telemetry:read", idempotency: idempotency_key, request: EmptyRequest, success: TelemetryExport, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, not_found, session_deleted, export_not_found, idempotency_conflict] }
