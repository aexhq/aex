# Overwrite-only registered opaque workspace files.
#
# Conventional filenames may carry guidance, skills, tool bundles, MCP
# configuration, custom instructions or arbitrary assets. They remain files;
# Bash is the only built-in callable model tool.
plane: regional
fragment: registry
operations:
  - { id: registry_files_list, method: GET, path: /api/files, summary: "List current workspace files.", scope: "resources:read", success: RegisteredFilePage, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_cursor], query: { cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: registry_files_get, method: GET, path: "/api/files/{name}", summary: "Read one current workspace file.", scope: "resources:read", etag: returns, success: RegisteredFile, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found] }
  - { id: registry_files_put, method: PUT, path: "/api/files/{name}", summary: "Replace one current workspace file from inline bytes or an HTTPS URL.", scope: "resources:write", idempotency: idempotency_key, etag: optional_if_match, request: RegisteredFileValue, success: RegisteredFile, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, idempotency_conflict, precondition_failed, limit_exceeded, content_missing] }
  - { id: registry_files_delete, method: DELETE, path: "/api/files/{name}", summary: "Delete one current workspace file.", scope: "resources:write", etag: optional_if_match, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, precondition_failed] }
  - { id: registry_files_download_create, method: POST, path: "/api/files/{name}/downloads", summary: "Mint a download grant for a ready current workspace file.", scope: "resources:read", idempotency: idempotency_key, request: RegistryDownloadRequest, successStatus: 201, success: DownloadGrant, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, invalid_request, invalid_range, idempotency_conflict, content_missing] }
