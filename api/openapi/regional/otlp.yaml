# Customer OTLP admission.
#
# The bodies are the pinned standard OTLP revision, declared `otlp` rather than
# an AEX schema; generating Rust OTLP types belongs to `aex-otlp-admission`.
plane: regional
fragment: otlp
operations:
  - { id: otlp_logs_ingest, method: POST, path: /api/telemetry/otlp/v1/logs, summary: "Admit an OTLP logs batch.", scope: "telemetry:write", idempotency: idempotency_key, bodyClass: otlp, success: TelemetryAdmissionReceipt, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_telemetry, telemetry_payload_too_large, telemetry_quota_exceeded, idempotency_conflict] }
  - { id: otlp_traces_ingest, method: POST, path: /api/telemetry/otlp/v1/traces, summary: "Admit an OTLP traces batch.", scope: "telemetry:write", idempotency: idempotency_key, bodyClass: otlp, success: TelemetryAdmissionReceipt, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_telemetry, telemetry_payload_too_large, telemetry_quota_exceeded, idempotency_conflict] }
  - { id: otlp_metrics_ingest, method: POST, path: /api/telemetry/otlp/v1/metrics, summary: "Admit an OTLP metrics batch.", scope: "telemetry:write", idempotency: idempotency_key, bodyClass: otlp, success: TelemetryAdmissionReceipt, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_telemetry, telemetry_payload_too_large, telemetry_quota_exceeded, idempotency_conflict] }
