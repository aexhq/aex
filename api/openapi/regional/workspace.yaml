plane: regional
fragment: workspace
operations:
  - { id: workspace_current_get, method: GET, path: /api/workspace, summary: "Read the workspace this credential is pinned to.", scope: "workspace:read", success: Workspace, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, workspace_not_live, workspace_activation_required, account_state_unavailable] }
  - { id: workspace_limits_list, method: GET, path: /api/workspace/limits, summary: "List the effective workspace safety limits. The registry is closed and complete, so the whole set is one page and no continuation is ever minted.", scope: "workspace:read", success: EffectiveWorkspaceLimitPage, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, workspace_activation_required] }
  - { id: workspace_limit_get, method: GET, path: "/api/workspace/limits/{limitId}", summary: "Read one effective workspace safety limit.", scope: "workspace:read", success: EffectiveWorkspaceLimit, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, not_found, workspace_activation_required] }
