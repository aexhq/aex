# Bounded observation reads.
#
# `query` is a paged snapshot read; `stream` replays from exactly one declared
# origin; `listen` rejects every origin and captures the current accepted
# position. `stream` and `listen` are NDJSON.
plane: regional
fragment: observations
operations:
  - { id: observations_events_query, method: POST, path: /api/observations/events/query, summary: "Query workspace events observations.", scope: "telemetry:read", request: ObservationQuery, success: ObservationPage, safeRetry: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, invalid_query, telemetry_query_budget_exhausted, invalid_cursor, observability_unavailable] }
  - { id: observations_events_stream, method: POST, path: /api/streams/events/stream, summary: "Stream workspace events observations from one origin.", scope: "telemetry:read", request: ObservationStreamRequest, success: ObservationFrame, transport: ndjson, safeRetry: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, invalid_query, observability_unavailable] }
