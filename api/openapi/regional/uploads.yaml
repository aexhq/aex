plane: regional
fragment: uploads
operations:
  - { id: upload_create, method: POST, path: /api/workspace/uploads, summary: "Stage a large registered-resource value.", scope: "resources:write", idempotency: idempotency_key, request: UploadCreateRequest, successStatus: 201, success: Upload, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, idempotency_conflict, limit_exceeded] }
  - { id: upload_parts_grant, method: POST, path: "/api/workspace/uploads/{uploadId}/parts", summary: "Mint presigned PUT grants for the named parts.", scope: "resources:write", request: UploadPartsRequest, success: UploadPartGrants, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, gone, invalid_request, limit_exceeded] }
  - { id: upload_complete, method: POST, path: "/api/workspace/uploads/{uploadId}/completion", summary: "Complete a staged upload.", scope: "resources:write", idempotency: idempotency_key, request: UploadCompleteRequest, success: Upload, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, not_found, gone, invalid_request, idempotency_conflict, content_missing] }
  - { id: upload_abort, method: DELETE, path: "/api/workspace/uploads/{uploadId}", summary: "Abort a staged upload.", scope: "resources:write", pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, not_found] }
