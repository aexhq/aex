plane: regional
fragment: operations
operations:
  - { id: regional_operations_list, method: GET, path: /api/operations, summary: "List regional durable operations.", scope: "operations:read", success: OperationPage, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, invalid_cursor, invalid_request], query: { sessionId: { type: id, of: session, optional: true, doc: "Restrict to one session." }, kind: { type: ref, to: OperationKind, optional: true, doc: "Restrict to one operation kind." }, status: { type: ref, to: OperationStatus, optional: true, doc: "Restrict to one status." }, cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: regional_operation_get, method: GET, path: "/api/operations/{operationId}", summary: "Read one regional durable operation.", scope: "operations:read", success: Operation, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, not_found] }
  - { id: regional_operation_cancel, method: POST, path: "/api/operations/{operationId}/cancellations", summary: "Request cancellation of a regional operation.", scope: "operations:write", request: EmptyRequest, success: Operation, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, not_found, operation_not_cancelable] }
