# Dedicated BYOK provider-credential bindings. This is not a generic secret API:
# plaintext is accepted only at registration and values are never readable.
plane: regional
fragment: provider-credentials
operations:
  - { id: provider_credential_register, method: POST, path: /api/workspace/provider-credentials, summary: "Register a dedicated BYOK provider credential; carries plaintext once.", scope: "provider_credentials:write", idempotency: idempotency_key, request: ProviderCredentialRegisterRequest, successStatus: 201, success: ProviderCredential, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, unknown_provider, idempotency_conflict, limit_exceeded] }
  - { id: provider_credentials_list, method: GET, path: /api/workspace/provider-credentials, summary: "List BYOK provider-credential binding metadata.", scope: "provider_credentials:read", success: ProviderCredentialPage, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_cursor], query: { provider: { type: provider_id, optional: true, doc: "Restrict to one provider." }, cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: provider_credential_get, method: GET, path: "/api/workspace/provider-credentials/{providerCredentialId}", summary: "Read one BYOK provider-credential binding.", scope: "provider_credentials:read", etag: returns, success: ProviderCredential, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, provider_credential_not_found] }
  - { id: provider_credential_revoke, method: POST, path: "/api/workspace/provider-credentials/{providerCredentialId}/revocations", summary: "Revoke a BYOK provider-credential binding.", scope: "provider_credentials:write", idempotency: idempotency_key, request: EmptyRequest, success: ProviderCredential, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, provider_credential_not_found, idempotency_conflict] }
