# The BYOK provider-credential binding directory.
#
# Registration carries plaintext and is therefore served by `regional-secret-api`
# on the secret plane; list, read and revocation are metadata only and are served
# by `regional-session-api`. Both live on the one regional host.
plane: regional
fragment: provider-credentials
operations:
  - { id: provider_credential_register, method: POST, path: /api/secrets/provider-credentials, summary: "Register a BYOK provider credential; carries plaintext.", scope: "secrets:write", idempotency: idempotency_key, request: ProviderCredentialRegisterRequest, successStatus: 201, success: ProviderCredential, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_request, unknown_provider, idempotency_conflict, limit_exceeded] }
  - { id: provider_credentials_list, method: GET, path: /api/workspace/provider-credentials, summary: "List provider-credential binding metadata.", scope: "secrets:read", success: ProviderCredentialPage, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, invalid_cursor], query: { provider: { type: provider_id, optional: true, doc: "Restrict to one provider." }, cursor: { type: cursor, optional: true, doc: "Opaque continuation token." }, limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." } } }
  - { id: provider_credential_get, method: GET, path: "/api/workspace/provider-credentials/{providerCredentialId}", summary: "Read one provider-credential binding.", scope: "secrets:read", etag: returns, success: ProviderCredential, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, account_paused, provider_credential_not_found] }
  - { id: provider_credential_revoke, method: POST, path: "/api/workspace/provider-credentials/{providerCredentialId}/revocations", summary: "Revoke a provider-credential binding.", scope: "secrets:revoke", idempotency: idempotency_key, request: EmptyRequest, success: ProviderCredential, pauseExempt: true, errors: [unauthenticated, insufficient_scope, wrong_workspace_region, provider_credential_not_found, idempotency_conflict] }
