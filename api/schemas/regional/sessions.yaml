# Session-centered public execution contract. Agents, Hands, generations,
# attempts, effects and subagents remain durable internal resources.
module: regional
schemas:
  SessionStatus:
    doc: Customer-visible session lifecycle, independent of sandbox suspension.
    type: enum
    values:
      - { value: idle, doc: "Ready for another user message." }
      - { value: running, doc: "Processing the one active root message." }
      - { value: terminating, doc: "Destroying sandbox compute." }
      - { value: terminated, doc: "Sandbox compute is gone; metadata and messages remain." }
      - { value: deleting, doc: "Irreversible session-content deletion is running." }

  SandboxStatus:
    doc: Observable preparation state of the session's single default-on sandbox.
    type: enum
    values:
      - { value: disabled, doc: "The caller explicitly opted out; sandbox tools return `sandbox_disabled`." }
      - { value: requested, doc: "Preparation was durably requested." }
      - { value: ready, doc: "Ready to execute a waiting tool call." }
      - { value: suspending, doc: "No waiter exists and initial preparation is suspending." }
      - { value: suspended, doc: "Prepared and suspended until the first sandbox tool call." }
      - { value: resuming, doc: "A tool waiter is resuming the exact generation." }
      - { value: lost, doc: "The generation was lost; tool calls receive a normal structured error." }

  NetworkMode:
    doc: What the sandbox may reach.
    type: enum
    values:
      - { value: none, doc: "No outbound network." }
      - { value: public_internet, doc: "Managed outbound Internet egress." }

  PackageEcosystem:
    doc: Supported setup package ecosystems.
    type: enum
    values:
      - { value: apt, doc: "Debian packages." }
      - { value: pip, doc: "Python packages." }
      - { value: npm, doc: "Node packages." }

  PackageRequest:
    doc: One exactly pinned setup package.
    type: object
    fields:
      ecosystem: { type: ref, to: PackageEcosystem, doc: "Which package manager." }
      name: { type: string, min: 1, max: 214, doc: "Package name." }
      version: { type: string, min: 1, max: 128, doc: "Exact version; ranges are rejected." }

  WorkspaceFileMount:
    doc: Resolve one current workspace-file name to a private immutable hash and mount path at admission.
    type: object
    fields:
      name: { type: resource_name, doc: "Current logical workspace-file name." }
      path: { type: file_path, doc: "Normalized absolute sandbox destination under /workspace." }

  SessionRegisteredSelection:
    doc: Files resolved once at session admission; later workspace overwrites cannot mutate this manifest.
    type: object
    fields:
      mounts: { type: array, max: 256, items: { type: ref, to: WorkspaceFileMount }, doc: "Explicit name-to-path mounts." }

  SessionComputeRequest:
    doc: The single sandbox's bounded compute selector.
    type: object
    fields:
      size: { type: compute_size, optional: true, doc: "Defaults to the launch baseline." }

  HandsNetworkRequest:
    doc: The sandbox network policy.
    type: object
    fields:
      mode: { type: ref, to: NetworkMode, doc: "What the guest may reach." }

  SessionNetworkRequest:
    doc: Network policy for the one sandbox.
    type: object
    fields:
      hands: { type: ref, to: HandsNetworkRequest, doc: "Guest policy." }

  SessionSandboxRequest:
    doc: Default-on sandbox configuration; enabled=false creates no Hand.
    type: object
    fields:
      enabled: { type: boolean, optional: true, doc: "Defaults true." }
      compute: { type: ref, to: SessionComputeRequest, optional: true, doc: "Bounded compute shape." }
      network: { type: ref, to: SessionNetworkRequest, optional: true, doc: "Guest egress policy." }
      packages: { type: array, max: 64, optional: true, items: { type: ref, to: PackageRequest }, doc: "Pinned packages applied before initial suspension." }

  RemoteMcpServer:
    doc: A remote Streamable HTTP MCP server frozen at session setup and invoked on demand inside the sandbox.
    type: object
    fields:
      url: { type: https_url, doc: "Official server endpoint." }
      headers: { type: map, max: 32, optional: true, items: { type: string, min: 1, max: 8192 }, doc: "Write-only session-encrypted request headers." }

  SandboxMcpServer:
    doc: An MCP process launched inside the sandbox after workspace materialization.
    type: object
    fields:
      command: { type: string, min: 1, max: 1024, doc: "Executable inside the sandbox." }
      args: { type: array, max: 64, optional: true, items: { type: string, min: 0, max: 4096 }, doc: "Bounded arguments." }
      environment: { type: map, max: 64, optional: true, items: { type: string, min: 0, max: 8192 }, doc: "Write-only session-encrypted environment." }
      workingDirectory: { type: file_path, optional: true, doc: "Normalized sandbox working directory." }

  McpTransport:
    doc: The two admitted MCP transports.
    type: union
    tag: kind
    variants:
      - { value: remote_http, payload: RemoteMcpServer, doc: "Remote Streamable HTTP." }
      - { value: sandbox_process, payload: SandboxMcpServer, doc: "Process inside the one sandbox." }

  McpServer:
    doc: One frozen MCP definition and its bounded tool namespace.
    type: object
    fields:
      name: { type: resource_name, doc: "Unique server/tool namespace." }
      transport: { type: ref, to: McpTransport, doc: "How the built-in sandbox MCP tool reaches it." }

  SessionCreateRequest:
    doc: Create a durable session with a write-only BYOK key, frozen file/MCP config and a default-on eager sandbox.
    type: object
    fields:
      provider: { type: provider_id, doc: "Qualified official provider family." }
      model: { type: string, min: 1, max: 256, doc: "Current admitted provider-native model id." }
      providerApiKey: { type: string, min: 8, max: 8192, doc: "Write-only session-scoped key; encrypted and never returned." }
      registered: { type: ref, to: SessionRegisteredSelection, optional: true, doc: "Files to resolve and freeze." }
      sandbox: { type: ref, to: SessionSandboxRequest, optional: true, doc: "Defaults enabled and prepares asynchronously." }
      mcpServers: { type: array, max: 16, optional: true, items: { type: ref, to: McpServer }, doc: "Remote and sandbox MCP definitions." }
      expiresAt: { type: timestamp, optional: true, doc: "Optional earlier expiry within the launch maximum." }
      maxSpendCents: { type: cents, optional: true, doc: "Session prepaid reservation ceiling." }
      metadata: { type: map, max: 64, optional: true, items: { type: metadata_value }, doc: "Caller labels." }

  ComputeShape:
    doc: One resolved sandbox compute dimension.
    type: object
    fields:
      memoryMiB: { type: integer, min: 0, max: 262144, doc: "Memory in mebibytes." }
      vcpus: { type: float, doc: "Virtual CPUs." }

  ResolvedCompute:
    doc: Complete provider-derived capacity of the frozen shape.
    type: object
    fields:
      size: { type: compute_size, doc: "Selected token." }
      baseline: { type: ref, to: ComputeShape, doc: "Guaranteed capacity." }
      peak: { type: ref, to: ComputeShape, doc: "Burst ceiling." }
      maxDiskGiB: { type: integer, min: 1, max: 1024, doc: "Maximum guest disk." }
      endpointBandwidthMBps: { type: integer, min: 1, max: 1024, doc: "Endpoint bandwidth." }
      maxConcurrentConnections: { type: integer, min: 1, max: 4096, doc: "Connection ceiling." }

  ResolvedNetwork:
    doc: Resolved sandbox network policy.
    type: object
    fields:
      hands: { type: ref, to: HandsNetworkRequest, doc: "Guest policy." }

  SessionLifecyclePolicy:
    doc: Immutable public session bounds; sandbox suspension is an internal lifecycle.
    type: object
    fields:
      maximumLifetimeSeconds: { type: integer, min: 1, max: 28800, doc: "Session lifetime, never more than eight hours at launch." }
      maximumSubagents: { type: integer, min: 12, max: 12, doc: "Exactly 12 non-root identities over the session lifetime." }
      maximumSubagentDepth: { type: integer, min: 3, max: 3, doc: "Root depth is zero; children may reach depth three." }

  ResolvedConfig:
    doc: Customer-safe frozen session configuration; all plaintext secrets are omitted.
    type: object
    fields:
      provider: { type: provider_id, doc: "Provider." }
      model: { type: string, min: 1, max: 256, doc: "Current model selected at admission." }
      sandboxEnabled: { type: boolean, doc: "Whether the one sandbox exists." }
      compute: { type: ref, to: ResolvedCompute, optional: true, doc: "Present only when sandbox is enabled." }
      network: { type: ref, to: ResolvedNetwork, optional: true, doc: "Present only when sandbox is enabled." }
      registered: { type: ref, to: SessionRegisteredSelection, doc: "Frozen mount selection; hashes remain private." }
      packages: { type: array, max: 64, items: { type: ref, to: PackageRequest }, doc: "Resolved setup packages." }
      mcpServerNames: { type: array, max: 16, items: { type: resource_name }, doc: "Frozen server names; secrets and transport credentials are omitted." }
      lifecycle: { type: ref, to: SessionLifecyclePolicy, doc: "Immutable session bounds." }

  Session:
    doc: The only public execution resource; sandbox loss never terminates agent state.
    type: object
    fields:
      id: { type: id, of: session, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "Owning fixed workspace." }
      status: { type: ref, to: SessionStatus, doc: "Conversation lifecycle." }
      sandboxStatus: { type: ref, to: SandboxStatus, doc: "One-Hand preparation/suspension state." }
      revision: { type: integer, min: 0, max: 9007199254740991, doc: "Monotonic concurrency token." }
      activeMessageId: { type: id, of: message, optional: true, doc: "The one active root user message." }
      expiresAt: { type: timestamp, doc: "Session expiry." }
      terminatedAt: { type: timestamp, optional: true, doc: "When explicit compute termination committed." }
      resolvedConfig: { type: ref, to: ResolvedConfig, doc: "Frozen customer-safe configuration." }
      metadata: { type: map, max: 64, optional: true, items: { type: metadata_value }, doc: "Caller labels." }
      createdAt: { type: timestamp, doc: "Admission time." }
      updatedAt: { type: timestamp, doc: "Last durable change." }

  SessionListItem:
    doc: Bounded collection projection.
    type: object
    fields:
      id: { type: id, of: session, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "Workspace." }
      status: { type: ref, to: SessionStatus, doc: "Conversation lifecycle." }
      sandboxStatus: { type: ref, to: SandboxStatus, doc: "Sandbox lifecycle." }
      provider: { type: provider_id, doc: "Provider." }
      model: { type: string, min: 1, max: 256, doc: "Model." }
      activeMessageId: { type: id, of: message, optional: true, doc: "Active root message." }
      expiresAt: { type: timestamp, doc: "Expiry." }
      createdAt: { type: timestamp, doc: "Admission time." }
      updatedAt: { type: timestamp, doc: "Last change." }

  SessionListPage:
    doc: One page of sessions.
    type: object
    fields:
      items: { type: array, max: 100, items: { type: ref, to: SessionListItem }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }

  SessionCommandReceipt:
    doc: Admission receipt for an asynchronous session command; there is no generic operations resource.
    type: object
    fields:
      operationId: { type: id, of: operation, doc: "Diagnostic and idempotency correlation identity." }
      sessionId: { type: id, of: session, doc: "Target session." }
      acceptedAt: { type: timestamp, doc: "When the command committed." }

  DeletingSession:
    doc: Minimal deletion marker returned while content cleanup runs.
    type: object
    fields:
      id: { type: id, of: session, doc: "Session." }
      operationId: { type: id, of: operation, doc: "Diagnostic deletion identity." }
      startedAt: { type: timestamp, doc: "When deletion began." }

  SessionTombstone:
    doc: Minimal marker after irreversible deletion.
    type: object
    fields:
      id: { type: id, of: session, doc: "Deleted session." }
      deletedAt: { type: timestamp, doc: "Commit time." }

  MessageRole:
    doc: Who produced a committed message.
    type: enum
    values:
      - { value: user, doc: "Customer." }
      - { value: assistant, doc: "Model." }
      - { value: tool, doc: "Canonical tool result." }

  MessagePartText:
    doc: Text content.
    type: object
    fields:
      text: { type: string, min: 0, max: 1048576, doc: "Text." }

  MessagePartToolCall:
    doc: Canonical provider-independent tool call.
    type: object
    fields:
      id: { type: id, of: tool_call, doc: "Call identity." }
      name: { type: string, min: 1, max: 256, doc: "Official or namespaced MCP tool name." }
      arguments: { type: canonical_json, doc: "Validated arguments." }

  MessagePartToolResult:
    doc: Bounded tool result; large/full bytes remain at its sandbox path unless storage.persist explicitly registers them as a workspace file.
    type: object
    fields:
      id: { type: id, of: tool_call, doc: "Call identity." }
      preview: { type: string, min: 0, max: 65536, doc: "Bounded live/model preview." }
      truncated: { type: boolean, doc: "Whether full output exceeded the preview." }
      sandboxPath: { type: file_path, optional: true, doc: "Stable call-scoped full-result path." }
      sha256: { type: content_hash, optional: true, doc: "Full-result digest." }
      sizeBytes: { type: decimal, optional: true, doc: "Full-result length." }

  MessagePart:
    doc: One part of a complete committed message.
    type: union
    tag: type
    variants:
      - { value: text, payload: MessagePartText, doc: "Text." }
      - { value: tool_call, payload: MessagePartToolCall, doc: "Tool call." }
      - { value: tool_result, payload: MessagePartToolResult, doc: "Tool result." }

  Message:
    doc: One complete sealed message in immutable visibility order.
    type: object
    fields:
      id: { type: id, of: message, doc: "Identity." }
      sessionId: { type: id, of: session, doc: "Session." }
      role: { type: ref, to: MessageRole, doc: "Producer." }
      content: { type: array, max: 256, items: { type: ref, to: MessagePart }, doc: "Parts." }
      createdAt: { type: timestamp, doc: "Display time; not collection ordering authority." }

  MessagePage:
    doc: One page of complete messages.
    type: object
    fields:
      items: { type: array, max: 100, items: { type: ref, to: Message }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }

  ResponseFormatKind:
    doc: Requested final response format.
    type: enum
    values:
      - { value: text, doc: "Ordinary text." }
      - { value: json_schema, doc: "Native provider JSON Schema support is required." }

  ResponseFormat:
    doc: Optional native structured-output request; prompt emulation is never presented as strict.
    type: object
    fields:
      kind: { type: ref, to: ResponseFormatKind, doc: "Format." }
      schema: { type: canonical_json, optional: true, doc: "Required only for `json_schema`." }

  MessageSendRequest:
    doc: Text-only user message; arbitrary files are referenced by mounted paths in this text.
    type: object
    fields:
      text: { type: string, min: 1, max: 24576, doc: "Complete user text; there is no attachment field." }
      responseFormat: { type: ref, to: ResponseFormat, optional: true, doc: "Native structured output request." }
      maxSpendCents: { type: cents, optional: true, doc: "Earlier per-message spend fence." }
      deadline: { type: timestamp, optional: true, doc: "Earlier absolute deadline." }

  MessageSendResult:
    doc: The admitted user message and session now processing it.
    type: object
    fields:
      message: { type: ref, to: Message, doc: "Admitted message." }
      session: { type: ref, to: Session, doc: "Updated session." }

  MessageStreamKind:
    doc: Preview/commit reconciliation protocol.
    type: enum
    values:
      - { value: preview, doc: "Uncommitted assistant delta; may be lost." }
      - { value: committed, doc: "A complete message became durable." }
      - { value: reconcile, doc: "Replace preview state from committed authority." }
      - { value: gap, doc: "One or more live frames were dropped; replay committed messages." }
      - { value: heartbeat, doc: "Keeps the bounded connection alive." }

  MessageStreamFrame:
    doc: One bounded NDJSON assistant-stream frame.
    type: object
    fields:
      sequence: { type: decimal, doc: "Monotonic connection-independent sequence." }
      kind: { type: ref, to: MessageStreamKind, doc: "Frame semantics." }
      messageId: { type: id, of: message, optional: true, doc: "Message correlation." }
      text: { type: string, min: 0, max: 65536, optional: true, doc: "Bounded preview text." }
      message: { type: ref, to: Message, optional: true, doc: "Complete committed/reconcile message." }

  TelemetryKind:
    doc: Trusted live and retained session signals.
    type: enum
    values:
      - { value: assistant, doc: "Assistant preview/commit lifecycle." }
      - { value: tool, doc: "Tool waiting, start, preview and completion." }
      - { value: runtime, doc: "Sandbox prepare/materialize/suspend/resume/loss lifecycle." }
      - { value: log, doc: "OpenTelemetry Log record." }
      - { value: span, doc: "OpenTelemetry Span record." }
      - { value: usage, doc: "Trusted model/runtime/storage/transfer usage fact." }
      - { value: gap, doc: "Bounded live delivery dropped frames; replay from S3." }
      - { value: heartbeat, doc: "Stream heartbeat." }

  TelemetryFrame:
    doc: One bounded normalized telemetry frame transmitted live and persisted in compressed S3 segments.
    type: object
    fields:
      sequence: { type: decimal, doc: "Monotonic per-session sequence." }
      kind: { type: ref, to: TelemetryKind, doc: "Signal family." }
      occurredAt: { type: timestamp, doc: "Trusted producer time." }
      traceId: { type: trace_id, optional: true, doc: "Trace correlation." }
      spanId: { type: span_id, optional: true, doc: "Span correlation." }
      body: { type: canonical_json, optional: true, doc: "Bounded customer-safe structured event." }
      preview: { type: string, min: 0, max: 65536, optional: true, doc: "Bounded tool/assistant output preview." }
      truncated: { type: boolean, doc: "Whether retained data is larger than this frame." }

  TelemetryDownloadRequest:
    doc: Select a bounded half-open telemetry export.
    type: object
    fields:
      fromSequence: { type: decimal, optional: true, doc: "First included sequence." }
      toSequence: { type: decimal, optional: true, doc: "Exclusive sequence ceiling." }

  TelemetryDownloadGrant:
    doc: Short-lived signed download for one immutable compressed telemetry export.
    type: object
    fields:
      url: { type: https_url, doc: "Signed S3 URL; never printed by the CLI." }
      expiresAt: { type: timestamp, doc: "Grant expiry." }
      sha256: { type: content_hash, doc: "Exact compressed object digest." }
      sizeBytes: { type: decimal, doc: "Compressed size." }
      mediaType: { type: string, min: 1, max: 128, doc: "Compressed NDJSON or OTLP bundle media type." }
