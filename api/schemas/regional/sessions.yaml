# Sessions and their complete, sealed messages.
#
# A session is the only public execution resource. Each admitted user message
# starts the session's current work; completion or cancellation returns it to
# `idle`, ready for another message. Internal turn/run identities never cross
# this contract.
module: regional
schemas:
  SessionStatus:
    doc: What a session is doing right now.
    type: enum
    values:
      - { value: idle, doc: "Ready for another message." }
      - { value: running, doc: "Processing the active message." }
      - { value: suspending, doc: "Stopping compute while retaining this exact generation." }
      - { value: suspended, doc: "Compute is stopped and this exact generation may be resumed." }
      - { value: resuming, doc: "Restarting the retained generation." }
      - { value: terminating, doc: "Destroying compute and live files." }
      - { value: terminated, doc: "Compute and live files are gone; metadata and sealed messages remain." }
      - { value: deleting, doc: "Irreversible metadata deletion is in progress." }

  SessionTerminationReason:
    doc: Why a session permanently lost its compute and live files.
    type: enum
    values:
      - { value: user, doc: "The customer explicitly terminated it." }
      - { value: lifetime_expired, doc: "The eight-hour provider lifetime ended." }
      - { value: provider_credential_revoked, doc: "Its pinned BYOK provider credential was revoked." }
      - { value: runtime_lost, doc: "The retained runtime was lost; crash recovery is not part of this release." }

  NetworkMode:
    doc: What the guest may reach.
    type: enum
    values:
      - { value: none, doc: "No outbound network." }
      - { value: public_internet, doc: "Managed outbound Internet egress." }

  PackageEcosystem:
    doc: The package ecosystems a session may pre-install from.
    type: enum
    values:
      - { value: apt, doc: "Debian packages." }
      - { value: pip, doc: "Python packages." }
      - { value: npm, doc: "Node packages." }

  PackageRequest:
    doc: One exactly-pinned package to pre-install.
    type: object
    fields:
      ecosystem: { type: ref, to: PackageEcosystem, doc: "Which ecosystem." }
      name: { type: string, min: 1, max: 214, doc: "The package name." }
      version: { type: string, min: 1, max: 64, doc: "The exact version; ranges are rejected." }

  SessionRegisteredSelection:
    doc: Opaque workspace files mounted into the session. Conventional files such as `AGENTS.md` may carry guidance, skills, tool bundles, MCP configuration or custom instructions; the built-in model tools are `read_file`, `edit_file`, `write_file`, and Bash.
    type: object
    fields:
      files: { type: array, max: 256, optional: true, items: { type: resource_name }, doc: "Registered files to mount." }

  SessionComputeRequest:
    doc: The only customer compute selector.
    type: object
    fields:
      size: { type: compute_size, optional: true, doc: "The baseline shape; defaults to `1gb`." }

  HandsNetworkRequest:
    doc: The guest network policy.
    type: object
    fields:
      mode: { type: ref, to: NetworkMode, doc: "What the guest may reach." }

  SessionNetworkRequest:
    doc: Network policy for the session.
    type: object
    fields:
      hands: { type: ref, to: HandsNetworkRequest, doc: "The guest policy." }

  SessionCreateRequest:
    doc: Create an eight-hour multi-turn session with one explicitly pinned BYOK provider credential.
    type: object
    fields:
      provider: { type: provider_id, doc: "The direct BYOK provider." }
      model: { type: string, min: 1, max: 256, doc: "The exact provider-native model id." }
      providerCredentialId: { type: id, of: provider_credential, doc: "The exact BYOK binding; the platform never guesses between bindings." }
      registered: { type: ref, to: SessionRegisteredSelection, optional: true, doc: "Opaque workspace files to mount." }
      compute: { type: ref, to: SessionComputeRequest, optional: true, doc: "The baseline compute shape." }
      network: { type: ref, to: SessionNetworkRequest, optional: true, doc: "The guest network policy." }
      packages: { type: array, max: 64, optional: true, items: { type: ref, to: PackageRequest }, doc: "Packages to pre-install." }
      metadata: { type: map, max: 64, optional: true, items: { type: metadata_value }, doc: "Caller-defined labels." }

  ComputeShape:
    doc: One resolved compute dimension.
    type: object
    fields:
      memoryMiB: { type: integer, min: 0, max: 262144, doc: "Memory in mebibytes." }
      vcpus: { type: float, doc: "Virtual CPUs; fractional at the smaller shapes." }

  ResolvedCompute:
    doc: The complete provider-derived capacity of the selected shape.
    type: object
    fields:
      size: { type: compute_size, doc: "The selected baseline token." }
      baseline: { type: ref, to: ComputeShape, doc: "Guaranteed capacity." }
      peak: { type: ref, to: ComputeShape, doc: "Burst ceiling." }
      maxDiskGiB: { type: integer, min: 1, max: 1024, doc: "Maximum guest disk." }
      endpointBandwidthMBps: { type: integer, min: 1, max: 1024, doc: "Endpoint bandwidth." }
      maxConcurrentConnections: { type: integer, min: 1, max: 4096, doc: "Concurrent connection ceiling." }

  ResolvedNetwork:
    doc: The resolved guest network policy.
    type: object
    fields:
      hands: { type: ref, to: HandsNetworkRequest, doc: "What the guest may reach." }

  SessionLifecyclePolicy:
    doc: The immutable automatic lifecycle behavior applied to this session.
    type: object
    fields:
      idleSuspendAfterSeconds: { type: integer, min: 180, max: 180, doc: "Idle sessions automatically suspend after exactly three minutes." }
      maximumLifetimeSeconds: { type: integer, min: 28800, max: 28800, doc: "The provider generation expires exactly eight hours after `launchedAt`." }
      resumeOnMessage: { type: boolean, doc: "A message automatically resumes this same suspended generation." }
      resumeOnLiveFileAccess: { type: boolean, doc: "A live-file request automatically resumes this same suspended generation." }

  ResolvedConfig:
    doc: Everything the platform resolved for this session.
    type: object
    fields:
      provider: { type: provider_id, doc: "The provider." }
      model: { type: string, min: 1, max: 256, doc: "The exact provider-native model id." }
      providerCredentialId: { type: id, of: provider_credential, doc: "The pinned BYOK binding." }
      catalogRevision: { type: string, min: 68, max: 68, pattern: "^mc1_[0-9a-f]{64}$", doc: "The signed model-catalog release that qualified this provider and model pair." }
      compute: { type: ref, to: ResolvedCompute, doc: "Resolved capacity." }
      network: { type: ref, to: ResolvedNetwork, doc: "Resolved network policy." }
      registered: { type: ref, to: SessionRegisteredSelection, doc: "Resolved mounted files." }
      packages: { type: array, max: 64, items: { type: ref, to: PackageRequest }, doc: "Resolved packages." }
      lifecycle: { type: ref, to: SessionLifecyclePolicy, doc: "Immutable automatic lifecycle behavior." }

  Session:
    doc: A multi-turn conversation backed by at most one retained provider generation. Termination destroys compute and live files but preserves this metadata and sealed messages until deletion.
    type: object
    fields:
      id: { type: id, of: session, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      status: { type: ref, to: SessionStatus, doc: "What the session is doing." }
      revision: { type: integer, min: 0, max: 9007199254740991, doc: "Monotonic concurrency token." }
      activeMessageId: { type: id, of: message, optional: true, doc: "The user message whose work is active. Absent while no message is active." }
      activeMaxSpendCents: { type: cents, optional: true, doc: "The effective current-message spend ceiling: the request value, or 1000 when omitted." }
      activeDeadline: { type: timestamp, optional: true, doc: "The internal bounded deadline for the active message." }
      launchedAt: { type: timestamp, doc: "When the provider generation first launched." }
      expiresAt: { type: timestamp, doc: "Exactly 28,800 seconds after `launchedAt`; suspension never extends it." }
      idleSince: { type: timestamp, optional: true, doc: "When the session most recently became idle." }
      suspendAt: { type: timestamp, optional: true, doc: "When an idle session will automatically suspend; exactly 180 seconds after `idleSince`." }
      suspendedAt: { type: timestamp, optional: true, doc: "When this exact generation most recently suspended." }
      terminatedAt: { type: timestamp, optional: true, doc: "When compute and live files were permanently destroyed." }
      terminationReason: { type: ref, to: SessionTerminationReason, optional: true, doc: "Why the session permanently terminated." }
      resolvedConfig: { type: ref, to: ResolvedConfig, doc: "Everything the platform resolved." }
      metadata: { type: map, max: 64, optional: true, items: { type: metadata_value }, doc: "Caller-defined labels." }
      createdAt: { type: timestamp, doc: "When metadata was created; this does not determine the provider lifetime." }
      updatedAt: { type: timestamp, doc: "When the session last changed." }

  SessionListItem:
    doc: The collection projection of a session; `resolvedConfig` is omitted.
    type: object
    fields:
      id: { type: id, of: session, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      status: { type: ref, to: SessionStatus, doc: "What the session is doing." }
      revision: { type: integer, min: 0, max: 9007199254740991, doc: "Monotonic concurrency token." }
      provider: { type: provider_id, doc: "The provider." }
      model: { type: string, min: 1, max: 256, doc: "The model." }
      activeMessageId: { type: id, of: message, optional: true, doc: "The active user message, when any." }
      expiresAt: { type: timestamp, doc: "When the provider generation's eight-hour lifetime ends." }
      createdAt: { type: timestamp, doc: "When metadata was created." }
      updatedAt: { type: timestamp, doc: "When the session last changed." }

  SessionListPage:
    doc: One page of sessions.
    type: object
    fields:
      items: { type: array, max: 100, items: { type: ref, to: SessionListItem }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }

  DeletingSession:
    doc: A session whose irreversible deletion is running; rendered at 410.
    type: object
    fields:
      id: { type: id, of: session, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      operationId: { type: id, of: operation, doc: "The deletion operation." }
      startedAt: { type: timestamp, doc: "When deletion began." }

  SessionTombstone:
    doc: The minimal marker left after irreversible deletion. Compute and live files are terminated first; session, message, Brain user-content, observation, telemetry and export payloads are removed. Independent registered workspace files and aggregate billing/audit facts remain.
    type: object
    fields:
      id: { type: id, of: session, doc: "The deleted session." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      deletedAt: { type: timestamp, doc: "When deletion committed." }
      operationId: { type: id, of: operation, doc: "The operation that deleted it." }

  MessageRole:
    doc: Who produced a message.
    type: enum
    values:
      - { value: user, doc: "The customer." }
      - { value: assistant, doc: "The model." }
      - { value: tool, doc: "A built-in tool result." }

  MessagePartText:
    doc: A text part.
    type: object
    fields:
      text: { type: string, min: 0, max: 1048576, doc: "The text." }

  MessagePartToolCall:
    doc: A built-in tool call emitted by the model.
    type: object
    fields:
      id: { type: id, of: tool_call, doc: "The call identity." }
      argumentsDigest: { type: content_hash, doc: "The canonical tool-argument digest." }

  MessagePartToolResult:
    doc: The canonical result of a built-in tool call.
    type: object
    fields:
      id: { type: id, of: tool_call, doc: "The call identity." }
      resultDigest: { type: content_hash, doc: "The canonical tool-result digest." }

  MessagePart:
    doc: One part of a complete message. Admission is text-only; assistant and tool messages may contain canonical built-in tool records.
    type: union
    tag: type
    variants:
      - { value: text, payload: MessagePartText, doc: "Text." }
      - { value: tool_call, payload: MessagePartToolCall, doc: "A canonical built-in tool call." }
      - { value: tool_result, payload: MessagePartToolResult, doc: "A canonical built-in tool result." }

  Message:
    doc: One complete, sealed message in a session. `createdAt` is display metadata; collection order is the immutable seal-visibility order and is not derived from this field.
    type: object
    fields:
      id: { type: id, of: message, doc: "Identity." }
      sessionId: { type: id, of: session, doc: "The owning session." }
      role: { type: ref, to: MessageRole, doc: "Who produced it." }
      content: { type: array, max: 256, items: { type: ref, to: MessagePart }, doc: "The parts." }
      createdAt: { type: timestamp, doc: "When it was recorded." }

  MessagePage:
    doc: One page of complete sealed messages, ordered by the immutable seal-visibility tuple `(sealedAt, messageId)`. Open partial messages are never visible.
    type: object
    fields:
      items: { type: array, max: 100, items: { type: ref, to: Message }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }

  MessageSendRequest:
    doc: Admit one text message of at most 24,576 UTF-8 bytes. Omitting `maxSpendCents` selects the 1000-cent default; an explicit positive value may be higher or lower. Omitting `deadline` uses the session's remaining lifetime/drain fence; an explicit deadline may only shorten it.
    type: object
    fields:
      text: { type: string, min: 1, max: 24576, doc: "The complete user text. The MVP bound keeps Brain's canonical admission record below its 32,768-byte inline journal ceiling with envelope overhead; staged message bodies are deferred." }
      maxSpendCents: { type: cents, optional: true, doc: "The current-message spend ceiling. Omission means 1000 cents; the platform does not reserve account funds." }
      deadline: { type: timestamp, optional: true, doc: "An earlier absolute deadline. It must be in the future and cannot exceed the session's remaining `expiresAt`/drain fence." }

  MessageSendResult:
    doc: The admitted user message and the session now processing it.
    type: object
    fields:
      message: { type: ref, to: Message, doc: "The admitted message." }
      session: { type: ref, to: Session, doc: "The session with current activity populated." }

  SessionCancelResult:
    doc: The result of cancelling the session's current work. The session is idle afterward and accepts another message.
    type: object
    fields:
      sessionId: { type: id, of: session, doc: "The session." }
      changed: { type: boolean, doc: "Whether work was active and got cancelled." }
      sessionRevision: { type: integer, min: 0, max: 9007199254740991, doc: "The revision after cancellation." }

  SessionSuspendResult:
    doc: The result of manually suspending an idle session's exact retained generation. Active work must be cancelled first.
    type: object
    fields:
      sessionId: { type: id, of: session, doc: "The session." }
      changed: { type: boolean, doc: "Whether the session transitioned to suspended." }
      suspendedAt: { type: timestamp, doc: "When the generation suspended." }
      sessionRevision: { type: integer, min: 0, max: 9007199254740991, doc: "The revision after suspension." }

  SessionResumeResult:
    doc: The result of manually resuming the same retained generation to idle.
    type: object
    fields:
      sessionId: { type: id, of: session, doc: "The session." }
      changed: { type: boolean, doc: "Whether the retained generation was resumed." }
      status: { type: ref, to: SessionStatus, doc: "Always `idle` after a successful resume." }
      resumedAt: { type: timestamp, doc: "When the retained generation resumed." }
      sessionRevision: { type: integer, min: 0, max: 9007199254740991, doc: "The revision after resumption." }

  SessionTerminateResult:
    doc: The result of permanently destroying compute and live files while preserving session metadata and sealed messages.
    type: object
    fields:
      sessionId: { type: id, of: session, doc: "The session." }
      changed: { type: boolean, doc: "Whether live compute or files existed and were destroyed." }
      terminatedAt: { type: timestamp, doc: "When permanent termination committed." }
      sessionRevision: { type: integer, min: 0, max: 9007199254740991, doc: "The revision after termination." }
