# Observations, coverage, gaps and exports.
#
# The `replay_expired` gap reason stays in the vocabulary and becomes unreachable
# once the streaming buffer is removed; a test asserts the server never produces
# it.
module: observation
schemas:
  ObservationSignal:
    doc: The six observable signals.
    type: enum
    values:
      - { value: events, doc: "Structured platform events." }
      - { value: logs, doc: "Log records." }
      - { value: spans, doc: "Individual spans." }
      - { value: metrics, doc: "Metric points." }
      - { value: traces, doc: "Assembled traces." }
      - { value: telemetry, doc: "Every signal, interleaved." }

  ObservationOrder:
    doc: Which direction a read walks the ordered series.
    type: enum
    values:
      - { value: ascending, doc: "Oldest first." }
      - { value: descending, doc: "Newest first." }

  ObservationConsistency:
    doc: How much of the accepted series a read must observe.
    type: enum
    values:
      - { value: indexed, doc: "Whatever is indexed now." }
      - { value: accepted, doc: "Everything accepted, waiting for indexing if needed." }

  ObservationOperator:
    doc: The comparison operators a filter leaf may use.
    type: enum
    values:
      - { value: eq, doc: "Equal." }
      - { value: ne, doc: "Not equal." }
      - { value: lt, doc: "Less than." }
      - { value: lte, doc: "Less than or equal." }
      - { value: gt, doc: "Greater than." }
      - { value: gte, doc: "Greater than or equal." }
      - { value: prefix, doc: "String prefix." }

  ObservationFilterAll:
    doc: Every child must match.
    type: object
    fields:
      filters: { type: array, max: 16, items: { type: ref, to: ObservationFilter }, doc: "The children." }

  ObservationFilterAny:
    doc: At least one child must match.
    type: object
    fields:
      filters: { type: array, max: 16, items: { type: ref, to: ObservationFilter }, doc: "The children." }

  ObservationFilterNot:
    doc: The child must not match.
    type: object
    fields:
      filters: { type: array, max: 1, items: { type: ref, to: ObservationFilter }, doc: "The single child." }

  ObservationFilterCompare:
    doc: A comparison against one field.
    type: object
    fields:
      field: { type: string, min: 1, max: 256, doc: "The field path." }
      operator: { type: ref, to: ObservationOperator, doc: "The comparison." }
      value: { type: string, min: 0, max: 1024, doc: "The operand." }

  ObservationFilterIn:
    doc: Membership of a bounded value set.
    type: object
    fields:
      field: { type: string, min: 1, max: 256, doc: "The field path." }
      values: { type: array, max: 100, items: { type: string, max: 1024 }, doc: "The operands." }

  ObservationFilterExists:
    doc: Presence of a field.
    type: object
    fields:
      field: { type: string, min: 1, max: 256, doc: "The field path." }

  ObservationFilter:
    doc: A bounded filter AST. Structural bounds are enforced before construction.
    type: union
    tag: op
    variants:
      - { value: all, payload: ObservationFilterAll, doc: "Conjunction." }
      - { value: any, payload: ObservationFilterAny, doc: "Disjunction." }
      - { value: not, payload: ObservationFilterNot, doc: "Negation." }
      - { value: compare, payload: ObservationFilterCompare, doc: "Comparison." }
      - { value: in, payload: ObservationFilterIn, doc: "Set membership." }
      - { value: exists, payload: ObservationFilterExists, doc: "Presence." }

  ObservationQuery:
    doc: A bounded, paged observation read.
    type: object
    fields:
      signal: { type: ref, to: ObservationSignal, doc: "Which signal." }
      timeRange: { type: ref, to: TimeRange, doc: "The observation-time window." }
      filter: { type: ref, to: ObservationFilter, optional: true, doc: "The bounded filter." }
      order: { type: ref, to: ObservationOrder, optional: true, doc: "Walk direction." }
      consistency: { type: ref, to: ObservationConsistency, optional: true, doc: "How much must be observed." }
      cursor: { type: cursor, optional: true, doc: "Continuation token." }
      limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." }

  ObservationOriginCursor:
    doc: Resume from an exact prior position.
    type: object
    fields:
      cursor: { type: cursor, doc: "The prior position." }

  ObservationOriginTime:
    doc: Start from an instant.
    type: object
    fields:
      at: { type: timestamp, doc: "The instant." }

  ObservationOriginEarliest:
    doc: Start from the earliest replayable position.
    type: object
    fields: {}

  ObservationOrigin:
    doc: Exactly one origin. A stream that declares none or two is rejected.
    type: union
    tag: from
    variants:
      - { value: cursor, payload: ObservationOriginCursor, doc: "An exact prior position." }
      - { value: time, payload: ObservationOriginTime, doc: "An instant." }
      - { value: earliest, payload: ObservationOriginEarliest, doc: "The earliest replayable position." }

  ObservationStreamRequest:
    doc: Replay from exactly one declared origin as NDJSON.
    type: object
    fields:
      signal: { type: ref, to: ObservationSignal, doc: "Which signal." }
      origin: { type: ref, to: ObservationOrigin, doc: "Exactly one origin." }
      filter: { type: ref, to: ObservationFilter, optional: true, doc: "The bounded filter." }

  ObservationListenRequest:
    doc: Capture the current accepted position and follow it. Origins are rejected.
    type: object
    fields:
      signal: { type: ref, to: ObservationSignal, doc: "Which signal." }
      filter: { type: ref, to: ObservationFilter, optional: true, doc: "The bounded filter." }

  Observation:
    doc: One admitted observation, in the canonical envelope.
    type: object
    fields:
      id: { type: id, of: observation, doc: "Identity." }
      signal: { type: ref, to: ObservationSignal, doc: "Which signal it belongs to." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      sessionId: { type: id, of: session, optional: true, doc: "The owning session, when attributable." }
      runId: { type: id, of: run, optional: true, doc: "The owning run, when attributable." }
      traceId: { type: trace_id, optional: true, doc: "The W3C trace." }
      spanId: { type: span_id, optional: true, doc: "The W3C span." }
      observedAt: { type: timestamp, doc: "When the producer says it happened." }
      acceptedAt: { type: timestamp, doc: "When AEX admitted it." }
      sequence: { type: decimal, doc: "Position in the ordered series." }
      body: { type: canonical_json, doc: "The signal-specific payload." }

  ObservationWatermark:
    doc: How far one stage of the pipeline has advanced.
    type: object
    fields:
      sequence: { type: decimal, doc: "The position." }
      at: { type: timestamp, doc: "The observation time at that position." }

  MissingInterval:
    doc: A known hole in the ordered series.
    type: object
    fields:
      range: { type: ref, to: TimeRange, doc: "The affected window." }
      gapId: { type: id, of: telemetry_gap, doc: "The recorded gap." }

  ObservationCoverage:
    doc: What the answer is actually complete over. Never omitted.
    type: object
    fields:
      snapshot: { type: decimal, doc: "The pinned snapshot position." }
      accepted: { type: ref, to: ObservationWatermark, doc: "Admission watermark." }
      indexed: { type: ref, to: ObservationWatermark, doc: "Indexing watermark." }
      earliestReplay: { type: timestamp, doc: "Earliest replayable observation time." }
      caughtUp: { type: boolean, doc: "Whether indexing has reached admission." }
      complete: { type: boolean, doc: "Whether the window has no known holes." }
      missingIntervals: { type: array, max: 100, items: { type: ref, to: MissingInterval }, doc: "Known holes." }
      unboundedGaps: { type: array, max: 100, items: { type: id, of: telemetry_gap }, doc: "Gaps with no known bound." }

  ObservationPage:
    doc: One page of observations plus the coverage it is complete over.
    type: object
    fields:
      items: { type: array, max: 1000, items: { type: ref, to: Observation }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }
      coverage: { type: ref, to: ObservationCoverage, doc: "What the answer covers." }

  ObservationFrameRecords:
    doc: A batch of observations. The server splits before the effective frame bound.
    type: object
    fields:
      items: { type: array, max: 1000, items: { type: ref, to: Observation }, doc: "The batch." }

  ObservationFrameGap:
    doc: A gap surfaced inline; it is never silently skipped.
    type: object
    fields:
      gap: { type: ref, to: TelemetryGap, doc: "The recorded gap." }

  ObservationFrameCursor:
    doc: A resumable position.
    type: object
    fields:
      cursor: { type: cursor, doc: "The position." }
      coverage: { type: ref, to: ObservationCoverage, doc: "What has been delivered so far." }

  ObservationFrameRotate:
    doc: The terminal condition after a 200. A stream always ends with a reason.
    type: object
    fields:
      reason: { type: ref, to: RotateReason, doc: "Why the stream ended." }
      retryable: { type: boolean, doc: "Whether reconnecting from the last cursor can succeed." }
      error: { type: ref, to: ApiErrorBody, optional: true, doc: "The failure, when there was one." }
      cursor: { type: cursor, optional: true, doc: "The last resumable position." }

  RotateReason:
    doc: Why a stream ended after its 200.
    type: enum
    values:
      - { value: budget_exhausted, doc: "The connection reached its byte or time budget." }
      - { value: server_rotating, doc: "The serving process is going away." }
      - { value: client_idle, doc: "The client stopped reading." }
      - { value: upstream_unavailable, doc: "The observation authority became unreachable." }
      - { value: failed, doc: "An error ended the stream; `error` names it." }

  ObservationFrame:
    doc: One NDJSON frame. `stream` and `listen` emit nothing else.
    type: union
    tag: type
    variants:
      - { value: records, payload: ObservationFrameRecords, doc: "Observations." }
      - { value: gap, payload: ObservationFrameGap, doc: "A surfaced gap." }
      - { value: cursor, payload: ObservationFrameCursor, doc: "A resumable position." }
      - { value: rotate, payload: ObservationFrameRotate, doc: "The terminal condition." }

  TelemetryGapReason:
    doc: Why a gap exists.
    type: enum
    values:
      - { value: admission_rejected, doc: "A batch failed admission." }
      - { value: spool_lost, doc: "A spooled chunk could not be recovered." }
      - { value: producer_dropped, doc: "The producer reported dropping records." }
      - { value: replay_expired, doc: "Retained for the vocabulary; unreachable at launch." }
      - { value: authority_unavailable, doc: "The authority was unreachable during the window." }

  TelemetryGap:
    doc: A recorded hole in the observation series. There is no public repair route.
    type: object
    fields:
      id: { type: id, of: telemetry_gap, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      sessionId: { type: id, of: session, optional: true, doc: "The owning session, when attributable." }
      signals: { type: array, max: 6, items: { type: ref, to: ObservationSignal }, doc: "Affected signals." }
      reason: { type: ref, to: TelemetryGapReason, doc: "Why it exists." }
      recoverable: { type: boolean, doc: "Whether the records can still be recovered." }
      timeRange: { type: ref, to: TimeRange, doc: "The affected observation-time window." }
      fromSequence: { type: decimal, optional: true, doc: "First affected position, when known." }
      toSequence: { type: decimal, optional: true, doc: "Last affected position, when known." }
      observationCount: { type: decimal, optional: true, doc: "Observations known lost." }
      byteCount: { type: decimal, optional: true, doc: "Bytes known lost." }
      revision: { type: integer, min: 0, max: 9007199254740991, doc: "Monotonic concurrency token." }
      detectedAt: { type: timestamp, doc: "When it was recorded." }
      repairedAt: { type: timestamp, optional: true, doc: "When it was repaired." }
      repairSource: { type: string, min: 1, max: 128, optional: true, doc: "What repaired it." }

  TelemetryGapPage:
    doc: One page of recorded gaps.
    type: object
    fields:
      items: { type: array, max: 1000, items: { type: ref, to: TelemetryGap }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }

  TelemetryGapQuery:
    doc: A bounded query over recorded gaps.
    type: object
    fields:
      timeRange: { type: ref, to: TimeRange, doc: "The observation-time window." }
      signals: { type: array, max: 6, optional: true, items: { type: ref, to: ObservationSignal }, doc: "Restrict to these signals." }
      recoverable: { type: boolean, optional: true, doc: "Restrict by recoverability." }
      cursor: { type: cursor, optional: true, doc: "Continuation token." }
      limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." }

  MetricAggregationCalculation:
    doc: The calculations a metric aggregation may request.
    type: enum
    values:
      - { value: sum, doc: "Sum." }
      - { value: count, doc: "Count." }
      - { value: min, doc: "Minimum." }
      - { value: max, doc: "Maximum." }
      - { value: avg, doc: "Arithmetic mean." }

  MetricAggregationRequest:
    doc: A bounded metric aggregation.
    type: object
    fields:
      metric: { type: string, min: 1, max: 256, doc: "The metric name." }
      calculation: { type: ref, to: MetricAggregationCalculation, doc: "What to compute." }
      timeRange: { type: ref, to: TimeRange, doc: "The observation-time window." }
      filter: { type: ref, to: ObservationFilter, optional: true, doc: "The bounded filter." }
      groupBy: { type: array, max: 8, optional: true, items: { type: string, max: 256 }, doc: "Grouping attribute paths." }
      cursor: { type: cursor, optional: true, doc: "Continuation token." }
      limit: { type: integer, min: 1, max: 1000, optional: true, doc: "Page size." }

  MetricAggregationGroup:
    doc: One aggregated group.
    type: object
    fields:
      key: { type: map, items: { type: string, max: 256 }, doc: "The grouping attributes." }
      value: { type: float, doc: "The computed value." }
      sampleCount: { type: decimal, doc: "How many points contributed." }

  MetricAggregationPage:
    doc: One page of aggregated groups plus the coverage they are complete over.
    type: object
    fields:
      items: { type: array, max: 1000, items: { type: ref, to: MetricAggregationGroup }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }
      coverage: { type: ref, to: ObservationCoverage, doc: "What the answer covers." }

  TraceSummary:
    doc: The header of one assembled trace.
    type: object
    fields:
      traceId: { type: trace_id, doc: "The W3C trace identifier." }
      workspaceId: { type: id, of: workspace, optional: true, doc: "The owning workspace, when attributable." }
      rootName: { type: string, min: 0, max: 256, doc: "The root span name." }
      startedAt: { type: timestamp, doc: "Earliest span start." }
      endedAt: { type: timestamp, doc: "Latest span end." }
      spanCount: { type: decimal, doc: "How many spans were assembled." }

  TraceDetail:
    doc: One assembled trace and the observations it was assembled from.
    type: object
    fields:
      summary: { type: ref, to: TraceSummary, doc: "The header." }
      spans: { type: array, max: 10000, items: { type: ref, to: Observation }, doc: "The spans." }
      coverage: { type: ref, to: ObservationCoverage, doc: "What the assembly covers." }

  ExportFormat:
    doc: The three export formats.
    type: enum
    values:
      - { value: ndjson, doc: "Newline-delimited JSON." }
      - { value: parquet, doc: "Apache Parquet." }
      - { value: otlp_json, doc: "OTLP JSON." }

  ExportCompleteness:
    doc: What an export does when the window has recorded gaps.
    type: enum
    values:
      - { value: require, doc: "Refuse to produce an artifact over a gap." }
      - { value: allow_gaps, doc: "Produce the artifact and record the gaps in the manifest." }

  ExportStatus:
    doc: Where an export is in its lifecycle.
    type: enum
    values:
      - { value: preparing, doc: "Being produced." }
      - { value: ready, doc: "Downloadable." }
      - { value: expired, doc: "Past its retention." }
      - { value: revoked, doc: "Explicitly revoked." }

  TelemetryExportRequest:
    doc: Admit a durable telemetry-export operation.
    type: object
    fields:
      query: { type: ref, to: ObservationQuery, doc: "What to export." }
      format: { type: ref, to: ExportFormat, doc: "The artifact format." }
      completeness: { type: ref, to: ExportCompleteness, doc: "What to do about recorded gaps." }

  TelemetryExport:
    doc: One telemetry export record. Session exports remain workspace-owned.
    type: object
    fields:
      id: { type: id, of: export, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The owning workspace." }
      sessionId: { type: id, of: session, optional: true, doc: "The session it was scoped to." }
      status: { type: ref, to: ExportStatus, doc: "Lifecycle position." }
      format: { type: ref, to: ExportFormat, doc: "The artifact format." }
      completeness: { type: ref, to: ExportCompleteness, doc: "The completeness rule it was produced under." }
      manifestHash: { type: content_hash, optional: true, doc: "Hash of the export manifest, once ready." }
      sizeBytes: { type: decimal, optional: true, doc: "Artifact size, once ready." }
      createdAt: { type: timestamp, doc: "When it was admitted." }
      readyAt: { type: timestamp, optional: true, doc: "When it became downloadable." }
      expiresAt: { type: timestamp, optional: true, doc: "When it stops being downloadable." }
      revokedAt: { type: timestamp, optional: true, doc: "When it was revoked." }
      gapIds: { type: array, max: 100, optional: true, items: { type: id, of: telemetry_gap }, doc: "Gaps inside the window." }

  TelemetryExportResult:
    doc: The result of a telemetry-export operation.
    type: object
    fields:
      exportId: { type: id, of: export, doc: "The produced export." }
      format: { type: ref, to: ExportFormat, doc: "The artifact format." }
      manifestHash: { type: content_hash, doc: "Hash of the export manifest." }
      expiresAt: { type: timestamp, doc: "When the artifact stops being downloadable." }

  TelemetryAdmissionReceipt:
    doc: The AEX receipt returned alongside the standard OTLP response.
    type: object
    fields:
      batchId: { type: id, of: telemetry_batch, doc: "The admitted batch." }
      accepted: { type: decimal, doc: "Records admitted." }
      rejected: { type: decimal, doc: "Records rejected." }
      bytes: { type: decimal, doc: "Decoded payload bytes." }
      acceptedAt: { type: timestamp, doc: "When admission committed." }
