# The adjustable workspace safety limits.
#
# This crate owns the identity and the public shape only. Enforcement and the
# audited override path belong to the regional capacity authority.
limits:
  - { id: "context.tool_result_bytes", shape: scalar, doc: "Largest tool result admitted into the next model context." }
  - { id: "session.materialized_agents", shape: scalar, doc: "Root-plus-subagents concurrently materialized in one session." }
  - { id: "session.initial_files_bytes", shape: scalar, doc: "Largest aggregate byte size of registered workspace files materialized synchronously before session creation returns ready." }
  - { id: "api.json_body", shape: scalar, doc: "Largest accepted encoded JSON request body." }
  - { id: "telemetry.batch", shape: map, dimensions: [encoded_bytes, decoded_bytes, records, observation_bytes, attributes, attribute_key_bytes, attribute_value_bytes, array_elements], doc: "Encoded, decoded, record and normalized-observation admission bounds." }
  - { id: "telemetry.ingest_rate", shape: map, dimensions: [sustained_bytes_per_second, burst_bytes, sustained_requests_per_second, burst_requests], doc: "Sustained and burst byte and request rates per workspace." }
  - { id: "telemetry.metric_series", shape: scalar, doc: "Exact active metric-series ceiling per workspace." }
  - { id: "query.filter", shape: map, dimensions: [depth, leaves, children_per_boolean, in_values, string_bytes], doc: "Structural bounds of an observation query filter." }
  - { id: "query.page", shape: map, dimensions: [items, serialized_bytes], doc: "Largest accepted collection page in items and serialized bytes." }
  - { id: "stream.frame", shape: map, dimensions: [records, encoded_bytes], doc: "Largest NDJSON records frame in observations and encoded bytes." }
  - { id: "metric.aggregate", shape: map, dimensions: [interval_min_seconds, interval_max_seconds, group_fields, calculations, buckets_per_series, rows], doc: "Interval, grouping, calculation, bucket and row aggregation bounds." }
  - { id: "registry.entries", shape: scalar, doc: "Registered names one workspace may hold in one registry." }
  - { id: "registry.value_bytes", shape: scalar, doc: "Largest canonical value document a registered name may carry." }
  - { id: "telemetry.export", shape: map, dimensions: [active, window_days], doc: "Concurrent non-terminal telemetry exports per workspace, and the widest observation-time window one export may cover. A cost guard rather than a correctness guard: the active count is read eventually consistently, so a race may admit one or two over the cap, which is a better failure than the transactional counter that leaks and blocks a workspace permanently." }
