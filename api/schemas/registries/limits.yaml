# The adjustable workspace safety limits.
#
# This crate owns the identity and the public shape only. Enforcement and the
# audited override path belong to the regional capacity authority.
limits:
  - { id: "context.tool_result_bytes", shape: scalar, doc: "Largest tool result admitted into the next model context." }
  - { id: "session.materialized_agents", shape: scalar, doc: "Root-plus-subagents concurrently materialized in one session." }
  - { id: "api.json_body", shape: scalar, doc: "Largest accepted encoded JSON request body." }
  - { id: "telemetry.batch", shape: map, doc: "Encoded, decoded, record and normalized-observation admission bounds." }
  - { id: "telemetry.ingest_rate", shape: map, doc: "Sustained and burst byte and request rates per workspace." }
  - { id: "telemetry.metric_series", shape: scalar, doc: "Exact active metric-series ceiling per workspace." }
  - { id: "query.filter", shape: map, doc: "Structural bounds of an observation query filter." }
  - { id: "query.page", shape: map, doc: "Largest accepted collection page in items and serialized bytes." }
  - { id: "stream.frame", shape: map, doc: "Largest NDJSON records frame in observations and encoded bytes." }
  - { id: "metric.aggregate", shape: map, doc: "Interval, grouping, calculation, bucket and row aggregation bounds." }
  - { id: "content.bundle_expand", shape: map, doc: "Expanded bytes, entries and path length admitted from a bundle." }
  - { id: "tools.io_safety", shape: map, doc: "Per-tool byte, traversal and listing safety bounds." }
