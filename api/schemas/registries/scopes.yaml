# The launch authorization vocabulary. Personal-account browser sessions use
# account/control/billing scopes; workspace keys use only session/file scopes.
scopes:
  - { scope: "account:read", doc: "Read bootstrap and personal-account state." }
  - { scope: "account:write", doc: "Close the caller's own browser session." }
  - { scope: "api_keys:read", doc: "List fixed-workspace API key metadata." }
  - { scope: "api_keys:write", doc: "Mint and revoke fixed-workspace API keys." }
  - { scope: "billing:read", doc: "Read prepaid balance, card metadata, transactions and rated usage." }
  - { scope: "billing:write", doc: "Set up or remove cards and create manual top-up checkouts." }
  - { scope: "sessions:read", doc: "Read sessions, messages and telemetry." }
  - { scope: "sessions:write", doc: "Create sessions, send messages, cancel and terminate." }
  - { scope: "sessions:delete", doc: "Admit irreversible session deletion." }
  - { scope: "resources:read", doc: "Read current workspace files and mint downloads." }
  - { scope: "resources:write", doc: "Overwrite/delete current workspace files and upload bytes." }
