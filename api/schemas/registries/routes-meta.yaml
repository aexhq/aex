# Route-table metadata.
#
# `expected` pins each plane's operation count. The generator fails if either
# drifts, so a route cannot be added or lost without the change being visible in
# this file's diff.
#
# `pathParams` is the one place a path parameter's type is declared. A fragment
# names the parameter in its template and nothing else, so two routes can never
# disagree about what `{sessionId}` is.
contractVersion: v1
expected:
  central: 27
  regional: 119
pathParams:
  organizationId: { type: id, of: organization, doc: "The organization the request is scoped to." }
  workspaceId: { type: id, of: workspace, doc: "The workspace the request is scoped to." }
  apiKeyId: { type: id, of: api_key, doc: "The API key metadata record." }
  statementId: { type: id, of: statement, doc: "The issued statement." }
  operationId: { type: id, of: operation, doc: "The durable operation record." }
  sessionId: { type: id, of: session, doc: "The session the request is scoped to." }
  runId: { type: id, of: run, doc: "The run within the session." }
  approvalId: { type: id, of: approval, doc: "The approval within the session." }
  uploadId: { type: id, of: upload, doc: "The staged upload." }
  exportId: { type: id, of: export, doc: "The telemetry export." }
  gapId: { type: id, of: telemetry_gap, doc: "The recorded telemetry gap." }
  providerCredentialId: { type: id, of: provider_credential, doc: "The provider-credential binding." }
  limitId: { type: limit_id, doc: "The effective workspace limit." }
  name: { type: resource_name, doc: "The registered resource or secret name." }
  traceId: { type: trace_id, doc: "A W3C 32-hex trace identifier." }

# Delivery/test selection defaults. Most fragments are mounted by one release
# unit and exercised by one scenario family. The per-operation table below is
# authoritative for the split fragments and the long-lived NDJSON transport;
# the generator resolves both layers into one final runtime/delivery owner.
scenarioOwners:
  central.api-keys: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.auth: { servingArtifact: central-identity-api, scenarios: [SC-IDENTITY-ACCOUNT] }
  central.billing: { servingArtifact: finance-api, scenarios: [SC-FINANCE-INVOICE] }
  central.bootstrap: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.identity: { servingArtifact: central-identity-api, scenarios: [SC-IDENTITY-ACCOUNT] }
  central.operations: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.organizations: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.workspaces: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  regional.approvals: { servingArtifact: regional-session-api, scenarios: [SC-BRAIN-TURN] }
  regional.files: { servingArtifact: regional-session-api, scenarios: [SC-CONTENT-LIFECYCLE] }
  regional.observations: { servingArtifact: regional-observation-api, scenarios: [SC-OBSERVATION-QUERY] }
  regional.operations: { servingArtifact: regional-session-api, scenarios: [SC-SESSION-TERMINAL] }
  regional.otlp: { servingArtifact: regional-otlp, scenarios: [SC-OBSERVATION-ADMIT] }
  regional.provider-credentials: { servingArtifact: regional-session-api, scenarios: [SC-SESSION-ADMIT] }
  regional.registry: { servingArtifact: regional-session-api, scenarios: [SC-SESSION-ADMIT] }
  regional.secrets: { servingArtifact: regional-secret-api, scenarios: [SC-SECRET-CUSTODY] }
  regional.sessions: { servingArtifact: regional-session-api, scenarios: [SC-SESSION-ADMIT, SC-SESSION-TERMINAL] }
  regional.telemetry-lifecycle: { servingArtifact: regional-observation-api, scenarios: [SC-OBSERVATION-EXPORT, SC-OBSERVATION-GAP] }
  regional.uploads: { servingArtifact: regional-session-api, scenarios: [SC-CONTENT-LIFECYCLE] }
  regional.usage: { servingArtifact: regional-session-api, scenarios: [SC-USAGE-SETTLE] }
  regional.workspace: { servingArtifact: regional-session-api, scenarios: [SC-SESSION-ADMIT] }

# Exceptions are keyed by operationId, never by path. The generator resolves
# these into the runtime RouteDescriptor and the delivery registry together.
# NDJSON is a distinct long-lived service even when its unary peer is authored
# in the same OpenAPI fragment. Secrets and provider credentials are split at
# the plaintext-custody boundary.
operationOwners:
  observations_events_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_events_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_logs_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_logs_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_metrics_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_metrics_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_spans_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_spans_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_telemetry_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_telemetry_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_traces_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  observations_traces_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  provider_credential_register: { servingArtifact: regional-secret-api, scenarios: [SC-SECRET-CUSTODY] }
  secret_get: { servingArtifact: regional-session-api, scenarios: [SC-SECRET-CUSTODY] }
  secrets_list: { servingArtifact: regional-session-api, scenarios: [SC-SECRET-CUSTODY] }
  session_observations_events_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_events_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_logs_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_logs_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_metrics_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_metrics_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_spans_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_spans_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_telemetry_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_telemetry_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_traces_listen: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
  session_observations_traces_stream: { servingArtifact: regional-stream, scenarios: [SC-SESSION-STREAM] }
