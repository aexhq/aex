# Route-table metadata.
#
# `expected` pins each plane's operation count. The generator fails if either
# drifts, so a route cannot be added or lost without the change being visible in
# this file's diff.
#
# `pathParams` is the one place a path parameter's type is declared. A fragment
# names the parameter in its template and nothing else, so two routes can never
# disagree about what `{sessionId}` is.
contractVersion: v1
expected:
  central: 31
  regional: 118
pathParams:
  organizationId: { type: id, of: organization, doc: "The organization the request is scoped to." }
  workspaceId: { type: id, of: workspace, doc: "The workspace the request is scoped to." }
  apiKeyId: { type: id, of: api_key, doc: "The API key metadata record." }
  statementId: { type: id, of: statement, doc: "The issued statement." }
  operationId: { type: id, of: operation, doc: "The durable operation record." }
  sessionId: { type: id, of: session, doc: "The session the request is scoped to." }
  runId: { type: id, of: run, doc: "The run within the session." }
  approvalId: { type: id, of: approval, doc: "The approval within the session." }
  uploadId: { type: id, of: upload, doc: "The staged upload." }
  exportId: { type: id, of: export, doc: "The telemetry export." }
  gapId: { type: id, of: telemetry_gap, doc: "The recorded telemetry gap." }
  providerCredentialId: { type: id, of: provider_credential, doc: "The provider-credential binding." }
  limitId: { type: limit_id, doc: "The effective workspace limit." }
  name: { type: resource_name, doc: "The registered resource or secret name." }
  traceId: { type: trace_id, doc: "A W3C 32-hex trace identifier." }

# Closed delivery vocabulary. Planned ownership and actual mount claims below
# must name an artifact on the operation's own API plane.
servingArtifacts:
  central-control-api: central
  central-identity-api: central
  finance-api: central
  regional-observation-api: regional
  regional-otlp: regional
  regional-secret-api: regional
  session-stream-api: regional

# Planned delivery/test selection defaults. Most fragments are intended for one
# release unit and one scenario family. The per-operation table below is
# authoritative for split fragments and the long-lived NDJSON transport. These
# declarations assign work; only `servedOperations` proves an actual mount.
scenarioOwners:
  central.api-keys: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.auth: { servingArtifact: central-identity-api, scenarios: [SC-IDENTITY-ACCOUNT] }
  central.billing: { servingArtifact: finance-api, scenarios: [SC-FINANCE-INVOICE] }
  central.bootstrap: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.identity: { servingArtifact: central-identity-api, scenarios: [SC-IDENTITY-ACCOUNT] }
  central.operations: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.organizations: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.workspaces: { servingArtifact: central-control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  regional.approvals: { servingArtifact: session-stream-api, scenarios: [SC-BRAIN-TURN] }
  regional.files: { servingArtifact: session-stream-api, scenarios: [SC-CONTENT-LIFECYCLE] }
  regional.observations: { servingArtifact: regional-observation-api, scenarios: [SC-OBSERVATION-QUERY] }
  regional.operations: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-TERMINAL] }
  regional.otlp: { servingArtifact: regional-otlp, scenarios: [SC-OBSERVATION-ADMIT] }
  regional.provider-credentials: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-ADMIT] }
  regional.registry: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-ADMIT] }
  regional.secrets: { servingArtifact: regional-secret-api, scenarios: [SC-SECRET-CUSTODY] }
  regional.sessions: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-ADMIT, SC-SESSION-TERMINAL] }
  regional.telemetry-lifecycle: { servingArtifact: regional-observation-api, scenarios: [SC-OBSERVATION-EXPORT, SC-OBSERVATION-GAP] }
  regional.uploads: { servingArtifact: session-stream-api, scenarios: [SC-CONTENT-LIFECYCLE] }
  regional.usage: { servingArtifact: session-stream-api, scenarios: [SC-USAGE-SETTLE] }
  regional.workspace: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-ADMIT] }

# Exceptions are keyed by operationId, never by path. The generator resolves
# these into the runtime RouteDescriptor and the delivery registry together.
# NDJSON is a distinct long-lived service even when its unary peer is authored
# in the same OpenAPI fragment. Secrets and provider credentials are split at
# the plaintext-custody boundary.
operationOwners:
  observations_events_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_events_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_logs_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_logs_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_metrics_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_metrics_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_spans_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_spans_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_telemetry_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_telemetry_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_traces_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  observations_traces_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  provider_credential_register: { servingArtifact: regional-secret-api, scenarios: [SC-SECRET-CUSTODY] }
  secret_get: { servingArtifact: session-stream-api, scenarios: [SC-SECRET-CUSTODY] }
  secrets_list: { servingArtifact: session-stream-api, scenarios: [SC-SECRET-CUSTODY] }
  session_observations_events_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_events_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_logs_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_logs_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_metrics_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_metrics_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_spans_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_spans_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_telemetry_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_telemetry_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_traces_listen: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }
  session_observations_traces_stream: { servingArtifact: session-stream-api, scenarios: [SC-SESSION-STREAM] }

# Explicit architecture debt. Every entry names one exact operation whose
# production handler is intentionally absent and why. The generator rejects an
# unknown operation, an empty reason, or overlap with `servedOperations`.
# Deferral is not mount evidence and is emitted only into the delivery registry.
deferredOperations:
  session_approval_get: "Nothing composed into the platform raises an approval, so the point read can only report that no approval exists."
  session_approval_respond: "The atomic bound-call approval writer is not composed into the regional service."
  session_approvals_list: "Nothing composed into the platform raises an approval, so the collection can only report an empty page."
  session_create: "The complete session authority and create use case are not implemented."
  session_credential_rebind: "The credential-rebind authority and durable command transaction are not implemented."
  session_files_live_download_create: "The session root, content decryption, and presigning composition is incomplete."
  session_files_live_list: "The guest answers this from lstat with no digest; session-stream-api composes no authenticated guest transport or provider endpoint token to ask it."
  session_files_live_stat: "The guest answers this from lstat with no digest; session-stream-api composes no authenticated guest transport or provider endpoint token to ask it."
  session_files_persisted_download_create: "The persisted root, content decryption, and presigning composition is incomplete."
  session_files_persisted_list: "The persisted root and plaintext content projection are incomplete."
  session_files_persisted_stat: "The persisted root and plaintext content projection are incomplete."
  session_message_send: "The wire and domain message vocabularies and durable command path are not reconciled."
  session_persist: "The paged persist operation and commit latch are incomplete."
  session_purge: "The paged purge operation and commit latch are incomplete."
  session_workspace_discard: "The workspace-discard operation and commit latch are incomplete."

# Actual public mount authority. `scenarioOwners` and `operationOwners` plan
# where a route belongs; this table says which complete handlers are mounted
# today. An absent route must have an exact `deferredOperations` entry or
# `graph verify` reports `aex-route-unserved`. Never add a route here to make
# the graph green: its production composition must consume or assert this
# generated projection, and served+deferred is rejected.
servedOperations:
  central-control-api:
    - api_key_create
