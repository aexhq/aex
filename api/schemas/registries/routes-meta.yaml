# The launch route allowlist and exact serving ownership.
contractVersion: v1
expected:
  central: 14
  regional: 19
pathParams:
  apiKeyId: { type: id, of: api_key, doc: "API key metadata." }
  paymentMethodId: { type: id, of: payment_method, doc: "Display-only card reference." }
  sessionId: { type: id, of: session, doc: "Owning session." }
  uploadId: { type: id, of: upload, doc: "Staged direct upload." }
  name: { type: resource_name, doc: "Current logical workspace-file name." }

servingArtifacts:
  control-api: central
  session-api: regional

scenarioOwners:
  central.auth: { servingArtifact: control-api, scenarios: [SC-IDENTITY-ACCOUNT] }
  central.bootstrap: { servingArtifact: control-api, scenarios: [SC-IDENTITY-ACCOUNT] }
  central.api-keys: { servingArtifact: control-api, scenarios: [SC-CONTROL-WORKSPACE] }
  central.billing: { servingArtifact: control-api, scenarios: [SC-BILLING-ESSENTIAL] }
  regional.sessions: { servingArtifact: session-api, scenarios: [SC-SESSION-ADMIT, SC-SESSION-STREAM, SC-SESSION-TERMINAL, SC-TELEMETRY-LIVE-RETAINED] }
  regional.registry: { servingArtifact: session-api, scenarios: [SC-FILES-CURRENT] }
  regional.uploads: { servingArtifact: session-api, scenarios: [SC-FILES-UPLOAD] }

operationOwners: {}
deferredOperations: {}

servedOperations:
  control-api:
    - auth_config_get
    - api_key_create
    - api_key_revoke
    - api_keys_list
    - billing_balance_get
    - billing_payment_method_delete
    - billing_payment_method_session_create
    - billing_payment_methods_list
    - billing_top_up_checkout_create
    - billing_transactions_list
    - billing_usage_get
    - dashboard_bootstrap_get
    - dashboard_session_create
    - dashboard_session_delete
  session-api:
    - registry_files_delete
    - registry_files_download_create
    - registry_files_get
    - registry_files_list
    - registry_files_put
    - session_cancel
    - session_create
    - session_delete
    - session_get
    - session_message_send
    - session_messages_list
    - session_messages_stream
    - session_telemetry_download_create
    - session_telemetry_replay
    - session_telemetry_stream
    - session_terminate
    - sessions_list
    - upload_complete
    - upload_create
