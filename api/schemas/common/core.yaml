# Shapes both planes use.
module: common
schemas:
  EmptyRequest:
    doc: A body that carries no fields; still strict, so an extra member is rejected.
    type: object
    fields: {}

  ApiError:
    doc: The one error envelope every failing request returns.
    type: object
    fields:
      error: { type: ref, to: ApiErrorBody, doc: "The failure." }

  ApiErrorBody:
    doc: The failure itself.
    type: object
    fields:
      code: { type: error_code, doc: "The closed v1 error code." }
      message: { type: string, max: 2048, doc: "A human message; never a provider body." }
      requestId: { type: string, max: 128, doc: "The diagnostic request identifier." }
      retryable: { type: boolean, doc: "Whether an identical retry can succeed." }
      operationId: { type: id, of: operation, optional: true, doc: "The durable operation this failure belongs to." }
      details: { type: ref, to: ErrorDetails, optional: true, doc: "Typed remediation detail." }

  ErrorDetails:
    doc: Closed, typed remediation detail; never an untyped bag.
    type: union
    tag: type
    variants:
      - { value: required_scope, payload: ErrorDetailsRequiredScope, doc: "The scope the credential lacks." }
      - { value: limit, payload: ErrorDetailsLimit, doc: "The effective limit that was exceeded." }
      - { value: quota, payload: ErrorDetailsQuota, doc: "The quota dimension that was exhausted." }
      - { value: region, payload: ErrorDetailsRegion, doc: "The authoritative region for the workspace." }
      - { value: retry, payload: ErrorDetailsRetry, doc: "How long to wait before retrying." }
      - { value: operation, payload: ErrorDetailsOperation, doc: "The original operation that already exists." }
      - { value: validation, payload: ErrorDetailsValidation, doc: "Exactly where the body failed validation." }

  ErrorDetailsRequiredScope:
    doc: The scope the credential lacks.
    type: object
    fields:
      scope: { type: scope, doc: "The missing scope." }

  ErrorDetailsLimit:
    doc: The effective limit that was exceeded.
    type: object
    fields:
      limit: { type: limit_id, doc: "Which limit." }
      effective: { type: decimal, doc: "The effective value at the time of the request." }
      measured: { type: decimal, doc: "What the request would have required." }

  ErrorDetailsQuota:
    doc: The quota dimension that was exhausted.
    type: object
    fields:
      dimension: { type: limit_id, doc: "Which quota dimension." }
      used: { type: decimal, doc: "Already consumed." }
      attempted: { type: decimal, doc: "What this request would have added." }

  ErrorDetailsRegion:
    doc: The authoritative placement of the workspace.
    type: object
    fields:
      expected: { type: region, doc: "Where the workspace actually lives." }
      apiUrl: { type: https_url, doc: "The regional host to reissue against." }

  ErrorDetailsRetry:
    doc: How long to wait before retrying.
    type: object
    fields:
      retryAfterMs: { type: integer, min: 0, max: 86400000, doc: "Milliseconds to wait." }

  ErrorDetailsOperation:
    doc: The original operation the replay resolved to.
    type: object
    fields:
      operationId: { type: id, of: operation, doc: "The original operation." }

  ErrorDetailsValidation:
    doc: Exactly where the body failed validation.
    type: object
    fields:
      pointer: { type: json_pointer, doc: "RFC 6901 pointer to the offending position." }
      reason: { type: string, max: 512, doc: "Why that position was rejected." }

  ByteRange:
    doc: An explicit inclusive byte range over an immutable object.
    type: object
    fields:
      start: { type: decimal, doc: "First byte, inclusive." }
      endInclusive: { type: decimal, doc: "Last byte, inclusive." }

  DownloadGrant:
    doc: A short-lived signed grant for exactly one object and range.
    type: object
    fields:
      measurementId: { type: id, of: measurement, doc: "The metered download measurement." }
      url: { type: https_url, doc: "The signed URL; never printed by the CLI." }
      expiresAt: { type: timestamp, doc: "When the signature stops verifying." }
      sha256: { type: content_hash, doc: "The immutable whole-object hash." }
      sizeBytes: { type: decimal, doc: "The whole object size." }
      authorizedBytes: { type: decimal, doc: "Bytes this grant authorizes." }
      range: { type: ref, to: ByteRange, optional: true, doc: "The signed range, when the grant is partial." }

  HttpHeader:
    doc: One request header a signed grant requires the caller to send verbatim.
    type: object
    fields:
      name: { type: string, min: 1, max: 128, doc: "The header name." }
      value: { type: string, min: 1, max: 8192, doc: "The exact value to send." }

  WorkspaceAccess:
    doc: Which retained session generation answered a live workspace call.
    type: object
    fields:
      generationId: { type: id, of: generation, doc: "The exact retained generation that answered." }
      resumed: { type: boolean, doc: "Whether this call first resumed the suspended generation." }

  HostedSession:
    doc: A short-lived hosted provider page.
    type: object
    fields:
      url: { type: https_url, doc: "The hosted page." }
      expiresAt: { type: timestamp, doc: "When the page stops working." }

  TimeRange:
    doc: A half-open instant range, `gte` inclusive and `lt` exclusive.
    type: object
    fields:
      gte: { type: timestamp, doc: "Inclusive lower bound." }
      lt: { type: timestamp, doc: "Exclusive upper bound." }
