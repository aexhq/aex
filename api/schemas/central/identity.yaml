# One personal account, one fixed workspace, GitHub browser sessions and API
# keys. Organization and membership product types intentionally do not
# exist in the launch contract.
module: central
schemas:
  AccountPauseReason:
    doc: Why the personal prepaid account cannot admit paid work.
    type: enum
    values:
      - { value: top_up_required, doc: "The prepaid balance is exhausted; a top-up restores service." }
      - { value: payment_hold, doc: "A payment is unresolved; another payment does not automatically clear it." }
      - { value: dispute_hold, doc: "A chargeback is open and requires reconciliation." }
      - { value: account_closed, doc: "The account is closed." }

  AccountActiveState:
    doc: An account in good standing.
    type: object
    fields:
      revision: { type: integer, min: 0, max: 9007199254740991, doc: "Monotonic state revision." }
      changedAt: { type: timestamp, doc: "When the state last changed." }

  AccountPausedState:
    doc: A paused account and its customer-visible remedy.
    type: object
    fields:
      reason: { type: ref, to: AccountPauseReason, doc: "Why it is paused." }
      revision: { type: integer, min: 0, max: 9007199254740991, doc: "Monotonic state revision." }
      changedAt: { type: timestamp, doc: "When the state last changed." }
      minimumRestoreCents: { type: cents, optional: true, doc: "Smallest restoring top-up, only for top_up_required." }

  AccountOperationalState:
    doc: Whether the account may consume paid capacity.
    type: union
    tag: status
    variants:
      - { value: active, payload: AccountActiveState, doc: "Active." }
      - { value: paused, payload: AccountPausedState, doc: "Paused." }

  WorkspaceOperationalState:
    doc: The fixed workspace's inherited personal-account state.
    type: object
    fields:
      accountId: { type: id, of: account, doc: "The personal account." }
      state: { type: ref, to: AccountOperationalState, doc: "The inherited state." }

  Workspace:
    doc: The account's fixed eu-west-1 execution and content boundary.
    type: object
    fields:
      id: { type: id, of: workspace, doc: "Identity." }
      name: { type: string, min: 1, max: 128, doc: "Display name." }
      region: { type: region, doc: "Immutable placement; eu-west-1 at launch." }
      apiUrl: { type: https_url, doc: "Regional session endpoint." }
      operationalState: { type: ref, to: WorkspaceOperationalState, doc: "Inherited account state." }
      createdAt: { type: timestamp, doc: "When first login provisioned it." }

  ApiKey:
    doc: Workspace API key metadata. Secret material is never returned by reads.
    type: object
    fields:
      id: { type: id, of: api_key, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The fixed workspace it authorizes." }
      name: { type: string, min: 1, max: 128, doc: "Display name." }
      scopes: { type: array, max: 16, items: { type: scope }, doc: "The scopes it carries." }
      createdAt: { type: timestamp, doc: "When it was minted." }
      revokedAt: { type: timestamp, optional: true, doc: "When it was revoked." }

  ApiKeyPage:
    doc: One bounded page of API key metadata.
    type: object
    fields:
      items: { type: array, max: 100, items: { type: ref, to: ApiKey }, doc: "The page." }
      nextCursor: { type: cursor, optional: true, doc: "Continuation token." }

  ApiKeyCreateRequest:
    doc: Mint a key for the account's fixed workspace.
    type: object
    fields:
      workspaceId: { type: id, of: workspace, doc: "Must name the fixed workspace." }
      name: { type: string, min: 1, max: 128, doc: "Display name." }
      scopes: { type: array, max: 16, items: { type: scope }, doc: "Launch scopes to grant." }

  NewApiKey:
    doc: A freshly minted key; its value is returned once and never stored.
    type: object
    fields:
      id: { type: id, of: api_key, doc: "Identity." }
      workspaceId: { type: id, of: workspace, doc: "The fixed workspace." }
      name: { type: string, min: 1, max: 128, doc: "Display name." }
      scopes: { type: array, max: 16, items: { type: scope }, doc: "The scopes it carries." }
      createdAt: { type: timestamp, doc: "When it was minted." }
      value: { type: string, min: 60, max: 128, doc: "The one-time secret value." }

  DashboardSessionRequest:
    doc: Complete a GitHub OAuth browser sign-in using PKCE-bound state.
    type: object
    fields:
      code: { type: string, min: 1, max: 2048, doc: "Single-use GitHub authorization code." }
      state: { type: string, min: 43, max: 128, doc: "The echoed S256 challenge." }
      codeVerifier: { type: string, min: 43, max: 128, doc: "The browser-held PKCE verifier." }

  DashboardSessionCredential:
    doc: A rotated browser session returned exactly once.
    type: object
    fields:
      session: { type: string, min: 16, max: 4096, doc: "Bearer credential for an HttpOnly cookie." }
      userId: { type: id, of: user, doc: "The GitHub-linked person." }
      expiresAt: { type: timestamp, doc: "When it stops verifying." }

  DashboardBootstrap:
    doc: The single bounded read that fills the launch dashboard shell.
    type: object
    fields:
      userId: { type: id, of: user, doc: "The signed-in person." }
      email: { type: string, min: 3, max: 320, doc: "Their verified GitHub email." }
      accountId: { type: id, of: account, doc: "Their personal prepaid account." }
      accountState: { type: ref, to: AccountOperationalState, doc: "Current paid-capacity state." }
      workspace: { type: ref, to: Workspace, doc: "The fixed eu-west-1 workspace." }
      generatedAt: { type: timestamp, doc: "When this snapshot was assembled." }
