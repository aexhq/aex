# The closed external-seam registry.
#
# A seam is a boundary where AEX code meets a system it does not own: an AWS
# service, a model provider, a payment processor, an MCP server, the public
# internet, a package registry. Every package declares the seams it touches by
# id; an id absent from this file fails `aex-unknown-seam`, and a seam with
# `requires_live = true` that no live companion claims fails
# `aex-unclaimed-seam`.
#
# `proves_locally` says how much of the seam the pinned local substrate
# (`release/policy/test-images.toml`) can establish:
#
#   "none"    - nothing about this seam is provable without the real service;
#   "partial" - request/expression shape and envelope limits are provable, the
#               listed `live_only` behaviours are not;
#   "full"    - the local engine is the same implementation as production.
#
# No launch seam is "full": every row below requires live evidence, which
# `OD-07` forbids earning in this rewrite. Those rows are emitted to
# `release/unearned-evidence.json` instead of being silently absent.

schema = "aex.seams.v1"

# --- DynamoDB ---------------------------------------------------------------

[seam."aws.dynamodb.transact_write"]
proves_locally = "partial"
requires_live = true
local = "expression syntax, the 100-action/4 MiB envelope, cancellation-reason vectors"
live_only = "cross-table cancellation-reason ordering and TransactionConflict under real contention"

[seam."aws.dynamodb.condition"]
proves_locally = "partial"
requires_live = true
local = "single-item conditional writes and their failure shapes"
live_only = "conditional-write behaviour under adaptive capacity and hot-partition throttling"

