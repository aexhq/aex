# Outbox-backlog-scaled and scale-to-zero. Derived from the outbox read itself
# rather than from a peer, because the read decides what concurrency can buy.
#
# The reservation is 5, down from 10, and this is a correctness argument rather
# than a cost one. The outbox `SELECT` takes no lease and no
# `FOR UPDATE SKIP LOCKED`; only the follow-up `UPDATE` is conditional. So N
# concurrent invocations read the same page and publish the same receipts, one
# wins the update, and the rest are duplicate SQS traffic and duplicate Aurora
# write contention. Concurrency above one buys ZERO additional drain throughput
# and multiplies duplicates linearly, and the one-minute schedule already
# guarantees a fresh drain every tick.
#
# The floor is 2, not 1. This unit consumes a queue, the event-source mapping's
# `maximum_concurrency` is set from this field, and AWS's minimum for that field
# is 2 — anything below 2 fails `terraform plan` rather than merely throttling.
# 5 leaves the mapping room to deliver a burst without becoming the throttle
# itself while halving the duplicate fan-out. `tests/resource_envelope.rs` pins
# it strictly below `finance-settlement-worker`, the lane that produces the
# receipts this one replays.
#
# 512 MiB is the family floor for a Data-API-bound worker: the resident set is at
# most 30 `PendingReceipt` rows (3 categories x a page of 10), page-capped at
# 768 KiB by the transport. 60 s must stay at or below the 60 s schedule tick so
# a slow drain never overlaps its successor, and the in-process
# `DEADLINE_SAFETY_MARGIN` already converts a long drain into an honest truncated
# report instead of a kill.
[unit.lambda]
memory_mb = 512
timeout_s = 60
reserved_concurrency = 5

[[unit]]
id = "provider-cost-reconciler"
kind = "rust-lambda"
plane = "central"
package = "provider-cost-reconciler"
bin = "provider-cost-reconciler"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release-lambda"
form = "zip"
entrypoint = "bootstrap"
config_env_namespace = "AEX_PROVIDER_COST_"
config_schema_version = 1
required_receipts = ["unit", "lint", "package-integrity"]
alarm_spec = "provider-cost-reconciler"
live_suite = "aex-live-provider-cost-reconciler"

# Daily schedule, one task at a time. Derived from the CUR export scan's own
# arithmetic, not from a peer.
#
# THIS SHAPE IS ONLY CORRECT AGAINST A 16 MiB SCAN BUDGET.
# `AEX_PROVIDER_COST_MAX_SCAN_BYTES` is bound to 16,777,216 in both plane
# bindings and the two numbers move together. The reason is the insert loop: the
# parsed rows are written one Data API round-trip at a time, serially, each its
# own implicit transaction, so at ~10 ms per round-trip a 900 s timeout buys
# ~90,000 rows — about 11.7 MiB of export at the fixture's ~130-byte lines.
# 16 MiB is the first round number safely above that.
#
# The budget was 512 MiB until 2026-08-10, which was wrong by 32x in the
# dangerous direction: the object is read wholesale into memory twice (the raw
# body is still live when the `String` copy exists), so a maximum-budget export
# peaked at ~1 GiB of raw body plus parsed rows against this 2048 MiB allocation
# and would have OOMed — while the timeout could never have reached more than
# ~2% of it. At 16 MiB peak resident is ~58 MiB inside 2048 MiB, a 35x margin,
# which is what makes the OOM impossible rather than merely unlikely.
#
# Memory stays 2048 (~1.2 vCPU) for the parse and the JSON rendering of the
# insert statements; it was never the payload bound. Raising it to cover 512 MiB
# instead would provision for rows the timeout can never insert, which is exactly
# how the mismatch arose. Timeout 900 s is the Lambda ceiling, so there is
# nowhere left to grow: if the export outgrows 16 MiB the answer is batching the
# insert loop and re-deriving this row, not a bigger timeout.
#
# Reserved concurrency 1 makes a duplicate schedule a no-op rather than a second
# scan, and `tests/resource_envelope.rs` pins it to exactly 1. Legal only because
# this unit consumes no queue: AWS's minimum event-source `maximum_concurrency`
# is 2 and that field is set from this one, so giving this unit a queue would
# fail `terraform plan` rather than merely throttle it.
[unit.lambda]
memory_mb = 2048
timeout_s = 900
reserved_concurrency = 1

