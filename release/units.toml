# One concurrent invocation per duty shard. 512 MiB holds one bounded due-scan
# page and its staged-page replay; the 300 s timeout is the EventBridge minute
# schedule with room for a full page of retries, and the reservation keeps a
# stuck duty from consuming the account's whole concurrency pool.
[unit.lambda]
memory_mb = 512
timeout_s = 300
reserved_concurrency = 8

