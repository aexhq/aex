config_schema_version = 1
required_receipts = ["unit", "property", "lint", "package-integrity"]
alarm_spec = "usage-storage-worker"
live_suite = "aex-live-usage-storage-worker"

# Shared with `usage-compute-worker` and `usage-transfer-worker`: the three carry
# one shape because they run one code path over three meters. The shape is not
# read off a peer, because the load profile is bimodal and one number has to
# serve both halves.
#
#   Ingress / Receipt / Stream — at most 10 records held, per-record work.
#   Sweep                      — up to 3,200 rows: 16 outbox shards x a 200-row
#                                page, then 3,200 sequential `SendMessage`.
#
# 1024 MiB is paid for by the sweep, which is the only mode that holds a large
# resident set; the three small modes would be happy at 512, and one function
# serves all four, so the larger mode sets the number. 300 s is the right order
# for 3,200 sequential sends (~48 s at 15 ms each, ~288 s at 90 ms).
#
# Reserved concurrency 10 is correct FOR THE INGRESS MODE, where admission is a
# per-record conditional write and parallelism is real, and it is also the
# ingress mapping's `maximum_concurrency`. It is wrong for the sweep, which wants
# exactly one runner — two concurrent sweeps read the same 16 partitions and
# republish the same rows. Since one function serves both, the sweep's
# singleton-ness comes from its schedule firing once, NOT from this number. Do
# not "fix" the 10 to protect the sweep; it would starve ingress and still not
# make the sweep a singleton.
#
# KNOWN DEFECT: the sweep never consults the Lambda deadline, unlike
# `usage-receipt-dispatcher` and its `DEADLINE_SAFETY_MARGIN`. A long sweep is
# killed mid-shard and the later shards are silently never swept. Port the
# margin pattern into the shared worker. Owned by observations-usage.
[unit.lambda]
memory_mb = 1024
timeout_s = 300
reserved_concurrency = 10

