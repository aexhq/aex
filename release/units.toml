alarm_spec = "finance-ingest"
live_suite = "aex-live-finance-ingest"

# Its own reservation, deliberately. A settlement backlog must never make Stripe
# redelivery the customer's problem (F-29). 10 s is one serializable inbox
# transaction; the edge returns 2xx only after it commits.
[unit.lambda]
memory_mb = 512
timeout_s = 10
reserved_concurrency = 20

# --- central plane: the two TypeScript edges ---------------------------------
#
# `P-AUTH-EDGE` keeps these two in TypeScript: they speak the official pinned
# Stripe protocol and nothing else, so the vendor's own client is the smaller
# risk. Their `package` is an npm member, which is why `GraphInputs::package_node`
# resolves a unit's owning package through both namespaces.

[[unit]]
id = "stripe-command-edge"
kind = "ts-lambda"
plane = "central"
package = "@aexhq/stripe-command-edge"
# A bundle is compiled for no triple. `none` is the honest recorded target; the
# arm64 the function is created with is Terraform's decision, not the bytes'.
target = "none"
profile = "release"
form = "zip"
entrypoint = "handler.js"
config_env_namespace = "AEX_STRIPE_COMMAND_"
config_schema_version = 1
required_receipts = ["unit", "contract", "lint", "sbom", "license", "vulnerability", "package-integrity"]
alarm_spec = "stripe-command-edge"
live_suite = "aex-live-stripe-command-edge"

# It executes one already-admitted effect identity with the idempotency key
# `finance-api` prepared, so the work is one outbound Stripe call. 512 MiB is
# the family floor and the 30 s timeout is `finance-api`'s own request deadline:
# an edge that outlived its caller would turn a resolved outcome into an unknown
# one for `finance-reconcile` to chase. The reservation matches `finance-ingest`
# because the two ends of the same money path should saturate together.
[unit.lambda]
memory_mb = 512
timeout_s = 30
reserved_concurrency = 20

[[unit]]
id = "stripe-webhook-edge"
kind = "ts-lambda"
plane = "central"
package = "@aexhq/stripe-webhook-edge"
target = "none"
profile = "release"
form = "zip"
entrypoint = "handler.js"
config_env_namespace = "AEX_STRIPE_WEBHOOK_"
config_schema_version = 1
required_receipts = ["unit", "contract", "lint", "sbom", "license", "vulnerability", "package-integrity"]
alarm_spec = "stripe-webhook-edge"
live_suite = "aex-live-stripe-webhook-edge"

# The public edge: verify a raw signature, normalize, hand off durably to
# `finance-ingest`, return 2xx. 512 MiB holds one webhook body, and the 30 s
# timeout is well inside Stripe's own delivery deadline, so a slow handoff
# becomes a redelivery rather than a duplicate. The reservation is the largest
# in the family because this is the only unit here whose arrival rate is set by
# somebody else, and a throttled webhook is a webhook Stripe retries.
[unit.lambda]
memory_mb = 512
timeout_s = 30
reserved_concurrency = 40

