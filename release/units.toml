# The one long-lived multi-socket process besides the mux. The 30 s stop
# timeout is the drain deadline the accepted design pins; the CPU, memory and
# port values below are the module defaults a root may raise, not a guess at
# capacity.
[unit.fargate]
cpu = 1024
memory_mb = 2048
desired_count = 2
stop_timeout_s = 30
port = 8080

