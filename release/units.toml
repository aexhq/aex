# --- public plane: published packages -----------------------------------------

[[unit]]
id = "sdk"
kind = "npm-package"
plane = "public"
# The published name. A unit id matches `^[a-z][a-z0-9-]{2,63}$` and can never
# be a scoped npm name, so this field is the only place the mapping exists, and
# `graph verify` requires it to be a publishable npm workspace member living in
# `packages/<id>` — the directory the recipe packs.
package = "@aexhq/sdk"
# A published bundle is compiled for no triple, exactly as the two TypeScript
# edges are: the package runs on whatever Node or Bun installed it.
target = "none"
profile = "release"
form = "npm-tarball"
# The client options shape, not a deployment environment: the package reads no
# process environment at all, which is why no `config_env_namespace` is
# declared.
config_schema_version = 1
required_receipts = ["unit", "contract", "lint", "package-integrity"]
