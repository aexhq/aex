config_env_namespace = "AEX_STRIPE_WEBHOOK_"
config_schema_version = 1
required_receipts = ["unit", "contract", "lint", "package-integrity"]
alarm_spec = "stripe-webhook-edge"
live_suite = "aex-live-stripe-webhook-edge"

# The public edge: verify a raw signature, normalize, hand off durably to
# `finance-ingest`, return 2xx. 512 MiB holds one webhook body, and the 30 s
# timeout is well inside Stripe's own delivery deadline, so a slow handoff
# becomes a redelivery rather than a duplicate. The reservation is the largest
# in the family because this is the only unit here whose arrival rate is set by
# somebody else, and a throttled webhook is a webhook Stripe retries.
[unit.lambda]
memory_mb = 512
timeout_s = 30
reserved_concurrency = 40

