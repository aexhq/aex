# Session-centered MVP release registry.
#
# This is deliberately the complete product graph, not a compatibility graph.
# Ten rows are placed compute. The guest agent, its single general-purpose
# image, the dashboard build output, and the published SDK are artifacts but do
# not add a separately scheduled control-plane service.

schema = "aex.units.v1"

[[unit]]
id = "control-api"
kind = "rust-oci-service"
plane = "central"
package = "central-api"
bin = "central-api"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release"
form = "oci-image"
base_image = "public.ecr.aws/amazonlinux/amazonlinux:2023-minimal@sha256:f536dd770d9f7065461c786418265a13f5ba548a11a57bbbf360e677b811ed39"
config_env_namespace = "AEX_CENTRAL_API_"
config_schema_version = 1
health_path = "/internal/healthz"
ready_path = "/internal/readyz"
required_receipts = ["unit", "contract", "property", "lint", "package-integrity"]
alarm_spec = "control-api"
live_suite = "aex-live-control-api"

[unit.fargate]
cpu = 1024
memory_mb = 2048
desired_count = 2
stop_timeout_s = 30
port = 8080

[[unit]]
id = "control-projection-worker"
kind = "rust-lambda"
plane = "central"
package = "central-control-worker"
bin = "central-control-worker"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release-lambda"
form = "zip"
entrypoint = "bootstrap"
config_env_namespace = "AEX_CENTRAL_CONTROL_WORKER_"
config_schema_version = 1
required_receipts = ["unit", "lint", "package-integrity"]
alarm_spec = "control-projection-worker"
live_suite = "aex-live-control-projection-worker"

[unit.lambda]
memory_mb = 512
timeout_s = 120
reserved_concurrency = 10

