# The deployable registry.
#
# One row per deployable. `graph verify` reads it, builds the `artifact:` nodes
# and their input-closure edges from it, and rejects a row that omits its
# resource shape or names a package, live companion or scenario that does not
# exist.
#
# WHAT IS DELIBERATELY MISSING
#
# Twenty-five rows carry no `[unit.lambda]` or `[unit.fargate]` block, so
# `graph verify` reports `unit-resource-shape-missing` for each of them. That
# is the intended state, not an oversight: the accepted design declares
# isolation requirements for these deployables but no memory, timeout,
# reserved-concurrency or task-shape values, and inventing them here would
# turn a missing decision into a shipped one. Each owning stream fills its own
# rows; the two shapes below are the only ones the accepted design pins
# (`brain-mux` stop timeout 120 s and desired count 1, `regional-stream` stop
# timeout 30 s).
#
# `dashboard`, `site`, `aex-cli`, `@aexhq/sdk`, the two Stripe TypeScript edges,
# the model and tool catalogues and the three generated bundles are also
# artifacts, and are absent here because their packages are not workspace
# members yet. Adding a member is an architecture decision this stream does not
# own.

schema = "aex.units.v1"

