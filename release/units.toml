# One five-minute EventBridge sweep. There is no hourly deep sweep: this comment
# claimed one until 2026-08-10, and a grep of both composition roots' schedules
# finds exactly one `finance-reconcile` entry.
#
# Reserved concurrency 2 by plan: the sweeps report and fence, and a reconciler
# that can outscale the authority it repairs is a second incident. 2 is not
# slack — the timeout equals the schedule interval on purpose, so a sweep that
# runs to its deadline is still running when its successor fires, and 2 is
# exactly that overlap. It must not be raised: the keyset cursor is a single
# global row with no lease, owner or expiry, so a third concurrent sweep re-reads
# the identical page and loses every revision fence. Concurrency here is
# duplicate work, not throughput. `tests/resource_envelope.rs` also pins it
# strictly below `finance-api`, `finance-ingest` and `finance-settlement-worker`.
#
# 1024 MiB is not sized to payload and should not be: the Data API budget caps a
# page at ~768 KiB and two 500-row pages at ~1.5 MiB whatever the ledger grows
# to. It buys the vCPU share for up to a thousand sequential round-trips.
#
# KNOWN DEFECT, not fixable by any number here: the sweep loop awaits up to 500
# serial `RequestResponse` invokes of an edge whose own timeout is 30 s, with no
# per-call budget derived from the remaining Lambda deadline. `page_limit` bounds
# the result set, not the work, so the sweep blows this timeout at a few hundred
# unresolved effects. The fix is the `DEADLINE_SAFETY_MARGIN` pattern
# `usage-receipt-dispatcher` already uses. Owned by central-finance.
[unit.lambda]
memory_mb = 1024
timeout_s = 300
reserved_concurrency = 2

