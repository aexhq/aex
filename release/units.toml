# Low concurrency by design: the launcher holds no observation read permission
# at all, so its only work is a due-scan, a conditional claim and one `RunTask`.
# 60 s covers `RunTask` plus the `ListTasks` identity reconciliation an unknown
# launch outcome needs.
[unit.lambda]
memory_mb = 512
timeout_s = 60
reserved_concurrency = 4

