alarm_spec = "finance-api"
live_suite = "aex-live-finance-api"

# Request-scaled and scale-to-zero. 512 MiB is the Data API client plus one
# bounded page; 15 s covers a serializable transaction plus one synchronous
# command-edge invoke. The reservation is capped below the ingest lane so a read
# burst can never starve Stripe redelivery (F-29).
[unit.lambda]
memory_mb = 512
timeout_s = 15
reserved_concurrency = 40

[[unit]]
id = "finance-ingest"
kind = "rust-lambda"
plane = "central"
package = "finance-ingest"
bin = "finance-ingest"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release-lambda"
form = "zip"
entrypoint = "bootstrap"
config_env_namespace = "AEX_FINANCE_INGEST_"
