# The deployable registry.
#
# One row per deployable. `graph verify` reads it, builds the `artifact:` nodes
# and their input-closure edges from it, and rejects a row that omits its
# resource shape or names a package, live companion or scenario that does not
# exist.
#
# RESOURCE SHAPES
#
# Every row that runs on Lambda or Fargate now carries its shape. Two of them
# the accepted design pins outright (`brain-mux` stop timeout 120 s and a
# production floor of two tasks, `session-stream-api` stop timeout 30 s); the rest
# are derived from the shape a peer doing the same kind of work already carries,
# and each says which peer and why in the comment above it. The reserved
# concurrencies sum to 488 in the central plane
# (50 + 200 + 50 + 40 + 40 + 20 + 40 + 10 + 30 + 2 + 5 + 1)
# and 242 in the regional plane
# (40 + 40 + 20 + 5 + 5 + 50 + 20 + 20 + 8 + 4 + 10 + 10 + 10),
# so one plane reserves 730. Every addend is a row below; no row reserves
# concurrency that is not counted here, and the standing policy is to add none.
# The regional total is lower than it once was because `regional-session-api`
# moved off Lambda onto Fargate and gave its 200 back to the unreserved pool.
#
# BOTH PLANES SHARE ONE ACCOUNT, so the figure that has to fit is 1,460, not
# 730. An account on the default 1,000 limit may reserve only 900, which two
# planes exceed; the pending increase to ~3,000 (2,900 reservable, because AWS
# holds 100 back unreserved) is therefore a deploy precondition, not a
# nice-to-have. 1,460 is 50% of 2,900.
#
# One caveat on 730: it counts *rows*. `lambda_units` in Terraform is keyed by
# function instance, and a mode-fanned row produces several functions that each
# take this row's `reserved_concurrency`. The deployed per-plane sum is
# therefore >= 730 and nobody has computed it — `content-lifecycle-worker`
# alone fans to four modes today. Compute the function-level sum before filing
# the limit increase.
#
# WHAT IS DELIBERATELY MISSING
#
# This registry models release artifacts, not only hosted deployment units, so
# an artifact with no row is absent by decision. Each decision is named here so
# that absence stays a choice somebody made rather than a gap nobody noticed.
#
# MODELLED. `@aexhq/sdk` carries the `sdk` row below: it is published to a
# package registry and runs on nobody's plane, and the row is what gives its
# tarball the immutable release identity a consumer pins.
#
# DESCOPED. Three artifacts have no row, each for its own reason:
#
#   * `site` — descoped for launch. The marketing site carries no API surface
#     and no compatibility contract, so an immutable release identity for it
#     would gate launch on something no consumer pins.
#   * `aex-cli` — descoped for launch. It is not published in the launch scope,
#     so there is no distribution boundary for a release identity to protect.
#   * `@aexhq/wire` — descoped and marked `private`. `aex-contract-gen` emits the
#     SDK's route table and error vocabulary into `packages/sdk/src/generated/`
#     rather than as an import, so nothing installs this package and it reaches
#     no registry; its manifest declares no `npm.registry.publish` seam, and a
#     row here would assert a distribution boundary that does not exist.
#
# Re-scoping any of the three means adding its row here — and, for `wire`,
# dropping `private` from its manifest first — not relaxing this comment. The
# model and tool catalogues and the three generated bundles remain carried by
# the hosted units that embed them.
#
# The two Stripe TypeScript edges *are* hosted workspace packages —
# `services/stripe-{command,webhook}-edge`, named explicitly by
# `aex_workspace_check::collect::NPM_EXPLICIT` rather than by a `workspaces`
# glob — so they carry rows here and the graph resolves their `package` to an
# npm node.
#
# PUBLISHED PACKAGES
#
# A row whose `kind` is `npm-package` publishes to a registry rather than to a
# plane, so it declares no resource shape, no alarm specification, no
# configuration environment and no live companion: there is no running resource
# for any of those to describe. `graph verify` enforces that exemption in both
# directions — such a row must carry none of them, and its owning npm member
# must already record why it has no live suite.

schema = "aex.units.v1"

# --- central plane: request APIs ---------------------------------------------

# `central-identity-api`, `central-control-api` and `finance-api` merged here.
# All three were request-path central edges behind one API Gateway, sharing one
# route table, one generated dispatcher and one Aurora cluster; the merge removes
# three process boundaries between code that already agreed.
#
# The three rows below are **not** retired by this row. They are the alternative
# composition, and a plane runs one or the other: `aex_central_http::config`
# states that relationship as `CentralServiceId::CentralApi.supersedes()` rather
# than as prose, and its suite proves the merged route set is exactly the union
# of theirs. Retiring them is a separate step, taken once a plane has actually
# served from this row.
#
# `required_receipts` is the union of the three rows it replaces: two owed
# `contract` and `finance-api` also owed `property`, and merging the deployables
# must not quietly retire either.
#
# The move off API Gateway removes the only component that ever *verified* a
# central credential, so this deployable does it in process — see
# `crates/aex-central-http/src/admission.rs`. It reaches Aurora through the one
# cluster login the three rows it replaces already use; per-schema PostgreSQL
# roles are a deferred capability recorded in `references/backlog.md`.
[[unit]]
id = "central-api"
kind = "rust-oci-service"
plane = "central"
package = "central-api"
bin = "central-api"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release"
form = "oci-image"
base_image = "public.ecr.aws/amazonlinux/amazonlinux:2023-minimal@sha256:f536dd770d9f7065461c786418265a13f5ba548a11a57bbbf360e677b811ed39"
config_env_namespace = "AEX_CENTRAL_API_"
config_schema_version = 1
health_path = "/internal/healthz"
ready_path = "/internal/readyz"
required_receipts = [
    "unit",
    "contract",
    "property",
    "lint",
    "package-integrity",
]
alarm_spec = "central-api"
live_suite = "aex-live-central-api"

# Sized from `session-stream-api`, the peer of the same class: a long-lived
# request-path task whose work is per-request rather than per-task. What this
# task must hold is the Data API client set, the JSON codec and the route table,
# which is what 1024/2048 already covered there.
#
# The 30 s stop timeout is the drain deadline, and the relationship is a start-up
# refusal rather than a comment: this process reads its admitted
# `AEX_CENTRAL_API_DRAIN_DEADLINE_MS` ceiling from
# `aex_regional_http::drain`, which derives it from this exact number. Raising
# this value without raising that constant makes the deadline unreachable and the
# task is killed mid-transaction instead of exiting on its own terms.
#
# `desired_count` is the production floor: two tasks. Unlike the three Lambda
# rows it replaces, this deployable does not scale to zero, and a single task is
# a single point of failure in front of the whole central plane.
[unit.fargate]
cpu = 1024
memory_mb = 2048
desired_count = 2
stop_timeout_s = 30
port = 8080

