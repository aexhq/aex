alarm_spec = "observation-export-task"
live_suite = "aex-live-observation-export-task"


# One-shot Fargate task, one export. 4 GiB against a 512 MiB working budget
# leaves the reservation model (page buffer, encoder scratch, one 16 MiB
# multipart part, one 64 MiB row group) provably inside the task, so a multi-GB
# export has a flat memory profile. `desired_count = 0` because nothing is
# long-lived: the launcher starts exactly one task per admitted export. The
# 120 s stop timeout is the multipart abort plus checkpoint flush.
[unit.fargate]
cpu = 2048
memory_mb = 4096
desired_count = 0
stop_timeout_s = 120
port = 0

