# The deployable registry.
#
# One row per deployable. `graph verify` reads it, builds the `artifact:` nodes
# and their input-closure edges from it, and rejects a row that omits its
# resource shape or names a package, live companion or scenario that does not
# exist.
#
# RESOURCE SHAPES
#
# Every row that runs on Lambda or Fargate now carries its shape. Two of them
# the accepted design pins outright (`brain-mux` stop timeout 120 s and desired
# count 1, `regional-stream` stop timeout 30 s); the rest are derived from the
# shape a peer doing the same kind of work already carries, and each says which
# peer and why in the comment above it. The reserved concurrencies sum to 477 in
# the central plane (50 + 200 + 50 + 50 + 20 + 20 + 40 + 10 + 20 + 5 + 10 + 2)
# and 432 in the regional plane (200 + 40 + 40 + 20 + 50 + 20 + 20 + 8 + 4 + 10 +
# 10 + 10), both inside the 900 an account with the default 1000-concurrency
# limit may reserve. Regional capacity adds five to the regional total, making
# it 437; it is isolated from the request-edge reservations below.
#
# WHAT IS DELIBERATELY MISSING
#
# `dashboard`, `site`, `aex-cli`, `@aexhq/sdk`, the model and tool catalogues and
# the three generated bundles are also release artifacts, but this registry
# models hosted deployment units rather than every customer-facing artifact.
# The dashboard, site, SDK and CLI are already workspace members. Their
# immutable publication or archive identities, plus any catalogue or bundle
# identity not carried by a hosted unit, must be represented by the release
# artifact graph before release; absence here is not evidence that they do not
# exist. The two Stripe TypeScript edges *are* hosted workspace packages —
# `services/stripe-{command,webhook}-edge`, named explicitly by
# `aex_workspace_check::collect::NPM_EXPLICIT` rather than by a `workspaces`
# glob — so they carry rows here and the graph resolves their `package` to an
# npm node.

schema = "aex.units.v1"

# --- central plane: request APIs ---------------------------------------------

[[unit]]
id = "central-identity-api"
kind = "rust-lambda"
plane = "central"
package = "central-identity-api"
bin = "central-identity-api"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release-lambda"
form = "zip"
entrypoint = "bootstrap"
config_env_namespace = "AEX_CENTRAL_IDENTITY_"
config_schema_version = 1
health_path = "/internal/healthz"
ready_path = "/internal/readyz"
required_receipts = ["unit", "contract", "lint", "deny", "sbom", "license", "vulnerability", "package-integrity"]
alarm_spec = "central-identity-api"
live_suite = "aex-live-central-identity-api"

# Request-scaled and scale-to-zero. 512 MiB is the smallest allocation that
# still gives the Ed25519 and HMAC work a whole vCPU share; the 15 s timeout is
# the request deadline plus one Data API statement deadline, so a hung ceremony
# is killed by Lambda rather than by a client. The reservation is separate from
# `central-authz` on purpose: a sign-in flood must never starve the assertion
# path, which every regional request depends on.
[unit.lambda]
memory_mb = 512
timeout_s = 15
reserved_concurrency = 50

[[unit]]
id = "central-authz"
kind = "rust-lambda"
plane = "central"
package = "central-authz"
bin = "central-authz"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release-lambda"
form = "zip"
entrypoint = "bootstrap"
config_env_namespace = "AEX_CENTRAL_AUTHZ_"
config_schema_version = 1
required_receipts = ["unit", "contract", "property", "lint", "deny", "sbom", "license", "vulnerability", "package-integrity"]
alarm_spec = "central-authz"
live_suite = "aex-live-central-authz"

# The hottest path in the platform: every regional request that lacks a fresh
# assertion lands here. 1024 MiB buys a full vCPU, which keeps the local
# signature under a millisecond, and the 5 s timeout is one Data API statement
# deadline — an assertion issue that needs longer is a failure, not a slow
# success. The reservation covers the Area-10 refresh table's synchronized
# burst (500 independent credentials) with headroom, and it is reserved rather
# than shared so a control-plane incident cannot take authorization with it.
[unit.lambda]
memory_mb = 1024
timeout_s = 5
reserved_concurrency = 200

