# Derived from `stripe-webhook-edge`, its only caller, because the pairing is
# strictly 1:1: every admitted webhook makes exactly one synchronous
# `RequestResponse` invoke here. Its own reservation, deliberately — a settlement
# backlog must never make Stripe redelivery the customer's problem (F-29).
#
# The reservation MATCHES the caller's 40 and must not drift below it. At 20
# behind a caller at 40, invocations 21-40 are throttled; a throttle on a
# `RequestResponse` invoke is an immediate error, the edge returns 500, and
# Stripe redelivers — the reservation that exists to prevent redelivery was
# causing it. Matching exactly makes the pair saturate together.
#
# 512 MiB is the family floor, bought for the vCPU share the serializable
# transaction's retry window wants and not for payload headroom: the resident
# set is one ~2 KiB normalized envelope and at most three postings. 10 s is one
# 6 s inbox transaction plus runtime and flush margin, well inside the caller's
# 30 s deadline. A wrong `provider_api_version` takes an early return into
# quarantine, so at most one 6 s transaction runs per invocation — the
# quarantine-then-apply path that would need 12 s does not exist.
[unit.lambda]
memory_mb = 512
timeout_s = 10
reserved_concurrency = 40

# --- central plane: the two TypeScript edges ---------------------------------
#
# `P-AUTH-EDGE` keeps these two in TypeScript: they speak the official pinned
# Stripe protocol and nothing else, so the vendor's own client is the smaller
# risk. Their `package` is an npm member, which is why `GraphInputs::package_node`
# resolves a unit's owning package through both namespaces.

[[unit]]
id = "stripe-command-edge"
kind = "ts-lambda"
plane = "central"
package = "@aexhq/stripe-command-edge"
