# **Dedicated memory and reserved concurrency**, which is the mechanism O-ROLES
# exists to provide: the whole-region decode footprint is
# `reserved_concurrency x AEX_OTLP_DECODED_MAX` = 20 x 16 MiB = 320 MiB, so
# decompression can never starve query, export or sockets. 3,008 MiB gives the
# 55 % decode budget room for one 16 MiB payload plus its normalized form; the
# 30 s timeout is the staged-commit protocol's worst case (two transactions plus
# 80 materialization writes) with margin.
[unit.lambda]
memory_mb = 3008
timeout_s = 30
reserved_concurrency = 20

