alarm_spec = "central-schema-admin"
live_suite = "aex-live-central-schema-admin"

# A one-shot task the release engine runs once per release, so `desired_count`
# is 0: nothing is long-lived, and `infra/modules/ecs-task-oneshot` registers a
# task definition with no service behind it. `desired_count = 0` and `port = 0`
# are not choices — `graph verify` rejects anything else for `rust-oci-task`.
#
# `regional-secret-key-admin`'s 512/1024 is the right size, and re-deriving from
# this unit's own work agrees. Unlike every other central unit this one opens a
# direct PostgreSQL wire connection rather than using the Data API, and the whole
# working set is the migration bundle EMBEDDED IN THE BINARY at compile time
# (measured: 14 files, 70,006 bytes; largest single file 15,888 bytes), one
# connection with its TLS stack, and one statement's result — the expensive
# subcommand returns single scalars, roughly a thousand sequential trivially
# cheap round-trips with no parallelism anywhere. 1024 MiB is ~14,000x the
# bundle. 512 cpu is 0.5 vCPU and buys the TLS handshake and statement rendering;
# nothing on the critical path is CPU-bound, so raising it would shorten nothing.
#
# The stop timeout is the family's longest, because the one thing that must never
# be killed mid-flight is a migration inside its transaction. 120 is also the
# module's hard ceiling and is externally pinned: the release launcher fails the
# run if the registered task definition's container stop timeout is not 120.
#
# KNOWN BOUND MISMATCH: the launcher runs `migrate` with a 900,000 ms statement
# timeout against this 120 s stop timeout, which cannot be raised. A statement
# running at its full declared budget is SIGKILLed ~13 minutes before it could
# finish. Either the statement timeout comes down to something a 120 s drain can
# protect, or the launcher is honest that a long migration is not drain-protected.
# Owned by the central-finance / schema stream.
[unit.fargate]
cpu = 512
memory_mb = 1024
desired_count = 0
stop_timeout_s = 120
port = 0

# --- regional plane: request APIs ---------------------------------------------

# `regional-session-api` and `regional-stream` merged here. Both were long-lived
# regional request-path edges on the same plane with the same task shape, the
# same stop timeout, the same `central-authz` dependency and the same authority
# tables, and each carried a production floor of two tasks. One deployable makes
# that floor two tasks instead of four.
#
# The merge is a deployment change and not a contract change: `RouteOwner::SessionApi`
# and `RouteOwner::Stream` both survive, the generated `servingArtifact` strings
# are untouched, and the two route sets are mounted separately and joined with
# `Router::merge` over URL prefixes that were already disjoint. Splitting them
# back apart needs a new unit row and nothing else.
#
# `required_receipts` is the union of the two rows it replaces: the session half
# owed `conformance` and the stream half owed `property`, and merging the
# deployables must not quietly retire either.
[[unit]]
id = "session-stream-api"
kind = "rust-oci-service"
plane = "regional"
package = "session-stream-api"
bin = "session-stream-api"
target = "aarch64-unknown-linux-gnu.2.34"
profile = "release"
form = "oci-image"
base_image = "public.ecr.aws/amazonlinux/amazonlinux:2023-minimal@sha256:f536dd770d9f7065461c786418265a13f5ba548a11a57bbbf360e677b811ed39"
config_env_namespace = "AEX_REGIONAL_SESSION_STREAM_"
config_schema_version = 1
health_path = "/internal/healthz"
ready_path = "/internal/readyz"
required_receipts = [
    "unit",
    "contract",
    "conformance",
    "property",
    "lint",
    "package-integrity",
]
alarm_spec = "session-stream-api"
live_suite = "aex-live-session-stream-api"

# The one long-lived multi-socket process besides the mux, now also carrying the
# finite API. The 61 generated unary routes and the one DynamoDB transaction per
# mutation are per-request work rather than per-task work, so what the task must
# hold is the transaction compiler, the JSON codec and the socket buffers — which
# is what this 1024/2048 shape already covered for the stream alone.
#
# The 30 s stop timeout is the drain deadline, and that relationship is now a
# start-up refusal rather than a comment: `aex_regional_http::drain` derives the
# admitted `AEX_DRAIN_DEADLINE_MS` ceiling from this number, so a deadline that
# could never fire before SIGKILL refuses the process instead of being silently
# truncated. Raising this value without raising that constant is a build failure.
[unit.fargate]
cpu = 1024
memory_mb = 2048
desired_count = 2
stop_timeout_s = 30
port = 8080

