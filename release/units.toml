alarm_spec = "central-control-api"
live_suite = "aex-live-central-control-api"

# Request-scaled and scale-to-zero. The 30 s timeout is the one place a central
# request legitimately waits on a cross-region effect: T1, the regional
# provision call and T2 in sequence. Its own reservation keeps a burst of
# workspace creations away from the authorization budget.
[unit.lambda]
memory_mb = 512
timeout_s = 30
reserved_concurrency = 50

