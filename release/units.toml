form = "zip"
entrypoint = "handler.js"
config_env_namespace = "AEX_STRIPE_COMMAND_"
config_schema_version = 1
required_receipts = ["unit", "contract", "lint", "package-integrity"]
alarm_spec = "stripe-command-edge"
live_suite = "aex-live-stripe-command-edge"

# It executes one already-admitted effect identity with the idempotency key
# `finance-api` prepared, so the work is one outbound Stripe call. 512 MiB is
# the family floor and the 30 s timeout is `finance-api`'s own request deadline:
# an edge that outlived its caller would turn a resolved outcome into an unknown
# one for `finance-reconcile` to chase.
#
# The reservation stays 20 even though its caller `finance-api` reserves 40, and
# the asymmetry is deliberate rather than an oversight. Unlike the
# `stripe-webhook-edge` -> `finance-ingest` pair, this one is not 1:1: only the
# top-up and portal routes reach the command edge, so the caller's reservation is
# not a lower bound on the callee's.
[unit.lambda]
memory_mb = 512
timeout_s = 30
reserved_concurrency = 20

[[unit]]
id = "stripe-webhook-edge"
kind = "ts-lambda"
plane = "central"
package = "@aexhq/stripe-webhook-edge"
target = "none"
profile = "release"
form = "zip"
entrypoint = "handler.js"
config_env_namespace = "AEX_STRIPE_WEBHOOK_"
