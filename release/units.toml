# FIFO backlog-scaled, one message group per organization, so SQS serializes one
# account and parallelises across accounts.
#
# 90 s is derived from the retry budget rather than from a peer, and the previous
# 60 s was a correctness defect: one initial attempt plus three serialization
# retries, each with the deployed 20 s transaction deadline, is 80 s of statement
# budget. Against a 60 s function timeout a group that used its full retry budget
# was killed by Lambda before the last retry could commit, and because failures
# are reported per group the whole group was redelivered — the retry budget that
# exists to absorb serialization conflicts instead guaranteed a redelivery under
# exactly the contention it was built for. 90 s covers 4 x 20 s plus 10 s of
# runtime margin, and the 1800 s queue visibility timeout stays 20x the function
# timeout, so nothing is redelivered while it is still executing.
#
# 1024 MiB is not a payload bound — the worst-case batch is 10 records and the
# Data API caps a decoded result at 768 KiB — it buys roughly a full vCPU share
# for cold-start init and JSON decode. A later cost pass could take this row to
# 512 and lose nothing measurable on a round-trip-bound workload; recorded so
# that trade is visible rather than discovered.
#
# The reservation bounds concurrent Aurora writers rather than the queue, and it
# is also the event-source mapping's `maximum_concurrency` by construction, so
# the two cannot be set independently.
[unit.lambda]
memory_mb = 1024
timeout_s = 90
reserved_concurrency = 30

