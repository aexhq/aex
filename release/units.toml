# is an accelerator over that authority rather than a correctness condition.
# Development runs exactly one task; the plane-specific count belongs to the
# deployment root, and `infra/modules/ecs-service` validates it per plane, so a
# root that hands the production floor to a development plane is refused rather
# than deployed. The 120 s stop timeout is the drain deadline the design pins.
