# The only explicit edge file in the delivery graph.
#
# Every other edge is derived from a manifest that already declares it. These
# cannot be: a scenario exercises a deployable through its public surface
# without importing it, so no dependency edge exists to derive.
#
# A deployable observed by no scenario fails `graph verify`. "Nobody has said
# what this service is for" is a gap worth blocking on.
#
# --- provisioning in `prd` (OD-35 / OD-36) -----------------------------------
#
# A scenario with no `[scenario.prd]` block runs in `dev` and provisions nothing
# in production. That is the default and it covers everything whose value is
# coverage rather than "does production work": permutation and matrix breadth,
# fuzz, load, soak, provider conformance matrices, hostile workloads and the
# migration rehearsal.
#
# A `[scenario.prd]` block is a claim, checked mechanically by `graph verify`:
#
#   * `rule` must be one of `[prd_provisioning.rule]` in
#     `release/policy/test-profiles.toml`, and the four `exactly_one` rules
#     admit exactly one scenario each;
#   * every kind in `provisions` must be a `[janitor.resource]` row that the
#     janitor can reclaim from tags. A prd-eligible scenario that creates an
#     unreclaimable kind fails `scenario-prd-unreclaimable`;
#   * a kind with `requires_declared_with` drags its companions in. Declaring
#     `payment_customer` without `payment_instrument` and
#     `auto_recharge_policy` fails, because that omission is precisely how a
#     saved card and an enabled auto-recharge policy survived every money-path
#     run in production.

schema = "aex.scenario-ownership.v1"

# --- identity, authorization and control -------------------------------------

[[scenario]]
id = "SC-IDENTITY-ACCOUNT"
owner = "central-identity"
observes = ["artifact:central-identity-api"]

[scenario.prd]
rule = "deployable_write"
provisions = [
  "organization",
  "api_key",
]

[[scenario]]
id = "SC-AUTHZ-ASSERTION"
owner = "central-identity"
observes = ["artifact:central-authz"]

[[scenario]]
id = "SC-CONTROL-WORKSPACE"
owner = "central-identity"
observes = ["artifact:central-control-api", "artifact:central-control-worker"]

[scenario.prd]
rule = "deployable_write"
provisions = [
  "organization",
  "workspace",
  "api_key",
]

[[scenario]]
id = "SC-SCHEMA-MIGRATE"
owner = "central-finance"
observes = ["artifact:central-schema-admin"]

# --- money --------------------------------------------------------------------

[[scenario]]
id = "SC-FINANCE-INVOICE"
owner = "central-finance"
observes = ["artifact:finance-api", "artifact:finance-settlement-worker"]

[[scenario]]
id = "SC-FINANCE-PAYMENT"
owner = "central-finance"
observes = ["artifact:finance-ingest"]

[scenario.prd]
rule = "money_path"
provisions = [
  "organization",
  "workspace",
  "api_key",
  "payment_customer",
  "payment_instrument",
  "auto_recharge_policy",
]

[[scenario]]
id = "SC-FINANCE-RECONCILE"
owner = "central-finance"
observes = ["artifact:finance-reconcile", "artifact:provider-cost-reconciler"]

[[scenario]]
id = "SC-USAGE-SETTLE"
owner = "observations-usage"
observes = [
  "artifact:usage-receipt-dispatcher",
  "artifact:usage-storage-worker",
  "artifact:usage-compute-worker",
  "artifact:usage-transfer-worker",
]

# --- session lifecycle ---------------------------------------------------------

