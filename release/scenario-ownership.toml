# The only explicit edge file in the delivery graph.
#
# Every other edge is derived from a manifest that already declares it. These
# cannot be: a scenario exercises a deployable through its public surface
# without importing it, so no dependency edge exists to derive.
#
# A deployable observed by no scenario fails `graph verify`. Observation alone
# is not runnable evidence: each scenario must also declare `package` as a
# namespaced Cargo/npm graph node and `target` as an exact `aex.targets` key
# mapped to the `e2e` layer,
# and that package must claim the scenario in `aex.scenarios`. A scenario whose
# production composition is not runnable instead carries an exact non-empty
# `deferred` reason. Deferral is architecture debt, never evidence: it is shown
# in the graph summary and omitted from the runnable scenario matrix. An
# implicit gap, a partial package/target pair, or runnable+deferred conflict is
# still a graph failure.
#
# --- provisioning in `prd` (OD-35 / OD-36) -----------------------------------
#
# A scenario with no `[scenario.prd]` block runs in `dev` and provisions nothing
# in production. That is the default and it covers everything whose value is
# coverage rather than "does production work": permutation and matrix breadth,
# fuzz, load, soak, provider conformance matrices, hostile workloads and the
# migration rehearsal.
#
# A `[scenario.prd]` block is a claim, checked mechanically by `graph verify`:
#
#   * `rule` must be one of `[prd_provisioning.rule]` in
#     `release/policy/test-profiles.toml`, and the four `exactly_one` rules
#     admit exactly one scenario each;
#   * every kind in `provisions` must be a `[janitor.resource]` row that the
#     janitor can reclaim from tags. A prd-eligible scenario that creates an
#     unreclaimable kind fails `scenario-prd-unreclaimable`;
#   * a kind with `requires_declared_with` drags its companions in. Declaring
#     `payment_customer` without `payment_instrument` and
#     `auto_recharge_policy` fails, because that omission is precisely how a
#     saved card and an enabled auto-recharge policy survived every money-path
#     run in production.

schema = "aex.scenario-ownership.v1"

# --- identity, authorization and control -------------------------------------

[[scenario]]
id = "SC-IDENTITY-ACCOUNT"
owner = "central-identity"
# An engine-backed body exists and executes: `aex-scenarios`'s `identity_account`
# target drives the real ceremony — sign in, open a dashboard session, start a
# device authorization, approve it, redeem it — through `aex-identity-app`'s use
# cases and `AuroraIdentityStore` against the committed schema and privileges.
# Two things keep it deferred, and the second is a product defect rather than a
# missing plane.
deferred = "The engine-backed body runs on the integration lane but has no `e2e` target, which needs a plane. Redemption additionally cannot succeed against the committed schema: `CONSUME_DEVICE_AUTHORIZATION` sets `account_token_id` before `INSERT_ACCOUNT_TOKEN` inserts the row it references, and `identity.device_authorization.account_token_id` is a non-deferrable foreign key, so the only path to an account token raises SQLSTATE 23503."
# `central-api` is the merged composition that serves the device-flow routes
# once a plane runs it, so it observes the same scenario as the deployable it
# replaces. Naming both is not double ownership: exactly one of them is
# deployed, and dropping either would leave the one that *is* deployed
# unobserved.
observes = ["artifact:central-api", "artifact:central-identity-api"]

[scenario.prd]
rule = "deployable_write"
provisions = [
  "organization",
  "api_key",
]

[[scenario]]
id = "SC-AUTHZ-ASSERTION"
owner = "central-identity"
deferred = "No executable live target yet proves assertion issuance, verification, and revocation together."
observes = ["artifact:central-authz"]

[[scenario]]
id = "SC-CONTROL-WORKSPACE"
owner = "central-identity"
# An engine-backed body exists and executes: `aex-scenarios`'s
# `control_workspace` target runs the organization, workspace and API-key
# ceremonies through `aex-control-app`'s use cases and `AuroraControlStore`
# against the committed schema and privileges, then resolves the minted key
# through `AuroraAuthorizationReader` as `aex_authz` and verifies it. What it
# cannot reach is the regional half, which is where the remaining defect lives.
deferred = "The engine-backed body runs on the integration lane but has no `e2e` target, which needs a plane. Two of the five observed artifacts are regional and unreached: `capacity-limit-projection-write`, the only writer of `workspace_edge_limits`, still has no production caller, so a provisioned workspace has no edge-limits row and every regional request against it answers 401 unauthenticated."
observes = [
  "artifact:central-api",
  "artifact:central-control-api",
  "artifact:central-control-worker",
  "artifact:regional-capacity-controller",
  "artifact:regional-control",
]

[scenario.prd]
rule = "deployable_write"
provisions = [
  "organization",
  "workspace",
  "api_key",
]

[[scenario]]
id = "SC-SCHEMA-MIGRATE"
owner = "central-finance"
deferred = "The central schema administrator companion has no executable migration-rehearsal target yet."
observes = ["artifact:central-schema-admin"]

# --- money --------------------------------------------------------------------

[[scenario]]
id = "SC-FINANCE-INVOICE"
owner = "central-finance"
# Reclassified 2026-08-10 while writing the P7.1 bodies. This scenario was
# recorded as blocked by deployment alone — "zero route work, all 8 finance
# routes already served". It is not: nothing anywhere writes the table the
# scenario is about, so no plane would make it pass.
deferred = "No code writes `finance.statement`. The whole worktree issues two SELECTs against it, both in `services/finance-api/src/aurora.rs`; `finance-reconcile` holds the `SELECT,INSERT,UPDATE` grant and never uses it. `billing_statements_list` and `billing_statement_get` therefore cannot answer with an invoice that exists. Settlement is unfinished for a second reason: `finance-settlement-worker` returns `pending` because the rating authorities it needs are unimplemented."
observes = [
  "artifact:central-api",
  "artifact:finance-api",
  "artifact:finance-settlement-worker",
]

[[scenario]]
id = "SC-FINANCE-PAYMENT"
owner = "central-finance"
deferred = "The end-to-end Stripe command, webhook, and ingest path has no executable live target yet."
# Both ends of one payment: the webhook edge is where a Stripe event enters and
# `finance-ingest` is where it becomes a finance transition, and the command edge
# is where an admitted effect leaves. A scenario that watched only the middle
# would pass while either edge was broken.
observes = [
  "artifact:finance-ingest",
  "artifact:stripe-command-edge",
  "artifact:stripe-webhook-edge",
]

[scenario.prd]
rule = "money_path"
provisions = [
  "organization",
  "workspace",
  "api_key",
  "payment_customer",
  "payment_instrument",
  "auto_recharge_policy",
]

[[scenario]]
id = "SC-FINANCE-RECONCILE"
owner = "central-finance"
deferred = "The finance and provider-cost reconciliation pair has no executable live target yet."
observes = ["artifact:finance-reconcile", "artifact:provider-cost-reconciler"]

[[scenario]]
id = "SC-USAGE-SETTLE"
owner = "observations-usage"
deferred = "The receipt, storage, compute, transfer, and query settlement chain has no executable live target yet."
observes = [
  "artifact:usage-receipt-dispatcher",
  "artifact:usage-storage-worker",
  "artifact:usage-compute-worker",
  "artifact:usage-transfer-worker",
  "artifact:session-stream-api",
]

