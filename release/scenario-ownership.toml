observes = ["artifact:regional-session-api", "artifact:session-operation-worker"]

[scenario.prd]
rule = "session_lifecycle"
provisions = [
  "organization",
  "workspace",
  "api_key",
  "session",
  "operation",
  "ecs_task",
  "hands_generation",
  "dynamo_item",
]

[[scenario]]
id = "SC-SESSION-STREAM"
owner = "regional-services"
observes = ["artifact:regional-stream"]

[[scenario]]
id = "SC-SECRET-CUSTODY"
owner = "regional-stores"
observes = ["artifact:regional-secret-api", "artifact:regional-secret-key-admin"]

[scenario.prd]
rule = "secret_path"
provisions = [
  "organization",
  "workspace",
  "api_key",
  "secret_generation",
  "kms_key",
]

[[scenario]]
id = "SC-CONTENT-LIFECYCLE"
owner = "regional-stores"
observes = ["artifact:content-lifecycle-worker"]

[scenario.prd]
rule = "content_path"
provisions = [
  "organization",
  "workspace",
  "api_key",
  "s3_multipart",
  "s3_object",
  "dynamo_item",
]

[[scenario]]
id = "SC-RUNTIME-CONTROL"
owner = "hands"
observes = ["artifact:runtime-control-worker"]

# --- observation ----------------------------------------------------------------

[[scenario]]
id = "SC-OBSERVATION-ADMIT"
owner = "observations-usage"
