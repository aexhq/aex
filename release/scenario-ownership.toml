# Release scenarios give the seventeen launch journeys explicit ownership.
# Files use two scenarios because current-value CRUD and upload finalization
# have different public entry points. A deferred row records a real missing
# hosted proof and never earns a release receipt.

schema = "aex.scenario-ownership.v1"

[[scenario]]
id = "SC-IDENTITY-ACCOUNT"
owner = "clients"
deferred = "The dashboard companion does not yet drive Google sign-in, idempotent personal provisioning, and bootstrap through one deployed journey."
observes = ["artifact:dashboard", "artifact:control-api", "artifact:control-projection-worker"]

[[scenario]]
id = "SC-CONTROL-WORKSPACE"
owner = "clients"
deferred = "No release-bound target yet proves API-key create/revoke and a clean packed SDK/CLI consumer against the auto-provisioned personal workspace."
observes = ["artifact:control-api", "artifact:control-projection-worker", "artifact:sdk"]

[[scenario]]
id = "SC-BILLING-ESSENTIAL"
owner = "central-finance"
package = "npm:@aexhq/user-tests"
target = "live"
observes = ["artifact:control-api", "artifact:stripe-webhook-edge", "artifact:billing-worker", "artifact:brain-mux", "artifact:runtime-control-worker", "artifact:tool-mux"]

[[scenario]]
id = "SC-SESSION-ADMIT"
owner = "regional-services"
deferred = "No deployed target yet proves BYOK session creation, the root authority row, frozen mounts, eager preparation enqueue, and admission reservation together."
observes = ["artifact:session-api", "artifact:brain-mux", "artifact:runtime-control-worker"]

