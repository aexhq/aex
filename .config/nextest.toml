# cargo-nextest profiles for the AEX Rust workspace.
#
# Rules that these profiles encode (Q-FLAKE / no-silent-skips):
#   * retries are always 0 — a retry-to-green lane hides a real defect;
#   * fail-fast is off so one failure never masks the rest of the evidence;
#   * every profile archives JUnit so CI keeps a machine-readable receipt.
#
# Live suites are separate `tests/live/aex-live-*` packages and are selected
# explicitly (`cargo nextest run -p aex-live-...`); they are never part of the
# default lane and must fail, not self-skip, when a prerequisite is absent.

[profile.default]
retries = 0
fail-fast = false
failure-output = "immediate"
status-level = "pass"
final-status-level = "flaky"
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.default.junit]
path = "junit.xml"
report-name = "aex-default"

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"
final-status-level = "flaky"
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"
report-name = "aex-ci"
