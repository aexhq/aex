# The safety point: 200 active mixed agents, the number above which the task
# admits nothing new. Correctness must be unchanged here; what is being measured
# is whether the reservations keep RSS, sockets, the reactor and the compute
# lane inside the envelope while excess work queues without starving.
id = "brain-200-agents"
owner = "brain-core"
target = "aex-live-brain-mux"
tier = "t3"
duration = "30m"
ttl = "4h"

[arrival]
mode = "closed"
concurrency = 200
mix = { short_turn = 0.4, long_context_turn = 0.3, tool_turn = 0.2, subagent_turn = 0.1 }

[[gate]]
id = "LOAD-200-SAFE"
kind = "budget"
blocking = true
assert = "rss_peak <= 0.85 * task_memory_limit && open_fds non-increasing over the last third && progress_stall_s < 60 && accepted_work_lost == 0"
source = "Q-PERFORMANCE 200-active safety point; PERF-02; PERF-04"

[report]
metrics = [
  "completed_per_s", "queue_delay_ms", "time_to_first_token_ms", "end_to_end_ms",
  "provider_wait_ms", "local_cpu_ms", "rss_peak_bytes", "open_fds", "tokio_tasks",
  "sockets", "journal_bytes", "checkpoint_bytes", "affinity_hit_rate", "scale_event_s",
  "recovery_s", "duplicate_effects", "gaps", "cost_micro_usd_per_completed_turn",
]
