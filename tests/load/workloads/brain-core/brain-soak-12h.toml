# The 12-hour mixed swarm soak. Slopes rather than absolutes: a leak is visible
# as a trend and invisible as a snapshot, which is why every assertion here is a
# derivative over the final third.
id = "brain-soak-12h"
owner = "brain-core"
target = "aex-live-brain-mux"
tier = "t2"
duration = "12h"
ttl = "24h"

[arrival]
mode = "closed"
concurrency = 100
mix = { short_turn = 0.4, long_context_turn = 0.2, tool_turn = 0.2, subagent_turn = 0.2 }

[[gate]]
id = "LEAK-SOAK-12H"
kind = "budget"
blocking = true
assert = "over the final 8 h: d(rss)/dt <= 0.5 MiB/h && d(open_fds)/dt <= 0 && tokio_tasks bounded && every frontier returns to baseline && cost_micro_usd_per_completed_turn within 20% of the first hour"
source = "Area 7 candidate-evidence rule; slope chosen, re-pinned from the first soak trace"

[report]
metrics = [
  "completed_per_s", "queue_delay_ms", "time_to_first_token_ms", "end_to_end_ms",
  "provider_wait_ms", "local_cpu_ms", "rss_peak_bytes", "open_fds", "tokio_tasks",
  "sockets", "journal_bytes", "checkpoint_bytes", "affinity_hit_rate", "scale_event_s",
  "recovery_s", "duplicate_effects", "gaps", "cost_micro_usd_per_completed_turn",
]
