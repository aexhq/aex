# The launch steady-state shape: 100 concurrent short agents on the composed system.
#
# Two gates ride on it. LOAD-100-COMPLETE is about loss — every offer must end
# in exactly one terminal, with no duplicate semantic commit. LOAD-100-BUDGETS
# is about latency and memory on that same shape, which is the only way a
# latency number means anything (PERF-01).
id = "brain-100-agents"
owner = "brain-core"
target = "aex-live-brain-mux"
tier = "t2"
duration = "30m"
ttl = "4h"

[arrival]
mode = "closed"
concurrency = 100
mix = { short_turn = 0.7, tool_turn = 0.2, subagent_turn = 0.1 }

[[gate]]
id = "LOAD-100-COMPLETE"
kind = "budget"
blocking = true
assert = "completed == offered && duplicate_effects == 0 && accepted_work_lost == 0"
source = "PERF-02; Area 10 T2 row 'Peak active/offered agents = 100'"

[[gate]]
id = "LOAD-100-BUDGETS"
kind = "budget"
blocking = true
assert = "admission_to_sqs_receive_p95 <= 250ms && receive_to_dispatch_p95 <= 25ms && rss_peak <= 0.70 * task_memory_limit"
source = "07-brain-core.md Slice 11 declared budgets"

[report]
metrics = [
  "completed_per_s", "queue_delay_ms", "time_to_first_token_ms", "end_to_end_ms",
  "provider_wait_ms", "local_cpu_ms", "rss_peak_bytes", "open_fds", "tokio_tasks",
  "sockets", "journal_bytes", "checkpoint_bytes", "affinity_hit_rate", "scale_event_s",
  "recovery_s", "duplicate_effects", "gaps", "cost_micro_usd_per_completed_turn",
]
