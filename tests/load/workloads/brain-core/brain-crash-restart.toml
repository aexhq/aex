# Crash and restart under each of the other shapes. The assertion is the one
# that matters most and is easiest to fake: every run reaches a terminal. A run
# that is still "running" after the process that owned it died is the failure
# this campaign exists to find.
id = "brain-crash-restart"
owner = "brain-core"
target = "aex-live-brain-mux"
tier = "t3"
duration = "60m"
ttl = "4h"

[arrival]
mode = "closed"
concurrency = 100
mix = { short_turn = 0.3, long_context_turn = 0.2, tool_turn = 0.2, subagent_turn = 0.2, fanout_50 = 0.1 }

[[gate]]
id = "LOAD-CRASH-TERMINAL"
kind = "budget"
blocking = true
assert = "after a kill at every effect transition and transaction boundary: every run ends succeeded, failed, cancelled, timed_out or interrupted && duplicate_effects == 0 && no ambiguous effect is automatically replayed"
source = "07-brain-core.md section 10 failure matrix; Slice 11 'crash/restart under each workload'"

[[gate]]
id = "LOAD-CRASH-RECOVERY"
kind = "diagnostic"
blocking = false
assert = "recovery_s from a task kill to restored progress, recorded per injection point"
source = "07-brain-core.md section 12 S-10.1"

[report]
metrics = [
  "completed_per_s", "queue_delay_ms", "time_to_first_token_ms", "end_to_end_ms",
  "provider_wait_ms", "local_cpu_ms", "rss_peak_bytes", "open_fds", "tokio_tasks",
  "sockets", "journal_bytes", "checkpoint_bytes", "affinity_hit_rate", "scale_event_s",
  "recovery_s", "duplicate_effects", "gaps", "cost_micro_usd_per_completed_turn",
]
