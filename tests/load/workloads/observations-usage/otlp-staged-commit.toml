# The OTLP admission path's staged commit, at the largest batch the contract
# admits.
#
# Two provider envelopes meet here and neither is negotiable: one
# `TransactWriteItems` carries at most 100 actions and at most 4 MiB of items.
# A maximal decoded batch is 2000 points and 16 MiB, so a staged commit that
# does not shard correctly does not degrade — it is refused by DynamoDB, and the
# telemetry is dropped. Dropping agent telemetry silently is the failure this
# gate exists to prevent, which is why it is a budget and not a diagnostic.
#
# Ten concurrent series-claim writers is the shape that makes the crash-cleanup
# half meaningful: a stage that is abandoned mid-commit must leave no claimed
# series behind, at every boundary, not only at the convenient one.
#
# Open arrival, because an OTLP exporter posts on its own schedule and does not
# wait for the collector; a closed profile here would measure a client that
# politely backs off, which is not the client this path receives.
id = "otlp-staged-commit"
owner = "observations-usage"
target = "aex-live-regional-otlp"
tier = "t3"
duration = "30m"
ttl = "2h"

[arrival]
mode = "open"
rate_per_s = 20.0
mix = { maximal_batch_2000_points = 0.5, maximal_batch_16mib = 0.3, crash_mid_stage = 0.2 }

[[gate]]
id = "OTLP-STAGED-COMMIT"
kind = "budget"
blocking = true
assert = "a maximal 2000-point / 16 MiB decoded batch commits within the 100-action and 4 MiB DynamoDB envelopes under ten concurrent series-claim writers && crash cleanup verified at every boundary"
source = "PERF-08; 11-observations.md G7 (serial, gating)"

[report]
metrics = [
  "completed_per_s", "queue_delay_ms", "time_to_first_token_ms", "end_to_end_ms",
  "provider_wait_ms", "local_cpu_ms", "rss_peak_bytes", "open_fds", "tokio_tasks",
  "sockets", "journal_bytes", "checkpoint_bytes", "affinity_hit_rate", "scale_event_s",
  "recovery_s", "duplicate_effects", "gaps", "cost_micro_usd_per_completed_turn",
]
