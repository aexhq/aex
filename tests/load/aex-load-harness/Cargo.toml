[package]
name = "aex-load-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "test-architecture"
role = "test_support"
artifact = "none"
layers = ["unit"]
concerns = ["property"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"

[package.metadata.aex.not_applicable]
live_suite = "test-only crate; the load executors it drives live in the owning live companion's `load` target (D-11)"

[dependencies]
aex-test-harness = { path = "../../support/aex-test-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[[test]]
name = "properties"
path = "tests/properties.rs"
