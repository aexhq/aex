[package]
name = "aex-test-harness"
version = "0.1.0"
description = "The one shared substrate for every AEX test run that touches something it must later clean up."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "test-architecture"
role = "test_support"
artifact = "none"
layers = ["unit"]
concerns = ["property"]
seams = []
security_tier = "diagnostic"
risk = ["none"]
scenarios = []

[package.metadata.aex.targets]
properties = "unit"

[package.metadata.aex.not_applicable]
live_suite = "test-only crate; must be absent from every production link graph"

[features]
# Off by default: the ordinary unit lane must never link `testcontainers` nor
# reach for a Docker socket. An integration target that starts a pinned engine
# turns this on for itself.
containers = ["dep:testcontainers", "dep:tokio"]

[dependencies]
blake3.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
testcontainers = { workspace = true, optional = true, features = ["http_wait"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "properties"
path = "tests/properties.rs"
