[package]
name = "aex-live-tool-mux"
version = "0.1.0"
description = "Live exact-generation, MCP and retained-result scenarios for tool-mux."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "tools-mcp"
role = "live_companion"
artifact = "none"
deployable = "tool-mux"
layers = ["e2e", "smoke"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.condition", "aws.dynamodb.transact_write", "aws.iam.denial", "aws.kms.branch_key_rotation", "aws.kms.encryption_context", "aws.lambda.microvm", "aws.s3.conditional_put", "aws.s3.sse_kms", "aws.sqs.fifo", "hands.guest.lifecycle", "mcp.streamable_http", "net.public_egress"]
security_tier = "internal"
risk = ["concurrency", "untrusted_input"]
scenarios = ["SC-TOOL-MUX"]

[package.metadata.aex.targets]
journeys = "smoke"
load = "e2e"

[dependencies]
aex-tool-mux = { path = "../../../crates/aex-tool-mux" }
aex-wire = { path = "../../../crates/aex-wire" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
aex-test-harness = { path = "../../support/aex-test-harness" }

[[test]]
name = "journeys"
path = "tests/journeys.rs"

[[test]]
name = "load"
path = "tests/load.rs"
