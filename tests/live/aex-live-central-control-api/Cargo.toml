[package]
name = "aex-live-central-control-api"
version = "0.1.0"
description = "Live-test companion package for the `central-control-api` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "live_companion"
artifact = "none"
deployable = "central-control-api"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.alb.framing", "aws.aurora.serverless_v2", "aws.iam.denial", "aws.rds_data.transaction", "aws.sqs.fifo"]
security_tier = "public_edge"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
live = "e2e"
