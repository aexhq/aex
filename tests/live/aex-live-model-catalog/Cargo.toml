[package]
name = "aex-live-model-catalog"
version = "0.1.0"
description = "Live-test companion for the model-catalog component shipped in `brain-mux`."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "providers"
role = "live_companion"
artifact = "none"
deployable = "brain-mux"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["provider.anthropic.stream", "provider.deepseek.stream", "provider.google.stream", "provider.moonshotai.stream", "provider.openai.stream", "provider.zai.stream"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
catalog_source = "e2e"
deepseek_qualification = "e2e"
genesis = "e2e"
qualification_output = "e2e"

[[bin]]
name = "aex-model-catalog-publisher"
path = "src/main.rs"

[[bin]]
name = "aex-model-catalog-qualifier"
path = "src/qualify.rs"

[[test]]
name = "catalog_source"
path = "tests/catalog_source.rs"

[[test]]
name = "deepseek_qualification"
path = "tests/deepseek_qualification.rs"

[[test]]
name = "genesis"
path = "tests/genesis.rs"

[[test]]
name = "qualification_output"
path = "tests/qualification_output.rs"

[dependencies]
aex-brain-app = { path = "../../../crates/aex-brain-app" }
aex-brain-provider-gateway = { path = "../../../crates/aex-brain-provider-gateway" }
aex-model-catalog = { path = "../../../crates/aex-model-catalog" }
aex-test-harness = { path = "../../support/aex-test-harness" }
aex-wire = { path = "../../../crates/aex-wire" }
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
p256.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
aws-lc-rs.workspace = true
