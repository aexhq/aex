[package]
name = "aex-live-model-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "providers"
role = "live_companion"
artifact = "none"
deployable = "brain-mux"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["provider.anthropic.stream", "provider.deepseek.stream", "provider.google.stream", "provider.moonshotai.stream", "provider.openai.stream", "provider.zai.stream"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the providers stream; live evidence cannot be earned before deployment (OD-07)"

[[bin]]
name = "aex-model-catalog-publisher"
path = "src/main.rs"

[dependencies]
aex-brain-provider-gateway = { path = "../../../crates/aex-brain-provider-gateway" }
aex-model-catalog = { path = "../../../crates/aex-model-catalog" }
aex-test-harness = { path = "../../support/aex-test-harness" }
aex-wire = { path = "../../../crates/aex-wire" }
base64.workspace = true
bytes.workspace = true
clap.workspace = true
hex.workspace = true
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
