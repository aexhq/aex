[package]
name = "aex-live-brain-mux"
version = "0.1.0"
description = "Live-test companion package for the `brain-mux` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "brain-core"
role = "live_companion"
artifact = "none"
deployable = "brain-mux"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.cloudwatch.export", "aws.dynamodb.condition", "aws.dynamodb.transact_write", "aws.ecs.run_task", "aws.iam.denial", "aws.lambda.microvm", "aws.s3.conditional_put", "aws.sqs.fifo", "hands.guest.lifecycle", "mcp.streamable_http", "net.public_egress", "provider.anthropic.stream", "provider.deepseek.stream", "provider.xai.stream", "provider.meta.stream", "provider.moonshotai.stream", "provider.openai.stream", "provider.alibaba.stream"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
smoke = "smoke"
load = "e2e"

[dependencies]
aex-load-harness = { path = "../../load/aex-load-harness" }
aex-test-harness = { path = "../../support/aex-test-harness" }

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "load"
path = "tests/load.rs"
