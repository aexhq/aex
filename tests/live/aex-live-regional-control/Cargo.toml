[package]
name = "aex-live-regional-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "live_companion"
artifact = "none"
deployable = "regional-control"
layers = ["smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.condition", "aws.lambda.microvm", "aws.iam.denial"]
security_tier = "authority"
risk = ["iam", "concurrency"]
scenarios = []

[package.metadata.aex.targets]
direct_invoke = "e2e"

[dev-dependencies]
aex-internal-contracts = { path = "../../../crates/aex-internal-contracts" }
aex-wire = { path = "../../../crates/aex-wire" }
serde_json.workspace = true

[[test]]
name = "direct_invoke"
path = "tests/direct_invoke.rs"
