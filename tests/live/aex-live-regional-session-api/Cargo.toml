[package]
name = "aex-live-regional-session-api"
version = "0.1.0"
description = "Live-test companion package for the `regional-session-api` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "live_companion"
artifact = "none"
deployable = "regional-session-api"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.alb.framing", "aws.dynamodb.condition", "aws.dynamodb.streams", "aws.dynamodb.throughput", "aws.dynamodb.transact_write", "aws.dynamodb.ttl", "aws.iam.denial", "aws.kms.encryption_context", "aws.s3.bounded_get", "aws.s3.conditional_put", "aws.s3.multipart", "aws.s3.presigned_expiry", "aws.s3.sse_kms", "aws.s3.unversioned_delete"]
security_tier = "public_edge"
risk = ["iam"]
scenarios = ["SC-REGIONAL-ADMISSION"]

[package.metadata.aex.targets]
e2e = "e2e"

[features]
live = []

[dev-dependencies]
aex-test-harness = { path = "../../support/aex-test-harness" }
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["live"]
