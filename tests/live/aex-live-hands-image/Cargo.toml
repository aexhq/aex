[package]
name = "aex-live-hands-image"
version = "0.1.0"
description = "Live-test companion package for the `hands-image` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "hands"
role = "live_companion"
artifact = "none"
deployable = "hands-image"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.lambda.microvm", "hands.guest.lifecycle"]
security_tier = "guest"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
boundary = "e2e"
