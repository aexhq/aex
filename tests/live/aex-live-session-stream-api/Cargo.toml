[package]
name = "aex-live-session-stream-api"
version = "0.1.0"
description = "Live-test companion package for the `session-stream-api` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "live_companion"
artifact = "none"
deployable = "session-stream-api"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.alb.framing", "aws.dynamodb.condition", "aws.dynamodb.streams", "aws.dynamodb.throughput", "aws.dynamodb.transact_write", "aws.dynamodb.ttl", "aws.iam.denial", "aws.kms.branch_key_rotation", "aws.kms.encryption_context", "aws.lambda.async_delivery", "aws.lambda.microvm", "aws.s3.bounded_get", "aws.s3.conditional_put", "aws.s3.multipart", "aws.s3.presigned_expiry", "aws.s3.sse_kms", "aws.s3.unversioned_delete"]
security_tier = "public_edge"
risk = ["iam"]
scenarios = ["SC-REGIONAL-ADMISSION", "SC-REGISTRY-RESOURCES", "SC-SESSION-LIVE-FILES"]

[package.metadata.aex.targets]
e2e = "e2e"
live-files = "e2e"
load = "e2e"

[features]
live = []

[dev-dependencies]
aex-load-harness = { path = "../../load/aex-load-harness" }
aex-test-harness = { path = "../../support/aex-test-harness" }
aex-wire = { path = "../../../crates/aex-wire" }
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["live"]

[[test]]
name = "live-files"
path = "tests/live_files.rs"
required-features = ["live"]

# `PERF-BASELINE-JOURNAL-FOLD` is a blocking gate whose descriptor names this
# package. Until this target existed it could not run and
# nothing reported them as pending, because `aex-workload-unowned` only asked
# whether a descriptor existed.
[[test]]
name = "load"
path = "tests/load.rs"
