[package]
name = "aex-live-dashboard"
version = "0.1.0"
description = "Live-test companion package for the `dashboard` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "clients"
role = "live_companion"
artifact = "none"
deployable = "dashboard"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.iam.denial", "vercel.build_output.deploy"]
security_tier = "public_edge"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
smoke = "smoke"
e2e = "e2e"

[features]
live = []

[dev-dependencies]
aex-test-harness = { path = "../../support/aex-test-harness" }
reqwest.workspace = true
tokio.workspace = true

[[test]]
name = "smoke"
path = "tests/smoke.rs"
required-features = ["live"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["live"]
