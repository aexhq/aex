[package]
name = "aex-live-central-api"
version = "0.1.0"
description = "Live-test companion package for the `central-api` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "live_companion"
artifact = "none"
deployable = "central-api"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.alb.framing", "aws.aurora.serverless_v2", "aws.iam.denial", "aws.rds_data.transaction", "stripe.test_mode.webhook"]
security_tier = "public_edge"
risk = ["iam", "money"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the central-identity stream to deploy the merged edge behind its load balancer; live evidence cannot be earned before deployment (OD-07)"
