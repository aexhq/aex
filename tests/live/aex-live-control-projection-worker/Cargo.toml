[package]
name = "aex-live-control-projection-worker"
version = "0.1.0"
description = "Live-test companion package for the `control-projection-worker` deployable."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "live_companion"
artifact = "none"
deployable = "control-projection-worker"
layers = ["smoke", "e2e"]
concerns = ["fault", "security", "performance"]
seams = ["aws.iam.denial", "aws.lambda.async_delivery", "aws.rds_data.transaction"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
live = "e2e"
