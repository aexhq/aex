[package]
name = "finance-api"
version = "0.1.0"
description = "`finance-api` is the public central money surface: balances, automatic top-up policy, statements and the two hosted provider pages."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "lambda_zip"
deployable = "finance-api"
live_suite = "aex-live-finance-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial", "stripe.test_mode.webhook"]
security_tier = "public_edge"
risk = ["money"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
capability = "unit"
smoke = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "finance-api"
path = "src/main.rs"

[dependencies]
aex-control-domain = { path = "../../crates/aex-control-domain" }
aex-finance-domain = { path = "../../crates/aex-finance-domain" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-payment-contracts = { path = "../../crates/aex-payment-contracts" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-rdsdata.workspace = true
aws-sdk-s3.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
futures.workspace = true
http.workspace = true
lambda_http.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
toml.workspace = true
tower.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "capability"
path = "tests/capability.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
