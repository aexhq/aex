[package]
name = "finance-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "lambda_zip"
deployable = "finance-api"
live_suite = "aex-live-finance-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial", "stripe.test_mode.webhook"]
security_tier = "public_edge"
risk = ["money"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
smoke = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "finance-api"
path = "src/main.rs"

[dependencies]
aex-finance-app = { path = "../../crates/aex-finance-app" }
aex-finance-aurora = { path = "../../crates/aex-finance-aurora" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
axum.workspace = true
lambda_http.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
