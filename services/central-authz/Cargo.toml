[package]
name = "central-authz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "deployable"
artifact = "lambda_zip"
deployable = "central-authz"
live_suite = "aex-live-central-authz"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
faults = "unit"
security = "unit"
resource_envelope = "e2e"

[[bin]]
name = "central-authz"
path = "src/main.rs"

[dependencies]
aex-central-http = { path = "../../crates/aex-central-http" }
aex-control-app = { path = "../../crates/aex-control-app" }
aex-control-aurora = { path = "../../crates/aex-control-aurora" }
aex-control-domain = { path = "../../crates/aex-control-domain" }
aex-identity-domain = { path = "../../crates/aex-identity-domain" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
aws-config.workspace = true
aws-sdk-rdsdata.workspace = true
# The pepper ring and the assertion private key, both read once at cold start.
aws-sdk-secretsmanager.workspace = true
# This function is invoked, never routed: `lambda_http` would parse an API
# Gateway proxy event that never arrives.
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
async-trait.workspace = true
