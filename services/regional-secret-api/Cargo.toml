[package]
name = "regional-secret-api"
version = "0.1.0"
description = "Plaintext admission boundary for secrets and provider credentials."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "regional-secret-api"
live_suite = "aex-live-regional-secret-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.kms.encryption_context", "aws.dynamodb.condition", "aws.iam.denial"]
security_tier = "secret"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
secrets = "unit"
composition = "unit"
served = "unit"
performance_contract = "e2e"

[[bin]]
name = "regional-secret-api"
path = "src/main.rs"

[dependencies]
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-kms.workspace = true
aws-sdk-ssm.workspace = true
lambda_http.workspace = true
tokio.workspace = true
aex-secret-aws = { path = "../../crates/aex-secret-aws" }
aex-secret-custody-dynamodb = { path = "../../crates/aex-secret-custody-dynamodb" }
aex-secret-keystore-dynamodb = { path = "../../crates/aex-secret-keystore-dynamodb" }
aex-regional-http = { path = "../../crates/aex-regional-http" }
aex-secret-domain = { path = "../../crates/aex-secret-domain" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", default-features = false, features = [
    "authz-projection",
] }
async-trait.workspace = true
aex-wire = { path = "../../crates/aex-wire" }
aex-identity-domain = { path = "../../crates/aex-identity-domain" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
time.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "secrets"
path = "tests/secrets.rs"

[[test]]
name = "composition"
path = "tests/composition.rs"

[[test]]
name = "served"
path = "tests/served.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
