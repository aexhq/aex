[package]
name = "regional-observation-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "lambda_zip"
deployable = "regional-observation-api"
live_suite = "aex-live-regional-observation-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.condition", "aws.s3.conditional_put", "aws.iam.denial"]
security_tier = "public_edge"
risk = ["iam", "untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
routes = "unit"
startup = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "regional-observation-api"
path = "src/main.rs"

[dependencies]
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-observation-domain = { path = "../../crates/aex-observation-domain" }
aex-observation-query = { path = "../../crates/aex-observation-query" }
aex-observation-store-aws = { path = "../../crates/aex-observation-store-aws" }
aex-otlp-admission = { path = "../../crates/aex-otlp-admission" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-regional-http = { path = "../../crates/aex-regional-http" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-lc-rs.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
lambda_http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[[test]]
name = "routes"
path = "tests/routes.rs"

[[test]]
name = "startup"
path = "tests/startup.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
