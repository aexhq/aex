[package]
name = "central-control-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "deployable"
artifact = "lambda_zip"
deployable = "central-control-api"
live_suite = "aex-live-central-control-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.sqs.fifo", "aws.iam.denial", "aws.alb.framing"]
security_tier = "public_edge"
risk = ["iam", "untrusted_input"]
scenarios = []

[[bin]]
name = "central-control-api"
path = "src/main.rs"

[dependencies]
aex-central-http = { path = "../../crates/aex-central-http" }
aex-control-app = { path = "../../crates/aex-control-app" }
aex-control-aurora = { path = "../../crates/aex-control-aurora" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
axum.workspace = true
lambda_http.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
aex-control-domain = { path = "../../crates/aex-control-domain" }
async-trait.workspace = true
time.workspace = true
tower.workspace = true
uuid.workspace = true
