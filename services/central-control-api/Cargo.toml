[package]
name = "central-control-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "deployable"
artifact = "lambda_zip"
deployable = "central-control-api"
live_suite = "aex-live-central-control-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial", "aws.alb.framing"]
security_tier = "public_edge"
risk = ["iam", "untrusted_input"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the central-identity stream; the cases land with the binary's own implementation"

[[bin]]
name = "central-control-api"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true
