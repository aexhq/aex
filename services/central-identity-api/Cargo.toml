[package]
name = "central-identity-api"
version = "0.1.0"
description = "`central-identity-api`: the identity half of the central HTTP surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "deployable"
artifact = "lambda_zip"
deployable = "central-identity-api"
live_suite = "aex-live-central-identity-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial", "aws.alb.framing"]
security_tier = "public_edge"
risk = ["iam", "untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
faults = "unit"
resource_envelope = "e2e"

[[bin]]
name = "central-identity-api"
path = "src/main.rs"

[dependencies]
aex-central-http = { path = "../../crates/aex-central-http" }
aex-central-aws = { path = "../../crates/aex-central-aws" }
aex-control-app = { path = "../../crates/aex-control-app" }
aex-control-domain = { path = "../../crates/aex-control-domain" }
aex-identity-app = { path = "../../crates/aex-identity-app" }
aex-identity-aurora = { path = "../../crates/aex-identity-aurora" }
aex-identity-domain = { path = "../../crates/aex-identity-domain" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-rdsdata.workspace = true
aws-sdk-secretsmanager.workspace = true
axum.workspace = true
base64.workspace = true
lambda_http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tower.workspace = true
