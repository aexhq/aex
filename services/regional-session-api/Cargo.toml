[package]
name = "regional-session-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "regional-session-api"
live_suite = "aex-live-regional-session-api"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.s3.conditional_put", "aws.iam.denial", "aws.alb.framing"]
security_tier = "public_edge"
risk = ["iam", "untrusted_input"]
scenarios = []

[package.metadata.aex.targets]
admission = "unit"
composition = "unit"
served = "unit"
performance_contract = "e2e"

[[bin]]
name = "regional-session-api"
path = "src/main.rs"

[dependencies]
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-ssm.workspace = true
lambda_http.workspace = true
tokio.workspace = true
aex-content-dynamodb = { path = "../../crates/aex-content-dynamodb" }
aex-registry-dynamodb = { path = "../../crates/aex-registry-dynamodb" }
aex-runtime-activity-dynamodb = { path = "../../crates/aex-runtime-activity-dynamodb" }
aex-secret-custody-dynamodb = { path = "../../crates/aex-secret-custody-dynamodb" }
aex-work-dynamodb = { path = "../../crates/aex-work-dynamodb" }
aex-regional-http = { path = "../../crates/aex-regional-http" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", default-features = false, features = [
    "authz-projection",
] }
async-trait.workspace = true
aex-wire = { path = "../../crates/aex-wire" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
aex-secret-domain = { path = "../../crates/aex-secret-domain" }
axum.workspace = true
http-body-util.workspace = true
time.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "admission"
path = "tests/admission.rs"

[[test]]
name = "composition"
path = "tests/composition.rs"

[[test]]
name = "served"
path = "tests/served.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
