[package]
name = "regional-stream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "oci_image"
deployable = "regional-stream"
live_suite = "aex-live-regional-stream"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.streams", "aws.alb.framing", "aws.iam.denial"]
security_tier = "public_edge"
risk = ["iam", "untrusted_input"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the regional-services stream; the cases land with the binary's own implementation"

[[bin]]
name = "regional-stream"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true
