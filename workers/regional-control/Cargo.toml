[package]
name = "regional-control"
version = "0.1.0"
description = "Direct-invoke regional workspace control authority."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "regional-control"
live_suite = "aex-live-regional-control"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.condition", "aws.lambda.microvm", "aws.iam.denial"]
security_tier = "authority"
risk = ["iam", "concurrency"]
scenarios = []

[package.metadata.aex.not_applicable]
inline_targets = "regional-services keeps the direct-invoke configuration evidence in the composition-root unit target and the fencing evidence in the owning adapter unit target; there is no separate integration binary to map"

[[bin]]
name = "regional-control"
path = "src/main.rs"

[dependencies]
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", default-features = false, features = ["session-authority"] }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
lambda_runtime.workspace = true
thiserror.workspace = true
tokio.workspace = true
