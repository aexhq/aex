[package]
name = "runtime-control-worker"
version = "0.1.0"
description = "`runtime-control-worker` composition root (Rust Lambda ZIP)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "runtime-control-worker"
live_suite = "aex-live-runtime-control-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.ecs.run_task", "aws.lambda.microvm", "aws.dynamodb.condition", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []


[[bin]]
name = "runtime-control-worker"
path = "src/main.rs"

[package.metadata.aex.not_applicable]
inline_targets = "the `regional-services` stream places this crate's evidence in inline unit modules, which the declared `unit` layer already collects; the crate declares no [[test]] target, so there is nothing to map"

[dependencies]
aex-hands-control-aws = { path = "../../crates/aex-hands-control-aws" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-diagnostics = { path = "../../crates/aex-platform-diagnostics" }
aex-runtime-activity-dynamodb = { path = "../../crates/aex-runtime-activity-dynamodb" }
aex-runtime-control = { path = "../../crates/aex-runtime-control" }
aex-runtime-control-aws = { path = "../../crates/aex-runtime-control-aws" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", features = ["session-authority"] }
aex-usage-domain = { path = "../../crates/aex-usage-domain" }
aex-wire = { path = "../../crates/aex-wire" }
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-lambdamicrovms.workspace = true
aws-sdk-sqs.workspace = true
aws-types.workspace = true
aws_lambda_events.workspace = true
axum.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
