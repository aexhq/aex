[package]
name = "central-schema-admin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "oci_task"
deployable = "central-schema-admin"
live_suite = "aex-live-central-schema-admin"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.aurora.serverless_v2", "aws.ecs.run_task", "aws.iam.denial"]
security_tier = "internal"
risk = ["sql"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the central-finance stream; the cases land with the binary's own implementation"

[[bin]]
name = "central-schema-admin"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true
