[package]
name = "central-schema-admin"
version = "0.1.0"
description = "Central schema administration: the migration bundle and the privilege allowlist that go with it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[features]
# The real-PostgreSQL suite. A marker feature: the engine crates are ordinary
# dev-dependencies and the container starts through the shared harness, which
# owns the digest-pinned image registry. The feature keeps the suite out of the
# unit lane while the integration lane arms it.
integration-engines = []

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "oci_task"
deployable = "central-schema-admin"
live_suite = "aex-live-central-schema-admin"
layers = ["unit", "integration", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.aurora.serverless_v2", "aws.iam.denial"]
security_tier = "authority"
risk = ["sql", "iam"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
hosted_extensions = "integration"
migrations = "integration"
smoke = "smoke"
resource_envelope = "e2e"

# The bundle parser and the privilege allowlist are a library so that the
# container-backed suite in `crates/aex-control-aurora` applies the *same*
# renderer production applies, rather than a second copy written for the test.
[lib]
name = "central_schema_admin"
path = "src/lib.rs"

[[bin]]
name = "central-schema-admin"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
aws-config.workspace = true
aws-sdk-secretsmanager.workspace = true
blake3.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
aex-test-harness = { path = "../../tests/support/aex-test-harness", features = ["containers"] }
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "migrations"
path = "tests/migrations.rs"
required-features = ["integration-engines"]

[[test]]
name = "hosted_extensions"
path = "tests/hosted_extensions.rs"
required-features = ["integration-engines"]

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
