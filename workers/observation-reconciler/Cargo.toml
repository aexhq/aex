[package]
name = "observation-reconciler"
version = "0.1.0"
description = "`observation-reconciler`: the scheduled duty runner of the observation authority."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "lambda_zip"
deployable = "observation-reconciler"
live_suite = "aex-live-observation-reconciler"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.streams", "aws.dynamodb.ttl", "aws.s3.conditional_put", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
duty = "unit"
startup = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "observation-reconciler"
path = "src/main.rs"

[dependencies]
aex-observation-domain = { path = "../../crates/aex-observation-domain" }
aex-observation-store-dynamodb = { path = "../../crates/aex-observation-store-dynamodb" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sqs.workspace = true
lambda_runtime.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
http.workspace = true

[[test]]
name = "duty"
path = "tests/duty.rs"

[[test]]
name = "startup"
path = "tests/startup.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
