[package]
name = "regional-secret-key-admin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "oci_task"
deployable = "regional-secret-key-admin"
live_suite = "aex-live-regional-secret-key-admin"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.kms.branch_key_rotation", "aws.iam.denial"]
security_tier = "secret"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
rotation = "unit"
composition = "unit"
performance_contract = "e2e"

[[bin]]
name = "regional-secret-key-admin"
path = "src/main.rs"

[dependencies]
clap.workspace = true
aex-regional-http = { path = "../../crates/aex-regional-http" }
aex-secret-keystore-dynamodb = { path = "../../crates/aex-secret-keystore-dynamodb" }
aex-wire = { path = "../../crates/aex-wire" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true

[[test]]
name = "rotation"
path = "tests/rotation.rs"

[[test]]
name = "composition"
path = "tests/composition.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
