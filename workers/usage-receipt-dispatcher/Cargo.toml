[package]
name = "usage-receipt-dispatcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "lambda_zip"
deployable = "usage-receipt-dispatcher"
live_suite = "aex-live-usage-receipt-dispatcher"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.sqs.fifo", "aws.sqs.redrive", "aws.dynamodb.streams", "aws.iam.denial"]
security_tier = "money"
risk = ["money"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the central-finance stream; the cases land with the binary's own implementation"

[[bin]]
name = "usage-receipt-dispatcher"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true
