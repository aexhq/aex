[package]
name = "content-lifecycle-worker"
version = "0.1.0"
description = "Conservative content lifecycle decisions and exact fenced deletes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "content-lifecycle-worker"
live_suite = "aex-live-content-lifecycle-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.s3.unversioned_delete", "aws.dynamodb.ttl", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
lifecycle = "unit"
composition = "unit"
expiry = "unit"
gc = "unit"
performance_contract = "e2e"

[[bin]]
name = "content-lifecycle-worker"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws_lambda_events.workspace = true
lambda_runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true
aex-content-aws = { path = "../../crates/aex-content-aws" }
aex-content-dynamodb = { path = "../../crates/aex-content-dynamodb" }
aex-registry-dynamodb = { path = "../../crates/aex-registry-dynamodb" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", default-features = false }
aex-workspace-domain = { path = "../../crates/aex-workspace-domain" }
aex-work-dynamodb = { path = "../../crates/aex-work-dynamodb" }
aex-identity-domain = { path = "../../crates/aex-identity-domain" }
aex-regional-http = { path = "../../crates/aex-regional-http" }
aex-wire = { path = "../../crates/aex-wire" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
serde.workspace = true
thiserror.workspace = true

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "composition"
path = "tests/composition.rs"

[[test]]
name = "expiry"
path = "tests/expiry.rs"

[[test]]
name = "gc"
path = "tests/gc.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
