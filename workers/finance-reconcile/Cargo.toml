[package]
name = "finance-reconcile"
version = "0.1.0"
description = "`finance-reconcile` runs the conservation, unresolved-effect and statement sweeps."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "lambda_zip"
deployable = "finance-reconcile"
live_suite = "aex-live-finance-reconcile"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "property", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial", "stripe.test_mode.webhook"]
security_tier = "money"
risk = ["money"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
smoke = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "finance-reconcile"
path = "src/main.rs"

[dependencies]
aex-finance-domain = { path = "../../crates/aex-finance-domain" }
aex-payment-contracts = { path = "../../crates/aex-payment-contracts" }
aex-platform-diagnostics = { path = "../../crates/aex-platform-diagnostics" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-rdsdata.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-sns.workspace = true
lambda_runtime.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
proptest.workspace = true
toml.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
