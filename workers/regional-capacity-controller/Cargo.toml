[package]
name = "regional-capacity-controller"
version = "0.1.0"
description = "Closed direct-invoke controller for durable workspace capacity."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "regional-capacity-controller"
live_suite = "aex-live-regional-capacity-controller"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.iam.denial"]
security_tier = "authority"
risk = ["iam", "concurrency"]
scenarios = []

[package.metadata.aex.targets]
composition = "unit"
performance_contract = "e2e"

[[bin]]
name = "regional-capacity-controller"
path = "src/main.rs"

[dependencies]
aex-capacity-dynamodb = { path = "../../crates/aex-capacity-dynamodb" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true

[[test]]
name = "composition"
path = "tests/composition.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
