[package]
name = "provider-cost-reconciler"
version = "0.1.0"
description = "`provider-cost-reconciler` records the private COGS fact family and reports a margin finding."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "lambda_zip"
deployable = "provider-cost-reconciler"
live_suite = "aex-live-provider-cost-reconciler"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.iam.denial"]
security_tier = "money"
risk = ["money"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
smoke = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "provider-cost-reconciler"
path = "src/main.rs"

[dependencies]
aex-platform-diagnostics = { path = "../../crates/aex-platform-diagnostics" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-rdsdata.workspace = true
aws-sdk-s3.workspace = true
lambda_runtime.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
toml.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
