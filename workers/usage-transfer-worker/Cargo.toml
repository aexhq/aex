[package]
name = "usage-transfer-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "lambda_zip"
deployable = "usage-transfer-worker"
live_suite = "aex-live-usage-transfer-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.condition", "aws.dynamodb.streams", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "DEFERRED, not inapplicable: the composition root, its charging-gate fence, the three event-mode classifications and the sibling-authority link proofs are covered by this binary's own unit module. The smoke, e2e and load targets need the DynamoDB and SQS AuthorityStore implementation, which observations-usage still owes; the handler above that seam is complete and tested against in-memory ports in aex-usage-application."

[[bin]]
name = "usage-transfer-worker"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-usage-application = { path = "../../crates/aex-usage-application" }
aex-usage-domain = { path = "../../crates/aex-usage-domain" }
aex-usage-transfer-aws = { path = "../../crates/aex-usage-transfer-aws" }
serde_json.workspace = true
thiserror.workspace = true
