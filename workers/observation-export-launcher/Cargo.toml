[package]
name = "observation-export-launcher"
version = "0.1.0"
description = "`observation-export-launcher` composition root (Rust Lambda ZIP)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "lambda_zip"
deployable = "observation-export-launcher"
live_suite = "aex-live-observation-export-launcher"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.ecs.run_task", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
launcher = "unit"
startup = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "observation-export-launcher"
path = "src/main.rs"

[dependencies]
aex-observation-domain = { path = "../../crates/aex-observation-domain" }
aex-observation-store-aws = { path = "../../crates/aex-observation-store-aws" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-lc-rs.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-ecs.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]

[[test]]
name = "launcher"
path = "tests/launcher.rs"

[[test]]
name = "startup"
path = "tests/startup.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
