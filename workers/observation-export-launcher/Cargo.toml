[package]
name = "observation-export-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "lambda_zip"
deployable = "observation-export-launcher"
live_suite = "aex-live-observation-export-launcher"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.ecs.run_task", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "awaiting the observations-usage stream; the cases land with the binary's own implementation"

[[bin]]
name = "observation-export-launcher"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
thiserror.workspace = true
