[package]
name = "session-operation-worker"
version = "0.1.0"
description = "Fenced, bounded continuation kernel for regional session operations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "session-operation-worker"
live_suite = "aex-live-session-operation-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.sqs.fifo", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
composition = "unit"
reconciliation = "unit"
performance_contract = "e2e"

[[bin]]
name = "session-operation-worker"
path = "src/main.rs"

[dependencies]
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-sqs.workspace = true
aws_lambda_events.workspace = true
lambda_runtime.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
aex-work-dynamodb = { path = "../../crates/aex-work-dynamodb" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb" }
aex-session-app = { path = "../../crates/aex-session-app" }
aex-session-domain = { path = "../../crates/aex-session-domain" }
aex-runtime-control = { path = "../../crates/aex-runtime-control" }
aex-runtime-control-aws = { path = "../../crates/aex-runtime-control-aws" }
aex-runtime-activity-dynamodb = { path = "../../crates/aex-runtime-activity-dynamodb" }
aex-observation-store-dynamodb = { path = "../../crates/aex-observation-store-dynamodb" }
aex-operation-domain = { path = "../../crates/aex-operation-domain" }
aex-identity-domain = { path = "../../crates/aex-identity-domain" }
aex-regional-http = { path = "../../crates/aex-regional-http" }
aex-wire = { path = "../../crates/aex-wire" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
serde.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# The fenced-step properties measure a lease TTL, and the lease vocabulary they
# exercise is expressed in `time::Duration`.
time.workspace = true

[[test]]
name = "composition"
path = "tests/composition.rs"

[[test]]
name = "reconciliation"
path = "tests/reconciliation.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
