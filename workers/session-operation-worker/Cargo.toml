[package]
name = "session-operation-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "regional-services"
role = "deployable"
artifact = "lambda_zip"
deployable = "session-operation-worker"
live_suite = "aex-live-session-operation-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.transact_write", "aws.dynamodb.condition", "aws.sqs.fifo", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
continuations = "unit"
performance_contract = "e2e"

[[bin]]
name = "session-operation-worker"
path = "src/main.rs"

[dependencies]
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
blake3.workspace = true
serde.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true

[[test]]
name = "continuations"
path = "tests/continuations.rs"

[[test]]
name = "performance_contract"
path = "tests/load.rs"
