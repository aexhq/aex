[package]
name = "central-control-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "deployable"
artifact = "lambda_zip"
deployable = "central-control-worker"
live_suite = "aex-live-central-control-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.sqs.fifo", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
faults = "unit"
security = "unit"
resource_envelope = "e2e"

[[bin]]
name = "central-control-worker"
path = "src/main.rs"

[dependencies]
aex-central-http = { path = "../../crates/aex-central-http" }
aex-control-domain = { path = "../../crates/aex-control-domain" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
axum.workspace = true
lambda_http.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tower.workspace = true
