[package]
name = "central-control-worker"
version = "0.1.0"
description = "`central-control-worker` composition root (Rust Lambda ZIP)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-identity"
role = "deployable"
artifact = "lambda_zip"
deployable = "central-control-worker"
live_suite = "aex-live-central-control-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.sqs.fifo", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
faults = "unit"
security = "unit"
resource_envelope = "e2e"

[[bin]]
name = "central-control-worker"
path = "src/main.rs"

[dependencies]
aex-central-http = { path = "../../crates/aex-central-http" }
aex-control-domain = { path = "../../crates/aex-control-domain" }
aex-control-app = { path = "../../crates/aex-control-app" }
aex-control-aurora = { path = "../../crates/aex-control-aurora" }
aex-central-aws = { path = "../../crates/aex-central-aws" }
aex-identity-app = { path = "../../crates/aex-identity-app" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-session-dynamodb = { path = "../../crates/aex-session-dynamodb", default-features = false, features = ["authz-projection-write"] }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
axum.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-rdsdata.workspace = true
aws-sdk-secretsmanager.workspace = true
aws-sdk-sesv2.workspace = true
aws-sdk-sqs.workspace = true
aws-smithy-types.workspace = true
aws_lambda_events.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tower.workspace = true
