[package]
name = "usage-compute-worker"
version = "0.1.0"
description = "`usage-compute-worker` composition root (Rust Lambda ZIP)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "lambda_zip"
deployable = "usage-compute-worker"
live_suite = "aex-live-usage-compute-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.dynamodb.condition", "aws.dynamodb.streams", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.not_applicable]
targets = "DEFERRED by observations-usage, not inapplicable: the composition root, its charging-gate fence, the three event-mode classifications, the partial-batch response contract and the sibling-authority link proofs are covered by this binary's own unit module. The smoke and e2e targets need a deployed function, a live stream and a live receipt queue, none of which exist yet; the DynamoDB and SQS ports beneath the handler are implemented and unit-covered in this worker's one adapter."

[[bin]]
name = "usage-compute-worker"
path = "src/main.rs"

[dependencies]
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-sqs.workspace = true
lambda_runtime.workspace = true
tokio.workspace = true
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-usage-app = { path = "../../crates/aex-usage-app" }
aex-usage-domain = { path = "../../crates/aex-usage-domain" }
aex-usage-compute-aws = { path = "../../crates/aex-usage-compute-aws" }
serde_json.workspace = true
thiserror.workspace = true
