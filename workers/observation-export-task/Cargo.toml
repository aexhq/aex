[package]
name = "observation-export-task"
version = "0.1.0"
description = "`observation-export-task` composition root (one-shot Rust OCI task)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "observations-usage"
role = "deployable"
artifact = "oci_task"
deployable = "observation-export-task"
live_suite = "aex-live-observation-export-task"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "fault", "security", "performance"]
seams = ["aws.s3.multipart", "aws.iam.denial"]
security_tier = "internal"
risk = ["iam"]
scenarios = []

[package.metadata.aex.targets]
export = "unit"
startup = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "observation-export-task"
path = "src/main.rs"

[dependencies]
aex-observation-domain = { path = "../../crates/aex-observation-domain" }
aex-observation-export = { path = "../../crates/aex-observation-export" }
aex-observation-store-aws = { path = "../../crates/aex-observation-store-aws" }
aex-otlp-admission = { path = "../../crates/aex-otlp-admission" }
aex-platform-telemetry = { path = "../../crates/aex-platform-telemetry" }
aex-telemetry-schema = { path = "../../crates/aex-telemetry-schema" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-lc-rs.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
axum.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[[test]]
name = "export"
path = "tests/export.rs"

[[test]]
name = "startup"
path = "tests/startup.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
