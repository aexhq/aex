[package]
name = "finance-settlement-worker"
version = "0.1.0"
description = "`finance-settlement-worker` drains the FIFO rating backlog into the money authority, one account at a time."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[package.metadata.aex]
owner = "central-finance"
role = "deployable"
artifact = "lambda_zip"
deployable = "finance-settlement-worker"
live_suite = "aex-live-finance-settlement-worker"
layers = ["unit", "smoke", "e2e"]
concerns = ["contract", "property", "fault", "security", "performance"]
seams = ["aws.rds_data.transaction", "aws.sqs.fifo", "aws.sqs.redrive", "aws.iam.denial"]
security_tier = "money"
risk = ["money", "concurrency"]
scenarios = []

[package.metadata.aex.targets]
conformance = "unit"
properties = "unit"
smoke = "smoke"
resource_envelope = "e2e"

[[bin]]
name = "finance-settlement-worker"
path = "src/main.rs"

[dependencies]
aex-finance-app = { path = "../../crates/aex-finance-app" }
aex-internal-contracts = { path = "../../crates/aex-internal-contracts" }
aex-platform-diagnostics = { path = "../../crates/aex-platform-diagnostics" }
aex-rds-data = { path = "../../crates/aex-rds-data" }
aex-wire = { path = "../../crates/aex-wire" }
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-rdsdata.workspace = true
aws_lambda_events.workspace = true
lambda_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The regional producer crates, so the conformance suite can round-trip the
# producer's exact bytes through this worker's exact decode path.
aex-usage-app = { path = "../../crates/aex-usage-app" }
aex-usage-domain = { path = "../../crates/aex-usage-domain" }
proptest.workspace = true
toml.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "resource_envelope"
path = "tests/resource_envelope.rs"
