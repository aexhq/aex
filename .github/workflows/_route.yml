# The change router.
#
# It runs once and every lane reads its outputs, so module count drives matrix
# size rather than job count.
#
# The router never guesses. `graph select` refuses to compute a selection from
# no change information at all (exit 11), and this job publishes a routing
# receipt either way. An empty selection and a broken router are different
# results and must never look the same downstream.

name: route

on:
  workflow_call:
    inputs:
      mode:
        description: affected | full | shadow
        type: string
        required: true
      artifact_mode:
        description: affected | full | shadow for the artifact matrix
        type: string
        required: true
      lane:
        description: pr | main | release
        type: string
        required: true
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      partitions:
        type: number
        required: false
        default: 4
      release_tool_sha256:
        description: SHA-256 of the run's prepared aex-release-tool.
        type: string
        required: true
      workspace_check_sha256:
        description: SHA-256 of the run's prepared aex-workspace-check.
        type: string
        required: true
    outputs:
      routing_failed:
        value: ${{ jobs.route.outputs.routing_failed }}
      repo_wide:
        value: ${{ jobs.route.outputs.repo_wide }}
      test_matrix:
        value: ${{ jobs.route.outputs.test_matrix }}
      has_test:
        value: ${{ jobs.route.outputs.has_test }}
      integration_matrix:
        value: ${{ jobs.route.outputs.integration_matrix }}
      has_integration:
        value: ${{ jobs.route.outputs.has_integration }}
      node_matrix:
        value: ${{ jobs.route.outputs.node_matrix }}
      has_node:
        value: ${{ jobs.route.outputs.has_node }}
      artifact_matrix:
        value: ${{ jobs.route.outputs.artifact_matrix }}
      has_artifact:
        value: ${{ jobs.route.outputs.has_artifact }}
      scenario_matrix:
        value: ${{ jobs.route.outputs.scenario_matrix }}
      has_scenario:
        value: ${{ jobs.route.outputs.has_scenario }}
      terraform_matrix:
        value: ${{ jobs.route.outputs.terraform_matrix }}
      has_terraform:
        value: ${{ jobs.route.outputs.has_terraform }}

permissions:
  contents: read

jobs:
  route:
    name: Route affected units
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      routing_failed: ${{ steps.test.outputs.routing_failed }}
      repo_wide: ${{ steps.test.outputs.repo_wide }}
      test_matrix: ${{ steps.test.outputs.matrix }}
      has_test: ${{ steps.test.outputs.has_entries }}
      integration_matrix: ${{ steps.integration.outputs.matrix }}
      has_integration: ${{ steps.integration.outputs.has_entries }}
      node_matrix: ${{ steps.node.outputs.matrix }}
      has_node: ${{ steps.node.outputs.has_entries }}
      artifact_matrix: ${{ steps.artifact.outputs.matrix }}
      has_artifact: ${{ steps.artifact.outputs.has_entries }}
      scenario_matrix: ${{ steps.scenario.outputs.matrix }}
      has_scenario: ${{ steps.scenario.outputs.has_entries }}
      terraform_matrix: ${{ steps.terraform.outputs.matrix }}
      has_terraform: ${{ steps.terraform.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      # The tool is no longer compiled here, but `graph *` still shells out to
      # `cargo metadata --no-deps`, so the toolchain has to exist. No cargo
      # cache: `--no-deps` resolves nothing and reads no registry, and the key
      # this job used to declare was never written by any workflow anyway.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"

      - name: Download the prepared workspace tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: workspace-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/aex-tools

      # The digests arrive through the job-output channel, not inside the
      # artifact, so an artifact that lies about itself cannot self-certify.
      - name: Use the prepared workspace tools
        env:
          RELEASE_TOOL_SHA256: ${{ inputs.release_tool_sha256 }}
          WORKSPACE_CHECK_SHA256: ${{ inputs.workspace_check_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aex-tools"
          [[ "$RELEASE_TOOL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WORKSPACE_CHECK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$RELEASE_TOOL_SHA256" aex-release-tool > expected.sha256
          printf '%s  %s\n' "$WORKSPACE_CHECK_SHA256" aex-workspace-check >> expected.sha256
          sha256sum --check --strict expected.sha256
          [[ "$(find . -maxdepth 1 -type f ! -name expected.sha256 | wc -l)" -eq 2 ]]
          chmod 0755 aex-release-tool aex-workspace-check
          ./aex-release-tool --version | grep -Eq '^aex-release-tool [0-9]+\.[0-9]+\.[0-9]+'
          ./aex-workspace-check --version | grep -Eq '^aex-workspace-check [0-9]+\.[0-9]+\.[0-9]+'
          echo "$RUNNER_TEMP/aex-tools" >> "$GITHUB_PATH"

      - name: Verify the delivery graph
        env:
          ROUTING_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [[ "$ROUTING_LANE" == "release" ]]; then
            aex-release-tool graph verify --release
          else
            aex-release-tool graph verify
          fi

      - name: Select
        run: |
          set -euo pipefail
          aex-release-tool graph select \
            --base "${{ inputs.base_sha }}" --head "${{ inputs.head_sha }}" \
            --mode "${{ inputs.mode }}" --lane "${{ inputs.lane }}" \
            --out selection.json --quiet

      - name: Select artifact graph
        run: |
          set -euo pipefail
          aex-release-tool graph select \
            --base "${{ inputs.base_sha }}" --head "${{ inputs.head_sha }}" \
            --mode "${{ inputs.artifact_mode }}" --lane "${{ inputs.lane }}" \
            --out artifact-selection.json --quiet

      - name: Test matrix
        id: test
        run: |
          set -euo pipefail
          aex-release-tool graph matrix \
            --selection selection.json --kind test \
            --artifact-selection artifact-selection.json \
            --partitions "${{ inputs.partitions }}" \
            --github-output "$GITHUB_OUTPUT" --quiet

      # Engine-backed targets only: packages that both map a target to the
      # integration layer and declare the `integration-engines` feature. A
      # package whose integration-layer target needs no container is left to the
      # unit lane, which already runs it, rather than run twice under two
      # receipts. Partitioned at 1 because each entry is one package's engine
      # suite and the engines, not the assertions, are what cost wall clock -
      # sharding a package would start the same containers twice.
      - name: Integration matrix
        id: integration
        run: |
          set -euo pipefail
          aex-release-tool graph matrix \
            --selection selection.json --kind integration \
            --partitions 1 \
            --github-output "$GITHUB_OUTPUT" --quiet

      - name: Artifact matrix
        id: artifact
        run: |
          set -euo pipefail
          aex-release-tool graph matrix \
            --selection artifact-selection.json --kind artifact \
            --github-output "$GITHUB_OUTPUT" --quiet

      - name: Node matrix
        id: node
        run: |
          set -euo pipefail
          aex-release-tool graph matrix \
            --selection selection.json --kind node \
            --artifact-selection artifact-selection.json \
            --partitions "${{ inputs.partitions }}" \
            --github-output "$GITHUB_OUTPUT" --quiet

      - name: Scenario matrix
        id: scenario
        run: |
          set -euo pipefail
          aex-release-tool graph matrix \
            --selection selection.json --kind scenario \
            --github-output "$GITHUB_OUTPUT" --quiet

      - name: Terraform matrix
        id: terraform
        run: |
          set -euo pipefail
          aex-release-tool graph matrix \
            --selection selection.json --kind terraform \
            --github-output "$GITHUB_OUTPUT" --quiet

      - name: Summarize the routing decision
        run: |
          set -euo pipefail
          aex-release-tool graph diff \
            --base "${{ inputs.base_sha }}" --head "${{ inputs.head_sha }}" \
            --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: selection-${{ inputs.lane }}
          path: |
            selection.json
            artifact-selection.json
          if-no-files-found: error
