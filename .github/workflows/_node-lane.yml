# The retained TypeScript lane.
#
# The SDK's conformance corpus runs on Node and on Bun, because "it works on
# our runtime" is not the claim the package makes. The packed tarball is
# installed outside the workspace, so a missing file or a stray workspace
# specifier fails here rather than at a customer.

name: node-lane

on:
  workflow_call:
    inputs:
      matrix:
        description: The routed Node package matrix, as canonical JSON.
        type: string
        required: true
      lane:
        type: string
        required: true
      job_name:
        description: Caller job id recorded in the unit receipts.
        type: string
        required: true
      selection_mode:
        description: affected | full | shadow
        type: string
        required: true

permissions:
  contents: read

jobs:
  node:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          set -euo pipefail
          bun run lint
          bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Packed clean install
        run: |
          set -euo pipefail
          bun pm pack --filter @aexhq/sdk --destination "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP"
          mkdir -p consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          node --input-type=module -e "import('@aexhq/sdk').then(m => { if (!m) process.exit(1); })"

  unit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"

      - name: Cargo cache
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1
        with:
          save-if: false
          shared-key: ${{ inputs.lane }}-node-evidence

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck the selected package
        env:
          RECEIPT_DIR: target/aex-evidence/node/${{ matrix.partition }}
          SELECTED_PACKAGE_DIR: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          date --utc +'%Y-%m-%dT%H:%M:%SZ' > "$RECEIPT_DIR/lint-started-at.txt"
          bun run --cwd "$SELECTED_PACKAGE_DIR" typecheck 2>&1 | tee "$RECEIPT_DIR/typecheck.log"
          jq -n '{schema:"aex.check-report.v1",producer:"TypeScript 5.8.3",checks:[
            {id:"selected-package-typecheck",status:"passed"}
          ]}' > "$RECEIPT_DIR/lint-report.json"

      # Bun has no non-executing test-list command. A first complete, unfiltered
      # JUnit run is therefore the runner-produced declaration. The evidence
      # run below repeats the same package without filters, and evidence verify
      # requires the second report to collect this exact non-zero count.
      - name: Record the declared test inventory
        env:
          RECEIPT_DIR: target/aex-evidence/node/${{ matrix.partition }}
          SELECTED_PACKAGE: ${{ matrix.name }}
          SELECTED_PACKAGE_DIR: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ -n "$SELECTED_PACKAGE_DIR" && "$SELECTED_PACKAGE_DIR" != /* ]]
          [[ "$SELECTED_PACKAGE_DIR" != *".."* ]]
          [[ "$(jq -er .name "$SELECTED_PACKAGE_DIR/package.json")" == "$SELECTED_PACKAGE" ]]
          mkdir -p "$RECEIPT_DIR"
          date --utc +'%Y-%m-%dT%H:%M:%SZ' > "$RECEIPT_DIR/started-at.txt"
          bun test --cwd "$SELECTED_PACKAGE_DIR" --isolate \
            --reporter=junit \
            --reporter-outfile="$GITHUB_WORKSPACE/$RECEIPT_DIR/declared-junit.xml"
          node scripts/cicd/assert-no-skips.mjs "$RECEIPT_DIR/declared-junit.xml"
          declared=$(REPORT_PATH="$RECEIPT_DIR/declared-junit.xml" bun -e '
            import { readFileSync } from "node:fs";
            import { listJunitTestcases } from "./scripts/cicd/junit-report.mjs";
            const total = listJunitTestcases(readFileSync(process.env.REPORT_PATH, "utf8")).length;
            if (total < 1) process.exit(1);
            process.stdout.write(String(total));
          ')
          [[ "$declared" =~ ^[1-9][0-9]*$ ]]
          printf '%s\n' "$declared" > "$RECEIPT_DIR/declared-count.txt"

      - name: Test the selected package
        env:
          RECEIPT_DIR: target/aex-evidence/node/${{ matrix.partition }}
          SELECTED_PACKAGE_DIR: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          bun test --cwd "$SELECTED_PACKAGE_DIR" --isolate \
            --reporter=junit \
            --reporter-outfile="$GITHUB_WORKSPACE/$RECEIPT_DIR/junit.xml"
          node scripts/cicd/assert-no-skips.mjs "$RECEIPT_DIR/junit.xml"

      - name: Build and verify the unit receipt
        env:
          CALLER_JOB: ${{ inputs.job_name }}
          RECEIPT_DIR: target/aex-evidence/node/${{ matrix.partition }}
          SELECTED_PACKAGE: ${{ matrix.name }}
          SELECTED_PACKAGE_DIR: ${{ matrix.directory }}
          SELECTED_UNITS_JSON: ${{ toJSON(matrix.units) }}
          SELECTION_MODE: ${{ inputs.selection_mode }}
          PARTITION_INDEX: ${{ matrix.partition }}
          PARTITION_TOTAL: ${{ matrix.partitions }}
          RECEIPT_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$(jq -er .name "$SELECTED_PACKAGE_DIR/package.json")" == "$SELECTED_PACKAGE" ]]
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<<"$SELECTED_UNITS_JSON" >/dev/null
          [[ "$PARTITION_INDEX" =~ ^[0-9]+$ ]]
          [[ "$PARTITION_TOTAL" =~ ^[1-9][0-9]*$ ]]
          (( PARTITION_INDEX < PARTITION_TOTAL ))
          completed_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          started_at=$(<"$RECEIPT_DIR/started-at.txt")
          declared=$(<"$RECEIPT_DIR/declared-count.txt")
          [[ "$declared" =~ ^[1-9][0-9]*$ ]]
          bun_lock_digest="sha256:$(sha256sum bun.lock | cut -d' ' -f1)"
          package_key=$(printf '%s' "$SELECTED_PACKAGE" | sha256sum | cut -c1-12)
          receipt_id="rc_${RECEIPT_LANE}_node_${package_key}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg receiptId "$receipt_id" \
            --arg lane "$RECEIPT_LANE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg jobName "$CALLER_JOB" \
            --arg builderId "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_node-lane.yml@$GITHUB_SHA" \
            --arg bunLockDigest "$bun_lock_digest" \
            --argjson unitIds "$SELECTED_UNITS_JSON" \
            --arg mode "$SELECTION_MODE" \
            --arg package "$SELECTED_PACKAGE" \
            --argjson partitionIndex "$PARTITION_INDEX" \
            --argjson partitionTotal "$PARTITION_TOTAL" \
            --argjson declared "$declared" \
            --arg startedAt "$started_at" \
            --arg completedAt "$completed_at" \
            '{
              receiptId: $receiptId,
              class: "unit",
              layer: "unit",
              lane: $lane,
              concerns: [],
              declared: $declared,
              source: {
                repository: $repository,
                commitSha: $commitSha,
                treeClean: true,
                workflowRunId: $workflowRunId,
                runAttempt: $runAttempt,
                jobName: $jobName,
                builderId: $builderId
              },
              inputs: {bunLockDigest: $bunLockDigest},
              subject: {unitIds: $unitIds},
              selection: {
                mode: $mode,
                filterset: "all()",
                packages: [$package],
                partition: {index: $partitionIndex, total: $partitionTotal}
              },
              data: {residue: "none", secretCanaryObserved: false},
              startedAt: $startedAt,
              completedAt: $completedAt
            }' > "$RECEIPT_DIR/context.json"
          cargo run --locked --release -p aex-release-tool -- evidence new \
            --context "$RECEIPT_DIR/context.json" \
            --junit "$RECEIPT_DIR/junit.xml" \
            --out "$RECEIPT_DIR/receipt.json"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$RECEIPT_DIR/receipt.json" --kind junit \
            --file "$RECEIPT_DIR/junit.xml" \
            --uri "artifact://junit-${RECEIPT_LANE}-node-${PARTITION_INDEX}/junit.xml"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$RECEIPT_DIR/receipt.json" --kind junit \
            --file "$RECEIPT_DIR/declared-junit.xml" \
            --uri "artifact://junit-${RECEIPT_LANE}-node-${PARTITION_INDEX}/declared-junit.xml"
          jq -e --argjson expectedDeclared "$declared" '
            .schema == "aex.evidence-receipt.v1" and
            .class == "unit" and
            .source.repository == env.GITHUB_REPOSITORY and
            .source.commitSha == env.GITHUB_SHA and
            .source.workflowRunId == env.GITHUB_RUN_ID and
            .source.runAttempt == (env.GITHUB_RUN_ATTEMPT | tonumber) and
            .source.jobName == env.CALLER_JOB and
            .subject.unitIds == (env.SELECTED_UNITS_JSON | fromjson) and
            .selection.packages == [env.SELECTED_PACKAGE] and
            .selection.partition.index == (env.PARTITION_INDEX | tonumber) and
            .selection.partition.total == (env.PARTITION_TOTAL | tonumber) and
            .inventory.declared == $expectedDeclared and
            .inventory.collected == $expectedDeclared and
            .inventory.skipped == 0 and
            .inventory.ignored == 0 and
            .inventory.filteredAtRuntime == 0 and
            .inventory.retried == 0 and
            .inventory.flaky == 0
          ' "$RECEIPT_DIR/receipt.json" >/dev/null
          cargo run --locked --release -p aex-release-tool -- evidence verify \
            --receipt "$RECEIPT_DIR/receipt.json"

      - name: Build and verify semantic and lint receipts
        env:
          CALLER_JOB: ${{ inputs.job_name }}
          RECEIPT_DIR: target/aex-evidence/node/${{ matrix.partition }}
          SELECTED_PACKAGE: ${{ matrix.name }}
          SELECTED_UNITS_JSON: ${{ toJSON(matrix.units) }}
          RECEIPT_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          completed_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          lint_started_at=$(<"$RECEIPT_DIR/lint-started-at.txt")
          jq \
            --arg receiptId "rc_${RECEIPT_LANE}_node_lint_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${{ matrix.partition }}" \
            --arg startedAt "$lint_started_at" \
            --arg completedAt "$completed_at" \
            '.receiptId=$receiptId | .class="lint" | .layer="unit" |
             .concerns=[] | .declared=1 | .startedAt=$startedAt | .completedAt=$completedAt' \
            "$RECEIPT_DIR/context.json" > "$RECEIPT_DIR/lint-context.json"
          cargo run --locked --release -p aex-release-tool -- evidence new-check \
            --context "$RECEIPT_DIR/lint-context.json" \
            --report "$RECEIPT_DIR/lint-report.json" \
            --out "$RECEIPT_DIR/receipt-lint.json"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$RECEIPT_DIR/receipt-lint.json" --kind log \
            --file "$RECEIPT_DIR/typecheck.log" \
            --uri "artifact://lint-${RECEIPT_LANE}-node-${{ matrix.partition }}/typecheck.log"
          cargo run --locked --release -p aex-release-tool -- evidence verify \
            --receipt "$RECEIPT_DIR/receipt-lint.json"

          mapfile -t producers < <(
            jq -c --arg package "$SELECTED_PACKAGE" \
              '.producers[] | select(.package == $package)' release/semantic-receipts.json
          )
          for producer in "${producers[@]}"; do
            unit=$(jq -er .unit <<<"$producer")
            class=$(jq -er .class <<<"$producer")
            layer=$(jq -er .layer <<<"$producer")
            filterset=$(jq -er '.filterset | select(. == "all()")' <<<"$producer")
            jq -e --arg unit "$unit" 'index($unit) != null' \
              <<<"$SELECTED_UNITS_JSON" >/dev/null
            output="$RECEIPT_DIR/receipt-semantic-$unit-$class.json"
            jq \
              --arg receiptId "rc_${RECEIPT_LANE}_node_${class}_${unit}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
              --arg class "$class" --arg layer "$layer" --arg unit "$unit" \
              --arg filterset "$filterset" --arg completedAt "$completed_at" \
              '.receiptId=$receiptId | .class=$class | .layer=$layer |
               .concerns=[$class] | .subject.unitIds=[$unit] |
               .selection.filterset=$filterset | .selection.partition=null |
               .completedAt=$completedAt' \
              "$RECEIPT_DIR/context.json" > "$RECEIPT_DIR/context-semantic-$unit-$class.json"
            cargo run --locked --release -p aex-release-tool -- evidence new \
              --context "$RECEIPT_DIR/context-semantic-$unit-$class.json" \
              --junit "$RECEIPT_DIR/junit.xml" --out "$output"
            cargo run --locked --release -p aex-release-tool -- evidence attach \
              --receipt "$output" --kind junit --file "$RECEIPT_DIR/junit.xml" \
              --uri "artifact://junit-${RECEIPT_LANE}-node-${class}/junit.xml"
            cargo run --locked --release -p aex-release-tool -- evidence verify \
              --receipt "$output"
          done

      - name: Upload the unit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: receipt-${{ inputs.lane }}-node-${{ matrix.partition }}
          path: target/aex-evidence/node/${{ matrix.partition }}/receipt.json
          if-no-files-found: error

      - name: Upload lint and semantic receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: receipt-${{ inputs.lane }}-node-support-${{ matrix.partition }}
          path: |
            target/aex-evidence/node/${{ matrix.partition }}/receipt-lint.json
            target/aex-evidence/node/${{ matrix.partition }}/receipt-semantic-*.json
          if-no-files-found: error

      - name: Upload the test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: junit-${{ inputs.lane }}-node-${{ matrix.partition }}
          path: |
            target/aex-evidence/node/${{ matrix.partition }}/declared-junit.xml
            target/aex-evidence/node/${{ matrix.partition }}/junit.xml
          if-no-files-found: error
