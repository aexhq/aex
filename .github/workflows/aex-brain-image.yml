name: Aex hosted Brain image

# The Aex-owned product composition is released only from an exact main commit whose complete CI
# passed. Cargo.lock records the immutable Brain and Hands source identities inside this image.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aex-brain

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact candidate
        run: docker build -f crates/aex-brain/Dockerfile -t "$IMAGE:${{ github.event.workflow_run.head_sha }}-${{ matrix.arch }}" .
      - name: Scan candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}-${{ matrix.arch }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push candidate
        run: docker push "$IMAGE:${{ github.event.workflow_run.head_sha }}-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable multi-architecture identity
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${{ github.event.workflow_run.head_sha }}" \
            "$IMAGE:${{ github.event.workflow_run.head_sha }}-amd64" \
            "$IMAGE:${{ github.event.workflow_run.head_sha }}-arm64"
