name: Aex hosted Brain image

# The Aex-owned composition is released only from an exact main commit whose complete CI passed.
# Per-architecture and sha tags are first-writer identities, preserving the first scanned object
# even though Cargo's source pins are immutable but base-image and apt inputs are not.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aex-brain
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the first per-architecture writer
        id: candidate
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref="$IMAGE:$SOURCE_SHA-$ARCH"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing the first published candidate $ref; this run will not rebuild it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build candidate once
        if: steps.candidate.outputs.exists == 'false'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -f crates/aex-brain/Dockerfile \
            -t "$IMAGE:$SOURCE_SHA-$ARCH" .
      - name: Scan the first-writer candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}-${{ matrix.arch }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish candidate without overwriting
        if: steps.candidate.outputs.exists == 'false'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref="$IMAGE:$SOURCE_SHA-$ARCH"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "candidate tag appeared after the first-writer check; refusing overwrite" >&2
            exit 1
          fi
          docker push "$ref"
      - name: Verify immutable candidate identity
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref="$IMAGE:$SOURCE_SHA-$ARCH"
          raw=$(mktemp)
          docker buildx imagetools inspect "$ref" --raw > "$raw"
          jq -e '.schemaVersion == 2 and ((.manifests // []) | length == 0)' "$raw" >/dev/null
          docker pull "$ref" >/dev/null
          test "$(docker image inspect --format '{{.Architecture}}' "$ref")" = "$ARCH"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")" = "$SOURCE_SHA"
          docker run --rm --entrypoint /bin/sh "$ref" -c '
            test "$BRAIN_LOOPHOST_TOOLCHAIN_DIR" = /opt/brain-loophost/guest
            test -f "$BRAIN_LOOPHOST_TOOLCHAIN_DIR/componentize-one.mjs"
            test -f /opt/brain-loophost/wit/guest.wit
            cd "$BRAIN_LOOPHOST_TOOLCHAIN_DIR"
            node --input-type=module -e "import(\"@bytecodealliance/componentize-js\")"
            ! command -v npm
          '
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest)
          printf '%s candidate: `%s@%s`\n' "$ARCH" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    if: github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or verify the immutable multi-architecture identity
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest
          }
          verify_index() {
            local ref=$1 amd=$2 arm=$3 raw
            raw=$(mktemp)
            docker buildx imagetools inspect "$ref" --raw > "$raw"
            jq -e --arg amd "$amd" --arg arm "$arm" '
              .schemaVersion == 2 and
              (.manifests | type == "array" and length == 2) and
              ([.manifests[] | select(.digest == $amd and .platform.os == "linux" and .platform.architecture == "amd64")] | length == 1) and
              ([.manifests[] | select(.digest == $arm and .platform.os == "linux" and .platform.architecture == "arm64")] | length == 1) and
              ([.manifests[].digest] | unique | length == 2)
            ' "$raw" >/dev/null
          }

          amd=$(digest_of "$IMAGE:$SOURCE_SHA-amd64")
          arm=$(digest_of "$IMAGE:$SOURCE_SHA-arm64")
          release="$IMAGE:sha-$SOURCE_SHA"
          if docker buildx imagetools inspect "$release" >/dev/null 2>&1; then
            verify_index "$release" "$amd" "$arm" || {
              echo "$release already exists with different children; refusing overwrite" >&2
              exit 1
            }
          else
            docker buildx imagetools create \
              -t "$release" \
              "$IMAGE@$amd" \
              "$IMAGE@$arm"
          fi
          verify_index "$release" "$amd" "$arm"
          digest=$(digest_of "$release")

          latest_digest=""
          if docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
            latest_digest=$(digest_of "$IMAGE:latest")
          fi
          if [[ "$latest_digest" != "$digest" ]]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$digest"
          fi
          test "$(digest_of "$IMAGE:latest")" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$IMAGE" \
            --arg manifest_digest "$digest" \
            --arg amd64_digest "$amd" \
            --arg arm64_digest "$arm" \
            '{schema: 1, source_sha: $source_sha, image: $image, manifest_digest: $manifest_digest, platforms: {"linux/amd64": $amd64_digest, "linux/arm64": $arm64_digest}}' \
            > "$RUNNER_TEMP/image-release.json"
          {
            echo '### Aex hosted Brain image'
            echo
            printf 'Immutable identity: `%s:sha-%s`\n' "$IMAGE" "$SOURCE_SHA"
            echo
            printf 'Resolved manifest: `%s@%s`\n' "$IMAGE" "$digest"
            echo
            printf 'Platforms: `linux/amd64@%s`, `linux/arm64@%s`\n' "$amd" "$arm"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: aex-brain-image-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/image-release.json
          if-no-files-found: error
          retention-days: 90
