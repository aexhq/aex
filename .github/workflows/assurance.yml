# Lane class 3 — scheduled assurance.
#
# A scheduled suite is never "optional". If a release requires a fresh receipt
# of a class, `admit` waits for a passing run of the suite that produces it and
# exits 42 until one exists. That is the only thing that keeps a weekly gate
# from decaying into a weekly notification.

name: assurance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which assurance profile to run.
        type: choice
        required: true
        options:
          - full-graph
          - supply-chain
          - deep-risk
          - cold-rebuild
  schedule:
    # full-graph
    - cron: "0 2 * * *"
    # supply-chain
    - cron: "0 3 * * *"
    # deep-risk
    - cron: "0 4 * * 0"
    # cold-rebuild
    - cron: "0 5 * * 1"

concurrency:
  group: assurance-${{ github.event.inputs.suite || github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suite:
    name: Resolve the suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.resolve.outputs.name }}
    steps:
      - name: Resolve
        id: resolve
        env:
          DISPATCHED: ${{ github.event.inputs.suite }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCHED:-}" ]; then
            echo "name=$DISPATCHED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "0 2 * * *") echo "name=full-graph" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * *") echo "name=supply-chain" >> "$GITHUB_OUTPUT" ;;
            "0 4 * * 0") echo "name=deep-risk" >> "$GITHUB_OUTPUT" ;;
            "0 5 * * 1") echo "name=cold-rebuild" >> "$GITHUB_OUTPUT" ;;
            *) echo "unrecognised schedule"; exit 2 ;;
          esac

  route:
    name: Route
    needs: suite
    if: needs.suite.outputs.name == 'full-graph'
    uses: ./.github/workflows/_route.yml
    with:
      mode: shadow
      artifact_mode: shadow
      lane: assurance
      base_sha: ${{ github.event.before || github.sha }}
      head_sha: ${{ github.sha }}
      partitions: 8

  full-graph:
    name: Full graph
    needs: [suite, route]
    if: needs.suite.outputs.name == 'full-graph'
    uses: ./.github/workflows/_rust-lane.yml
    with:
      matrix: ${{ needs.route.outputs.test_matrix }}
      lane: assurance
      job_name: full-graph
      selection_mode: shadow
      cache_mode: restore

  full-scenarios:
    name: Full scenarios
    needs: [suite, route]
    if: needs.suite.outputs.name == 'full-graph' && needs.route.outputs.has_scenario == 'true'
    uses: ./.github/workflows/_scenario-lane.yml
    with:
      matrix: ${{ needs.route.outputs.scenario_matrix }}
      lane: assurance

  supply-chain:
    name: Supply chain
    needs: suite
    if: needs.suite.outputs.name == 'supply-chain'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"

      - name: Install the auditors
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60  # v2.85.7
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Cargo advisories and licences
        run: cargo deny --all-features check

      - name: Cargo audit
        run: cargo audit --deny warnings

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Bun audit
        run: bun audit

      - name: Action pin drift
        run: cargo run --locked --release -p aex-release-tool -- policy workflows

  deep-risk:
    name: Deep risk
    needs: suite
    if: needs.suite.outputs.name == 'deep-risk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Declare what this suite still owes
        run: |
          set -euo pipefail
          echo "Fuzz, mutation, Miri and sanitizer targets are derived from each"
          echo "crate risk declaration. No crate declares one yet, so the suite"
          echo "has nothing to select and says so rather than reporting green."
          exit 40

  cold-rebuild:
    name: Cold rebuild
    needs: suite
    if: needs.suite.outputs.name == 'cold-rebuild'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Rebuild every published artifact with no cache
        run: |
          set -euo pipefail
          echo "This suite is what keeps caches from becoming artifact authority."
          echo "It rebuilds every published artifact on a cache-free runner and"
          echo "compares digests. Nothing is published yet, so there is nothing"
          echo "to compare against."
          exit 40
