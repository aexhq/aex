name: model catalog publish

on:
  push:
    branches:
      - main
    paths:
      - "release/model-catalog/*.source.json"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed public main commit containing the catalog source.
        type: string
        required: true
      catalog_source_path:
        description: Tracked release/model-catalog/*.source.json compatibility source.
        type: string
        required: true
      catalog_source_sha256:
        description: Exact lowercase sha256 identity of the reviewed source bytes.
        type: string
        required: true

concurrency:
  group: model-catalog-publisher
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: sign and publish reviewed model-catalog compatibility metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aex-model-catalog-publisher
    permissions:
      contents: write
      id-token: write
    env:
      AWS_PAGER: ""
      AEX_MODEL_CATALOG_BINDING_JSON: ${{ vars.AEX_MODEL_CATALOG_BINDING_JSON }}
      AEX_MODEL_CATALOG_AWS_REGION: ${{ vars.AEX_MODEL_CATALOG_AWS_REGION }}
      AEX_MODEL_CATALOG_AWS_ROLE_ARN: ${{ vars.AEX_MODEL_CATALOG_AWS_ROLE_ARN }}
      AEX_MODEL_CATALOG_KMS_KEY_ARN: ${{ vars.AEX_MODEL_CATALOG_KMS_KEY_ARN }}
      AEX_MODEL_CATALOG_KMS_KEY_ID: ${{ vars.AEX_MODEL_CATALOG_KMS_KEY_ID }}
      AEX_MODEL_CATALOG_EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AEX_MODEL_CATALOG_EXPECTED_AWS_ACCOUNT_ID }}
      AEX_MODEL_CATALOG_PUBLISH_CONFIRMATION: ${{ secrets.AEX_MODEL_CATALOG_PUBLISH_CONFIRMATION }}
      DISPATCH_CATALOG_SOURCE_PATH: ${{ inputs.catalog_source_path }}
      DISPATCH_CATALOG_SOURCE_SHA256: ${{ inputs.catalog_source_sha256 }}
      DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
      PUBLISH_DIR: .tmp/model-catalog/publish
    steps:
      - name: Refuse an unpinned or unapproved request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "aexhq/aex" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$DISPATCH_SOURCE_SHA" == "$GITHUB_SHA" ]]
            [[ "$DISPATCH_CATALOG_SOURCE_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$DISPATCH_CATALOG_SOURCE_PATH" =~ ^release/model-catalog/[A-Za-z0-9._-]+\.source\.json$ ]]
          fi
          [[ -n "$AEX_MODEL_CATALOG_PUBLISH_CONFIRMATION" ]]
          [[ "$AEX_MODEL_CATALOG_AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]$ ]]
          [[ "$AEX_MODEL_CATALOG_AWS_ROLE_ARN" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/aex-model-catalog-publisher$ ]]
          [[ "$AEX_MODEL_CATALOG_KMS_KEY_ARN" =~ ^arn:aws[a-z-]*:kms:${AEX_MODEL_CATALOG_AWS_REGION}:[0-9]{12}:key/[0-9a-f-]+$ ]]
          [[ "$AEX_MODEL_CATALOG_KMS_KEY_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
          [[ "$AEX_MODEL_CATALOG_EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AEX_MODEL_CATALOG_AWS_ROLE_ARN" == *"::${AEX_MODEL_CATALOG_EXPECTED_AWS_ACCOUNT_ID}:"* ]]
          [[ "$AEX_MODEL_CATALOG_KMS_KEY_ARN" == *":${AEX_MODEL_CATALOG_EXPECTED_AWS_ACCOUNT_ID}:"* ]]

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify reviewed catalog source before any AWS call
        shell: bash
        run: |
          set -euo pipefail
          reviewed_source_sha="$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$reviewed_source_sha" ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            catalog_source_path="$DISPATCH_CATALOG_SOURCE_PATH"
            catalog_source_sha256="$DISPATCH_CATALOG_SOURCE_SHA256"
          else
            before_sha=$(jq -er '.before | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")
            [[ "$before_sha" != "0000000000000000000000000000000000000000" ]]
            mapfile -t changed_sources < <(
              git diff --name-only --no-renames --diff-filter=ACMRT \
                "$before_sha" "$reviewed_source_sha" -- 'release/model-catalog/*.source.json'
            )
            [[ "${#changed_sources[@]}" == "1" ]]
            catalog_source_path="${changed_sources[0]}"
            [[ "$catalog_source_path" =~ ^release/model-catalog/[A-Za-z0-9._-]+\.source\.json$ ]]
            catalog_source_sha256="sha256:$(sha256sum "$catalog_source_path" | cut -d' ' -f1)"
          fi
          git ls-files --error-unmatch -- "$catalog_source_path" >/dev/null
          resolved=$(realpath "$catalog_source_path")
          expected_prefix=$(realpath release/model-catalog)/
          [[ "$resolved" == "$expected_prefix"* ]]
          actual="sha256:$(sha256sum "$catalog_source_path" | cut -d' ' -f1)"
          [[ "$actual" == "$catalog_source_sha256" ]]
          git diff --exit-code -- "$catalog_source_path"
          mkdir -p "$PUBLISH_DIR"
          {
            echo "CATALOG_SOURCE_PATH=$catalog_source_path"
            echo "CATALOG_SOURCE_SHA256=$catalog_source_sha256"
            echo "REVIEWED_SOURCE_SHA=$reviewed_source_sha"
          } >> "$GITHUB_ENV"

      - name: Acquire the optional last-good predecessor before any AWS call
        shell: bash
        run: |
          set -euo pipefail
          binding="${AEX_MODEL_CATALOG_BINDING_JSON:-}"
          if [[ -z "$binding" ]]; then
            echo "PREVIOUS_COLLECTION_PATH=" >> "$GITHUB_ENV"
            exit 0
          fi
          (( ${#binding} <= 49152 ))
          canonical_binding=$(jq -cS . <<<"$binding")
          [[ "$binding" == "$canonical_binding" ]]
          jq -e '
            type == "object" and
            keys == ["collectionSha256", "collectionUri", "schema", "trustRootsJson", "trustRootsSha256"] and
            .schema == "aex.model-catalog-build-binding.v1" and
            (.collectionUri | type == "string") and
            (.collectionSha256 | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
            (.trustRootsJson | type == "string" and length > 0) and
            (.trustRootsSha256 | type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' <<<"$binding" >/dev/null
          uri=$(jq -er .collectionUri <<<"$binding")
          digest=$(jq -er .collectionSha256 <<<"$binding")
          roots_json=$(jq -er .trustRootsJson <<<"$binding")
          roots_digest=$(jq -er .trustRootsSha256 <<<"$binding")
          expected_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/"
          [[ "$uri" == "$expected_prefix"* ]]
          [[ "$uri" != *'?'* && "$uri" != *'#'* && "$uri" != *'..'* ]]
          previous_roots="$PUBLISH_DIR/previous-trust-roots.json"
          printf '%s' "$roots_json" > "$previous_roots"
          [[ "$roots_json" == "$(jq -cS . "$previous_roots")" ]]
          [[ "sha256:$(sha256sum "$previous_roots" | cut -d' ' -f1)" == "$roots_digest" ]]
          previous_collection="$PUBLISH_DIR/previous-collection.json"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 67108864 \
            --output "$previous_collection" "$uri"
          [[ "sha256:$(sha256sum "$previous_collection" | cut -d' ' -f1)" == "$digest" ]]
          echo "PREVIOUS_COLLECTION_PATH=$previous_collection" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build and preflight the repository-owned publisher
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p aex-live-model-catalog \
            --bin aex-model-catalog-publisher
          install -m 0500 target/release/aex-model-catalog-publisher \
            "$PUBLISH_DIR/aex-model-catalog-publisher"
          validation_now_ms=$(date --utc +%s%3N)
          [[ "$validation_now_ms" =~ ^[0-9]{13}$ ]]
          "$PUBLISH_DIR/aex-model-catalog-publisher" generate \
            --source "$CATALOG_SOURCE_PATH" \
            --now-ms "$validation_now_ms" \
            --out "$PUBLISH_DIR/catalog-document.json"
          "$PUBLISH_DIR/aex-model-catalog-publisher" validate \
            --source "$CATALOG_SOURCE_PATH" \
            --document "$PUBLISH_DIR/catalog-document.json" \
            --now-ms "$validation_now_ms"
          catalog_document_sha256="sha256:$(sha256sum "$PUBLISH_DIR/catalog-document.json" | cut -d' ' -f1)"
          echo "CATALOG_DOCUMENT_SHA256=$catalog_document_sha256" >> "$GITHUB_ENV"
          echo "AEX_MODEL_CATALOG_VALIDATION_NOW_MS=$validation_now_ms" >> "$GITHUB_ENV"
          "$PUBLISH_DIR/aex-model-catalog-publisher" prepare \
            --document "$PUBLISH_DIR/catalog-document.json" \
            --now-ms "$validation_now_ms" \
            --out "$PUBLISH_DIR/signing-request.json"

      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AEX_MODEL_CATALOG_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AEX_MODEL_CATALOG_AWS_REGION }}
          role-session-name: aex-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ vars.AEX_MODEL_CATALOG_EXPECTED_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Derive the exact P-256 trust root from KMS
        shell: bash
        run: |
          set -euo pipefail
          aws kms describe-key --key-id "$AEX_MODEL_CATALOG_KMS_KEY_ARN" \
            --output json \
            --query '{Arn:KeyMetadata.Arn,KeySpec:KeyMetadata.KeySpec,KeyUsage:KeyMetadata.KeyUsage,KeyState:KeyMetadata.KeyState,KeyManager:KeyMetadata.KeyManager,Origin:KeyMetadata.Origin,MultiRegion:KeyMetadata.MultiRegion,SigningAlgorithms:KeyMetadata.SigningAlgorithms}' \
            > "$PUBLISH_DIR/kms-description.json"
          jq -e --arg arn "$AEX_MODEL_CATALOG_KMS_KEY_ARN" \
            '.Arn == $arn and .KeySpec == "ECC_NIST_P256" and
             .KeyUsage == "SIGN_VERIFY" and .KeyState == "Enabled" and
             .KeyManager == "CUSTOMER" and .Origin == "AWS_KMS" and
             .MultiRegion == false and .SigningAlgorithms == ["ECDSA_SHA_256"]' \
            "$PUBLISH_DIR/kms-description.json" >/dev/null
          aws kms get-public-key --key-id "$AEX_MODEL_CATALOG_KMS_KEY_ARN" \
            --output json \
            --query '{KeyId:KeyId,KeySpec:KeySpec,KeyUsage:KeyUsage,SigningAlgorithms:SigningAlgorithms,PublicKey:PublicKey}' \
            > "$PUBLISH_DIR/kms-public-key.json"
          "$PUBLISH_DIR/aex-model-catalog-publisher" trust-roots \
            --kms-output "$PUBLISH_DIR/kms-public-key.json" \
            --expected-kms-key-arn "$AEX_MODEL_CATALOG_KMS_KEY_ARN" \
            --key-id "$AEX_MODEL_CATALOG_KMS_KEY_ID" \
            --out "$PUBLISH_DIR/trust-roots.json"
          rm "$PUBLISH_DIR/kms-description.json" "$PUBLISH_DIR/kms-public-key.json"

      - name: Sign only the prepared digest and runtime-verify the collection
        shell: bash
        run: |
          set -euo pipefail
          jq -er '.schema == "aex.model-catalog-signing-request.v1" and
                  .signingAlgorithm == "ECDSA_SHA_256" and .messageType == "DIGEST"' \
            "$PUBLISH_DIR/signing-request.json" >/dev/null
          jq -er .messageDigestBase64 "$PUBLISH_DIR/signing-request.json" \
            | base64 --decode > "$PUBLISH_DIR/message.digest"
          [[ "$(stat -c '%s' "$PUBLISH_DIR/message.digest")" == "32" ]]
          request_digest=$(jq -er .messageDigestSha256 "$PUBLISH_DIR/signing-request.json")
          [[ "sha256:$(sha256sum "$PUBLISH_DIR/message.digest" | cut -d' ' -f1)" == "$request_digest" ]]
          aws kms sign --key-id "$AEX_MODEL_CATALOG_KMS_KEY_ARN" \
            --signing-algorithm ECDSA_SHA_256 --message-type DIGEST \
            --message "fileb://$PWD/$PUBLISH_DIR/message.digest" \
            --output json \
            --query '{KeyId:KeyId,Signature:Signature,SigningAlgorithm:SigningAlgorithm}' \
            > "$PUBLISH_DIR/kms-signature.json"
          "$PUBLISH_DIR/aex-model-catalog-publisher" record-signature \
            --request "$PUBLISH_DIR/signing-request.json" \
            --key-id "$AEX_MODEL_CATALOG_KMS_KEY_ID" \
            --expected-kms-key-arn "$AEX_MODEL_CATALOG_KMS_KEY_ARN" \
            --kms-output "$PUBLISH_DIR/kms-signature.json" \
            --out "$PUBLISH_DIR/signature-record.json"
          assemble_args=(
            --document "$PUBLISH_DIR/catalog-document.json"
            --signature "$PUBLISH_DIR/signature-record.json"
            --trust-roots "$PUBLISH_DIR/trust-roots.json"
            --now-ms "$AEX_MODEL_CATALOG_VALIDATION_NOW_MS"
            --out "$PUBLISH_DIR/collection.json"
            --binding-out "$PUBLISH_DIR/publication-binding.json"
          )
          if [[ -n "${PREVIOUS_COLLECTION_PATH:-}" ]]; then
            assemble_args+=(--previous-collection "$PREVIOUS_COLLECTION_PATH")
          fi
          "$PUBLISH_DIR/aex-model-catalog-publisher" assemble "${assemble_args[@]}"
          rm "$PUBLISH_DIR/message.digest" "$PUBLISH_DIR/kms-signature.json" \
            "$PUBLISH_DIR/signature-record.json"

      - name: Publish and read back a never-overwritten release binding
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          roots_digest=$(jq -er '.trustRootsSha256 | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$PUBLISH_DIR/publication-binding.json")
          collection_digest=$(jq -er '.collectionSha256 | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$PUBLISH_DIR/publication-binding.json")
          [[ "$roots_digest" == "sha256:$(sha256sum "$PUBLISH_DIR/trust-roots.json" | cut -d' ' -f1)" ]]
          [[ "$collection_digest" == "sha256:$(sha256sum "$PUBLISH_DIR/collection.json" | cut -d' ' -f1)" ]]

          roots_asset="model-catalog-trust-roots-${roots_digest#sha256:}.json"
          collection_asset="model-catalog-collection-${collection_digest#sha256:}.json"
          publication_digest="sha256:$(sha256sum "$PUBLISH_DIR/publication-binding.json" | cut -d' ' -f1)"
          publication_asset="model-catalog-publication-binding-${publication_digest#sha256:}.json"
          cp "$PUBLISH_DIR/trust-roots.json" "$PUBLISH_DIR/$roots_asset"
          cp "$PUBLISH_DIR/collection.json" "$PUBLISH_DIR/$collection_asset"
          cp "$PUBLISH_DIR/publication-binding.json" "$PUBLISH_DIR/$publication_asset"

          tag="model-catalog-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; catalog identities are never replaced" >&2
            exit 21
          fi
          if git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; catalog identities are never reused" >&2
            exit 21
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          build_binding=$(jq -cnS \
            --arg collectionUri "$base/$collection_asset" \
            --arg collectionSha256 "$collection_digest" \
            --arg trustRootsSha256 "$roots_digest" \
            --rawfile trustRootsJson "$PUBLISH_DIR/trust-roots.json" \
            '{collectionSha256:$collectionSha256,collectionUri:$collectionUri,
              schema:"aex.model-catalog-build-binding.v1",
              trustRootsJson:$trustRootsJson,trustRootsSha256:$trustRootsSha256}')
          printf '%s' "$build_binding" > "$PUBLISH_DIR/build-binding.json"
          build_binding_digest="sha256:$(sha256sum "$PUBLISH_DIR/build-binding.json" | cut -d' ' -f1)"
          build_binding_asset="model-catalog-build-binding-${build_binding_digest#sha256:}.json"
          mv "$PUBLISH_DIR/build-binding.json" "$PUBLISH_DIR/$build_binding_asset"

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "Protected signed model catalog from $GITHUB_SHA." \
            --draft --prerelease
          gh release upload "$tag" \
            "$PUBLISH_DIR/$roots_asset" "$PUBLISH_DIR/$collection_asset" \
            "$PUBLISH_DIR/$publication_asset" "$PUBLISH_DIR/$build_binding_asset" \
            --repo "$GITHUB_REPOSITORY"
          observed=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets)
          [[ "$(jq -r .isDraft <<<"$observed")" == "true" ]]
          [[ "$(jq -r .isPrerelease <<<"$observed")" == "true" ]]
          [[ "$(jq '.assets | length' <<<"$observed")" == "4" ]]

          mkdir "$PUBLISH_DIR/readback"
          for asset in "$roots_asset" "$collection_asset" "$publication_asset" "$build_binding_asset"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir "$PUBLISH_DIR/readback"
            cmp --silent "$PUBLISH_DIR/$asset" "$PUBLISH_DIR/readback/$asset"
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "false" ]]
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_binding_uri=$base/$build_binding_asset" >> "$GITHUB_OUTPUT"
          echo "build_binding_sha256=$build_binding_digest" >> "$GITHUB_OUTPUT"
          echo "collection_uri=$base/$collection_asset" >> "$GITHUB_OUTPUT"
          echo "collection_sha256=$collection_digest" >> "$GITHUB_OUTPUT"

      - name: Record the human installation handoff
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          BUILD_BINDING_URI: ${{ steps.publish.outputs.build_binding_uri }}
          BUILD_BINDING_SHA256: ${{ steps.publish.outputs.build_binding_sha256 }}
          COLLECTION_URI: ${{ steps.publish.outputs.collection_uri }}
          COLLECTION_SHA256: ${{ steps.publish.outputs.collection_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "### Signed model-catalog publication"
            echo "- source: $GITHUB_SHA"
            echo "- release: $RELEASE_TAG"
            echo "- collection: $COLLECTION_URI"
            echo "- collection digest: $COLLECTION_SHA256"
            echo "- canonical build binding: $BUILD_BINDING_URI"
            echo "- build-binding digest: $BUILD_BINDING_SHA256"
            echo ""
            echo "This workflow does not install repository variables. Review the binding asset independently before atomically replacing AEX_MODEL_CATALOG_BINDING_JSON."
          } >> "$GITHUB_STEP_SUMMARY"
