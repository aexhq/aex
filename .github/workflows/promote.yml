name: Promote
run-name: promote @aexhq/sdk@${{ inputs.version }} to ${{ inputs.npm_dist_tag }} ${{ inputs.release_key && format('[{0}]', inputs.release_key) || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published @aexhq/sdk version to promote.
        required: true
        type: string
      release_run_id:
        description: GitHub Actions run ID of the green release.yml run that published this version.
        required: true
        type: string
      dev_validation_run_id:
        description: GitHub Actions run ID of the green platform deploy-dev.yml run that tested this SDK version.
        required: true
        type: string
      platform_promotion_run_id:
        description: GitHub Actions run ID of the green platform promote-prd.yml run that promoted the dev-tested candidate.
        required: true
        type: string
      public_sha:
        description: Exact aex source SHA recorded by the release manifest.
        required: true
        type: string
      sdk_integrity:
        description: Exact npm dist.integrity recorded by the release manifest.
        required: true
        type: string
      npm_dist_tag:
        description: npm dist-tag to assign.
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - canary
      release_key:
        description: Optional idempotency key used by the release controller.
        required: false
        default: ""
        type: string

concurrency:
  group: promote-aex
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to read the release.yml run named by release_run_id.
  actions: read

env:
  PACKAGE_VERSION: ${{ inputs.version }}
  RELEASE_RUN_ID: ${{ inputs.release_run_id }}
  DEV_VALIDATION_RUN_ID: ${{ inputs.dev_validation_run_id }}
  PLATFORM_PROMOTION_RUN_ID: ${{ inputs.platform_promotion_run_id }}
  RELEASE_SOURCE_SHA: ${{ inputs.public_sha }}
  RELEASE_INTEGRITY: ${{ inputs.sdk_integrity }}
  NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}

jobs:
  promote:
    name: Promote @aexhq/sdk
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Fail-closed release proof: promotion requires the run ID of the
      # release.yml run that shipped this exact version. Via the GitHub API
      # (GITHUB_TOKEN) we verify that the run (a) is .github/workflows/
      # release.yml in THIS repo — the API path is repo-scoped, so a foreign
      # run id 404s; (b) completed with conclusion=success, which release.yml
      # only reaches after static gates, publish, and the published-artifact
      # smoke pass;
      # and (c) published THIS version — the npm registry publish timestamp
      # (`time[version]`) must fall inside that run's created_at..updated_at
      # window (created_at, not workflow_started_at, so a rerun does not move
      # the window past the publish time). Any check
      # that cannot be evaluated fails the promotion.
      - name: Verify green release workflow attempt published this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ env.RELEASE_RUN_ID }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_RUN_ID}" in
            ''|*[!0-9]*)
              echo "::error::release_run_id must be a numeric workflow run id (got '${RELEASE_RUN_ID}')."
              exit 1
              ;;
          esac
          workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          workflow_path="$(jq -r '.path' <<<"${workflow_json}")"
          status="$(jq -r '.status' <<<"${workflow_json}")"
          conclusion="$(jq -r '.conclusion' <<<"${workflow_json}")"
          workflow_created_at="$(jq -r '.created_at' <<<"${workflow_json}")"
          workflow_updated_at="$(jq -r '.updated_at' <<<"${workflow_json}")"
          if [ "${workflow_path}" != ".github/workflows/release.yml" ]; then
            echo "::error::Workflow run ${RELEASE_RUN_ID} is '${workflow_path}', not .github/workflows/release.yml."
            exit 1
          fi
          if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
            echo "::error::Release run ${RELEASE_RUN_ID} has status='${status}' conclusion='${conclusion}'; promotion requires a fully green release workflow attempt (published-artifact smoke included)."
            exit 1
          fi
          published_at="$(curl -fsSL "https://registry.npmjs.org/@aexhq%2Fsdk" | jq -r --arg v "${PACKAGE_VERSION}" '.time[$v] // empty')"
          if [ -z "${published_at}" ]; then
            echo "::error::@aexhq/sdk@${PACKAGE_VERSION} has no publish timestamp on npm; nothing to promote."
            exit 1
          fi
          start_s="$(date -u -d "${workflow_created_at}" +%s)"
          end_s="$(date -u -d "${workflow_updated_at}" +%s)"
          pub_s="$(date -u -d "${published_at}" +%s)"
          if [ "${pub_s}" -lt "${start_s}" ] || [ "${pub_s}" -gt "${end_s}" ]; then
            echo "::error::@aexhq/sdk@${PACKAGE_VERSION} was published at ${published_at}, outside release workflow attempt ${RELEASE_RUN_ID}'s window (${workflow_created_at}..${workflow_updated_at}); that run did not publish this version."
            exit 1
          fi
          echo "Verified: green release workflow attempt ${RELEASE_RUN_ID} published @aexhq/sdk@${PACKAGE_VERSION} at ${published_at}."

      - name: Verify public release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ env.RELEASE_RUN_ID }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          RELEASE_SOURCE_SHA: ${{ env.RELEASE_SOURCE_SHA }}
          RELEASE_INTEGRITY: ${{ env.RELEASE_INTEGRITY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-release-manifest
          mkdir public-release-manifest
          gh run download "${RELEASE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "public-release-manifest-${RELEASE_RUN_ID}" \
            --dir public-release-manifest
          manifest_file="$(find public-release-manifest -name public-release-manifest.json -print -quit)"
          if [ -z "${manifest_file}" ]; then
            echo "::error::Release run ${RELEASE_RUN_ID} did not include public-release-manifest.json."
            exit 1
          fi
          bun scripts/cicd/release-manifest.mjs verify-public \
            --manifest "${manifest_file}" \
            --version "${PACKAGE_VERSION}" \
            --run-id "${RELEASE_RUN_ID}" \
            --head-sha "${RELEASE_SOURCE_SHA}" \
            --integrity "${RELEASE_INTEGRITY}"

      # The dev and prd workflows are separate run identities. Promotion is
      # accepted only when both are green on the same platform SHA and the prd
      # proof names the exact dev run and SDK candidate.
      - name: Verify green dev validation and production promotion
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          DEV_VALIDATION_RUN_ID: ${{ env.DEV_VALIDATION_RUN_ID }}
          PLATFORM_PROMOTION_RUN_ID: ${{ env.PLATFORM_PROMOTION_RUN_ID }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PLATFORM_REPO_TOKEN is required to verify private platform evidence."
            exit 1
          fi
          for run_id in "${DEV_VALIDATION_RUN_ID}" "${PLATFORM_PROMOTION_RUN_ID}"; do
            case "${run_id}" in
              ''|*[!0-9]*)
                echo "::error::Platform run IDs must be numeric (got '${run_id}')."
                exit 1
                ;;
            esac
          done

          dev_run="$(gh api "repos/aexhq/platform/actions/runs/${DEV_VALIDATION_RUN_ID}")"
          promotion_run="$(gh api "repos/aexhq/platform/actions/runs/${PLATFORM_PROMOTION_RUN_ID}")"
          dev_path="$(jq -r '.path' <<<"${dev_run}")"
          promotion_path="$(jq -r '.path' <<<"${promotion_run}")"
          dev_sha="$(jq -r '.head_sha' <<<"${dev_run}")"
          promotion_sha="$(jq -r '.head_sha' <<<"${promotion_run}")"
          if [ "${dev_path}" != ".github/workflows/deploy-dev.yml" ]; then
            echo "::error::Run ${DEV_VALIDATION_RUN_ID} is '${dev_path}', not deploy-dev.yml."
            exit 1
          fi
          if [ "${promotion_path}" != ".github/workflows/promote-prd.yml" ]; then
            echo "::error::Run ${PLATFORM_PROMOTION_RUN_ID} is '${promotion_path}', not promote-prd.yml."
            exit 1
          fi
          for run_json in "${dev_run}" "${promotion_run}"; do
            status="$(jq -r '.status' <<<"${run_json}")"
            conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
            if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
              echo "::error::Platform evidence must come from completed, successful workflow runs."
              exit 1
            fi
          done
          if [ "${dev_sha}" != "${promotion_sha}" ]; then
            echo "::error::Production promotion SHA ${promotion_sha} differs from dev-tested SHA ${dev_sha}."
            exit 1
          fi

          rm -rf platform-proof
          mkdir platform-proof
          gh run download "${PLATFORM_PROMOTION_RUN_ID}" \
            --repo aexhq/platform \
            --name "promotion-proof-${PLATFORM_PROMOTION_RUN_ID}" \
            --dir platform-proof
          proof_file="$(find platform-proof -name promotion-proof.json -print -quit)"
          if [ -z "${proof_file}" ]; then
            echo "::error::Promotion run ${PLATFORM_PROMOTION_RUN_ID} did not include promotion-proof.json."
            exit 1
          fi
          jq -e \
            --arg promotionRun "${PLATFORM_PROMOTION_RUN_ID}" \
            --arg devRun "${DEV_VALIDATION_RUN_ID}" \
            --arg version "${PACKAGE_VERSION}" '
              .schemaVersion == 3
              and .kind == "platform-promotion-proof"
              and .workflow == "promote-prd.yml"
              and .runId == $promotionRun
              and .devValidationRunId == $devRun
              and .sdkVersion == $version
              and (["suite_dev", "spot_canary_dev", "suite_prod", "smoke_prod"] - .gates | length == 0)
            ' "${proof_file}" >/dev/null || {
              echo "::error::Promotion proof is not bound to the requested dev run, promotion run, and SDK version."
              exit 1
            }

      - name: Verify platform validation manifest
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          DEV_VALIDATION_RUN_ID: ${{ env.DEV_VALIDATION_RUN_ID }}
          PLATFORM_PROMOTION_RUN_ID: ${{ env.PLATFORM_PROMOTION_RUN_ID }}
          RELEASE_RUN_ID: ${{ env.RELEASE_RUN_ID }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          RELEASE_SOURCE_SHA: ${{ env.RELEASE_SOURCE_SHA }}
          RELEASE_INTEGRITY: ${{ env.RELEASE_INTEGRITY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf platform-validation-manifest
          mkdir platform-validation-manifest
          gh run download "${PLATFORM_PROMOTION_RUN_ID}" \
            --repo aexhq/platform \
            --name "platform-validation-manifest-${PLATFORM_PROMOTION_RUN_ID}" \
            --dir platform-validation-manifest
          manifest_file="$(find platform-validation-manifest -name platform-validation-manifest.json -print -quit)"
          if [ -z "${manifest_file}" ]; then
            echo "::error::Platform promotion workflow attempt ${PLATFORM_PROMOTION_RUN_ID} did not include platform-validation-manifest.json."
            exit 1
          fi
          bun scripts/cicd/release-manifest.mjs verify-platform \
            --manifest "${manifest_file}" \
            --version "${PACKAGE_VERSION}" \
            --run-id "${PLATFORM_PROMOTION_RUN_ID}" \
            --dev-validation-run-id "${DEV_VALIDATION_RUN_ID}" \
            --public-release-run-id "${RELEASE_RUN_ID}" \
            --public-release-head-sha "${RELEASE_SOURCE_SHA}" \
            --integrity "${RELEASE_INTEGRITY}"

      - name: Assert version exists on npm
        run: node scripts/cicd/wait-for-npm.mjs @aexhq/sdk "${{ env.PACKAGE_VERSION }}"

      - name: Verify exact registry integrity
        env:
          RELEASE_INTEGRITY: ${{ env.RELEASE_INTEGRITY }}
        shell: bash
        run: |
          set -euo pipefail
          registry_integrity="$(npm view "@aexhq/sdk@${PACKAGE_VERSION}" dist.integrity --registry https://registry.npmjs.org)"
          if [ "${registry_integrity}" != "${RELEASE_INTEGRITY}" ]; then
            echo "::error::Registry integrity '${registry_integrity}' does not match validated release integrity '${RELEASE_INTEGRITY}'."
            exit 1
          fi

      - name: Assert version installs with Bun
        run: bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "${{ env.PACKAGE_VERSION }}"

      - name: Require current monotonic release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          dist_tags="$(npm view @aexhq/sdk dist-tags --json --registry https://registry.npmjs.org)"
          current_latest_version="$(jq -er '.latest | if type == "string" and length > 0 then . else error("missing latest dist-tag") end' <<<"${dist_tags}")"
          current_canary_version="$(jq -er '.canary | if type == "string" and length > 0 then . else error("missing canary dist-tag") end' <<<"${dist_tags}")"
          current_latest_sha="$(npm view "@aexhq/sdk@${current_latest_version}" aexRelease.sourceSha --json --registry https://registry.npmjs.org | jq -r 'select(type == "string")')"
          current_canary_sha="$(npm view "@aexhq/sdk@${current_canary_version}" aexRelease.sourceSha --json --registry https://registry.npmjs.org | jq -r 'select(type == "string")')"
          bun scripts/cicd/assert-monotonic-promotion.mjs \
            --candidate-version "${PACKAGE_VERSION}" \
            --candidate-sha "${RELEASE_SOURCE_SHA}" \
            --current-main-sha "${current_main_sha}" \
            --current-latest-version "${current_latest_version}" \
            --current-latest-sha "${current_latest_sha}" \
            --current-canary-version "${current_canary_version}" \
            --current-canary-sha "${current_canary_sha}"

      - name: Add npm dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ env.NPM_DIST_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required in the npm-release environment for npm dist-tag promotion." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm dist-tag add "@aexhq/sdk@${PACKAGE_VERSION}" "${NPM_DIST_TAG}" --registry https://registry.npmjs.org
          npm dist-tag ls @aexhq/sdk --registry https://registry.npmjs.org
