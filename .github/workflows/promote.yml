name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Deferred until the Bun-first npm publish/promote path is implemented.
        required: true
        type: string

concurrency:
  group: promote-aex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deferred:
    name: npm promote deferred
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred promote path
        run: |
          echo "::error::npm dist-tag promotion is intentionally deferred for the Bun-first migration."
          echo "Reintroduce this workflow with the dedicated publish path once npm release support is revalidated."
          exit 1
