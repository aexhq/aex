name: Live On-Demand Tests

# Consolidated, manually-dispatched pipeline for the OPTIONAL live suites that
# are deliberately kept out of the default Live User Tests sweep. One trigger
# runs them both:
#   1. Managed-gateway model-family matrix
#      (apps/user-tests/test/live/providers/) — one minimal round-trip per
#      additional model family, with no customer-supplied provider keys.
#   2. Heavy full-feature long session (test:user:heavy) — one maximal-submission
#      DeepSeek-managed session exercising the entire feature surface.
#
# Feature depth on the two wire shapes (openai-chat via DeepSeek,
# anthropic-messages via Anthropic) is covered on every dispatch by the default
# Live User Tests workflow; this pipeline exists so the costly extras run only
# when you ask for them, never on push.

on:
  workflow_dispatch:
    inputs:
      artifact_source:
        description: SDK artifact to test.
        required: true
        default: pack-current
        type: choice
        options:
          - pack-current
          - published-version
      version:
        description: Published aex version when artifact_source is published-version.
        required: false
        type: string
      source_sha:
        description: Exact 40-character source SHA when artifact_source is published-version.
        required: false
        type: string

concurrency:
  group: live-on-demand-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-artifact:
    name: Prepare SDK artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.artifact.outputs.version }}
      tarball_artifact: ${{ steps.artifact.outputs.tarball_artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        if: ${{ inputs.artifact_source == 'pack-current' }}
        run: bun ci

      - name: Select SDK artifact
        id: artifact
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          PACKAGE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_SOURCE" = "published-version" ]; then
            if [ -z "$PACKAGE_VERSION" ] || ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "version and a lowercase 40-character source_sha are required when artifact_source is published-version." >&2
              exit 1
            fi
            bun scripts/cicd/wait-for-npm.mjs @aexhq/sdk "$PACKAGE_VERSION" --source-sha "$SOURCE_SHA"
            bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "$PACKAGE_VERSION"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          else
            bun run pack:sdk
            pack_dir="$RUNNER_TEMP/aex-pack"
            mkdir -p "$pack_dir"
            (cd packages/sdk && bun pm pack --destination "$pack_dir")
            tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            if [ -z "$tarball" ]; then
              echo "No @aexhq/sdk tarball was produced." >&2
              exit 1
            fi
            echo "tarball_artifact=live-on-demand-sdk-tarball" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SDK tarball
        if: ${{ inputs.artifact_source == 'pack-current' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-on-demand-sdk-tarball
          path: ${{ runner.temp }}/aex-pack/aexhq-sdk-*.tgz
          if-no-files-found: error
          retention-days: 1

  provider-tests:
    name: Per-provider correctness tests
    needs: prepare-artifact
    runs-on: ubuntu-latest
    environment: live-user-tests
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Download SDK tarball
        if: ${{ inputs.artifact_source == 'pack-current' }}
        uses: actions/download-artifact@v4
        with:
          name: live-on-demand-sdk-tarball
          path: ${{ runner.temp }}/aex-pack

      - name: Use selected SDK artifact
        shell: bash
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          PACKAGE_VERSION: ${{ needs['prepare-artifact'].outputs.version }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_SOURCE" = "published-version" ]; then
            echo "AEX_USER_TEST_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          else
            tarball="$(find "$RUNNER_TEMP/aex-pack" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            if [ -z "$tarball" ]; then
              echo "No downloaded @aexhq/sdk tarball was found." >&2
              exit 1
            fi
            echo "AEX_USER_TEST_TARBALL=${tarball}" >> "$GITHUB_ENV"
          fi

      - name: Per-provider correctness tests
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          AEX_USER_TEST_ANTHROPIC_MODEL: ${{ vars.AEX_USER_TEST_ANTHROPIC_MODEL }}
        run: bun run test:user:providers

  heavy-session:
    name: Heavy full-feature long session
    needs: prepare-artifact
    runs-on: ubuntu-latest
    environment: live-user-tests
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Download SDK tarball
        if: ${{ inputs.artifact_source == 'pack-current' }}
        uses: actions/download-artifact@v4
        with:
          name: live-on-demand-sdk-tarball
          path: ${{ runner.temp }}/aex-pack

      - name: Use selected SDK artifact
        shell: bash
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          PACKAGE_VERSION: ${{ needs['prepare-artifact'].outputs.version }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_SOURCE" = "published-version" ]; then
            echo "AEX_USER_TEST_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          else
            tarball="$(find "$RUNNER_TEMP/aex-pack" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            if [ -z "$tarball" ]; then
              echo "No downloaded @aexhq/sdk tarball was found." >&2
              exit 1
            fi
            echo "AEX_USER_TEST_TARBALL=${tarball}" >> "$GITHUB_ENV"
          fi

      - name: Heavy full-feature long session
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
        run: bun run test:user:heavy
