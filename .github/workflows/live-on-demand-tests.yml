name: Live On-Demand Tests

# Consolidated, manually-dispatched pipeline for the OPTIONAL, expensive live
# suites that are deliberately kept out of the default Live User Tests sweep.
# One trigger runs them all:
#   1. Per-provider correctness matrix (apps/user-tests/test/live/providers/) —
#      one minimal round-trip per extra provider (doubao, future
#      openai/gemini/mistral/openrouter); each self-skips when its key is unset.
#   2. Heavy full-feature long session (test:user:heavy) — one maximal-submission
#      DeepSeek-managed run exercising the entire feature surface.
#
# Feature depth on the two wire shapes (openai-chat via DeepSeek,
# anthropic-messages via Anthropic) is covered on every dispatch by the default
# Live User Tests workflow; this pipeline exists so the costly extras run only
# when you ask for them, never on push.

on:
  workflow_dispatch:
    inputs:
      artifact_source:
        description: SDK artifact to test.
        required: true
        default: pack-current
        type: choice
        options:
          - pack-current
          - published-version
      version:
        description: Published aex version when artifact_source is published-version.
        required: false
        type: string

concurrency:
  group: live-on-demand-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-on-demand-tests:
    name: Live on-demand tests
    runs-on: ubuntu-latest
    environment: live-user-tests
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Select SDK artifact
        id: artifact
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$ARTIFACT_SOURCE" = "published-version" ]; then
            if [ -z "$PACKAGE_VERSION" ]; then
              echo "version input is required when artifact_source is published-version." >&2
              exit 1
            fi
            bun scripts/cicd/wait-for-npm.mjs @aexhq/sdk "$PACKAGE_VERSION"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          else
            pack_dir="$RUNNER_TEMP/aex-pack"
            mkdir -p "$pack_dir"
            (cd packages/sdk && bun pm pack --destination "$pack_dir")
            tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            if [ -z "$tarball" ]; then
              echo "No @aexhq/sdk tarball was produced." >&2
              exit 1
            fi
            echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          fi

      - name: Per-provider correctness tests
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_TOKEN: ${{ secrets.AEX_API_TOKEN }}
          # One key env per extra provider. Each test self-skips when its key is
          # empty, so add a provider's secret here when you want this dispatch to
          # exercise it (future: OPENAI_API_KEY, GEMINI_API_KEY, etc.).
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          AEX_USER_TEST_DOUBAO_MODEL: ${{ vars.AEX_USER_TEST_DOUBAO_MODEL }}
          AEX_USER_TEST_DOUBAO_PROVIDER: ${{ vars.AEX_USER_TEST_DOUBAO_PROVIDER }}
          AEX_USER_TEST_TARBALL: ${{ steps.artifact.outputs.tarball }}
          AEX_USER_TEST_VERSION: ${{ steps.artifact.outputs.version }}
        run: bun run test:user:providers

      - name: Heavy full-feature long session
        # Run even if the provider step failed, so one dispatch yields the full
        # signal from both suites (only skip if the job was cancelled).
        if: ${{ !cancelled() }}
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_TOKEN: ${{ secrets.AEX_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AEX_USER_TEST_ANTHROPIC_MODEL: ${{ vars.AEX_USER_TEST_ANTHROPIC_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
          AEX_USER_TEST_TARBALL: ${{ steps.artifact.outputs.tarball }}
          AEX_USER_TEST_VERSION: ${{ steps.artifact.outputs.version }}
        run: bun run test:user:heavy
