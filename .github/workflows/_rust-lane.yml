# The Rust unit lane.
#
# `--no-tests=fail` on every invocation: a filter that matched nothing is an
# error, not a pass. `retries = 0` lives in `.config/nextest.toml` so no lane
# can grant itself a retry, and `flake scan` produces the receipt counters from
# real tool output rather than letting the lane self-report them.

name: rust-lane

on:
  workflow_call:
    inputs:
      matrix:
        description: The routed package matrix, as canonical JSON.
        type: string
        required: true
      lane:
        type: string
        required: true
      job_name:
        description: Caller job id recorded in the lane receipt.
        type: string
        required: true
      selection_mode:
        description: affected | full | shadow
        type: string
        required: true
      cache_mode:
        description: restore | restore-save
        type: string
        required: false
        default: restore
      profile:
        type: string
        required: false
        default: ci

permissions:
  contents: read

jobs:
  nextest:
    name: Prepare pinned nextest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"

      - name: Build, stage, and verify exact nextest
        run: |
          set -euo pipefail
          cargo install --locked --version 0.9.108 cargo-nextest
          cargo-nextest --version | grep -Eq '^cargo-nextest 0\.9\.108([[:space:]]|$)'
          mkdir -p "$RUNNER_TEMP/aex-nextest"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/aex-nextest/cargo-nextest"
          (cd "$RUNNER_TEMP/aex-nextest" && sha256sum cargo-nextest > cargo-nextest.sha256)

      - name: Upload pinned nextest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cargo-nextest-${{ inputs.lane }}-${{ inputs.job_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aex-nextest/cargo-nextest
            ${{ runner.temp }}/aex-nextest/cargo-nextest.sha256
          if-no-files-found: error
          retention-days: 1

  test:
    name: ${{ matrix.name }}
    needs: nextest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1
        with:
          save-if: ${{ inputs.cache_mode == 'restore-save' }}
          shared-key: ${{ inputs.lane }}

      - name: Download pinned nextest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: cargo-nextest-${{ inputs.lane }}-${{ inputs.job_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aex-nextest

      - name: Use pinned nextest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aex-nextest"
          sha256sum --check cargo-nextest.sha256
          chmod 0755 cargo-nextest
          ./cargo-nextest --version | grep -Eq '^cargo-nextest 0\.9\.108([[:space:]]|$)'
          echo "$RUNNER_TEMP/aex-nextest" >> "$GITHUB_PATH"

      - name: Record the receipt source identity
        env:
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RECEIPT_DIR"
          date --utc +'%Y-%m-%dT%H:%M:%SZ' > "$RECEIPT_DIR/lint-started-at.txt"

      - name: Clippy
        env:
          CARGO_INCREMENTAL: "0"
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
        run: |
          set -euo pipefail
          cargo clippy --locked -p "${{ matrix.name }}" --all-targets \
            --message-format=json -- -D warnings \
            | tee "$RECEIPT_DIR/clippy.json"

      - name: Build and verify the lint receipt
        env:
          CALLER_JOB: ${{ inputs.job_name }}
          LINT_RECEIPT: target/aex-evidence/${{ matrix.name }}/receipt-lint-${{ matrix.name }}-${{ matrix.partition }}.json
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
          SELECTED_PACKAGE: ${{ matrix.name }}
          SELECTED_UNITS_JSON: ${{ toJSON(matrix.units) }}
          SELECTION_MODE: ${{ inputs.selection_mode }}
          PARTITION_INDEX: ${{ matrix.partition }}
          PARTITION_TOTAL: ${{ matrix.partitions }}
          RECEIPT_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          completed_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          started_at=$(<"$RECEIPT_DIR/lint-started-at.txt")
          cargo_lock_digest="sha256:$(sha256sum Cargo.lock | cut -d' ' -f1)"
          package_key=$(printf '%s' "$SELECTED_PACKAGE" | sha256sum | cut -c1-12)
          receipt_id="rc_${RECEIPT_LANE}_rust_lint_${package_key}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg receiptId "$receipt_id" \
            --arg lane "$RECEIPT_LANE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg jobName "$CALLER_JOB" \
            --arg builderId "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_rust-lane.yml@$GITHUB_SHA" \
            --arg cargoLockDigest "$cargo_lock_digest" \
            --argjson unitIds "$SELECTED_UNITS_JSON" \
            --arg mode "$SELECTION_MODE" \
            --arg package "$SELECTED_PACKAGE" \
            --argjson partitionIndex "$PARTITION_INDEX" \
            --argjson partitionTotal "$PARTITION_TOTAL" \
            --arg startedAt "$started_at" \
            --arg completedAt "$completed_at" \
            '{
              receiptId: $receiptId,
              class: "lint",
              layer: "unit",
              lane: $lane,
              concerns: [],
              declared: 1,
              source: {
                repository: $repository,
                commitSha: $commitSha,
                treeClean: true,
                workflowRunId: $workflowRunId,
                runAttempt: $runAttempt,
                jobName: $jobName,
                builderId: $builderId
              },
              inputs: {cargoLockDigest: $cargoLockDigest},
              subject: {unitIds: $unitIds},
              selection: {
                mode: $mode,
                filterset: "clippy(--all-targets,-Dwarnings)",
                packages: [$package],
                partition: {index: $partitionIndex, total: $partitionTotal}
              },
              data: {residue: "none", secretCanaryObserved: false},
              startedAt: $startedAt,
              completedAt: $completedAt
            }' > "$RECEIPT_DIR/lint-context.json"
          cargo run --locked --release -p aex-release-tool -- evidence new-cargo \
            --context "$RECEIPT_DIR/lint-context.json" \
            --messages "$RECEIPT_DIR/clippy.json" \
            --out "$LINT_RECEIPT"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$LINT_RECEIPT" --kind log \
            --file "$RECEIPT_DIR/clippy.json" \
            --uri "artifact://lint-${RECEIPT_LANE}-${SELECTED_PACKAGE}-${PARTITION_INDEX}/clippy.json"
          jq -e '
            .schema == "aex.evidence-receipt.v1" and
            .class == "lint" and
            .source.commitSha == env.GITHUB_SHA and
            .source.workflowRunId == env.GITHUB_RUN_ID and
            .source.runAttempt == (env.GITHUB_RUN_ATTEMPT | tonumber) and
            .source.jobName == env.CALLER_JOB and
            .subject.unitIds == (env.SELECTED_UNITS_JSON | fromjson) and
            .selection.packages == [env.SELECTED_PACKAGE] and
            .inventory == {
              declared: 1,
              collected: 1,
              passed: 1,
              failed: 0,
              skipped: 0,
              ignored: 0,
              filteredAtRuntime: 0,
              retried: 0,
              flaky: 0
            }
          ' "$LINT_RECEIPT" >/dev/null
          cargo run --locked --release -p aex-release-tool -- evidence verify \
            --receipt "$LINT_RECEIPT"

      - name: Record the declared test inventory
        env:
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RECEIPT_DIR"
          date --utc +'%Y-%m-%dT%H:%M:%SZ' > "$RECEIPT_DIR/started-at.txt"
          cargo nextest list --locked --profile "${{ inputs.profile }}" \
            -p "${{ matrix.name }}" --all-targets --message-format json \
            > "$RECEIPT_DIR/nextest-list.json"

      - name: Test
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          cargo nextest run --locked --profile "${{ inputs.profile }}" \
            -p "${{ matrix.name }}" --no-tests=fail

      - name: Doctests
        env:
          CARGO_INCREMENTAL: "0"
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
          SELECTED_PACKAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          package_count=$(jq --arg package "$SELECTED_PACKAGE" \
            '[.packages[] | select(.name == $package)] | length' <<<"$metadata")
          [[ "$package_count" == "1" ]]
          has_library=$(jq -r --arg package "$SELECTED_PACKAGE" \
            '[.packages[] | select(.name == $package).targets[] | select(.kind | index("lib"))] | length > 0' \
            <<<"$metadata")
          if [[ "$has_library" == "true" ]]; then
            cargo test --locked --color never --doc -p "$SELECTED_PACKAGE" 2>&1 \
              | tee "$RECEIPT_DIR/doctest.log"
          elif [[ "$has_library" == "false" ]]; then
            printf '%s\n' "$SELECTED_PACKAGE has no library target; doctests are not applicable" \
              > "$RECEIPT_DIR/doctest.log"
          else
            echo "invalid library-target verdict for $SELECTED_PACKAGE: $has_library" >&2
            exit 2
          fi

      - name: Prove the no-skip inventory
        env:
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
        run: |
          set -euo pipefail
          cargo run --locked --release -p aex-workspace-check -- flake scan \
            --list "$RECEIPT_DIR/nextest-list.json" \
            --junit "target/nextest/${{ inputs.profile }}/junit.xml" \
            --doctest "$RECEIPT_DIR/doctest.log" \
            --profile "${{ inputs.profile }}" \
            --default-features-only \
            --package "${{ matrix.name }}" \
            > "$RECEIPT_DIR/inventory.json"

      - name: Build and verify the unit receipt
        env:
          CALLER_JOB: ${{ inputs.job_name }}
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
          SELECTED_PACKAGE: ${{ matrix.name }}
          SELECTED_UNITS_JSON: ${{ toJSON(matrix.units) }}
          SELECTION_MODE: ${{ inputs.selection_mode }}
          PARTITION_INDEX: ${{ matrix.partition }}
          PARTITION_TOTAL: ${{ matrix.partitions }}
          RECEIPT_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          completed_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          started_at=$(<"$RECEIPT_DIR/started-at.txt")
          declared=$(jq -er '.declared | select(. > 0)' "$RECEIPT_DIR/inventory.json")
          cargo_lock_digest="sha256:$(sha256sum Cargo.lock | cut -d' ' -f1)"
          package_key=$(printf '%s' "$SELECTED_PACKAGE" | sha256sum | cut -c1-12)
          receipt_id="rc_${RECEIPT_LANE}_rust_${package_key}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg receiptId "$receipt_id" \
            --arg lane "$RECEIPT_LANE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg jobName "$CALLER_JOB" \
            --arg builderId "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_rust-lane.yml@$GITHUB_SHA" \
            --arg cargoLockDigest "$cargo_lock_digest" \
            --argjson unitIds "$SELECTED_UNITS_JSON" \
            --arg mode "$SELECTION_MODE" \
            --arg package "$SELECTED_PACKAGE" \
            --argjson partitionIndex "$PARTITION_INDEX" \
            --argjson partitionTotal "$PARTITION_TOTAL" \
            --argjson declared "$declared" \
            --arg startedAt "$started_at" \
            --arg completedAt "$completed_at" \
            '{
              receiptId: $receiptId,
              class: "unit",
              layer: "unit",
              lane: $lane,
              concerns: [],
              declared: $declared,
              source: {
                repository: $repository,
                commitSha: $commitSha,
                treeClean: true,
                workflowRunId: $workflowRunId,
                runAttempt: $runAttempt,
                jobName: $jobName,
                builderId: $builderId
              },
              inputs: {cargoLockDigest: $cargoLockDigest},
              subject: {unitIds: $unitIds},
              selection: {
                mode: $mode,
                filterset: "all()",
                packages: [$package],
                partition: {index: $partitionIndex, total: $partitionTotal}
              },
              data: {residue: "none", secretCanaryObserved: false},
              startedAt: $startedAt,
              completedAt: $completedAt
            }' > "$RECEIPT_DIR/context.json"
          cargo run --locked --release -p aex-release-tool -- evidence new \
            --context "$RECEIPT_DIR/context.json" \
            --junit "target/nextest/${{ inputs.profile }}/junit.xml" \
            --out "$RECEIPT_DIR/receipt.json"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$RECEIPT_DIR/receipt.json" --kind junit \
            --file "target/nextest/${{ inputs.profile }}/junit.xml" \
            --uri "artifact://junit-${RECEIPT_LANE}-${SELECTED_PACKAGE}-${PARTITION_INDEX}/junit.xml"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$RECEIPT_DIR/receipt.json" --kind nextest-list \
            --file "$RECEIPT_DIR/nextest-list.json" \
            --uri "artifact://junit-${RECEIPT_LANE}-${SELECTED_PACKAGE}-${PARTITION_INDEX}/nextest-list.json"
          cargo run --locked --release -p aex-release-tool -- evidence attach \
            --receipt "$RECEIPT_DIR/receipt.json" --kind log \
            --file "$RECEIPT_DIR/doctest.log" \
            --uri "artifact://junit-${RECEIPT_LANE}-${SELECTED_PACKAGE}-${PARTITION_INDEX}/doctest.log"
          jq -e --slurpfile scan "$RECEIPT_DIR/inventory.json" '
            .schema == "aex.evidence-receipt.v1" and
            .source.commitSha == env.GITHUB_SHA and
            .source.workflowRunId == env.GITHUB_RUN_ID and
            .source.runAttempt == (env.GITHUB_RUN_ATTEMPT | tonumber) and
            .inventory.declared == $scan[0].declared and
            .inventory.collected == $scan[0].collected and
            .inventory.skipped == $scan[0].skipped and
            .inventory.ignored == $scan[0].ignored and
            .inventory.filteredAtRuntime == $scan[0].filtered_at_runtime and
            .inventory.retried == $scan[0].retried and
            .inventory.flaky == $scan[0].flaky
          ' "$RECEIPT_DIR/receipt.json" >/dev/null
          cargo run --locked --release -p aex-release-tool -- evidence verify \
            --receipt "$RECEIPT_DIR/receipt.json"

      - name: Build and verify declared semantic receipts
        env:
          RECEIPT_DIR: target/aex-evidence/${{ matrix.name }}
          SELECTED_PACKAGE: ${{ matrix.name }}
          SELECTED_UNITS_JSON: ${{ toJSON(matrix.units) }}
          RECEIPT_LANE: ${{ inputs.lane }}
          NEXTEST_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          mapfile -t producers < <(
            jq -c --arg package "$SELECTED_PACKAGE" \
              '.producers[] | select(.package == $package)' release/semantic-receipts.json
          )
          for producer in "${producers[@]}"; do
            unit=$(jq -er .unit <<<"$producer")
            class=$(jq -er .class <<<"$producer")
            layer=$(jq -er .layer <<<"$producer")
            filterset=$(jq -er .filterset <<<"$producer")
            jq -e --arg unit "$unit" 'index($unit) != null' \
              <<<"$SELECTED_UNITS_JSON" >/dev/null
            started_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
            list="$RECEIPT_DIR/nextest-list.json"
            junit="target/nextest/$NEXTEST_PROFILE/junit.xml"
            declared=$(jq -er .declared "$RECEIPT_DIR/inventory.json")
            if [[ "$filterset" != "all()" ]]; then
              profile="$NEXTEST_PROFILE"
              feature_args=()
              if jq -e '.features != null' <<<"$producer" >/dev/null; then
                profile=integration
                features=$(jq -er '.features | join(",")' <<<"$producer")
                feature_args+=(--features "$features")
              fi
              key=$(printf '%s-%s' "$unit" "$class" | tr -c 'A-Za-z0-9._-' '-')
              list="$RECEIPT_DIR/nextest-list-$key.json"
              cargo nextest list --locked --profile "$profile" \
                -p "$SELECTED_PACKAGE" --all-targets "${feature_args[@]}" \
                -E "$filterset" --message-format json > "$list"
              cargo nextest run --locked --profile "$profile" \
                -p "$SELECTED_PACKAGE" "${feature_args[@]}" \
                -E "$filterset" --no-tests=fail
              junit="target/nextest/$profile/junit.xml"
              declared=$(jq -er '[."rust-suites"[].testcases | length] | add | select(. > 0)' "$list")
            fi
            completed_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
            output="$RECEIPT_DIR/receipt-semantic-$unit-$class.json"
            context="$RECEIPT_DIR/context-semantic-$unit-$class.json"
            jq \
              --arg receiptId "rc_${RECEIPT_LANE}_rust_${class}_${unit}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
              --arg class "$class" \
              --arg layer "$layer" \
              --arg unit "$unit" \
              --arg filterset "$filterset" \
              --argjson declared "$declared" \
              --arg startedAt "$started_at" \
              --arg completedAt "$completed_at" \
              '.receiptId=$receiptId | .class=$class | .layer=$layer |
               .concerns=[$class] | .declared=$declared | .subject.unitIds=[$unit] |
               .selection.filterset=$filterset | .selection.partition=null |
               .startedAt=$startedAt | .completedAt=$completedAt' \
              "$RECEIPT_DIR/context.json" > "$context"
            cargo run --locked --release -p aex-release-tool -- evidence new \
              --context "$context" --junit "$junit" --out "$output"
            cargo run --locked --release -p aex-release-tool -- evidence attach \
              --receipt "$output" --kind junit --file "$junit" \
              --uri "artifact://junit-${RECEIPT_LANE}-${SELECTED_PACKAGE}-${class}/junit.xml"
            cargo run --locked --release -p aex-release-tool -- evidence attach \
              --receipt "$output" --kind nextest-list --file "$list" \
              --uri "artifact://junit-${RECEIPT_LANE}-${SELECTED_PACKAGE}-${class}/nextest-list.json"
            cargo run --locked --release -p aex-release-tool -- evidence verify \
              --receipt "$output"
          done

      - name: Upload the unit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: receipt-${{ inputs.lane }}-rust-${{ matrix.name }}-${{ matrix.partition }}
          path: target/aex-evidence/${{ matrix.name }}/receipt.json
          if-no-files-found: error

      - name: Upload the lint receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: receipt-${{ inputs.lane }}-rust-lint-${{ matrix.name }}-${{ matrix.partition }}
          path: target/aex-evidence/${{ matrix.name }}/receipt-lint-${{ matrix.name }}-${{ matrix.partition }}.json
          if-no-files-found: error

      - name: Upload semantic receipts
        if: ${{ hashFiles(format('target/aex-evidence/{0}/receipt-semantic-*.json', matrix.name)) != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: receipt-${{ inputs.lane }}-rust-semantic-${{ matrix.name }}-${{ matrix.partition }}
          path: target/aex-evidence/${{ matrix.name }}/receipt-semantic-*.json
          if-no-files-found: error

      - name: Upload the lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lint-${{ inputs.lane }}-${{ matrix.name }}-${{ matrix.partition }}
          path: target/aex-evidence/${{ matrix.name }}/clippy.json
          if-no-files-found: error

      - name: Upload the test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: junit-${{ inputs.lane }}-${{ matrix.name }}-${{ matrix.partition }}
          path: |
            target/nextest/${{ inputs.profile }}/junit.xml
            target/aex-evidence/${{ matrix.name }}/nextest-list.json
            target/aex-evidence/${{ matrix.name }}/doctest.log
          if-no-files-found: error

  capacity-limit-projection:
    name: aex-session-dynamodb / capacity limit producer
    needs: nextest
    if: ${{ contains(fromJSON(inputs.matrix).include.*.name, 'aex-session-dynamodb') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1
        with:
          save-if: ${{ inputs.cache_mode == 'restore-save' }}
          shared-key: ${{ inputs.lane }}-capacity-limit-projection

      - name: Download pinned nextest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: cargo-nextest-${{ inputs.lane }}-${{ inputs.job_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aex-nextest

      - name: Use pinned nextest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aex-nextest"
          sha256sum --check cargo-nextest.sha256
          chmod 0755 cargo-nextest
          ./cargo-nextest --version | grep -Eq '^cargo-nextest 0\.9\.108([[:space:]]|$)'
          echo "$RUNNER_TEMP/aex-nextest" >> "$GITHUB_PATH"

      - name: Compile the isolated producer
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo check --locked -p aex-session-dynamodb --no-default-features
          --features capacity-limit-projection-write

      - name: Clippy the isolated producer
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo clippy --locked -p aex-session-dynamodb --all-targets
          --no-default-features --features capacity-limit-projection-write -- -D warnings

      - name: Test the isolated producer
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo nextest run --locked --profile "${{ inputs.profile }}"
          -p aex-session-dynamodb --no-default-features
          --features capacity-limit-projection-write --no-tests=fail

      - name: Prove central producer feature isolation
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          cargo check --locked -p central-control-worker
          cargo test --locked --doc -p aex-session-dynamodb \
            --no-default-features --features authz-projection-write

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: junit-${{ inputs.lane }}-aex-session-dynamodb-capacity-limit-projection
          path: target/nextest/${{ inputs.profile }}/junit.xml
          if-no-files-found: error
