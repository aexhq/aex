# Lane class 1 — pull request and merge queue.
#
# No cloud, registry, publish or signing credential reaches this lane. The
# artifacts job compiles and packages at the production profile so the bytes
# are proved buildable, and uploads nothing.
#
# `checks` is the single required status. It is the only job whose result is
# meaningful on its own, because it compares what the lane declared it would
# run against the receipts the lane actually produced.

name: pr

on:
  pull_request:
  merge_group:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    name: Route
    uses: ./.github/workflows/_route.yml
    with:
      mode: affected
      lane: pr
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      partitions: 4

  gates:
    name: Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1  # v2.8.1
        with:
          save-if: false
          shared-key: gates

      - name: Install cargo-deny
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed  # v2.85.6
        with:
          tool: cargo-deny@0.20.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Workspace structure
        run: cargo run --locked -p aex-workspace-check

      - name: Delivery graph
        run: cargo run --locked --release -p aex-release-tool -- graph verify

      - name: Router selftest
        run: cargo run --locked --release -p aex-release-tool -- selftest

      - name: Workflow structure
        run: cargo run --locked --release -p aex-release-tool -- policy workflows

      - name: Terraform packages no code
        run: cargo run --locked --release -p aex-release-tool -- policy terraform

      - name: Supply chain
        run: cargo deny --all-features check

      - name: Secret scan
        run: bash scripts/cicd/scan-secrets.sh

  rust:
    name: Rust
    needs: route
    if: needs.route.outputs.has_test == 'true'
    uses: ./.github/workflows/_rust-lane.yml
    with:
      matrix: ${{ needs.route.outputs.test_matrix }}
      lane: pr
      job_name: rust
      selection_mode: affected
      cache_mode: restore

  node:
    name: TypeScript
    needs: route
    uses: ./.github/workflows/_node-lane.yml
    with:
      matrix: ${{ needs.route.outputs.node_matrix }}
      lane: pr
      job_name: node
      selection_mode: affected

  scenarios:
    name: Scenarios
    needs: route
    if: needs.route.outputs.has_scenario == 'true'
    uses: ./.github/workflows/_scenario-lane.yml
    with:
      matrix: ${{ needs.route.outputs.scenario_matrix }}
      lane: pr

  terraform:
    name: Terraform
    needs: route
    if: needs.route.outputs.has_terraform == 'true'
    uses: ./.github/workflows/_terraform-lane.yml
    with:
      matrix: ${{ needs.route.outputs.terraform_matrix }}
      mode: static
      lane: pr
      job_name: terraform
      selection_mode: affected

  artifacts:
    name: Artifacts
    needs: route
    if: needs.route.outputs.has_artifact == 'true'
    uses: ./.github/workflows/_build-artifacts.yml
    with:
      matrix: ${{ needs.route.outputs.artifact_matrix }}
      lane: pr
      publish: false

  checks:
    name: Checks
    needs: [route, gates, rust, node, scenarios, terraform, artifacts]
    if: always()
    uses: ./.github/workflows/_receipts.yml
    with:
      lane: pr
      receipt_jobs: >-
        {"rust":{"job":"rust","selected":"${{ needs.route.outputs.has_test }}"},"node":{"job":"node","selected":"${{ needs.route.outputs.has_node }}"},"terraform":{"job":"terraform","selected":"${{ needs.route.outputs.has_terraform }}"}}
      rust_matrix: ${{ needs.route.outputs.test_matrix }}
      node_matrix: ${{ needs.route.outputs.node_matrix }}
      terraform_matrix: ${{ needs.route.outputs.terraform_matrix }}
      required_job_results: >-
        {"route":{"result":"${{ needs.route.result }}","allowSkipped":false},"gates":{"result":"${{ needs.gates.result }}","allowSkipped":false},"rust":{"result":"${{ needs.rust.result }}","allowSkipped":true},"node":{"result":"${{ needs.node.result }}","allowSkipped":false},"scenarios":{"result":"${{ needs.scenarios.result }}","allowSkipped":true},"terraform":{"result":"${{ needs.terraform.result }}","allowSkipped":true},"artifacts":{"result":"${{ needs.artifacts.result }}","allowSkipped":true}}
