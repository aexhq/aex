# Lane class 1 — pull request and merge queue.
#
# No cloud, registry, publish or signing credential reaches this lane, and this
# lane is read-only by construction: `permissions: contents: read` is granted at
# the workflow level and no job may exceed it. That is why the artifacts job does
# not run here — `_build-artifacts.yml`'s build job requests `id-token: write`
# and `attestations: write`, and a reusable workflow cannot request more than its
# caller grants, so calling it from a read-only caller fails the whole run at
# startup. Bytes are proved buildable on `main`, which holds those permissions.
#
# `checks` is the single required status. It is the only job whose result is
# meaningful on its own, because it compares what the lane declared it would
# run against the receipts the lane actually produced.

name: pr

on:
  pull_request:
  merge_group:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deliberately unblocked: neither step below consumes a prebuilt tool, so
  # waiting on `tools` bought nothing and cost every run the ~1m46s that build
  # takes. A formatting violation or a leaked secret now fails the run in well
  # under a minute. This is a feedback narrowing, not a weakened gate —
  # `checks` requires this job at `allowSkipped: false`, so a skipped
  # `preflight` fails the run.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: the secret scan walks every reachable commit
      # (`--log-opts=--all`), not just the tip.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      # No cargo cache and no workspace-tools download: the only cargo this job
      # runs is the `metadata --no-deps` behind `cargo fmt --all`, which
      # resolves no dependency and reads no registry, and nothing here executes
      # a built tool. `rustfmt` is the one component the job uses.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Secret scan
        run: bash scripts/cicd/scan-secrets.sh

  # The head of the tool-dependent graph. Every job below runs the exact bytes
  # this one built and published the digest of, so `gates` deliberately depends
  # on `tools` rather than on `route`: a broken router must not hide a policy
  # finding. The two findings that need no prebuilt tool run in `preflight`
  # above and report independently of this job.
  tools:
    name: Tools
    uses: ./.github/workflows/_tools.yml

  route:
    name: Route
    needs: tools
    uses: ./.github/workflows/_route.yml
    with:
      mode: affected
      artifact_mode: affected
      lane: pr
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      partitions: 4
      release_tool_sha256: ${{ needs.tools.outputs.release_tool_sha256 }}
      workspace_check_sha256: ${{ needs.tools.outputs.workspace_check_sha256 }}

  gates:
    name: Gates
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      # No cargo cache: nothing here compiles since the tools arrive prebuilt,
      # and the only cargo this job still runs is the `metadata --no-deps`
      # behind `aex-workspace-check` and `graph verify`, which resolves no
      # dependency and reads no registry. The key it used to declare was never
      # written by any workflow, so the step could only miss.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Download the prepared workspace tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: workspace-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/aex-tools

      # The digests arrive through the job-output channel, not inside the
      # artifact, so an artifact that lies about itself cannot self-certify.
      - name: Use the prepared workspace tools
        env:
          RELEASE_TOOL_SHA256: ${{ needs.tools.outputs.release_tool_sha256 }}
          WORKSPACE_CHECK_SHA256: ${{ needs.tools.outputs.workspace_check_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aex-tools"
          [[ "$RELEASE_TOOL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WORKSPACE_CHECK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$RELEASE_TOOL_SHA256" aex-release-tool > expected.sha256
          printf '%s  %s\n' "$WORKSPACE_CHECK_SHA256" aex-workspace-check >> expected.sha256
          sha256sum --check --strict expected.sha256
          [[ "$(find . -maxdepth 1 -type f ! -name expected.sha256 | wc -l)" -eq 2 ]]
          chmod 0755 aex-release-tool aex-workspace-check
          ./aex-release-tool --version | grep -Eq '^aex-release-tool [0-9]+\.[0-9]+\.[0-9]+'
          ./aex-workspace-check --version | grep -Eq '^aex-workspace-check [0-9]+\.[0-9]+\.[0-9]+'
          echo "$RUNNER_TEMP/aex-tools" >> "$GITHUB_PATH"

      - name: Workspace structure
        run: aex-workspace-check

      - name: Delivery graph
        run: aex-release-tool graph verify

      - name: Router selftest
        run: aex-release-tool selftest

      - name: Workflow structure
        run: aex-release-tool policy workflows

      - name: Terraform packages no code
        run: aex-release-tool policy terraform

      # The janitor reclaims test residue in dependency order, and the order is
      # data: `[janitor.resource]` in `release/policy/test-profiles.toml`. A row
      # whose prerequisite outranks it would be reclaimed in the wrong order and
      # no test of the engine would catch it, because the engine faithfully
      # implements whatever the table says. This is the check on the table.
      - name: Janitor policy
        run: aex-release-tool janitor verify

  rust:
    name: Rust
    needs: [tools, route]
    if: needs.route.outputs.has_test == 'true'
    uses: ./.github/workflows/_rust-lane.yml
    with:
      matrix: ${{ needs.route.outputs.test_matrix }}
      lane: pr
      job_name: rust
      selection_mode: affected
      cache_mode: restore
      release_tool_sha256: ${{ needs.tools.outputs.release_tool_sha256 }}
      workspace_check_sha256: ${{ needs.tools.outputs.workspace_check_sha256 }}

  integration:
    name: Integration
    needs: [tools, route]
    if: needs.route.outputs.has_integration == 'true'
    uses: ./.github/workflows/_integration-lane.yml
    with:
      matrix: ${{ needs.route.outputs.integration_matrix }}
      lane: pr
      cache_mode: restore

  node:
    name: TypeScript
    needs: [tools, route]
    if: needs.route.outputs.has_node == 'true'
    uses: ./.github/workflows/_node-lane.yml
    with:
      matrix: ${{ needs.route.outputs.node_matrix }}
      lane: pr
      job_name: node
      selection_mode: affected
      release_tool_sha256: ${{ needs.tools.outputs.release_tool_sha256 }}
      workspace_check_sha256: ${{ needs.tools.outputs.workspace_check_sha256 }}

  scenarios:
    name: Scenarios
    needs: route
    if: needs.route.outputs.has_scenario == 'true'
    uses: ./.github/workflows/_scenario-lane.yml
    with:
      matrix: ${{ needs.route.outputs.scenario_matrix }}
      lane: pr

  terraform:
    name: Terraform
    needs: [tools, route]
    if: needs.route.outputs.has_terraform == 'true'
    uses: ./.github/workflows/_terraform-lane.yml
    with:
      matrix: ${{ needs.route.outputs.terraform_matrix }}
      mode: static
      lane: pr
      job_name: terraform
      selection_mode: affected
      release_tool_sha256: ${{ needs.tools.outputs.release_tool_sha256 }}
      workspace_check_sha256: ${{ needs.tools.outputs.workspace_check_sha256 }}

  checks:
    name: Checks
    needs: [preflight, tools, route, gates, rust, integration, node, scenarios, terraform]
    if: always()
    uses: ./.github/workflows/_receipts.yml
    with:
      lane: pr
      release_tool_sha256: ${{ needs.tools.outputs.release_tool_sha256 }}
      workspace_check_sha256: ${{ needs.tools.outputs.workspace_check_sha256 }}
      receipt_jobs: >-
        {"rust":{"job":"rust","selected":"${{ needs.route.outputs.has_test }}"},"node":{"job":"node","selected":"${{ needs.route.outputs.has_node }}"},"terraform":{"job":"terraform","selected":"${{ needs.route.outputs.has_terraform }}"}}
      rust_matrix: ${{ needs.route.outputs.test_matrix }}
      node_matrix: ${{ needs.route.outputs.node_matrix }}
      terraform_matrix: ${{ needs.route.outputs.terraform_matrix }}
      required_job_results: >-
        {"preflight":{"result":"${{ needs.preflight.result }}","allowSkipped":false},"tools":{"result":"${{ needs.tools.result }}","allowSkipped":false},"route":{"result":"${{ needs.route.result }}","allowSkipped":false},"gates":{"result":"${{ needs.gates.result }}","allowSkipped":false},"rust":{"result":"${{ needs.rust.result }}","allowSkipped":true},"integration":{"result":"${{ needs.integration.result }}","allowSkipped":true},"node":{"result":"${{ needs.node.result }}","allowSkipped":true},"scenarios":{"result":"${{ needs.scenarios.result }}","allowSkipped":true},"terraform":{"result":"${{ needs.terraform.result }}","allowSkipped":true}}
