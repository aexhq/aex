# Publish one already-compiled artifact, and mint the public release inputs.
#
# The filename and the `build` job id are load-bearing. An attestation minted
# inside a reusable workflow carries that reusable workflow as its signer, so
# every certified envelope, npm readback, OCI readback and cosign identity in
# this repository names `.github/workflows/_build-artifacts.yml`. Renaming
# either breaks verification of every artifact ever published.
#
# The compile half is `_compile-artifacts.yml`, which holds no write scope and
# therefore runs concurrently with the test lanes. This job admits exactly one
# compiled unit, proves it is the one its recipe describes, and publishes it.
#
# `publish: false` still performs the admission checks and reaches no registry.

name: build-artifacts

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      lane:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: false
      bootstrap_oci_visibility:
        description: Explicit one-time request to create missing private GHCR unit packages.
        type: boolean
        required: false
        default: false
      release_tool_sha256:
        description: SHA-256 of the run's prepared aex-release-tool.
        type: string
        required: true
      workspace_check_sha256:
        description: SHA-256 of the run's prepared aex-workspace-check.
        type: string
        required: true
    secrets:
      AEX_GHCR_VISIBILITY_BOOTSTRAP:
        description: Protected second authority for the one-time GHCR namespace bootstrap.
        required: false
    outputs:
      release_tag:
        description: Unique non-overwriting public prerelease tag.
        value: ${{ jobs.public_release_inputs.outputs.release_tag }}
      release_tool_uri:
        description: Public raw release-tool asset URL.
        value: ${{ jobs.public_release_inputs.outputs.release_tool_uri }}
      release_tool_digest:
        description: SHA-256 identity of the raw release tool.
        value: ${{ jobs.public_release_inputs.outputs.release_tool_digest }}
      release_tool_size_bytes:
        description: Exact raw release-tool byte length.
        value: ${{ jobs.public_release_inputs.outputs.release_tool_size_bytes }}
      release_tool_version:
        description: Exact release-tool semantic version.
        value: ${{ jobs.public_release_inputs.outputs.release_tool_version }}
      release_tool_attestation_id:
        description: Official GitHub provenance locator; admission re-verifies subject and signer.
        value: ${{ jobs.public_release_inputs.outputs.release_tool_attestation_id }}
      release_tool_attestation_url:
        description: GitHub provenance URL returned by the official action.
        value: ${{ jobs.public_release_inputs.outputs.release_tool_attestation_url }}
      module_bundle_uri:
        description: Public Terraform module bundle asset URL.
        value: ${{ jobs.public_release_inputs.outputs.module_bundle_uri }}
      module_bundle_digest:
        description: SHA-256 identity of the Terraform module bundle.
        value: ${{ jobs.public_release_inputs.outputs.module_bundle_digest }}
      module_bundle_size_bytes:
        description: Exact Terraform module bundle byte length.
        value: ${{ jobs.public_release_inputs.outputs.module_bundle_size_bytes }}
      module_bundle_attestation_id:
        description: Official GitHub provenance locator; admission re-verifies subject and signer.
        value: ${{ jobs.public_release_inputs.outputs.module_bundle_attestation_id }}
      module_bundle_attestation_url:
        description: GitHub provenance URL returned by the official action.
        value: ${{ jobs.public_release_inputs.outputs.module_bundle_attestation_url }}
      regional_tables_uri:
        description: Public generated regional table bundle asset URL.
        value: ${{ jobs.public_release_inputs.outputs.regional_tables_uri }}
      regional_tables_digest:
        description: SHA-256 identity of the transported regional table JSON.
        value: ${{ jobs.public_release_inputs.outputs.regional_tables_digest }}
      regional_tables_size_bytes:
        description: Exact regional table JSON byte length.
        value: ${{ jobs.public_release_inputs.outputs.regional_tables_size_bytes }}
      regional_tables_definitions_digest:
        description: BLAKE3 identity of the canonical decoded definitions.
        value: ${{ jobs.public_release_inputs.outputs.regional_tables_definitions_digest }}
      regional_tables_attestation_id:
        description: Official GitHub provenance locator; admission re-verifies subject and signer.
        value: ${{ jobs.public_release_inputs.outputs.regional_tables_attestation_id }}
      regional_tables_attestation_url:
        description: GitHub provenance URL returned by the official action.
        value: ${{ jobs.public_release_inputs.outputs.regional_tables_attestation_url }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      RELEASE_DIR: target/aex-release/${{ matrix.name }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Download the prepared workspace tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: workspace-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/aex-tools

      # The digests arrive through the job-output channel, not inside the
      # artifact, so an artifact that lies about itself cannot self-certify.
      - name: Use the prepared workspace tools
        env:
          RELEASE_TOOL_SHA256: ${{ inputs.release_tool_sha256 }}
          WORKSPACE_CHECK_SHA256: ${{ inputs.workspace_check_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aex-tools"
          [[ "$RELEASE_TOOL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WORKSPACE_CHECK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$RELEASE_TOOL_SHA256" aex-release-tool > expected.sha256
          printf '%s  %s\n' "$WORKSPACE_CHECK_SHA256" aex-workspace-check >> expected.sha256
          sha256sum --check --strict expected.sha256
          [[ "$(find . -maxdepth 1 -type f ! -name expected.sha256 | wc -l)" -eq 2 ]]
          chmod 0755 aex-release-tool aex-workspace-check
          ./aex-release-tool --version | grep -Eq '^aex-release-tool [0-9]+\.[0-9]+\.[0-9]+'
          ./aex-workspace-check --version | grep -Eq '^aex-workspace-check [0-9]+\.[0-9]+\.[0-9]+'
          echo "$RUNNER_TEMP/aex-tools" >> "$GITHUB_PATH"

      # Exactly one of these three matches, because the compile job uploads the
      # blob shape or the OCI shape, never both. `pattern:` is used rather than
      # `name:` so a non-match is not an error here; the step below is what
      # fails closed, and it fails on two matches as loudly as on none. Glob
      # patterns are anchored, so `artifact-<unit>` never matches
      # `oci-artifact-<unit>`.
      - name: Download the compiled blob unit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: artifact-${{ matrix.name }}
          path: ${{ runner.temp }}/compiled

      - name: Download the compiled OCI unit identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: oci-artifact-${{ matrix.name }}
          path: ${{ runner.temp }}/compiled

      - name: Download the compiled OCI publish context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: oci-context-${{ matrix.name }}
          path: ${{ runner.temp }}/compiled

      - name: Admit exactly one compiled unit and read its kind
        id: compiled
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/compiled"
          blob="$src/artifact-${{ matrix.name }}"
          oci="$src/oci-artifact-${{ matrix.name }}"
          context="$src/oci-context-${{ matrix.name }}"
          present=0
          [ -d "$blob" ] && present=$((present + 1))
          [ -d "$oci" ]  && present=$((present + 1))
          [ "$present" -eq 1 ]
          mkdir -p "$RELEASE_DIR"
          if [ -d "$oci" ]; then
            cp -R "$oci"/. "$RELEASE_DIR"/
            test -d "$context"
            mkdir "$RELEASE_DIR/context-1"
            cp -R "$context"/. "$RELEASE_DIR/context-1"/
            # `oci-prepare` writes both context files 0644 and the RDS bundle is
            # installed 0644. The artifact round trip does not carry mode, so
            # restate it: `COPY --chmod=0555 artifact` makes the ELF's own mode
            # irrelevant, but `COPY aws-rds-global-bundle.pem` has no --chmod,
            # and a mode change there is a different image digest.
            find "$RELEASE_DIR/context-1" -type f -exec chmod 0644 {} +
            test -f "$RELEASE_DIR/context-1/Dockerfile"
            test -f "$RELEASE_DIR/context-1/artifact"
          else
            cp -R "$blob"/. "$RELEASE_DIR"/
            test -f "$RELEASE_DIR/artifact.bin"
          fi
          kind=$(jq -er .unit.kind "$RELEASE_DIR/draft-envelope.json")
          [[ "$kind" == "$(jq -er .kind "$RELEASE_DIR/recipe.json")" ]]
          if [[ "$kind" == rust-oci-* ]]; then test -d "$oci"; else test -d "$blob"; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Buildx and BuildKit
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      # The producer half of this check — `artifact oci-toolchain`, which also
      # records zig and cargo-zigbuild — belongs to the compile job. What is
      # left here is the pushing half: the exact buildx client and the exact
      # BuildKit node that will write to the registry.
      - name: Verify the pinned OCI producer toolchain
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        env:
          BUILDX_NODES: ${{ steps.buildx.outputs.nodes }}
        run: |
          set -euo pipefail
          buildx_binary="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins/docker-buildx"
          test -x "$buildx_binary"
          echo "f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b  $buildx_binary" \
            | sha256sum --check --strict
          docker buildx version | grep -F 'v0.34.1'
          [[ "$(jq -er 'if length == 1 then .[0].buildkit else error("expected one BuildKit node") end' <<<"$BUILDX_NODES")" == "v0.30.0" ]]
          buildkit_node=$(jq -er '.[0].name' <<<"$BUILDX_NODES")
          buildkit_container="buildx_buildkit_${buildkit_node}"
          [[ "$(docker inspect --format '{{.Config.Image}}' "$buildkit_container")" == \
            "moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f" ]]

      # Only Node is installed here, never a registry credential. `registry-url`
      # is deliberately absent: it writes an `.npmrc` line that reads
      # `NODE_AUTH_TOKEN`, which is exactly the long-lived-token idiom trusted
      # publishing replaces and `policy::lint_workflow_text` refuses.
      - name: Install Node for registry publication
        if: ${{ inputs.publish && steps.compiled.outputs.kind == 'npm-package' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"

      - name: Install the pinned npm client that supports trusted publishing
        if: ${{ inputs.publish && steps.compiled.outputs.kind == 'npm-package' }}
        run: |
          set -euo pipefail
          # 11.5.1 is the first npm release that exchanges a workflow OIDC token
          # for a short-lived publish credential. Node 22 ships npm 10.x, which
          # would fall back to asking for a token, so the client is pinned here
          # rather than inherited. Bumping it is a deliberate edit.
          npm install -g npm@11.5.1
          [[ "$(npm --version)" == "11.5.1" ]]

      - name: Attest the build provenance
        if: ${{ inputs.publish && !startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        id: attest_unit
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: ${{ env.RELEASE_DIR }}/artifact.bin

      - name: Preserve exact blob provenance evidence
        if: ${{ inputs.publish && !startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        env:
          BUNDLE_PATH: ${{ steps.attest_unit.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest_unit.outputs['attestation-url'] }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          test -n "$ATTESTATION_URL"
          cp "$BUNDLE_PATH" "$RELEASE_DIR/provenance.sigstore.json"
          jq -n \
            --arg uri "$ATTESTATION_URL" \
            --arg builderId "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main" \
            '{predicateType:"https://slsa.dev/provenance/v1",uri:$uri,builderId:$builderId,attested:true}' \
            > "$RELEASE_DIR/provenance-claims.json"

      # Trusted publishing. npm exchanges this job's OIDC identity token for a
      # short-lived publish credential, so there is no stored npm token in this
      # repository and nothing for a compromised workflow to exfiltrate. The
      # tarball handed to the registry is the exact packaged artifact, which is
      # what makes the SHA-256 in the envelope and the SHA-512 the registry
      # serves two identities over the same bytes rather than two artifacts.
      #
      # The trusted publisher this exchange matches against must name the
      # *calling* workflow, `main.yml`, and not this file. npm validates the
      # OIDC `workflow_ref` claim, which for a reusable workflow is the caller;
      # `_build-artifacts.yml` appears only in `job_workflow_ref`, which npm
      # does not read. Every other identity in this repository is bound to this
      # file, so the exception is easy to get wrong in exactly one direction.
      # See `references/npm-trusted-publisher-bootstrap.md`.
      - name: Publish the packed tarball with npm provenance
        if: ${{ inputs.publish && steps.compiled.outputs.kind == 'npm-package' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "aexhq/aex" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          # No stored credential may exist at publish time. If one did, npm
          # would use it and publish without provenance while still succeeding,
          # which is precisely the silent fallback trusted publishing removes.
          if [ -f "$HOME/.npmrc" ]; then
            ! grep -qE '_authToken|_auth=|_password' "$HOME/.npmrc"
          fi
          # The recipe's `input` path is the compile job's build tree and does
          # not exist here, and npm refuses anything that is not named `.tgz`.
          # Restore the exact packaged bytes under the recipe's own basename.
          # The `cmp` that used to prove those bytes equal the packed tarball
          # now runs in the compile job, where `input` still exists; comparing
          # here would only compare a file against its own copy.
          tarball="$RELEASE_DIR/$(basename "$(jq -er .input "$RELEASE_DIR/recipe.json")")"
          cp "$RELEASE_DIR/artifact.bin" "$tarball"
          manifest="$(jq -er '.argv | index("--cwd") as $i | .[$i + 1]' \
            "$RELEASE_DIR/recipe.json")/package.json"
          name=$(jq -er .name "$manifest")
          version=$(jq -er .version "$manifest")
          # Prove the OIDC token endpoint is reachable before publishing. npm
          # reports a failed trusted-publishing exchange as `ENEEDAUTH`, which
          # is indistinguishable from having configured no credential at all, so
          # assert the one precondition npm will not tell us about.
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] \
            || { echo "::error::no OIDC token endpoint; the job lacks id-token: write"; exit 1; }
          # Main publishes the complete selected graph, so an unchanged package
          # may already have an immutable registry identity from an earlier
          # composition. Reuse is safe only because the next step reads that
          # exact version back and proves its bytes and provenance against this
          # run's packed tarball. A changed package without a version bump still
          # fails closed on the readback integrity comparison.
          if npm view --json "$name@$version" >/dev/null 2>&1; then
            echo "registry already serves $name@$version; exact readback will verify reuse"
            exit 0
          fi
          # `--loglevel verbose` is what makes a rejected exchange legible: it
          # names the registry's response instead of collapsing every cause into
          # `ENEEDAUTH`. On failure the debug log is the only record of which
          # trusted-publisher claim did not match, so surface it rather than
          # leaving it on a runner that is about to be destroyed.
          if ! npm publish "$tarball" --provenance --access public --loglevel verbose \
            2>&1 | tee "$RUNNER_TEMP/npm-publish.log"; then
            # A concurrent or eventually-consistent publisher can win between
            # the presence check and this POST. Treat only npm's exact immutable
            # version collision as a candidate for reuse; readback remains the
            # authority and rejects different bytes or missing provenance.
            if grep -Fq \
              "You cannot publish over the previously published versions: $version." \
              "$RUNNER_TEMP/npm-publish.log"; then
              echo "registry concurrently published $name@$version; exact readback will verify reuse"
              exit 0
            fi
            for log in "$HOME"/.npm/_logs/*-debug-0.log; do
              [ -f "$log" ] || continue
              echo "::group::npm debug log $(basename "$log")"
              cat "$log"
              echo "::endgroup::"
            done
            # The registry answers an unmatched trusted-publisher claim with a
            # 404 on the exchange endpoint, and npm renders that as `package
            # not found` even when the package exists and is public. The
            # package is not what was not found; the publisher claim is. Name
            # the one input this repository cannot supply for itself, because
            # the default reading sends the operator to look at the package.
            if grep -q 'token exchange error - package not found' \
              "$RUNNER_TEMP/npm-publish.log"; then
              echo "::error::No trusted publisher on this package matches this run." \
                "On npmjs.com, Package settings for the published name, add a" \
                "GitHub Actions publisher: organization \`${GITHUB_REPOSITORY%%/*}\`," \
                "repository \`${GITHUB_REPOSITORY#*/}\`, workflow filename \`main.yml\`" \
                "(the caller — NOT _build-artifacts.yml), environment blank." \
                "See references/npm-trusted-publisher-bootstrap.md."
            fi
            exit 1
          fi

      - name: Read the published version back from the registry
        if: ${{ inputs.publish && steps.compiled.outputs.kind == 'npm-package' }}
        run: |
          set -euo pipefail
          # The packed directory comes from the recipe rather than from the unit
          # id, so the manifest read here is the one that was actually packed.
          manifest="$(jq -er '.argv | index("--cwd") as $i | .[$i + 1]' \
            "$RELEASE_DIR/recipe.json")/package.json"
          name=$(jq -er .name "$manifest")
          version=$(jq -er .version "$manifest")
          # The registry is eventually consistent for a few seconds after a
          # publish. Bounded, and loud when it runs out: a readback that never
          # succeeded must never be reported as one that did.
          published=""
          for attempt in 1 2 3 4 5 6; do
            if npm view --json "$name@$version" > "$RELEASE_DIR/registry-metadata.json"; then
              published=yes
              break
            fi
            echo "registry has not served $name@$version yet (attempt $attempt)"
            sleep 10
          done
          if [ -z "$published" ]; then
            echo "the registry never served back $name@$version" >&2
            exit 22
          fi
          aex-release-tool artifact npm-readback \
            --unit "${{ matrix.name }}" \
            --tarball "$RELEASE_DIR/artifact.bin" \
            --manifest "$manifest" \
            --registry-metadata "$RELEASE_DIR/registry-metadata.json" \
            --workflow-repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --workflow-path .github/workflows/_build-artifacts.yml \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-name "${{ matrix.name }}" \
            --builder-id "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main" \
            --out "$RELEASE_DIR/npm-publication.json"

      - name: Upload registry publication evidence
        if: ${{ inputs.publish && steps.compiled.outputs.kind == 'npm-package' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: npm-publication-${{ matrix.name }}
          path: |
            ${{ env.RELEASE_DIR }}/npm-publication.json
            ${{ env.RELEASE_DIR }}/registry-metadata.json
          if-no-files-found: error

      - name: Install the pinned hands-agent signing client
        if: ${{ inputs.publish && matrix.name == 'hands-agent' }}
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/aex-cosign"
          mkdir -p "$install_root"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$install_root/cosign" \
            https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  $install_root/cosign" \
            | sha256sum --check --strict
          chmod 0755 "$install_root/cosign"
          [[ "$("$install_root/cosign" version --json | jq -er .gitVersion)" == "v3.1.2" ]]
          echo "$install_root" >> "$GITHUB_PATH"

      - name: Sign and verify the exact hands-agent bytes
        if: ${{ inputs.publish && matrix.name == 'hands-agent' }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main"
          cosign sign-blob --yes \
            --bundle "$RELEASE_DIR/signature.sigstore.json" \
            "$RELEASE_DIR/artifact.bin"
          cosign verify-blob \
            --bundle "$RELEASE_DIR/signature.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RELEASE_DIR/artifact.bin"

      - name: Require a public GHCR package or explicit bootstrap authority
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_AUTHORITY: ${{ secrets.AEX_GHCR_VISIBILITY_BOOTSTRAP }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "aexhq/aex" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          unit=$(jq -er .unit "$RELEASE_DIR/identity-1.json")
          endpoint="https://api.github.com/orgs/aexhq/packages/container/aex-units%2F${unit}"
          status=$(curl --silent --show-error --output "$RELEASE_DIR/ghcr-package-before.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint")
          case "$status" in
            200) visibility=$(jq -er .visibility "$RELEASE_DIR/ghcr-package-before.json") ;;
            404) visibility=missing ;;
            *) echo "GitHub package read failed with HTTP $status" >&2; exit 22 ;;
          esac
          bootstrap=()
          if [[ "${{ inputs.bootstrap_oci_visibility }}" == "true" ]]; then
            test -n "$BOOTSTRAP_AUTHORITY"
            bootstrap+=(--bootstrap-authorized)
          fi
          aex-release-tool artifact oci-visibility \
            --identity "$RELEASE_DIR/identity-1.json" \
            --visibility "$visibility" \
            --phase before-push \
            "${bootstrap[@]}" \
            --out "$RELEASE_DIR/visibility-before-push.json"

      - name: Authenticate to GHCR without minting a mutable tag
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the exact OCI manifest by digest
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        id: publish_oci
        run: |
          set -euo pipefail
          image_repository=$(jq -er .imageRepository "$RELEASE_DIR/identity-1.json")
          expected_digest=$(jq -er .outputDigest "$RELEASE_DIR/identity-1.json")
          aex-release-tool artifact oci-source-clean \
            --out "$RELEASE_DIR/source-clean-before-push.json"
          docker buildx build \
            --builder "${{ steps.buildx.outputs.name }}" \
            --platform linux/arm64 \
            --no-cache \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --provenance=false \
            --sbom=false \
            --file "$RELEASE_DIR/context-1/Dockerfile" \
            --metadata-file "$RELEASE_DIR/push-metadata.json" \
            --output "type=image,name=$image_repository,push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true,rewrite-timestamp=true,compression=gzip,compression-level=9,force-compression=true" \
            "$RELEASE_DIR/context-1"
          pushed_digest=$(jq -er '."containerimage.digest"' "$RELEASE_DIR/push-metadata.json")
          [[ "$pushed_digest" == "$expected_digest" ]]
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "digest=$pushed_digest" >> "$GITHUB_OUTPUT"

      - name: Fail closed until the bootstrap package is public
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_AUTHORITY: ${{ secrets.AEX_GHCR_VISIBILITY_BOOTSTRAP }}
        run: |
          set -euo pipefail
          unit=$(jq -er .unit "$RELEASE_DIR/identity-1.json")
          endpoint="https://api.github.com/orgs/aexhq/packages/container/aex-units%2F${unit}"
          status=$(curl --silent --show-error --output "$RELEASE_DIR/ghcr-package-after.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint")
          case "$status" in
            200) visibility=$(jq -er .visibility "$RELEASE_DIR/ghcr-package-after.json") ;;
            404) visibility=missing ;;
            *) echo "GitHub package read failed with HTTP $status" >&2; exit 22 ;;
          esac
          bootstrap=()
          if [[ "${{ inputs.bootstrap_oci_visibility }}" == "true" ]]; then
            test -n "$BOOTSTRAP_AUTHORITY"
            bootstrap+=(--bootstrap-authorized)
          fi
          aex-release-tool artifact oci-visibility \
            --identity "$RELEASE_DIR/identity-1.json" \
            --visibility "$visibility" \
            --phase after-push \
            "${bootstrap[@]}" \
            --out "$RELEASE_DIR/visibility-after-push.json"

      - name: Reverify clean source immediately before OCI attestation
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        run: |
          set -euo pipefail
          aex-release-tool artifact oci-source-clean \
            --out "$RELEASE_DIR/source-clean-before-attestation.json"

      - name: Attest the immutable OCI digest
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        id: attest_oci
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-name: ${{ steps.publish_oci.outputs.image_repository }}
          subject-digest: ${{ steps.publish_oci.outputs.digest }}
          push-to-registry: true

      - name: Verify OCI provenance and read back registry bytes
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest_oci.outputs.bundle-path }}
          IMAGE_REPOSITORY: ${{ steps.publish_oci.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.publish_oci.outputs.digest }}
        run: |
          set -euo pipefail
          subject="oci://$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          gh attestation verify "$subject" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE_PATH" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-"hosted"-runners \
            --format json > "$RELEASE_DIR/verified-provenance.json"
          # A public artifact must be readable without the publisher's token.
          # A fresh Docker config makes package visibility part of readback.
          mkdir "$RELEASE_DIR/anonymous-docker"
          DOCKER_CONFIG="$RELEASE_DIR/anonymous-docker" docker buildx imagetools inspect --raw \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" > "$RELEASE_DIR/readback-manifest.json"
          DOCKER_CONFIG="$RELEASE_DIR/anonymous-docker" docker pull --platform linux/arm64 \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          config_digest=$(docker image inspect --format '{{.Id}}' \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST")
          bin=$(jq -er .bin "$RELEASE_DIR/identity-1.json")
          container=$(docker create --platform linux/arm64 \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/local/bin/$bin" "$RELEASE_DIR/readback-elf"
          docker rm "$container" >/dev/null
          trap - EXIT
          aex-release-tool artifact oci-readback \
            --identity "$RELEASE_DIR/identity-1.json" \
            --manifest "$RELEASE_DIR/readback-manifest.json" \
            --config-digest "$config_digest" \
            --binary "$RELEASE_DIR/readback-elf" \
            --verified-provenance "$RELEASE_DIR/verified-provenance.json" \
            --provenance-bundle "$BUNDLE_PATH" \
            --workflow-repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --workflow-path .github/workflows/_build-artifacts.yml \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-name "${{ matrix.name }}" \
            --builder-id "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main" \
            --out "$RELEASE_DIR/oci-publication.json"
          cp "$BUNDLE_PATH" "$RELEASE_DIR/provenance.sigstore.json"
          jq -n \
            --arg uri "${{ steps.attest_oci.outputs['attestation-url'] }}" \
            --arg builderId "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main" \
            '{predicateType:"https://slsa.dev/provenance/v1",uri:$uri,builderId:$builderId,attested:true}' \
            > "$RELEASE_DIR/provenance-claims.json"

      - name: Upload blob publication evidence
        if: ${{ inputs.publish && !startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: publication-${{ matrix.name }}
          path: |
            ${{ env.RELEASE_DIR }}/provenance.sigstore.json
            ${{ env.RELEASE_DIR }}/provenance-claims.json
          if-no-files-found: error

      - name: Upload hands-agent signature evidence
        if: ${{ inputs.publish && matrix.name == 'hands-agent' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: signature-${{ matrix.name }}
          path: ${{ env.RELEASE_DIR }}/signature.sigstore.json
          if-no-files-found: error

      - name: Upload OCI publication evidence
        if: ${{ inputs.publish && startsWith(steps.compiled.outputs.kind, 'rust-oci-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: publication-${{ matrix.name }}
          path: |
            ${{ env.RELEASE_DIR }}/source-clean-before-push.json
            ${{ env.RELEASE_DIR }}/source-clean-before-attestation.json
            ${{ env.RELEASE_DIR }}/visibility-before-push.json
            ${{ env.RELEASE_DIR }}/visibility-after-push.json
            ${{ env.RELEASE_DIR }}/oci-publication.json
            ${{ env.RELEASE_DIR }}/readback-manifest.json
            ${{ env.RELEASE_DIR }}/verified-provenance.json
            ${{ env.RELEASE_DIR }}/provenance.sigstore.json
            ${{ env.RELEASE_DIR }}/provenance-claims.json
          if-no-files-found: error

  public_release_inputs:
    name: Public release inputs
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_tool_uri: ${{ steps.publish.outputs.release_tool_uri }}
      release_tool_digest: ${{ steps.identities.outputs.release_tool_digest }}
      release_tool_size_bytes: ${{ steps.identities.outputs.release_tool_size_bytes }}
      release_tool_version: ${{ steps.identities.outputs.release_tool_version }}
      release_tool_attestation_id: ${{ steps.attest_release_tool.outputs['attestation-id'] }}
      release_tool_attestation_url: ${{ steps.attest_release_tool.outputs['attestation-url'] }}
      module_bundle_uri: ${{ steps.publish.outputs.module_bundle_uri }}
      module_bundle_digest: ${{ steps.identities.outputs.module_bundle_digest }}
      module_bundle_size_bytes: ${{ steps.identities.outputs.module_bundle_size_bytes }}
      module_bundle_attestation_id: ${{ steps.attest_module_bundle.outputs['attestation-id'] }}
      module_bundle_attestation_url: ${{ steps.attest_module_bundle.outputs['attestation-url'] }}
      regional_tables_uri: ${{ steps.publish.outputs.regional_tables_uri }}
      regional_tables_digest: ${{ steps.identities.outputs.regional_tables_digest }}
      regional_tables_size_bytes: ${{ steps.identities.outputs.regional_tables_size_bytes }}
      regional_tables_definitions_digest: ${{ steps.identities.outputs.regional_tables_definitions_digest }}
      regional_tables_attestation_id: ${{ steps.attest_regional_tables.outputs['attestation-id'] }}
      regional_tables_attestation_url: ${{ steps.attest_regional_tables.outputs['attestation-url'] }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-musl

      - name: Cargo cache
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1  # v2.8.1
        with:
          save-if: true
          shared-key: public-release-inputs

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Download every packaged blob unit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: artifact-*
          path: packaged-units

      - name: Download every reproducible OCI unit identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: oci-artifact-*
          path: oci-units

      - name: Download every publication evidence bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: publication-*
          path: publication-units

      - name: Download every registry publication identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: npm-publication-*
          path: npm-publications

      - name: Download the required hands-agent signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: signature-hands-agent
          path: signature-units/hands-agent

      - name: Download every same-run validation receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: receipt-main-*
          path: validation-receipts

      # The published tool is a statically linked musl binary, so it is not the
      # run's prepared host tool and has to be compiled here. No incremental
      # state, a fixed epoch and a remapped workspace path keep these bytes a
      # function of the commit rather than of the runner. Only the target
      # directory is renamed: the `cmp` of two differently named target
      # directories that this replaces passed on every run, so that path was
      # never in the published bytes.
      - name: Build the published release tool
        env:
          CARGO_INCREMENTAL: "0"
          SOURCE_DATE_EPOCH: "0"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/workspace/aex
            -C link-self-contained=yes
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          cargo build --locked --release -p aex-release-tool --target "$target" \
            --target-dir target/release-tool
          mkdir -p dist
          built="target/release-tool/$target/release/aex-release-tool"
          test -f "$built"
          install -m 0755 "$built" dist/aex-release-tool

      - name: Package modules twice and prove byte determinism
        run: |
          set -euo pipefail
          dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet \
            artifact module-bundle --out dist/terraform-modules.tar.gz
          dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet \
            artifact module-bundle --out dist/terraform-modules.check.tar.gz
          cmp dist/terraform-modules.tar.gz dist/terraform-modules.check.tar.gz
          rm dist/terraform-modules.check.tar.gz

      - name: Certify exact build and publication identities
        run: |
          set -euo pipefail
          mkdir -p dist/bound-receipts dist/certified dist/unit-assets dist/aux-assets
          shopt -s nullglob
          mapfile -d '' receipts < <(
            find validation-receipts -type f -name '*.json' -print0 | sort -z
          )
          drafts=(
            packaged-units/artifact-*/draft-envelope.json
            oci-units/oci-artifact-*/draft-envelope.json
          )
          tag="main-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          builder="https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main"

          bun -e '
            const parsed = Bun.TOML.parse(await Bun.file("release/units.toml").text());
            const policies = Bun.TOML.parse(await Bun.file("release/policy/artifact-policy.toml").text());
            if (!Array.isArray(parsed.unit) || parsed.unit.length === 0) {
              throw new Error("release/units.toml declares no units");
            }
            const ids = parsed.unit.map((row) => row.id);
            if (ids.some((id) => typeof id !== "string" || id.length === 0)) {
              throw new Error("every release unit needs a non-empty id");
            }
            if (new Set(ids).size !== ids.length) {
              throw new Error("release/units.toml declares duplicate unit ids");
            }
            for (const row of parsed.unit) {
              if (typeof row.kind !== "string" || typeof policies.kind?.[row.kind]?.signature !== "string") {
                throw new Error(`release unit ${row.id} has no artifact signature policy for kind ${row.kind}`);
              }
            }
            const rows = Object.fromEntries(parsed.unit.map((row) => [row.id, row.required_receipts]));
            const oci = parsed.unit
              .filter((row) => row.kind.startsWith("rust-oci-"))
              .map((row) => row.id)
              .sort();
            // Three publication destinations, not two. A published package has
            // packaged bytes like a blob unit, but its immutable location is a
            // registry version, so it must never also become a release asset:
            // two locations for one artifact is two identities to keep in step.
            const npm = parsed.unit
              .filter((row) => row.kind === "npm-package")
              .map((row) => row.id)
              .sort();
            const blobs = parsed.unit
              .filter((row) => !row.kind.startsWith("rust-oci-") && row.kind !== "npm-package")
              .map((row) => row.id)
              .sort();
            const signed = parsed.unit
              .filter((row) => policies.kind?.[row.kind]?.signature === "sigstore-cosign")
              .map((row) => row.id)
              .sort();
            await Bun.write("dist/unit-required-receipts.json", JSON.stringify(rows, null, 2) + "\n");
            await Bun.write("dist/declared-unit-ids.txt", ids.toSorted().join("\n") + "\n");
            await Bun.write("dist/declared-blob-unit-ids.txt", blobs.length === 0 ? "" : blobs.join("\n") + "\n");
            await Bun.write("dist/declared-oci-unit-ids.txt", oci.length === 0 ? "" : oci.join("\n") + "\n");
            await Bun.write("dist/declared-npm-unit-ids.txt", npm.length === 0 ? "" : npm.join("\n") + "\n");
            await Bun.write("dist/declared-signature-unit-ids.txt", signed.length === 0 ? "" : signed.join("\n") + "\n");
          '
          for draft in "${drafts[@]}"; do
            jq -er '.unit.id | select(type == "string" and length > 0)' "$draft"
          done | sort > dist/draft-unit-ids.txt
          test -s dist/draft-unit-ids.txt
          test -z "$(uniq -d dist/draft-unit-ids.txt)"
          diff -u dist/declared-unit-ids.txt dist/draft-unit-ids.txt
          : > dist/produced-signature-unit-ids.txt

          new_bound_package_receipt() {
            local unit=$1 class=$2 report=$3 attachment=$4 draft=$5 output=$6
            local now declared context unbound
            now=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
            declared=$(jq -er '.checks | length | select(. > 0)' "$report")
            context="${output%.json}.context.json"
            unbound="${output%.json}.unbound.json"
            jq -n \
              --arg receiptId "rc_main_artifact_${class}_${unit}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
              --arg class "$class" --arg repository "$GITHUB_REPOSITORY" \
              --arg commitSha "$GITHUB_SHA" --arg workflowRunId "$GITHUB_RUN_ID" \
              --argjson runAttempt "$GITHUB_RUN_ATTEMPT" --arg unit "$unit" \
              --arg builderId "$builder" --argjson declared "$declared" --arg now "$now" \
              '{receiptId:$receiptId,class:$class,layer:"unit",lane:"main",concerns:[],
                declared:$declared,
                source:{repository:$repository,commitSha:$commitSha,treeClean:true,
                  workflowRunId:$workflowRunId,runAttempt:$runAttempt,
                  jobName:"Public release inputs",builderId:$builderId},
                inputs:{},subject:{unitIds:[$unit]},
                selection:{mode:"full",filterset:"exact-artifact",packages:[]},
                data:{residue:"none",secretCanaryObserved:false},
                startedAt:$now,completedAt:$now}' > "$context"
            dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet evidence new-check \
              --context "$context" --report "$report" --out "$unbound"
            dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet evidence attach \
              --receipt "$unbound" --kind producer-report --file "$attachment" \
              --uri "artifact://artifact-evidence-$unit/$class-producer.json"
            dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet evidence bind-artifact \
              --receipt "$unbound" --envelope "$draft" --out "$output"
          }

          for draft in "${drafts[@]}"; do
            unit=$(jq -er .unit.id "$draft")
            kind=$(jq -er .unit.kind "$draft")
            directory=${draft%/draft-envelope.json}
            publication="publication-units/publication-$unit"
            bound_directory="dist/bound-receipts/$unit"
            certified_directory="dist/certified/$unit"
            evidence_directory="$certified_directory/evidence"
            mkdir -p "$bound_directory" "$evidence_directory"
            required=$(jq -cer --arg unit "$unit" '.[$unit] | select(type == "array")' \
              dist/unit-required-receipts.json)

            receipt_args=()
            for receipt in "${receipts[@]}"; do
              class=$(jq -er .class "$receipt")
              if jq -e --arg unit "$unit" --arg class "$class" --argjson required "$required" \
                '(.subject.unitIds | index($unit) != null) and
                 ($required | index($class) != null)' \
                "$receipt" >/dev/null; then
                bound="$bound_directory/$class.json"
                test ! -e "$bound"
                dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet \
                  evidence bind-artifact --receipt "$receipt" --envelope "$draft" --out "$bound"
                receipt_args+=(--receipt "$bound")
              fi
            done

            if [[ "$kind" == rust-oci-* ]]; then
              publication_claim="$publication/oci-publication.json"
              artifact_args=()
              location=$(jq -c .location "$publication_claim")
            elif [[ "$kind" == npm-package ]]; then
              # The registry version is the location. No release asset is
              # produced and none is uploaded, so `dist/unit-assets` stays the
              # exact set of GitHub Release blobs.
              artifact="$directory/artifact.bin"
              artifact_args=(--file "$artifact")
              location=$(jq -c .location "npm-publications/npm-publication-$unit/npm-publication.json")
            else
              artifact="$directory/artifact.bin"
              asset_metadata=$(dist/aex-release-tool artifact asset-name --unit "$unit" --file "$artifact")
              asset=$(jq -er .asset <<<"$asset_metadata")
              cp "$artifact" "dist/unit-assets/$asset"
              artifact_args=(--file "$artifact")
              location=$(jq -cn --arg uri "$release_base/$asset" \
                '{kind:"github-release",uri:$uri,immutable:true}')
            fi

            for class in package-integrity determinism; do
              if jq -e --arg class "$class" 'index($class) != null' <<<"$required" >/dev/null; then
                bound="$bound_directory/$class.json"
                new_bound_package_receipt "$unit" "$class" "$directory/package-integrity-report.json" \
                  "$directory/package-integrity-report.json" "$draft" "$bound"
                receipt_args+=(--receipt "$bound")
              fi
            done

            signature='{ "present": false, "kind": "none" }'
            signature_args=()
            if [[ "$unit" == hands-agent ]]; then
              signature_bundle="signature-units/hands-agent/signature.sigstore.json"
              signature_digest=$(sha256sum "$signature_bundle" | cut -d' ' -f1)
              signature_asset="signature-$unit-$signature_digest.sigstore.json"
              cp "$signature_bundle" "dist/aux-assets/$signature_asset"
              printf '%s\n' "$unit" >> dist/produced-signature-unit-ids.txt
              signature=$(jq -cn --arg keyId \
                "https://github.com/$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml@refs/heads/main" \
                '{present:true,kind:"sigstore-cosign",keyId:$keyId}')
              signature_args=(--signature-bundle "$signature_bundle")
            elif [[ "$kind" == npm-package ]]; then
              # The registry is the signer: npm minted the attestation from this
              # workflow's own OIDC identity and holds it. There is no detached
              # bundle to upload, and `certify` refuses one for this kind.
              signature=$(jq -cn --arg keyId "$builder" \
                '{present:true,kind:"npm-provenance",keyId:$keyId}')
            fi
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" \
              --arg runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg unit "$unit" --arg builderId "$builder" \
              --argjson location "$location" --argjson signature "$signature" \
              --slurpfile provenance "$publication/provenance-claims.json" \
              '{workflow:{repository:$repository,ref:$ref,path:".github/workflows/_build-artifacts.yml",
                  runId:$runId,runAttempt:$runAttempt,jobName:$unit,builderId:$builderId},
                location:$location,provenance:$provenance[0],signature:$signature}' \
              > "$evidence_directory/certification-claims.json"
            dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet artifact certify \
              --draft "$draft" --claims "$evidence_directory/certification-claims.json" \
              "${artifact_args[@]}" --defer-supply-chain \
              --provenance-bundle "$publication/provenance.sigstore.json" \
              "${signature_args[@]}" "${receipt_args[@]}" \
              --out "$certified_directory/certified-envelope.json"
          done
          certified_count=$(find dist/certified -type f -name certified-envelope.json | wc -l)
          test "$certified_count" -eq "${#drafts[@]}"
          sort -o dist/produced-signature-unit-ids.txt dist/produced-signature-unit-ids.txt
          test -z "$(uniq -d dist/produced-signature-unit-ids.txt)"
          diff -u dist/declared-signature-unit-ids.txt dist/produced-signature-unit-ids.txt

      - name: Upload the exact certified artifact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: certified-envelopes
          path: dist/certified
          if-no-files-found: error

      - name: Validate regional table definitions twice and prove byte identity
        run: |
          set -euo pipefail
          dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet \
            artifact regional-tables --out dist/regional-tables.json
          dist/aex-release-tool --root "$GITHUB_WORKSPACE" --quiet \
            artifact regional-tables --out dist/regional-tables.check.json
          cmp dist/regional-tables.json dist/regional-tables.check.json
          rm dist/regional-tables.check.json

      - name: Record exact identities
        id: identities
        run: |
          set -euo pipefail
          tool_digest="sha256:$(sha256sum dist/aex-release-tool | cut -d' ' -f1)"
          module_digest="sha256:$(sha256sum dist/terraform-modules.tar.gz | cut -d' ' -f1)"
          regional_digest="sha256:$(sha256sum dist/regional-tables.json | cut -d' ' -f1)"
          tool_size=$(stat -c '%s' dist/aex-release-tool)
          module_size=$(stat -c '%s' dist/terraform-modules.tar.gz)
          regional_size=$(stat -c '%s' dist/regional-tables.json)
          regional_definitions_digest=$(jq -er .digest dist/regional-tables.json)
          tool_version=$(dist/aex-release-tool --version | awk '{print $2}')
          [[ "$tool_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$module_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$regional_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$tool_size" =~ ^[1-9][0-9]*$ ]]
          [[ "$module_size" =~ ^[1-9][0-9]*$ ]]
          [[ "$regional_size" =~ ^[1-9][0-9]*$ ]]
          [[ "$regional_definitions_digest" =~ ^blake3:[0-9a-f]{64}$ ]]
          [[ "$tool_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "release_tool_digest=$tool_digest" >> "$GITHUB_OUTPUT"
          echo "release_tool_size_bytes=$tool_size" >> "$GITHUB_OUTPUT"
          echo "release_tool_version=$tool_version" >> "$GITHUB_OUTPUT"
          echo "module_bundle_digest=$module_digest" >> "$GITHUB_OUTPUT"
          echo "module_bundle_size_bytes=$module_size" >> "$GITHUB_OUTPUT"
          echo "regional_tables_digest=$regional_digest" >> "$GITHUB_OUTPUT"
          echo "regional_tables_size_bytes=$regional_size" >> "$GITHUB_OUTPUT"
          echo "regional_tables_definitions_digest=$regional_definitions_digest" >> "$GITHUB_OUTPUT"

      - name: Verify every content-addressed unit and auxiliary asset
        run: |
          set -euo pipefail
          blob_count=0
          : > dist/produced-blob-unit-ids.txt
          : > dist/produced-oci-unit-ids.txt
          : > dist/produced-npm-unit-ids.txt
          shopt -s nullglob
          for directory in packaged-units/artifact-*; do
            unit=${directory##*/artifact-}
            file="$directory/artifact.bin"
            test -f "$file"
            # A published package is packaged like a blob and published like a
            # registry version, so it is counted here and deliberately excluded
            # from the release-asset inventory below.
            if grep -Fxq "$unit" dist/declared-npm-unit-ids.txt; then
              printf '%s\n' "$unit" >> dist/produced-npm-unit-ids.txt
              publication="npm-publications/npm-publication-$unit/npm-publication.json"
              jq -e --arg digest "sha256:$(sha256sum "$file" | cut -d' ' -f1)" \
                '.schema == "aex.npm-publication.v1" and .tarballDigest == $digest and
                 .provenance == true and .location.kind == "npm" and .location.immutable == true' \
                "$publication" >/dev/null
              continue
            fi
            printf '%s\n' "$unit" >> dist/produced-blob-unit-ids.txt
            metadata=$(dist/aex-release-tool artifact asset-name --unit "$unit" --file "$file")
            asset=$(jq -er .asset <<<"$metadata")
            cmp --silent "$file" "dist/unit-assets/$asset"
            blob_count=$((blob_count + 1))
          done
          oci_count=0
          for identity in oci-units/oci-artifact-*/identity-1.json; do
            jq -e '.schema == "aex.oci-image-identity.v1" and (.unit | length > 0) and (.outputDigest | test("^sha256:[0-9a-f]{64}$"))' \
              "$identity" >/dev/null
            unit=$(jq -er .unit "$identity")
            printf '%s\n' "$unit" >> dist/produced-oci-unit-ids.txt
            jq -e --arg digest "$(jq -er .outputDigest "$identity")" \
              '.schema == "aex.oci-publication.v1" and .image.outputDigest == $digest and .location.immutable == true and (.provenance.bundleDigest | test("^sha256:[0-9a-f]{64}$")) and (.provenance.verificationResultDigest | test("^sha256:[0-9a-f]{64}$"))' \
              "publication-units/publication-$unit/oci-publication.json" >/dev/null
            oci_count=$((oci_count + 1))
          done
          sort -o dist/produced-blob-unit-ids.txt dist/produced-blob-unit-ids.txt
          sort -o dist/produced-oci-unit-ids.txt dist/produced-oci-unit-ids.txt
          sort -o dist/produced-npm-unit-ids.txt dist/produced-npm-unit-ids.txt
          test -z "$(uniq -d dist/produced-blob-unit-ids.txt)"
          test -z "$(uniq -d dist/produced-oci-unit-ids.txt)"
          test -z "$(uniq -d dist/produced-npm-unit-ids.txt)"
          diff -u dist/declared-blob-unit-ids.txt dist/produced-blob-unit-ids.txt
          diff -u dist/declared-oci-unit-ids.txt dist/produced-oci-unit-ids.txt
          diff -u dist/declared-npm-unit-ids.txt dist/produced-npm-unit-ids.txt
          aux_count=$(find dist/aux-assets -maxdepth 1 -type f | wc -l)
          signature_count=$(wc -l < dist/produced-signature-unit-ids.txt)
          if [ "$aux_count" -ne "$signature_count" ]; then
            echo "found $aux_count auxiliary assets for $signature_count declared signer units" >&2
            exit 30
          fi
          echo "blob_count=$blob_count" >> "$GITHUB_ENV"
          echo "oci_count=$oci_count" >> "$GITHUB_ENV"
          echo "aux_count=$aux_count" >> "$GITHUB_ENV"

      - name: Attest raw release tool provenance
        id: attest_release_tool
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: dist/aex-release-tool

      - name: Attest module bundle provenance
        id: attest_module_bundle
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: dist/terraform-modules.tar.gz

      - name: Attest regional table bundle provenance
        id: attest_regional_tables
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: dist/regional-tables.json

      - name: Create immutable draft release candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; published identities are never replaced" >&2
            exit 21
          fi
          if git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; published identities are never reused" >&2
            exit 21
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "Plane-neutral public inputs from $GITHUB_SHA." \
            --draft --prerelease
          # Never clean up or replace a partial upload. A failed attempt stays
          # visible, and the fixed-forward retry receives a new attempt tag.
          gh release upload "$tag" dist/aex-release-tool dist/terraform-modules.tar.gz \
            dist/regional-tables.json \
            --repo "$GITHUB_REPOSITORY"
          shopt -s nullglob
          unit_assets=(dist/unit-assets/*)
          aux_assets=(dist/aux-assets/*)
          if [ ${#unit_assets[@]} -ne "$blob_count" ]; then
            echo "named ${#unit_assets[@]} unit assets, expected $blob_count" >&2
            exit 30
          fi
          if [ ${#unit_assets[@]} -gt 0 ]; then
            gh release upload "$tag" "${unit_assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          if [ ${#aux_assets[@]} -ne "$aux_count" ]; then
            echo "named ${#aux_assets[@]} auxiliary assets, expected $aux_count" >&2
            exit 30
          fi
          if [ ${#aux_assets[@]} -gt 0 ]; then
            gh release upload "$tag" "${aux_assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          observed_count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          expected_count=$((3 + blob_count + aux_count))
          [[ "$observed_count" -eq "$expected_count" ]]
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tool_uri=$base/aex-release-tool" >> "$GITHUB_OUTPUT"
          echo "module_bundle_uri=$base/terraform-modules.tar.gz" >> "$GITHUB_OUTPUT"
          echo "regional_tables_uri=$base/regional-tables.json" >> "$GITHUB_OUTPUT"

      - name: Read back and verify every published unit and auxiliary asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/unit-readback dist/aux-readback
          shopt -s nullglob
          local_assets=(dist/unit-assets/*)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'unit-*' --dir dist/unit-readback
          readback_assets=(dist/unit-readback/*)
          [[ "${#readback_assets[@]}" -eq "${#local_assets[@]}" ]]
          denied_runner_class=self
          denied_runner_class+="-hosted"
          for local_asset in "${local_assets[@]}"; do
            name=${local_asset##*/}
            readback="dist/unit-readback/$name"
            cmp --silent "$local_asset" "$readback"
            gh attestation verify "$readback" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/_build-artifacts.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              "--deny-${denied_runner_class}-runners"
          done
          local_aux=(dist/aux-assets/*)
          if [ ${#local_aux[@]} -gt 0 ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'signature-*' --dir dist/aux-readback
          fi
          readback_aux=(dist/aux-readback/*)
          [[ "${#readback_aux[@]}" -eq "${#local_aux[@]}" ]]
          for local_asset in "${local_aux[@]}"; do
            cmp --silent "$local_asset" "dist/aux-readback/${local_asset##*/}"
          done

      - name: Record provenance outputs
        env:
          TOOL_ATTESTATION_ID: ${{ steps.attest_release_tool.outputs['attestation-id'] }}
          TOOL_ATTESTATION_URL: ${{ steps.attest_release_tool.outputs['attestation-url'] }}
          MODULE_ATTESTATION_ID: ${{ steps.attest_module_bundle.outputs['attestation-id'] }}
          MODULE_ATTESTATION_URL: ${{ steps.attest_module_bundle.outputs['attestation-url'] }}
          REGIONAL_ATTESTATION_ID: ${{ steps.attest_regional_tables.outputs['attestation-id'] }}
          REGIONAL_ATTESTATION_URL: ${{ steps.attest_regional_tables.outputs['attestation-url'] }}
        run: |
          set -euo pipefail
          test -n "$TOOL_ATTESTATION_ID"
          test -n "$TOOL_ATTESTATION_URL"
          test -n "$MODULE_ATTESTATION_ID"
          test -n "$MODULE_ATTESTATION_URL"
          test -n "$REGIONAL_ATTESTATION_ID"
          test -n "$REGIONAL_ATTESTATION_URL"
          {
            echo "### Public release input provenance"
            echo "- release tool: $TOOL_ATTESTATION_URL"
            echo "- module bundle: $MODULE_ATTESTATION_URL"
            echo "- regional tables: $REGIONAL_ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
