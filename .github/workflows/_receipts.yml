# The single required status.
#
# It first checks the result of every required workflow job, including jobs
# such as routing and publication that do not produce test evidence. It then
# compares the selected evidence producers with the receipts they actually
# emitted. A selected producer that emitted nothing is not a pass; an
# unselected producer makes no evidence claim.

name: receipts

on:
  workflow_call:
    inputs:
      lane:
        type: string
        required: true
      receipt_jobs:
        description: JSON object mapping producer kinds to caller job ids and selection state.
        type: string
        required: true
      rust_matrix:
        description: Exact routed Rust package matrix, as canonical JSON.
        type: string
        required: true
      node_matrix:
        description: Exact routed Node package matrix, as canonical JSON.
        type: string
        required: true
      terraform_matrix:
        description: Exact routed Terraform matrix, as canonical JSON.
        type: string
        required: true
      required_job_results:
        description: JSON object mapping every required job to its result and skip policy.
        type: string
        required: true

permissions:
  contents: read

jobs:
  aggregate:
    name: Receipts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"

      - name: Require every workflow job to pass
        env:
          REQUIRED_JOB_RESULTS: ${{ inputs.required_job_results }}
          RECEIPT_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and length > 0 and
            all(to_entries[];
              (.key | type == "string" and length > 0) and
              (.value | type == "object") and
              (.value | keys | sort) == ["allowSkipped", "result"] and
              (.value.allowSkipped | type == "boolean") and
              (
                .value.result == "success" or
                (.value.allowSkipped and .value.result == "skipped")
              )
            )
          ' <<<"$REQUIRED_JOB_RESULTS" >/dev/null
          jq -cn --arg lane "$RECEIPT_LANE" --argjson jobs "$REQUIRED_JOB_RESULTS" '
            {schema: "aex.workflow-job-results.v1", lane: $lane, jobs: $jobs}
          ' > required-job-results.json

      - name: Declare the expected receipt job set
        id: expected
        env:
          NODE_MATRIX: ${{ inputs.node_matrix }}
          RECEIPT_JOBS: ${{ inputs.receipt_jobs }}
          RECEIPT_LANE: ${{ inputs.lane }}
          RUST_MATRIX: ${{ inputs.rust_matrix }}
          TERRAFORM_MATRIX: ${{ inputs.terraform_matrix }}
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and (keys == ["node", "rust", "terraform"]) and
            all(to_entries[];
              (.value | type == "object") and
              (.value | keys) == ["job", "selected"] and
              (.value.job | type == "string" and length > 0) and
              (.value.selected == "true" or .value.selected == "false")
            )
          ' <<<"$RECEIPT_JOBS" >/dev/null

          jq -en --argjson rust "$RUST_MATRIX" --argjson node "$NODE_MATRIX" \
            --argjson terraform "$TERRAFORM_MATRIX" '
            def valid_matrix:
              type == "object" and (keys == ["include"]) and
              (.include | type == "array") and
              all(.include[];
                (.id | type == "string" and length > 0) and
                (.name | type == "string" and length > 0) and
                (.partition | type == "number" and . >= 0) and
                (.partitions | type == "number" and . > 0) and
                (.partition < .partitions)
              );
            ($rust | valid_matrix) and ($node | valid_matrix) and
            ($terraform | valid_matrix)
          ' >/dev/null

          jq -en --argjson jobs "$RECEIPT_JOBS" --argjson rust "$RUST_MATRIX" \
            --argjson node "$NODE_MATRIX" --argjson terraform "$TERRAFORM_MATRIX" '
            (($jobs.rust.selected == "true") == (($rust.include | length) > 0)) and
            (($jobs.node.selected == "true") == (($node.include | length) > 0)) and
            (($jobs.terraform.selected == "true") == (($terraform.include | length) > 0))
          ' >/dev/null

          jq -cn --arg lane "$RECEIPT_LANE" --argjson jobs "$RECEIPT_JOBS" \
            --argjson rust "$RUST_MATRIX" --argjson node "$NODE_MATRIX" \
            --argjson terraform "$TERRAFORM_MATRIX" \
            --slurpfile semantic release/semantic-receipts.json '
            def partition($entry):
              {index: $entry.partition, total: $entry.partitions};
            def producer($job; $package; $partition; $class):
              {jobName: $job, package: $package, partition: $partition, class: $class};
            {
              schema: "aex.declared-producers.v1",
              lane: $lane,
              producers: [
                ($rust.include[] as $entry |
                  producer($jobs.rust.job; $entry.name; partition($entry); "unit"),
                  producer($jobs.rust.job; $entry.name; partition($entry); "lint"),
                  ($semantic[0].producers[] as $semantic_producer |
                    select($semantic_producer.package == $entry.name) |
                    producer($jobs.rust.job; $entry.name; null; $semantic_producer.class))
                ),
                ($node.include[] as $entry |
                  producer($jobs.node.job; $entry.name; partition($entry); "unit"),
                  producer($jobs.node.job; $entry.name; partition($entry); "lint"),
                  ($semantic[0].producers[] as $semantic_producer |
                    select($semantic_producer.package == $entry.name) |
                    producer($jobs.node.job; $entry.name; null; $semantic_producer.class))
                ),
                ($terraform.include[] as $entry |
                  producer($jobs.terraform.job; $entry.id; partition($entry); "unit"))
              ] | sort_by([.jobName, .package, (.partition.index // -1), .class])
            }
          ' > declared-producers.json
          if [ "$(jq '.producers | length' declared-producers.json)" -gt 0 ]; then
            echo "has_receipts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_receipts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download every receipt
        if: steps.expected.outputs.has_receipts == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: receipt-*
          path: receipts
          merge-multiple: false

      - name: Aggregate
        run: |
          set -euo pipefail
          receipts=()
          if [ -d receipts ]; then
            mapfile -d '' receipts < <(
              find receipts -type f -name '*.json' -print0 | sort -z
            )
          fi
          args=()
          for receipt in "${receipts[@]}"; do
            args+=(--receipt "$receipt")
          done
          cargo run --locked --release -p aex-release-tool -- \
            evidence aggregate "${args[@]}" --expect declared-producers.json \
            --out lane-receipt.json

      - name: Upload the lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lane-receipt-${{ inputs.lane }}
          path: |
            lane-receipt.json
            required-job-results.json
          if-no-files-found: error
