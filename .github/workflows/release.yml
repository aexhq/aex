name: Release

on:
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: Deferred until the Bun-first publish path is implemented.
        required: true
        default: canary
        type: choice
        options:
          - canary
          - latest
          - next

concurrency:
  group: release-aex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deferred:
    name: npm publish deferred
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred release path
        run: |
          echo "::error::npm publish/provenance is intentionally deferred for the Bun-first migration."
          echo "Implement a dedicated publish workflow once package staging, provenance, and dist-tag promotion are revalidated."
          exit 1
