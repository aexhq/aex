name: Release

on:
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: npm dist-tag for the initial publish (latest is forbidden — assign it via promote.yml after this run is green).
        required: true
        default: canary
        type: choice
        options:
          - canary
          - next

concurrency:
  group: release-aex
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  version:
    name: Resolve release version
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # This workflow publishes BEFORE the live user tests run, so it must
      # never ship straight to `latest`. Guard the raw input as well as the
      # choice list so an API dispatch can't sneak `latest` past the UI.
      # `publish` needs this job, so failing here blocks the publish.
      - name: Forbid direct publish to latest
        env:
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if [ "${NPM_DIST_TAG}" = "latest" ]; then
            echo "::error::Publishing directly to the 'latest' dist-tag is forbidden: release.yml publishes before the live user tests run. Publish to 'canary' and assign 'latest' via promote.yml once this release run is green."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/sdk/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Assert npm version is unused
        run: node scripts/cicd/assert-npm-version-available.mjs @aexhq/sdk "${{ steps.version.outputs.version }}"

  lint:
    name: Lint
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Lint
        run: bun run lint

  unit-tests:
    name: Unit tests
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Test
        run: bun run test

  offline-user-tests:
    name: Offline user tests
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Offline user tests
        env:
          AEX_USER_TEST_OFFLINE_MAX_WORKERS: 4
        run: bun run test:user:offline

  docs-build:
    name: Docs build
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Docs build
        run: bun run docs:build

  pack-sdk:
    name: Pack SDK gate
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Pack SDK gate
        run: bun run pack:sdk

  live-user-tests-preflight:
    name: Live user tests preflight
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    environment: live-user-tests
    steps:
      - name: Check live user-test configuration
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LIVE_USER_TEST_MIN_MAX_CONCURRENT_RUNS: 50
        run: bun scripts/cicd/preflight-live-user-tests.mjs

  publish:
    name: Publish @aexhq/sdk
    needs:
      - version
      - lint
      - unit-tests
      - offline-user-tests
      - docs-build
      - pack-sdk
      - live-user-tests-preflight
    # npm publish stays on GitHub-hosted even when AEX_CI_RUNNER is flipped on:
    # keeps NPM_TOKEN off the self-hosted home box and avoids any npm-provenance
    # attestation edge case on release day. It is a fast, once-per-release job.
    runs-on: ubuntu-latest
    environment: npm-release
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.17.0 && npm --version

      - name: Install
        run: bun ci

      - name: Pack publish tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/aex-pack"
          mkdir -p "$pack_dir"
          (cd packages/sdk && bun pm pack --destination "$pack_dir")
          tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "No @aexhq/sdk tarball was produced." >&2
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required in the npm-release environment for token-based npm publish. Configure npm trusted publishing before removing this token path."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --registry https://registry.npmjs.org \
            --access public \
            --tag "${NPM_DIST_TAG}" \
            --provenance

      - name: Wait for npm visibility
        run: node scripts/cicd/wait-for-npm.mjs @aexhq/sdk "${{ needs.version.outputs.version }}"

      - name: Wait for Bun install visibility
        run: bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "${{ needs.version.outputs.version }}"

  live-user-tests:
    # Published-artifact SMOKE (not the full behavioral matrix). release.yml
    # publishes to a pre-release dist-tag, then this proves the PUBLISHED
    # @aexhq/sdk + CLI installs from npm and runs end-to-end — a DeepSeek SDK
    # round-trip on the managed runtime and the installed CLI
    # (apps/user-tests/vitest.smoke.config.ts). The full test/live/** matrix
    # runs against this same published sdk_version across dev + prd in platform
    # deploy.yml (aws-suite.yml sdk_user_tests), which the release runbook (§4.7)
    # requires green before promoting to `latest` — so re-running the whole
    # suite here was redundant with that deploy gate.
    name: Published-artifact smoke
    needs: publish
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    environment: live-user-tests
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Wait for published SDK installability
        run: bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "${{ needs.publish.outputs.version }}"

      - name: Published-artifact smoke
        shell: bash
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
          AEX_USER_TEST_VERSION: ${{ needs.publish.outputs.version }}
          # Two smoke files; run both at once (2 live runs is trivially within
          # the workspace's maxConcurrentRuns >= 50 the preflight asserts).
          AEX_USER_TEST_MAX_WORKERS: 2
          RAW_LOG: ${{ github.workspace }}/.suite-diagnostics/raw/release-smoke.log
          REPORT: ${{ github.workspace }}/.suite-diagnostics/raw/release-smoke.report.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RAW_LOG")"
          # Smoke-only: install the PUBLISHED @aexhq/sdk@<version> from npm and
          # exercise the SDK + CLI end-to-end. The full behavioral matrix is the
          # deploy.yml gate (see the job comment above).
          bun run test:user:smoke -- --reporter=default --reporter=json --outputFile.json="$REPORT" 2>&1 | tee "$RAW_LOG"
          node scripts/cicd/assert-no-skips.mjs "$REPORT" 2>&1 | tee -a "$RAW_LOG"

      - name: Redact smoke log
        if: ${{ always() }}
        env:
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RAW_LOG: ${{ github.workspace }}/.suite-diagnostics/raw/release-smoke.log
          REDACTED_LOG: ${{ github.workspace }}/.suite-diagnostics/redacted/release-smoke.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REDACTED_LOG")"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";

          const rawPath = process.env.RAW_LOG;
          const outPath = process.env.REDACTED_LOG;
          if (!rawPath || !outPath) {
            throw new Error("RAW_LOG and REDACTED_LOG are required.");
          }
          let text = existsSync(rawPath)
            ? readFileSync(rawPath, "utf8")
            : "release published-artifact smoke log was not created before diagnostics collection.\n";

          for (const name of ["AEX_API_KEY", "DEEPSEEK_API_KEY"]) {
            const value = process.env[name];
            if (value && value.length > 0) {
              text = text.split(value).join(`[REDACTED:${name}]`);
            }
          }
          text = redactSignedUrls(text);

          writeFileSync(outPath, text);

          function redactSignedUrls(input) {
            return input
              .replace(/https?:\/\/[^\s<>"'`]+/g, (raw) => {
                const trailing = raw.match(/[),.;:!?]+$/)?.[0] ?? "";
                const candidate = trailing ? raw.slice(0, -trailing.length) : raw;
                if (!/[?&](?:X-Amz-|X-Goog-|AWSAccessKeyId=|GoogleAccessId=|Signature=|Credential=|Security-Token=)/i.test(candidate)) {
                  return raw;
                }
                try {
                  const url = new URL(candidate);
                  const auth = url.username || url.password ? "[redacted]@" : "";
                  return `${url.protocol}//${auth}${url.host}${url.pathname}?[redacted]${url.hash}${trailing}`;
                } catch {
                  return `${candidate.replace(/\?.*$/, "?[redacted]")}${trailing}`;
                }
              })
              .replace(
                /\b((?:X-Amz-[A-Za-z0-9-]+|X-Goog-[A-Za-z0-9-]+|AWSAccessKeyId|GoogleAccessId|Signature|Credential|Security-Token|AccessKeyId|SecretAccessKey|SessionToken)=)[^&\s<>"'`]+/gi,
                "$1[redacted]"
              );
          }
          NODE

      - name: Upload redacted smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-redacted-log
          path: .suite-diagnostics/redacted
          if-no-files-found: error
          retention-days: 7
