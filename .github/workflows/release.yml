name: Release

on:
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: npm dist-tag to publish under.
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - dark

concurrency:
  group: release-antpath
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish antpath
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing (>=11.5.1)
        # OIDC trusted publishing requires npm CLI >=11.5.1; Node 22 ships npm 10.x.
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read SDK version
        id: version
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing antpath@$version"

      - name: Ensure npm versions are available
        run: |
          set -euo pipefail
          for pkg in antpath @antpath/cli @antpath/contracts @antpath/conformance; do
            node scripts/cicd/assert-npm-version-available.mjs "$pkg" "${{ steps.version.outputs.version }}"
          done

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Docs build
        run: pnpm run docs:build

      - name: Pack SDK tarball
        id: pack
        run: |
          pack_dir="$RUNNER_TEMP/antpath-pack"
          mkdir -p "$pack_dir"
          pnpm --filter antpath pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -name 'antpath-*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "No antpath tarball was produced." >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Offline user tests against tarball
        env:
          ANTPATH_USER_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm run test:user:offline

      - name: Final npm version check
        run: node scripts/cicd/assert-npm-version-available.mjs antpath "${{ steps.version.outputs.version }}"

      - name: Publish to npm (trusted publishing / OIDC)
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Pack with pnpm so each tarball's `workspace:*` deps are rewritten to
          # concrete versions, then publish each tarball with the npm CLI so the
          # OIDC trusted-publishing exchange runs (pnpm publish does NOT perform
          # the OIDC exchange; `npm publish` does not rewrite workspace: deps —
          # pack-then-publish-tarball gives us both). Dependency order so a
          # consumer resolving a just-published package finds its deps. All four
          # packages share VERSION, so the tarball filename is exact (no glob).
          pack_dir="$RUNNER_TEMP/antpath-publish"
          mkdir -p "$pack_dir"
          # pkg:tarball-basename pairs (scoped @antpath/x packs as antpath-x-<ver>.tgz)
          for spec in "@antpath/contracts:antpath-contracts" "@antpath/conformance:antpath-conformance" "@antpath/cli:antpath-cli" "antpath:antpath"; do
            pkg="${spec%%:*}"
            pnpm --filter "$pkg" pack --pack-destination "$pack_dir"
          done
          for spec in "@antpath/contracts:antpath-contracts" "@antpath/conformance:antpath-conformance" "@antpath/cli:antpath-cli" "antpath:antpath"; do
            pkg="${spec%%:*}"; base="${spec##*:}"
            tgz="$pack_dir/${base}-${VERSION}.tgz"
            [ -f "$tgz" ] || { echo "::error::missing tarball $tgz for $pkg"; ls -la "$pack_dir"; exit 1; }
            echo "publishing $pkg from $tgz under tag $NPM_DIST_TAG"
            npm publish "$tgz" --provenance --access public --tag "$NPM_DIST_TAG"
          done

  post-publish-user-tests:
    name: Post-publish offline user tests (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Wait for npm registry
        run: node scripts/cicd/wait-for-npm.mjs antpath "${{ needs.publish.outputs.version }}"

      - name: Offline user tests against published package
        env:
          ANTPATH_USER_TEST_VERSION: ${{ needs.publish.outputs.version }}
        run: pnpm run test:user:offline
