name: Release
run-name: release ${{ github.sha }} [${{ inputs.release_key }}]

on:
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: npm dist-tag for the immutable candidate (latest is assigned only by promote.yml after validation).
        required: true
        default: canary
        type: choice
        options:
          - canary
      release_key:
        description: Required idempotency key supplied by the release controller.
        required: true
        type: string
      platform_sha:
        description: Required exact platform commit expected to receive the candidate.
        required: true
        type: string

concurrency:
  group: release-aex-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RELEASE_HEAD_SHA: ${{ github.sha }}
  NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
  RELEASE_MODE: immutable-canary

jobs:
  authorize:
    name: Authorize release source
    runs-on: ubuntu-latest
    steps:
      - name: Require exact controller release source
        env:
          RELEASE_REF: ${{ github.ref }}
          PLATFORM_SHA: ${{ inputs.platform_sha }}
          RELEASE_KEY: ${{ inputs.release_key }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/release/sha-${RELEASE_HEAD_SHA}"
          if [ "${RELEASE_REF}" != "${expected_ref}" ]; then
            echo "::error::Release must run from immutable tag ${expected_ref}; received ${RELEASE_REF}."
            exit 1
          fi
          if ! [[ "${PLATFORM_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::platform_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [ -z "${RELEASE_KEY}" ]; then
            echo "::error::release_key is required for controller correlation."
            exit 1
          fi
          echo "release-mode=${RELEASE_MODE}"
          echo "source-sha=${RELEASE_HEAD_SHA}"

  version:
    name: Resolve release version
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      head_sha: ${{ env.RELEASE_HEAD_SHA }}
      already_published: ${{ steps.availability.outputs.already_published }}
    steps:
      # This workflow publishes BEFORE the live user tests run, so it must
      # publish only to the candidate lane. Guard the raw input as well as the
      # choice list because API dispatch is not constrained by the UI options.
      # `publish` needs this job, so failing here blocks the publish.
      - name: Require canary dist-tag
        env:
          NPM_DIST_TAG: ${{ env.NPM_DIST_TAG }}
        run: |
          set -euo pipefail
          if [ "${NPM_DIST_TAG}" != "canary" ]; then
            echo "::error::release.yml publishes immutable candidates only to the 'canary' dist-tag; assign 'latest' via promote.yml once validation is green."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve package version
        id: version
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./packages/sdk/package.json').version")"
          version="$(bun scripts/cicd/canary-version.mjs resolve \
            --base-version "${base_version}" \
            --run-number "${RELEASE_RUN_ID}" \
            --sha "${RELEASE_HEAD_SHA}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable publication state
        id: availability
        env:
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          npm view "@aexhq/sdk@${SDK_VERSION}" version --json > npm-version.json 2> npm-version.err
          npm_status=$?
          set -e
          if [ "${npm_status}" -eq 0 ]; then
            observed="$(jq -r '.' npm-version.json)"
            if [ "${observed}" != "${SDK_VERSION}" ]; then
              echo "::error::npm returned ${observed} while resolving immutable canary ${SDK_VERSION}"
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Resuming already-published immutable canary ${SDK_VERSION}."
          elif grep -Eq 'E404|is not in this registry|No match found' npm-version.err; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm registry lookup failed while resolving ${SDK_VERSION}"
            sed -n '1,20p' npm-version.err
            exit "${npm_status}"
          fi

  lint:
    name: Lint
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Lint
        run: bun run lint

  unit-tests:
    name: Unit tests
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Test
        run: bun run test

  offline-user-tests:
    name: Offline user tests
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Offline user tests
        env:
          AEX_USER_TEST_OFFLINE_MAX_WORKERS: 4
        run: bun run test:user:offline

  docs-build:
    name: Docs build
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Docs build
        run: bun run docs:build

  pack-sdk:
    name: Pack SDK gate
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Pack SDK gate
        run: bun run pack:sdk

  live-user-tests-preflight:
    name: Live user tests preflight
    needs: authorize
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    environment: live-user-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check live user-test configuration
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_EXPECTED_API_HOST: ${{ vars.AEX_EXPECTED_API_HOST || 'dev-api.aex.dev' }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # This gate starts exactly two smoke files in parallel. The full
          # live matrix preflights declared session-slot demand separately.
          LIVE_USER_TEST_MIN_MAX_CONCURRENT_SESSIONS: 2
          LIVE_USER_TEST_REQUIRED_SCOPES: sessions:read,sessions:write,files:read
        run: bun scripts/cicd/preflight-live-user-tests.mjs

  publish:
    name: Publish @aexhq/sdk
    needs:
      - version
      - lint
      - unit-tests
      - offline-user-tests
      - docs-build
      - pack-sdk
    # npm trusted publishing supports GitHub-hosted runners only. Keep this job
    # off AEX_CI_RUNNER so OIDC exchange and provenance remain deterministic.
    runs-on: ubuntu-latest
    environment: npm-release
    outputs:
      version: ${{ needs.version.outputs.version }}
      integrity: ${{ steps.registry-evidence.outputs.integrity }}
      head_sha: ${{ needs.version.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.17.0 && npm --version

      - name: Install
        run: bun ci

      - name: Apply immutable canary version
        if: ${{ needs.version.outputs.already_published != 'true' }}
        run: bun scripts/cicd/canary-version.mjs apply --version "${{ needs.version.outputs.version }}"

      - name: Bind package to release source
        if: ${{ needs.version.outputs.already_published != 'true' }}
        run: bun scripts/cicd/release-source.mjs apply --sha "${RELEASE_HEAD_SHA}"

      - name: Pack publish tarball
        id: pack
        if: ${{ needs.version.outputs.already_published != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/aex-pack"
          mkdir -p "$pack_dir"
          (cd packages/sdk && bun pm pack --destination "$pack_dir")
          tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "No @aexhq/sdk tarball was produced." >&2
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: ${{ needs.version.outputs.already_published != 'true' }}
        env:
          NPM_DIST_TAG: ${{ env.NPM_DIST_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --registry https://registry.npmjs.org \
            --access public \
            --tag "${NPM_DIST_TAG}" \
            --provenance

      - name: Wait for npm visibility
        run: node scripts/cicd/wait-for-npm.mjs @aexhq/sdk "${{ needs.version.outputs.version }}"

      - name: Wait for Bun install visibility
        run: bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "${{ needs.version.outputs.version }}"

      - name: Resolve immutable registry evidence
        id: registry-evidence
        env:
          SDK_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          package_spec="@aexhq/sdk@${SDK_VERSION}"
          integrity="$(npm view "${package_spec}" dist.integrity --json --registry https://registry.npmjs.org | jq -r '.')"
          if ! [[ "${integrity}" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::npm returned invalid dist.integrity for ${package_spec}"
            exit 1
          fi
          source_sha="$(npm view "${package_spec}" aexRelease.sourceSha --json --registry https://registry.npmjs.org | jq -r 'select(type == "string")')"
          if [ "${source_sha}" != "${RELEASE_HEAD_SHA}" ]; then
            echo "::error::Registry source attestation '${source_sha:-missing}' does not match release source '${RELEASE_HEAD_SHA}'."
            exit 1
          fi
          echo "integrity=${integrity}" >> "$GITHUB_OUTPUT"

  live-user-tests:
    # Published-artifact SMOKE (not the full behavioral matrix). release.yml
    # publishes to a pre-release dist-tag, then this proves the PUBLISHED
    # @aexhq/sdk + CLI install from npm and run end-to-end: a DeepSeek SDK
    # round-trip on the managed runtime and the installed CLI
    # (apps/user-tests/vitest.smoke.config.ts). The platform deploy gate then
    # runs its complete release suite against this same published sdk_version
    # across dev + prd: every discovered gating SDK file plus the isolated
    # admission, heavy-session, and tool-fuzz lanes. Promotion requires both
    # planes to pass; release.yml does not rerun those scenarios.
    name: Published-artifact smoke
    needs:
      - publish
      - live-user-tests-preflight
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.live-user-tests-preflight.result == 'success'
      }}
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    environment: live-user-tests
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Wait for published SDK installability
        run: bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "${{ needs.publish.outputs.version }}"

      - name: Published-artifact smoke
        shell: bash
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
          AEX_USER_TEST_VERSION: ${{ needs.publish.outputs.version }}
          # Two smoke files; run both at once. The preflight above checks the
          # capacity this job actually consumes.
          AEX_USER_TEST_MAX_WORKERS: 2
          RAW_LOG: ${{ github.workspace }}/.suite-diagnostics/raw/release-smoke.log
          REPORT: ${{ github.workspace }}/.suite-diagnostics/raw/release-smoke.report.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RAW_LOG")"
          # Smoke-only: install the PUBLISHED @aexhq/sdk@<version> from npm and
          # exercise the SDK + CLI end-to-end. The full behavioral matrix runs
          # in the platform deploy-dev.yml and promote-prd.yml gates.
          set +e
          bun run test:user:smoke -- --reporter=default --reporter=json --outputFile.json="$REPORT" > "$RAW_LOG" 2>&1
          test_status=$?
          node scripts/cicd/assert-no-skips.mjs "$REPORT" >> "$RAW_LOG" 2>&1
          assertion_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$assertion_status"

      - name: Redact smoke log
        if: ${{ always() }}
        env:
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RAW_LOG: ${{ github.workspace }}/.suite-diagnostics/raw/release-smoke.log
          REDACTED_LOG: ${{ github.workspace }}/.suite-diagnostics/redacted/release-smoke.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REDACTED_LOG")"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";

          const rawPath = process.env.RAW_LOG;
          const outPath = process.env.REDACTED_LOG;
          if (!rawPath || !outPath) {
            throw new Error("RAW_LOG and REDACTED_LOG are required.");
          }
          let text = existsSync(rawPath)
            ? readFileSync(rawPath, "utf8")
            : "release published-artifact smoke log was not created before diagnostics collection.\n";

          for (const name of ["AEX_API_KEY", "DEEPSEEK_API_KEY"]) {
            const value = process.env[name];
            if (value && value.length > 0) {
              text = text.split(value).join(`[REDACTED:${name}]`);
            }
          }
          text = redactSignedUrls(text);

          writeFileSync(outPath, text);

          function redactSignedUrls(input) {
            return input
              .replace(/https?:\/\/[^\s<>"'`]+/g, (raw) => {
                const trailing = raw.match(/[),.;:!?]+$/)?.[0] ?? "";
                const candidate = trailing ? raw.slice(0, -trailing.length) : raw;
                if (!/[?&](?:X-Amz-|X-Goog-|AWSAccessKeyId=|GoogleAccessId=|Signature=|Credential=|Security-Token=)/i.test(candidate)) {
                  return raw;
                }
                try {
                  const url = new URL(candidate);
                  const auth = url.username || url.password ? "[redacted]@" : "";
                  return `${url.protocol}//${auth}${url.host}${url.pathname}?[redacted]${url.hash}${trailing}`;
                } catch {
                  return `${candidate.replace(/\?.*$/, "?[redacted]")}${trailing}`;
                }
              })
              .replace(
                /\b((?:X-Amz-[A-Za-z0-9-]+|X-Goog-[A-Za-z0-9-]+|AWSAccessKeyId|GoogleAccessId|Signature|Credential|Security-Token|AccessKeyId|SecretAccessKey|SessionToken)=)[^&\s<>"'`]+/gi,
                "$1[redacted]"
              );
          }
          NODE
          cat "$REDACTED_LOG"

      - name: Upload redacted smoke log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-redacted-log
          path: .suite-diagnostics/redacted
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  public-release-manifest:
    name: Public release manifest
    needs:
      - publish
      - live-user-tests
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.live-user-tests.result == 'success'
      }}
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Write public release manifest
        env:
          SDK_VERSION: ${{ needs.publish.outputs.version }}
          SDK_INTEGRITY: ${{ needs.publish.outputs.integrity }}
          SOURCE_SHA: ${{ needs.publish.outputs.head_sha }}
          NPM_DIST_TAG: ${{ env.NPM_DIST_TAG }}
        run: |
          set -euo pipefail
          bun scripts/cicd/release-manifest.mjs write-public \
            --version "${SDK_VERSION}" \
            --dist-tag "${NPM_DIST_TAG}" \
            --integrity "${SDK_INTEGRITY}" \
            --head-sha "${SOURCE_SHA}" \
            --out public-release-manifest.json

      - name: Upload public release manifest
        uses: actions/upload-artifact@v4
        with:
          name: public-release-manifest-${{ github.run_id }}
          path: public-release-manifest.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release-complete:
    name: Verify complete release
    needs:
      - publish
      - live-user-tests
      - public-release-manifest
    # A successful publish is irreversible. Once it happens, make skipped
    # smoke or manifest work fail the workflow instead of allowing
    # GitHub's skipped-job semantics to report a false green release.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete published candidate
        env:
          SMOKE_RESULT: ${{ needs.live-user-tests.result }}
          MANIFEST_RESULT: ${{ needs.public-release-manifest.result }}
        run: |
          set -euo pipefail
          if [ "${SMOKE_RESULT}" != "success" ] || [ "${MANIFEST_RESULT}" != "success" ]; then
            echo "::error::Published candidate is incomplete: smoke=${SMOKE_RESULT}, manifest-and-dispatch=${MANIFEST_RESULT}."
            exit 1
          fi
