name: Model catalog compatibility monitor

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit to qualify
        required: true
        type: string
      maximum_budget_micro_usd:
        description: Maximum approved provider spend in micro-USD
        required: true
        default: "2500000"
        type: string
      maximum_runtime_seconds:
        description: Whole-run deadline in seconds
        required: true
        default: "1800"
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: model-catalog-qualify-deepseek-v4-flash
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify deepseek/deepseek-v4-flash
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aex-model-catalog-qualifier
    env:
      REVIEWED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      OPERATOR_BUDGET_MICRO_USD: ${{ inputs.maximum_budget_micro_usd || '2500000' }}
      OPERATOR_RUNTIME_SECONDS: ${{ inputs.maximum_runtime_seconds || '1800' }}
      OWNER_BUDGET_CEILING_MICRO_USD: ${{ vars.AEX_MODEL_CATALOG_MAXIMUM_BUDGET_MICRO_USD }}
    steps:
      - name: Validate reviewed source and protected bounds
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATOR_BUDGET_MICRO_USD" =~ ^[1-9][0-9]*$ ]]
          [[ "$OPERATOR_RUNTIME_SECONDS" =~ ^[1-9][0-9]*$ ]]
          [[ "$OWNER_BUDGET_CEILING_MICRO_USD" =~ ^[1-9][0-9]*$ ]]
          (( OPERATOR_BUDGET_MICRO_USD <= OWNER_BUDGET_CEILING_MICRO_USD ))
          (( OPERATOR_RUNTIME_SECONDS <= 3600 ))

      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE_SHA" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$REVIEWED_SOURCE_SHA" ]]

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Fetch and verify the official tokenizer oracle
        shell: bash
        run: |
          set -euo pipefail
          tokenizer_dir=.tmp/model-catalog/tokenizer
          install -d -m 700 "$tokenizer_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://cdn.deepseek.com/api-docs/deepseek_v3_tokenizer.zip \
            --output "$tokenizer_dir/deepseek_v3_tokenizer.zip"
          printf '%s  %s\n' \
            c954ca6f6e54281d72d3c27e2430cea7663f81292b39982e2f97890c66c302de \
            "$tokenizer_dir/deepseek_v3_tokenizer.zip" \
            | sha256sum --check --strict
          unzip -p \
            "$tokenizer_dir/deepseek_v3_tokenizer.zip" \
            deepseek_v3_tokenizer/tokenizer.json \
            > "$tokenizer_dir/tokenizer.json"
          printf '%s  %s\n' \
            ecb6f9fc369894346f0511f4074ca75cee5cd5f3b06d02f1ba35fcd39f8e121d \
            "$tokenizer_dir/tokenizer.json" \
            | sha256sum --check --strict
          rm "$tokenizer_dir/deepseek_v3_tokenizer.zip"
          chmod 600 "$tokenizer_dir/tokenizer.json"

      - name: Build the protected qualifier
        shell: bash
        run: >-
          cargo build --locked --release
          -p aex-live-model-catalog
          --bin aex-model-catalog-qualifier

      - name: Require a complete qualification implementation
        shell: bash
        run: |
          set -euo pipefail
          preflight="$(target/release/aex-model-catalog-qualifier preflight)"
          jq -e '
            .schema == "aex.model-catalog-qualification-preflight.v1"
            and .provider == "deepseek"
            and .model == "deepseek-v4-flash"
            and .programs == 23
            and .ready == true
            and .unsupportedRequired == []
          ' <<< "$preflight" >/dev/null

      - name: Run qualification and create canonical outputs
        shell: bash
        env:
          AEX_LIVE_PROVIDER_KEY_DEEPSEEK: ${{ secrets.AEX_LIVE_PROVIDER_KEY_DEEPSEEK }}
          AEX_MODEL_CATALOG_QUALIFY_CONFIRMATION: ${{ secrets.AEX_MODEL_CATALOG_QUALIFY_CONFIRMATION }}
        run: |
          set -euo pipefail
          [[ -n "$AEX_LIVE_PROVIDER_KEY_DEEPSEEK" ]]
          [[ -n "$AEX_MODEL_CATALOG_QUALIFY_CONFIRMATION" ]]
          output_dir=.tmp/model-catalog/qualification
          target/release/aex-model-catalog-qualifier run \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --maximum-budget-micro-usd "$OPERATOR_BUDGET_MICRO_USD" \
            --maximum-runtime-seconds "$OPERATOR_RUNTIME_SECONDS" \
            --tokenizer-json "$GITHUB_WORKSPACE/.tmp/model-catalog/tokenizer/tokenizer.json" \
            --output-dir "$output_dir"
          test -s "$output_dir/evidence.json"
          test -s "$output_dir/receipt.json"

      - name: Bind the exact canonical qualification outputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cicd/model-catalog-qualification-binding.mjs create \
            --directory .tmp/model-catalog/qualification \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-path .github/workflows/model-catalog-qualify.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --maximum-budget-micro-usd "$OPERATOR_BUDGET_MICRO_USD" \
            --maximum-runtime-seconds "$OPERATOR_RUNTIME_SECONDS"

      - name: Attest the exact three-file monitoring allowlist
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            .tmp/model-catalog/qualification/evidence.json
            .tmp/model-catalog/qualification/receipt.json
            .tmp/model-catalog/qualification/qualification-binding.json

      - name: Retain the exact attested monitoring allowlist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-catalog-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/model-catalog/qualification/evidence.json
            .tmp/model-catalog/qualification/receipt.json
            .tmp/model-catalog/qualification/qualification-binding.json
          if-no-files-found: error
          retention-days: 7
