name: Live User Tests

on:
  workflow_dispatch:
    inputs:
      artifact_source:
        description: SDK artifact to test.
        required: true
        default: pack-current
        type: choice
        options:
          - pack-current
          - published-version
      version:
        description: Published aex version when artifact_source is published-version.
        required: false
        type: string
      run_heavy:
        description: Run the heavy full-feature live canary after the default live suite.
        required: true
        default: false
        type: boolean

concurrency:
  group: live-user-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-user-tests:
    name: Live user tests
    runs-on: ubuntu-latest
    environment: live-user-tests
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Select SDK artifact
        id: artifact
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$ARTIFACT_SOURCE" = "published-version" ]; then
            if [ -z "$PACKAGE_VERSION" ]; then
              echo "version input is required when artifact_source is published-version." >&2
              exit 1
            fi
            node scripts/cicd/wait-for-npm.mjs @aexhq/sdk "$PACKAGE_VERSION"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          else
            pack_dir="$RUNNER_TEMP/aex-pack"
            mkdir -p "$pack_dir"
            pnpm --filter @aexhq/sdk pack --pack-destination "$pack_dir"
            tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            if [ -z "$tarball" ]; then
              echo "No @aexhq/sdk tarball was produced." >&2
              exit 1
            fi
            echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          fi

      - name: Live user tests
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_TOKEN: ${{ secrets.AEX_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AEX_USER_TEST_ANTHROPIC_MODEL: ${{ vars.AEX_USER_TEST_ANTHROPIC_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
          AEX_USER_TEST_TARBALL: ${{ steps.artifact.outputs.tarball }}
          AEX_USER_TEST_VERSION: ${{ steps.artifact.outputs.version }}
        run: pnpm run test:user

      - name: Heavy live user-test canary
        if: ${{ inputs.run_heavy }}
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_TOKEN: ${{ secrets.AEX_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AEX_USER_TEST_ANTHROPIC_MODEL: ${{ vars.AEX_USER_TEST_ANTHROPIC_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
          AEX_USER_TEST_TARBALL: ${{ steps.artifact.outputs.tarball }}
          AEX_USER_TEST_VERSION: ${{ steps.artifact.outputs.version }}
        run: pnpm run test:user:heavy
