name: Live User Tests

on:
  workflow_dispatch:
    inputs:
      artifact_source:
        description: Public artifact pair to test.
        required: true
        default: pack-current
        type: choice
        options:
          - pack-current
          - published-versions
      sdk_version:
        description: Exact @aexhq/sdk version for published-versions.
        required: false
        type: string
      cli_version:
        description: Exact @aexhq/cli version for published-versions.
        required: false
        type: string
      source_sha:
        description: Exact source SHA shared by the published artifact pair.
        required: false
        type: string

concurrency:
  group: live-user-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-artifacts:
    name: Prepare SDK and CLI artifacts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Verify published artifact pair
        if: ${{ inputs.artifact_source == 'published-versions' }}
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          CLI_VERSION: ${{ inputs.cli_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -z "$SDK_VERSION" ] || [ -z "$CLI_VERSION" ] || ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sdk_version, cli_version, and a lowercase 40-character source_sha are required." >&2
            exit 1
          fi
          node scripts/cicd/wait-for-npm.mjs @aexhq/sdk "$SDK_VERSION" --source-sha "$SOURCE_SHA"
          node scripts/cicd/wait-for-npm.mjs @aexhq/cli "$CLI_VERSION" --source-sha "$SOURCE_SHA"
          bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "$SDK_VERSION"
          bun scripts/cicd/wait-for-bun-install.mjs @aexhq/cli "$CLI_VERSION"

      - name: Pack current artifact pair
        if: ${{ inputs.artifact_source == 'pack-current' }}
        run: |
          set -euo pipefail
          bun run build
          mkdir -p "$RUNNER_TEMP/aex-pack"
          (cd packages/sdk && bun pm pack --destination "$RUNNER_TEMP/aex-pack" --ignore-scripts)
          (cd packages/cli && bun pm pack --destination "$RUNNER_TEMP/aex-pack" --ignore-scripts)
          test "$(find "$RUNNER_TEMP/aex-pack" -maxdepth 1 -name 'aexhq-sdk-*.tgz' | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/aex-pack" -maxdepth 1 -name 'aexhq-cli-*.tgz' | wc -l)" -eq 1

      - name: Upload current artifact pair
        if: ${{ inputs.artifact_source == 'pack-current' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: live-user-tests-artifacts
          path: ${{ runner.temp }}/aex-pack/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Build single-architecture file matrix
        id: matrix
        run: echo "matrix=$(bun apps/user-tests/scripts/shard-files.mjs --matrix)" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify dev API access
    runs-on: ubuntu-latest
    environment: live-user-tests
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Preflight canonical sessions route
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_EXPECTED_API_HOST: ${{ vars.AEX_EXPECTED_API_HOST || 'dev-api.aex.dev' }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
        run: bun scripts/cicd/preflight-live-user-tests.mjs

  live-user-tests:
    name: Live user tests ${{ matrix.shard }}/${{ matrix.count }}
    needs:
      - prepare-artifacts
      - preflight
    runs-on: ubuntu-latest
    environment: live-user-tests
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-artifacts.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Download current artifact pair
        if: ${{ inputs.artifact_source == 'pack-current' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: live-user-tests-artifacts
          path: ${{ runner.temp }}/aex-pack

      - name: Select artifact pair
        shell: bash
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_SOURCE" = "published-versions" ]; then
            echo "AEX_USER_TEST_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
            echo "AEX_USER_TEST_CLI_VERSION=$CLI_VERSION" >> "$GITHUB_ENV"
          else
            sdk="$(find "$RUNNER_TEMP/aex-pack" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            cli="$(find "$RUNNER_TEMP/aex-pack" -maxdepth 1 -name 'aexhq-cli-*.tgz' -print -quit)"
            test -n "$sdk"
            test -n "$cli"
            echo "AEX_USER_TEST_SDK_TARBALL=$sdk" >> "$GITHUB_ENV"
            echo "AEX_USER_TEST_CLI_TARBALL=$cli" >> "$GITHUB_ENV"
          fi

      - name: Run declared dev scenario
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_KEY: ${{ secrets.AEX_API_KEY }}
          AEX_USER_TEST_MODEL: ${{ vars.AEX_USER_TEST_MODEL }}
          TEST_FILES: ${{ matrix.file }}
        run: |
          set -euo pipefail
          # Paths are repository-owned and contain no spaces.
          # shellcheck disable=SC2086
          bun run test:user:files -- $TEST_FILES \
            --report=.tmp/junit-live-${{ matrix.shard }}.xml
