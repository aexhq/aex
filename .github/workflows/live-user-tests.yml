name: Live User Tests

on:
  workflow_dispatch:
    inputs:
      artifact_source:
        description: SDK artifact to test.
        required: true
        default: pack-current
        type: choice
        options:
          - pack-current
          - published-version
      version:
        description: Published aex version when artifact_source is published-version.
        required: false
        type: string

concurrency:
  group: live-user-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-user-tests:
    name: Live user tests
    runs-on: ubuntu-latest
    environment: live-user-tests
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Select SDK artifact
        id: artifact
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$ARTIFACT_SOURCE" = "published-version" ]; then
            if [ -z "$PACKAGE_VERSION" ]; then
              echo "version input is required when artifact_source is published-version." >&2
              exit 1
            fi
            bun scripts/cicd/wait-for-npm.mjs @aexhq/sdk "$PACKAGE_VERSION"
            bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "$PACKAGE_VERSION"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          else
            pack_dir="$RUNNER_TEMP/aex-pack"
            mkdir -p "$pack_dir"
            (cd packages/sdk && bun pm pack --destination "$pack_dir")
            tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
            if [ -z "$tarball" ]; then
              echo "No @aexhq/sdk tarball was produced." >&2
              exit 1
            fi
            echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          fi

      - name: Live user tests
        env:
          AEX_API_URL: ${{ vars.AEX_API_URL }}
          AEX_API_TOKEN: ${{ secrets.AEX_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AEX_USER_TEST_ANTHROPIC_MODEL: ${{ vars.AEX_USER_TEST_ANTHROPIC_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AEX_USER_TEST_DEEPSEEK_MODEL: ${{ vars.AEX_USER_TEST_DEEPSEEK_MODEL }}
          AEX_USER_TEST_TARBALL: ${{ steps.artifact.outputs.tarball }}
          AEX_USER_TEST_VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .suite-diagnostics/raw
          bun run test:user 2>&1 | tee .suite-diagnostics/raw/live-user-tests.log

      - name: Redact live user test log
        if: ${{ always() }}
        env:
          AEX_API_TOKEN: ${{ secrets.AEX_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .suite-diagnostics/redacted
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";

          const rawPath = ".suite-diagnostics/raw/live-user-tests.log";
          const outPath = ".suite-diagnostics/redacted/live-user-tests.log";
          let text = existsSync(rawPath)
            ? readFileSync(rawPath, "utf8")
            : "live-user-tests.log was not created before diagnostics collection.\n";

          for (const name of ["AEX_API_TOKEN", "ANTHROPIC_API_KEY", "DEEPSEEK_API_KEY"]) {
            const value = process.env[name];
            if (value && value.length > 0) {
              text = text.split(value).join(`[REDACTED:${name}]`);
            }
          }

          writeFileSync(outPath, text);
          NODE

      - name: Upload redacted live user test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-user-tests-redacted-log
          path: .suite-diagnostics/redacted
          if-no-files-found: error
          retention-days: 14

      # The expensive, optional suites (heavy full-feature session +
      # per-provider correctness matrix) are NOT run here — they live in the
      # manually-dispatched .github/workflows/live-on-demand-tests.yml so one
      # trigger runs them all without piling spend onto the default sweep.
