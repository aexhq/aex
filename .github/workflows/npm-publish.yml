name: publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned Brain packages
        run: |
          git clone --filter=blob:none https://github.com/aexhq/brain.git ../brain
          git -C ../brain checkout ea73244489311cb3a11442c3a4306b289ec97ba7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.19.0
      - name: Build pinned Brain packages
        run: |
          npm ci --prefix ../brain
          npm run build --prefix ../brain
      - run: npm ci
      - run: npm test
      - run: npm run package-smoke
      - name: Publish in dependency order
        env:
          # Bootstrap-safe for a package's first release; provenance is still minted by this
          # public GitHub Actions job. Existing packages may authenticate through OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publish_workspace() {
            local workspace="$1"
            local package_json="packages/$workspace/package.json"
            local name version spec visible
            name=$(node -p "require('./$package_json').name")
            version=$(node -p "require('./$package_json').version")
            spec="$name@$version"

            if npm view "$spec" version --json >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish --workspace "$name" --access public
            fi

            for attempt in $(seq 1 12); do
              visible=$(npm view "$spec" version --json 2>/dev/null | tr -d '"' || true)
              if [[ "$visible" == "$version" ]]; then
                echo "$spec is visible on the public registry"
                return 0
              fi
              sleep 5
            done

            echo "$spec did not become visible after publication" >&2
            return 1
          }

          publish_workspace contracts
          publish_workspace sdk
          publish_workspace tools
          publish_workspace cli
