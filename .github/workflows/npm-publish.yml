name: Publish packages and image
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-artifacts
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          EXPECTED: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$GITHUB_REF" = "refs/tags/release/sha-$EXPECTED"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git merge-base --is-ancestor "$EXPECTED" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED&event=push" --jq '.workflow_runs | any(.conclusion == "success")' | grep -x true
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/storage-integration.yml/runs?head_sha=$EXPECTED&event=workflow_dispatch" --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")' | grep -x true
  prepare-npm:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run test:sdk
      - run: npm run test:cli
      - run: node tools/npm-release.mjs pack "$RUNNER_TEMP/aex-npm-release"
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: aex-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/aex-npm-release
          if-no-files-found: error
          retention-days: 90
  sdk:
    needs: prepare-npm
    environment: npm-production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aex-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/aex-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0
      - run: node "$RUNNER_TEMP/aex-npm-release/publish.mjs" stage
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
  verify-npm:
    needs: sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aex-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/aex-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0
      - run: node "$RUNNER_TEMP/aex-npm-release/publish.mjs" verify
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
  image:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.os }}
    env:
      IMAGE: ghcr.io/aexhq/aex-server:sha-${{ github.sha }}-${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the original candidate
        id: candidate
        run: |
          digest=$(python3 tools/release-image.py resolve "$IMAGE")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build an unpublished candidate
        if: steps.candidate.outputs.digest == ''
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t aex-rewrite:test .
      - name: Reuse the published candidate
        if: steps.candidate.outputs.digest != ''
        env:
          ORIGINAL: ${{ steps.candidate.outputs.digest }}
        run: |
          docker pull "$ORIGINAL"
          docker tag "$ORIGINAL" aex-rewrite:test
      - name: Check candidate source and architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect aex-rewrite:test --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect aex-rewrite:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
      - run: python3 tools/image-smoke.py
      - name: Publish only a new candidate
        if: steps.candidate.outputs.digest == ''
        run: |
          existing=$(python3 tools/release-image.py resolve "$IMAGE")
          test -z "$existing"
          docker tag aex-rewrite:test "$IMAGE"
          docker push "$IMAGE"
      - run: |
          digest=$(python3 tools/release-image.py resolve "$IMAGE")
          test -n "$digest"
          echo "$digest" > image-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.txt
          overwrite: true
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
      - env:
          IMAGE: ghcr.io/aexhq/aex-server:sha-${{ github.sha }}
        run: |
          python3 tools/release-image.py manifest "$IMAGE" "$(cat image-amd64.txt)" "$(cat image-arm64.txt)"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
