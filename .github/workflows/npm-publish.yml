name: publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned Brain packages
        run: |
          git clone --filter=blob:none https://github.com/aexhq/brain.git ../brain
          git -C ../brain checkout 830356e72cf1de7b8f4b6f3971f40eff01bbdb31
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.19.0
      - name: Build pinned Brain packages
        run: |
          npm ci --prefix ../brain
          npm run build --prefix ../brain
      - run: npm ci
      - run: npm test
      - run: npm run package-smoke
      - name: Publish with trusted publishing in dependency order
        shell: bash
        run: |
          set -euo pipefail

          publish_workspace() {
            local workspace="$1"
            local package_json="packages/$workspace/package.json"
            local name version spec version_url
            name=$(node -p "require('./$package_json').name")
            version=$(node -p "require('./$package_json').version")
            spec="$name@$version"
            version_url=$(node -e 'const [name, version] = process.argv.slice(1); process.stdout.write(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`)' "$name" "$version")

            if curl --fail --silent "$version_url" >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish --workspace "$name" --access public
            fi

            for attempt in $(seq 1 12); do
              if curl --fail --silent "$version_url" >/dev/null 2>&1; then
                echo "$spec is visible on the public registry"
                return 0
              fi
              sleep 5
            done

            echo "$spec did not become visible after publication" >&2
            return 1
          }

          publish_workspace contracts
          publish_workspace sdk
          publish_workspace tools
          publish_workspace cli
