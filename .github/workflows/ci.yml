name: ci
on:
  push:
    branches: [main]
  pull_request:

# Superseded PR pushes stop competing for runners; main pushes run to completion
# (both image workflows key off ci success on main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: npm ci
      - name: Checkout the pinned Brain contract
        shell: bash
        run: |
          set -euo pipefail
          brain_revision=$(node tools/pinned-revision.mjs brain)
          git clone --filter=blob:none https://github.com/aexhq/brain.git ../brain
          git -C ../brain checkout "$brain_revision"
          test "$(git -C ../brain rev-parse HEAD)" = "$brain_revision"
      - name: cache cargo-typify
        id: typify-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.7.0-${{ runner.os }}
      - name: Install the pinned contract generator
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --version 0.7.0 --locked
      - name: Regenerate owning contracts and fail on drift
        shell: bash
        run: |
          set -euo pipefail
          bash tools/gen.sh
          node tools/verify-brain-overlay.mjs
          git diff --exit-code
          test -z "$(git status --porcelain)"

  rust-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - run: cargo test --workspace

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checkout the pinned Brain contract
        shell: bash
        run: |
          set -euo pipefail
          brain_revision=$(node tools/pinned-revision.mjs brain)
          git clone --filter=blob:none https://github.com/aexhq/brain.git ../brain
          git -C ../brain checkout "$brain_revision"
          test "$(git -C ../brain rev-parse HEAD)" = "$brain_revision"
      - run: npm test

  package-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package-smoke
