name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Main-push and manual sessions each get a session_id-scoped concurrency group, so they
# run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contract-parity:
    name: Contract parity
    runs-on: ubuntu-latest
    # Secrets can't be referenced in step-level `if`; surface the platform PAT
    # presence as a job-level flag so the guard step can gate on it.
    env:
      HAS_PLATFORM_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # This gate must never be silently disarmed. CI sessions only on push to
      # main by maintainers, so a missing/expired PLATFORM_REPO_TOKEN or a
      # failed platform checkout fails this job loudly instead of letting the
      # parity script skip.
      - name: Require platform token
        if: ${{ env.HAS_PLATFORM_TOKEN != 'true' }}
        run: |
          echo "::error::PLATFORM_REPO_TOKEN is missing or empty, so the contract parity gate cannot run. Restore the PAT; this gate must not be silently disarmed."
          exit 1

      - name: Checkout platform (for contract parity)
        uses: actions/checkout@v6
        with:
          repository: aexhq/aex-platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: _platform
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      # Fails on any platform<->public contract divergence not recorded in
      # scripts/cicd/contract-parity-baseline.json. The platform tree is
      # guaranteed present here by the mandatory checkout above.
      - name: Contract parity
        run: bun run contracts:parity:check
        env:
          AEX_PLATFORM_DIR: ${{ github.workspace }}/_platform

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Lint
        run: bun run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Test
        run: bun run test

  offline-user-tests:
    name: Offline user tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Offline user tests
        env:
          AEX_USER_TEST_OFFLINE_MAX_WORKERS: 4
        run: bun run test:user:offline

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Docs build
        run: bun run docs:build

  pack-sdk:
    name: Pack SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun ci

      - name: Pack SDK
        run: bun run pack:sdk

  public:
    name: Install, lint, test, pack
    runs-on: ubuntu-latest
    needs:
      - contract-parity
      - lint
      - unit-tests
      - offline-user-tests
      - docs-build
      - pack-sdk
    if: ${{ always() }}
    steps:
      - name: Check gate results
        env:
          CONTRACT_PARITY_RESULT: ${{ needs['contract-parity'].result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_TESTS_RESULT: ${{ needs['unit-tests'].result }}
          OFFLINE_USER_TESTS_RESULT: ${{ needs['offline-user-tests'].result }}
          DOCS_BUILD_RESULT: ${{ needs['docs-build'].result }}
          PACK_SDK_RESULT: ${{ needs['pack-sdk'].result }}
        run: |
          set -euo pipefail
          failed=0
          for name in CONTRACT_PARITY LINT UNIT_TESTS OFFLINE_USER_TESTS DOCS_BUILD PACK_SDK; do
            var="${name}_RESULT"
            result="${!var}"
            echo "${name}: ${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
