name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Lint
        run: bun run lint

  typecheck:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Type checks
        run: bun run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Unit tests
        run: bun run test:unit

  checks:
    name: Required checks
    needs:
      - lint
      - typecheck
      - unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs['unit-tests'].result }}
        run: |
          set -euo pipefail
          for result in "$LINT_RESULT" "$TYPECHECK_RESULT" "$UNIT_TESTS_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Required check failed: $result"
              exit 1
            fi
          done

  publish-canary:
    name: Publish canary
    needs:
      - lint
      - typecheck
      - unit-tests
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.lint.result == 'success' &&
        needs.typecheck.result == 'success' &&
        needs.unit-tests.result == 'success'
      }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ env.RELEASE_HEAD_SHA }}
      source_tag: ${{ steps.source-tag.outputs.source_tag }}
      integrity: ${{ steps.registry-evidence.outputs.integrity }}
    env:
      RELEASE_HEAD_SHA: ${{ github.sha }}
      NPM_DIST_TAG: canary
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$RELEASE_HEAD_SHA" ]; then
            echo "::error::Checked out $actual_sha, expected $RELEASE_HEAD_SHA."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.17.0

      - name: Install
        run: bun ci

      - name: Resolve canary version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("packages/sdk/package.json", "utf8")).version)')"
          version="$(bun scripts/cicd/canary-version.mjs resolve --base-version "$base_version" --sha "$RELEASE_HEAD_SHA")"
          remote_sha="$(git ls-remote origin "refs/tags/canary/${version}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/canary/${version}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_sha" ]; then
            echo "::error::Canary tag canary/${version} already exists at ${remote_sha}. Bump the SDK base version and fix forward."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing @aexhq/sdk@$version from $RELEASE_HEAD_SHA"

      - name: Require an unused immutable npm version
        run: node scripts/cicd/assert-npm-version-available.mjs @aexhq/sdk "${{ steps.version.outputs.version }}"

      - name: Apply canary version and source attestation
        run: |
          bun scripts/cicd/canary-version.mjs apply --version "${{ steps.version.outputs.version }}"
          bun scripts/cicd/release-source.mjs apply --sha "$RELEASE_HEAD_SHA"

      - name: Tag the exact tested source
        id: source-tag
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_tag="canary/${CANARY_VERSION}"
          remote_sha="$(git ls-remote origin "refs/tags/${source_tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/${source_tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$RELEASE_HEAD_SHA" ]; then
              echo "::error::${source_tag} already points to ${remote_sha}, not ${RELEASE_HEAD_SHA}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$source_tag" "$RELEASE_HEAD_SHA" --message "aex canary ${CANARY_VERSION} (${RELEASE_HEAD_SHA})"
            git push origin "refs/tags/${source_tag}"
          fi
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"

      - name: Pack publish tarball
        id: pack
        shell: bash
        # `bun run pack:sdk` FIRST, and in the same step that produces the
        # tarball: it builds the SDK, dry-run packs it, and runs
        # contracts:boundary:check. Calling `bun pm pack` directly skipped the
        # boundary check entirely, so a public-surface violation could ship to
        # npm with every gate green. Publishing must not be reachable except
        # through the checked path.
        run: |
          set -euo pipefail
          bun run pack:sdk
          pack_dir="$RUNNER_TEMP/aex-pack"
          mkdir -p "$pack_dir"
          (cd packages/sdk && bun pm pack --destination "$pack_dir")
          tarball="$(find "$pack_dir" -maxdepth 1 -name 'aexhq-sdk-*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error::No @aexhq/sdk tarball was produced."
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish canary to npm
        run: |
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --registry https://registry.npmjs.org \
            --access public \
            --tag "$NPM_DIST_TAG" \
            --provenance

      - name: Verify npm source provenance
        id: registry-evidence
        env:
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          node scripts/cicd/wait-for-npm.mjs @aexhq/sdk "${SDK_VERSION}"
          --source-sha "${RELEASE_HEAD_SHA}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Wait for Bun install visibility
        run: bun scripts/cicd/wait-for-bun-install.mjs @aexhq/sdk "${{ steps.version.outputs.version }}"

      - name: Record canary identity
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ steps.source-tag.outputs.source_tag }}
          NPM_INTEGRITY: ${{ steps.registry-evidence.outputs.integrity }}
        run: |
          set -euo pipefail
          cat > canary-release.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "version": "${CANARY_VERSION}",
            "sourceSha": "${RELEASE_HEAD_SHA}",
            "sourceTag": "${SOURCE_TAG}",
            "npmDistTag": "${NPM_DIST_TAG}",
            "npmIntegrity": "${NPM_INTEGRITY}",
            "workflowRunId": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload canary identity
        uses: actions/upload-artifact@v4
        with:
          name: aex-canary-${{ github.run_id }}
          path: canary-release.json
          if-no-files-found: error
          retention-days: 30
