name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Main-push and manual runs each get a run_id-scoped concurrency group, so they
# run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  public:
    name: Install, lint, test, pack
    runs-on: ${{ fromJSON(vars.AEX_CI_RUNNER || '"ubuntu-latest"') }}
    # Secrets can't be referenced in step-level `if`; surface the platform PAT
    # presence as a job-level flag so the parity checkout can gate on it.
    env:
      HAS_PLATFORM_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Best-effort checkout of the private platform repo so the contract
      # parity gate can run. The gate SKIPS (does not fail) when this checkout
      # is absent — e.g. on forks / PRs without the PAT — so CI still passes;
      # it only enforces on trusted runs where AEX_PLATFORM_DIR is populated.
      - name: Checkout platform (for contract parity)
        if: ${{ env.HAS_PLATFORM_TOKEN == 'true' }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: aexhq/aex-platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: _platform
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on any platform<->public contract divergence not recorded in
      # scripts/cicd/contract-parity-baseline.json. SKIPS when the platform
      # tree wasn't checked out (forks / missing PAT).
      - name: Contract parity
        run: pnpm run contracts:parity:check
        env:
          AEX_PLATFORM_DIR: ${{ github.workspace }}/_platform

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Offline user tests
        run: pnpm run test:user:offline

      - name: Docs build
        run: pnpm run docs:build

      - name: Pack SDK
        run: pnpm run pack:sdk
