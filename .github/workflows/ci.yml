name: rewrite-ci
on:
  push:
    branches: [main, rewrite/mvp]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: bash tools/check.sh
  journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: bash tools/journeys.sh
  image:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t aex-rewrite:test .
      - run: python3 tools/image-smoke.py
  release-gate:
    if: always()
    needs: [audit, checks, journeys, image]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'for(const [name,job] of Object.entries(JSON.parse(process.env.RESULTS))) if(job.result!=="success") throw Error(name+":"+job.result)'
