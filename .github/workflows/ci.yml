name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded in-flight runs for the same PR; main-push runs are never
# cancelled (github.head_ref is empty on push, so each push gets its own
# run_id group and runs to completion).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  public:
    name: Install, lint, test, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Offline user tests
        run: pnpm run test:user:offline

      - name: Docs build
        run: pnpm run docs:build

      - name: Pack SDK
        run: pnpm run pack:sdk
