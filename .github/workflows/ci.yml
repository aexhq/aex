name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  # The change router. It runs ONCE and every module lane reads its outputs, so
  # module count drives matrix size rather than job count.
  #
  # It never fails the build: `public-module-graph.mjs` writes `routing_failed=true`
  # plus a run-everything closure on its own error path, because a detector that
  # skips its outputs routes every guard below to "run nothing", which is
  # indistinguishable from "everything passed". Graph correctness is gated instead
  # by scripts/validate/public-module-graph.test.ts, in the blocking unit lane.
  modules:
    name: Route affected modules
    runs-on: ubuntu-latest
    outputs:
      routing_failed: ${{ steps.route.outputs.routing_failed }}
      repo_wide: ${{ steps.route.outputs.repo_wide }}
      affected: ${{ steps.route.outputs.affected }}
      closure: ${{ steps.route.outputs.closure }}
      publish: ${{ steps.route.outputs.publish }}
      has_publish: ${{ steps.route.outputs.has_publish }}
      checks_matrix: ${{ steps.route.outputs.checks_matrix }}
      publish_matrix: ${{ steps.route.outputs.publish_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22

      - name: Route
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          node scripts/cicd/public-module-graph.mjs \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Summarise routing
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Module routing"
            echo
            echo "- routing_failed: \`${{ steps.route.outputs.routing_failed }}\`"
            echo "- repo_wide: \`${{ steps.route.outputs.repo_wide }}\`"
            echo "- affected: \`${{ steps.route.outputs.affected }}\`"
            echo "- dependent closure: \`${{ steps.route.outputs.closure }}\`"
            echo "- publishable: \`${{ steps.route.outputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Each affected module runs its own build/typecheck/lint/unit lanes over the
  # DEPENDENT CLOSURE, not just the changed module: a contracts change is only
  # proven by rebuilding the SDK and CLI that embed it.
  module-checks:
    name: Module lanes (${{ matrix.id }})
    needs: modules
    if: ${{ needs.modules.outputs.closure != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.checks_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Module lanes
        run: bun scripts/cicd/run-module-checks.mjs "${{ matrix.id }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Lint
        run: bun run lint

  typecheck:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Type checks
        run: bun run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun ci

      - name: Unit tests
        run: bun run test:unit

  checks:
    name: Required checks
    needs:
      - lint
      - typecheck
      - unit-tests
      - module-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs['unit-tests'].result }}
          # `skipped` is legal for exactly one reason: an empty dependent closure,
          # which means the diff touched no module. Any other non-success is a
          # failure — a skipped module lane must never read as a passing one.
          MODULE_CHECKS_RESULT: ${{ needs['module-checks'].result }}
        run: |
          set -euo pipefail
          for result in "$LINT_RESULT" "$TYPECHECK_RESULT" "$UNIT_TESTS_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Required check failed: $result"
              exit 1
            fi
          done
          if [ "$MODULE_CHECKS_RESULT" != success ] && [ "$MODULE_CHECKS_RESULT" != skipped ]; then
            echo "::error::Required check failed: module-checks $MODULE_CHECKS_RESULT"
            exit 1
          fi

  # One canary per affected public module. Matrix jobs may start together, but
  # each dependent waits for immutable npm evidence for every same-run upstream
  # before it packs or publishes. That gives the graph real publication order
  # without sharing a mutable checkout between packages.
  #
  # `matrix` is the router's publish set, so an unaffected module is not
  # republished and an affected one cannot be forgotten. Stable promotion is
  # intentionally absent during prelaunch and is not a consequence of this job
  # passing.
  #
  # Publication is OIDC trusted publishing (`id-token: write` + `--provenance`).
  # There is deliberately no token path: the `NPM_TOKEN` secret was deleted, and
  # reintroducing one would also reintroduce a long-lived credential in a
  # repository that accepts fork pull requests.
  publish-canary:
    name: Publish canary (${{ matrix.id }})
    needs:
      - modules
      - lint
      - typecheck
      - unit-tests
      - module-checks
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.modules.outputs.routing_failed == 'false' &&
        needs.modules.outputs.has_publish == 'true' &&
        needs.lint.result == 'success' &&
        needs.typecheck.result == 'success' &&
        needs.unit-tests.result == 'success' &&
        needs.module-checks.result == 'success'
      }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    strategy:
      # Never fail-fast: each dependent is responsible for waiting on its
      # upstreams and failing closed if one never becomes available.
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.publish_matrix) }}
    env:
      RELEASE_HEAD_SHA: ${{ github.sha }}
      NPM_DIST_TAG: canary
      MODULE_ID: ${{ matrix.id }}
      MODULE_NAME: ${{ matrix.name }}
      MODULE_DIR: ${{ matrix.dir }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$RELEASE_HEAD_SHA" ]; then
            echo "::error::Checked out $actual_sha, expected $RELEASE_HEAD_SHA."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.17.0

      - name: Install
        run: bun ci

      # The version carries the source sha and this run id — see the header of
      # scripts/cicd/canary-version.mjs. Two pushes at one base version are two
      # commits and therefore two versions, so npm no longer refuses the second.
      - name: Resolve canary version
        id: version
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          version="$(bun scripts/cicd/module-canary.mjs resolve --module "$MODULE_ID" --sha "$RELEASE_HEAD_SHA" --run "$RELEASE_RUN_ID")"
          source_tag="$(bun scripts/cicd/module-canary.mjs source-tag --module "$MODULE_ID" --version "$version")"
          remote_sha="$(git ls-remote origin "refs/tags/${source_tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/${source_tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_sha" ]; then
            # A tag can only pre-exist if this exact run already published, i.e. a
            # re-run after success. The version is a function of (base, sha, run),
            # so it is not reachable by a different commit.
            echo "::error::Canary tag ${source_tag} already exists at ${remote_sha}; this run already published ${MODULE_ID}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing ${MODULE_NAME}@${version} from $RELEASE_HEAD_SHA"

      - name: Require an unused immutable npm version
        run: node scripts/cicd/assert-npm-version-available.mjs "$MODULE_NAME" "${{ steps.version.outputs.version }}"

      - name: Apply canary version and source attestation
        run: >-
          bun scripts/cicd/module-canary.mjs apply
          --module "$MODULE_ID"
          --version "${{ steps.version.outputs.version }}"
          --sha "$RELEASE_HEAD_SHA"
          --run "$GITHUB_RUN_ID"

      - name: Require same-run upstream canaries
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r upstream_name upstream_version; do
            [ -n "$upstream_name" ] || continue
            node scripts/cicd/wait-for-npm.mjs \
              "$upstream_name" "$upstream_version" \
              --source-sha "$RELEASE_HEAD_SHA"
            bun scripts/cicd/wait-for-bun-install.mjs "$upstream_name" "$upstream_version"
          done < <(bun scripts/cicd/module-canary.mjs upstream-lines --module "$MODULE_ID")

      - name: Tag the exact tested source
        id: source-tag
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/tags/${SOURCE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/${SOURCE_TAG}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$RELEASE_HEAD_SHA" ]; then
              echo "::error::${SOURCE_TAG} already points to ${remote_sha}, not ${RELEASE_HEAD_SHA}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$SOURCE_TAG" "$RELEASE_HEAD_SHA" \
              --message "${MODULE_NAME} canary ${CANARY_VERSION} (${RELEASE_HEAD_SHA})"
            git push origin "refs/tags/${SOURCE_TAG}"
          fi
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Pack publish tarball
        id: pack
        shell: bash
        # `bun run pack:sdk` FIRST for the SDK, and in the same step that produces
        # the tarball: it builds the SDK, dry-run packs it, and runs
        # contracts:boundary:check. Calling `bun pm pack` directly skipped the
        # boundary check entirely, so a public-surface violation could ship to npm
        # with every gate green. Publishing must not be reachable except through
        # the checked path — which is why the boundary check also runs for every
        # other module, whose build script does not carry it. The boundary
        # inspects the SDK's packed surface, so non-SDK lanes must materialize
        # the SDK before running it in their fresh checkout.
        run: |
          set -euo pipefail
          if [ "$MODULE_ID" = "sdk" ]; then
            bun run pack:sdk
          else
            bun run --filter "$MODULE_NAME" build
            bun run --filter @aexhq/sdk build
            bun run contracts:boundary:check
          fi
          pack_dir="$RUNNER_TEMP/aex-pack-$MODULE_ID"
          mkdir -p "$pack_dir"
          (cd "$MODULE_DIR" && bun pm pack --destination "$pack_dir")
          slug="$(printf '%s' "$MODULE_NAME" | sed -e 's|^@||' -e 's|/|-|g')"
          tarball="$(find "$pack_dir" -maxdepth 1 -name "${slug}-*.tgz" -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error::No ${MODULE_NAME} tarball was produced."
            exit 1
          fi
          packed_manifest="$pack_dir/package.json"
          tar -xOf "$tarball" package/package.json > "$packed_manifest"
          bun scripts/cicd/module-canary.mjs verify-packed \
            --module "$MODULE_ID" \
            --manifest "$packed_manifest" \
            --version "${{ steps.version.outputs.version }}" \
            --sha "$RELEASE_HEAD_SHA" \
            --run "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish canary to npm
        run: |
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --registry https://registry.npmjs.org \
            --access public \
            --tag "$NPM_DIST_TAG" \
            --provenance

      - name: Verify npm source provenance
        id: registry-evidence
        env:
          MODULE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          node scripts/cicd/wait-for-npm.mjs "$MODULE_NAME" "${MODULE_VERSION}"
          --source-sha "${RELEASE_HEAD_SHA}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Wait for Bun install visibility
        run: bun scripts/cicd/wait-for-bun-install.mjs "$MODULE_NAME" "${{ steps.version.outputs.version }}"

      - name: Record canary identity
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ steps.source-tag.outputs.source_tag }}
          NPM_INTEGRITY: ${{ steps.registry-evidence.outputs.integrity }}
          PACKED_UPSTREAM: ${{ steps.pack.outputs.upstream }}
        run: |
          set -euo pipefail
          cat > "canary-release-${MODULE_ID}.json" <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "module": "${MODULE_ID}",
            "name": "${MODULE_NAME}",
            "version": "${CANARY_VERSION}",
            "sourceSha": "${RELEASE_HEAD_SHA}",
            "sourceTag": "${SOURCE_TAG}",
            "npmDistTag": "${NPM_DIST_TAG}",
            "npmIntegrity": "${NPM_INTEGRITY}",
            "upstream": ${PACKED_UPSTREAM},
            "workflowRunId": "${GITHUB_RUN_ID}"
          }
          JSON

      - name: Upload canary identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aex-canary-${{ matrix.id }}-${{ github.run_id }}
          path: canary-release-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  # The release identity of this push: every module canary that was published,
  # with the registry's own integrity value and the exact source commit and tag.
  #
  # This artifact is the ONLY thing the private repository is allowed to select
  # from. Following public `main` would pin a tree that was never published, and
  # inferring the package set from a moving tag would pin one that was never
  # tested together.
  canary-manifest:
    name: Record canary manifest
    needs:
      - modules
      - publish-canary
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.modules.outputs.routing_failed == 'false' &&
        needs.modules.outputs.has_publish == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22

      - name: Download module canary identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: aex-canary-*-${{ github.run_id }}
          path: .canary-records

      - name: Build and validate the canary manifest
        shell: bash
        run: |
          set -euo pipefail
          records=()
          while IFS= read -r record; do
            records+=(--record "$record")
          done < <(find .canary-records -name 'canary-release-*.json' | sort)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "::error::No module canary identities were produced."
            exit 1
          fi
          node scripts/cicd/canary-manifest.mjs build \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$RELEASE_HEAD_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --out canary-manifest.json \
            "${records[@]}"
          node scripts/cicd/canary-manifest.mjs check --manifest canary-manifest.json
          {
            echo "### Public canary manifest"
            echo
            echo '```json'
            cat canary-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the canary manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aex-canary-manifest-${{ github.run_id }}
          path: canary-manifest.json
          if-no-files-found: error
          retention-days: 90
