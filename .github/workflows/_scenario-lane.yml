# Runnable release scenarios selected by the delivery graph.
#
# Every matrix row carries an exact package and target claim already checked
# against that package's `e2e` metadata. `--no-tests=fail` prevents a stale
# Cargo target from becoming a green no-op; npm's missing script exits non-zero.

name: scenario-lane

on:
  workflow_call:
    inputs:
      matrix:
        description: The routed scenario matrix, as canonical JSON.
        type: string
        required: true
      lane:
        type: string
        required: true

permissions:
  contents: read

jobs:
  scenario:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: "1.97.1"

      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60  # v2.85.7
        with:
          tool: cargo-nextest

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Run claimed target
        env:
          SCENARIO_PACKAGE: ${{ matrix.package }}
          SCENARIO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$SCENARIO_PACKAGE" in
            cargo:*)
              cargo nextest run --locked --profile live \
                -p "${SCENARIO_PACKAGE#cargo:}" \
                --test "$SCENARIO_TARGET" --no-tests=fail
              ;;
            npm:*)
              bun install --frozen-lockfile
              bun --filter "${SCENARIO_PACKAGE#npm:}" run "test:$SCENARIO_TARGET"
              ;;
            *)
              echo "unrecognised scenario package node: $SCENARIO_PACKAGE"
              exit 2
              ;;
          esac
