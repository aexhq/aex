# Release scenario targets selected by the delivery graph.
#
# Every matrix row carries an exact package and target claim already checked
# against that package's `e2e` metadata. Pre-publication lanes compile and list
# the claimed target without executing remote-plane behavior; the protected
# post-deploy release-evidence workflow owns real execution and receipts.

name: scenario-lane

on:
  workflow_call:
    inputs:
      matrix:
        description: The routed scenario matrix, as canonical JSON.
        type: string
        required: true
      lane:
        type: string
        required: true

permissions:
  contents: read

jobs:
  nextest:
    name: Prepare pinned nextest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: "1.97.1"

      - name: Build, stage, and verify exact nextest
        run: |
          set -euo pipefail
          cargo install --locked --version 0.9.108 cargo-nextest
          cargo-nextest --version | grep -Eq '^cargo-nextest 0\.9\.108([[:space:]]|$)'
          mkdir -p "$RUNNER_TEMP/aex-nextest"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/aex-nextest/cargo-nextest"
          (cd "$RUNNER_TEMP/aex-nextest" && sha256sum cargo-nextest > cargo-nextest.sha256)

      - name: Upload pinned nextest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-nextest-${{ inputs.lane }}-scenario-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aex-nextest/cargo-nextest
            ${{ runner.temp }}/aex-nextest/cargo-nextest.sha256
          if-no-files-found: error
          retention-days: 1

  scenario:
    name: ${{ matrix.name }}
    needs: nextest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: "1.97.1"

      - name: Download pinned nextest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-nextest-${{ inputs.lane }}-scenario-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aex-nextest

      - name: Use pinned nextest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aex-nextest"
          sha256sum --check cargo-nextest.sha256
          chmod 0755 cargo-nextest
          ./cargo-nextest --version | grep -Eq '^cargo-nextest 0\.9\.108([[:space:]]|$)'
          echo "$RUNNER_TEMP/aex-nextest" >> "$GITHUB_PATH"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Validate claimed target
        env:
          SCENARIO_PACKAGE: ${{ matrix.package }}
          SCENARIO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$SCENARIO_PACKAGE" in
            cargo:*)
              cargo nextest list --locked --profile live \
                -p "${SCENARIO_PACKAGE#cargo:}" \
                --features live --test "$SCENARIO_TARGET" \
                --ignore-default-filter --message-format json \
                > "$RUNNER_TEMP/scenario-list.json"
              jq -e '."test-count" > 0' "$RUNNER_TEMP/scenario-list.json" >/dev/null
              ;;
            npm:*)
              export PACKAGE_NAME="${SCENARIO_PACKAGE#npm:}"
              export SCRIPT_NAME="test:$SCENARIO_TARGET"
              bun -e '
                const matches = [];
                for await (const path of new Bun.Glob("**/package.json").scan({ onlyFiles: true })) {
                  const normalized = path.replaceAll("\\\\", "/");
                  if (normalized.includes("/node_modules/") || normalized.startsWith("node_modules/")) continue;
                  const document = await Bun.file(path).json();
                  if (document.name === process.env.PACKAGE_NAME) matches.push({ path, document });
                }
                if (matches.length !== 1) throw new Error(`expected one package ${process.env.PACKAGE_NAME}, found ${matches.length}`);
                const command = matches[0].document.scripts?.[process.env.SCRIPT_NAME];
                if (typeof command !== "string" || command.length === 0) {
                  throw new Error(`${process.env.PACKAGE_NAME} has no ${process.env.SCRIPT_NAME} script`);
                }
              '
              ;;
            *)
              echo "unrecognised scenario package node: $SCENARIO_PACKAGE"
              exit 2
              ;;
          esac
