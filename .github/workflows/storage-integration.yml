name: attachment storage integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s3:
    environment: storage-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Prove immutable S3 put, get and delete
        env:
          AEX_S3_ACCESS_KEY_ID: ${{ secrets.AEX_S3_ACCESS_KEY_ID }}
          AEX_S3_SECRET_ACCESS_KEY: ${{ secrets.AEX_S3_SECRET_ACCESS_KEY }}
          AEX_S3_SESSION_TOKEN: ${{ secrets.AEX_S3_SESSION_TOKEN }}
          AEX_TEST_S3_BUCKET: ${{ vars.AEX_TEST_S3_BUCKET }}
          AEX_TEST_S3_REGION: ${{ vars.AEX_TEST_S3_REGION }}
        run: cargo test --locked -p aex-server --features storage-integration-tests --test s3
