version: 2

# Dependabot watches the two supply-chain edges this repository actually has:
# the GitHub Actions in .github/workflows, and the bun dependency tree rooted
# at the workspace manifest.
#
# There is no `docker` entry: this repository contains no Dockerfile — the
# container/runner images live in the private platform repository, which has
# its own dependabot.yml.
#
# `labels` is deliberately absent. Dependabot creates its own `dependencies`
# label, but a CUSTOM label that does not already exist in the repository is
# silently IGNORED rather than created, and this repository carries only the
# GitHub default label set. Declaring `ci` here would be a no-op that reads
# like a working rule.

updates:
  # GitHub Actions used by .github/workflows/*.yml. Every `uses:` is pinned to
  # a full commit SHA (enforced by scripts/validate/action-pins.test.ts),
  # because a version tag is a mutable pointer owned by the action's author:
  # compromising that account rewrites what our CI runs, including the job
  # holding `id-token: write`, which can then publish `@aexhq/sdk` with a valid
  # provenance attestation. Pinning closes that window; this entry is what
  # keeps the pins from decaying into unpatched code, and it rewrites the
  # trailing `# <tag>` comment alongside each SHA.
  #
  # Unlike the platform repository, `actions/*` is pinned here too. A
  # first-party publisher is a smaller risk, not an absent one, and the gate
  # does not carve out an exception it would then have to police.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per week for the whole action set. Five separate bumps of the
      # same five actions is the shape that trains people to merge unread.
      github-actions:
        patterns:
          - "*"

  # Root package.json + bun.lock. This repository is a bun workspace
  # (`packages/*`, `apps/*`) on bun@1.3.14 — not pnpm — so the ecosystem is
  # `bun`, and the root directory covers every workspace member through the
  # single root lockfile. Tests run on `bun test`; there is no vitest to bump,
  # and the AI-Gateway migration removed the direct `@anthropic-ai/sdk`
  # dependency, so neither carries a pin to ignore.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Tooling is grouped; runtime dependencies are NOT. `@aexhq/sdk` ships
      # zod, fflate, ignore and @standard-schema/spec to consumers at exact
      # versions, so each of those bumps is a change to what users install and
      # deserves its own reviewable PR.
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: development
